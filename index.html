<!-- ============================================================
     词库加载器（首屏遮罩的唯一驱动）
     ------------------------------------------------------------
     只做两件事：把 vocal.js 弄进来 → 再执行 #appSrc 里的主脚本。
     · http(s)：fetch 读流，按 Content-Length 算真实百分比，读完注入执行。
     · file://：浏览器禁止 fetch 读本地文件（CORS），退回 <script src>，只转圈不给百分比。
     · window.__bootSync 为真：用 document.write 同步加载，还原老的同步时序（无头测试用）。
     · 主脚本什么时候能跑，判据只有一个：window.BANK 已经在了。
     ============================================================ -->
<script id="bootLoader">
(function(){
  var mask = document.getElementById('boot');
  var bar  = document.getElementById('bootBar');
  var pct  = document.getElementById('bootPct');
  var sub  = document.getElementById('bootSub');
  var src  = document.getElementById('appSrc');
  var SRC  = 'vocal.js?v=4';
  /* 五个拓展词库（bank_ext_*.js，共约 123 KB）。**一律加载**，只让
     enabledByDefault / 用户开关决定「启不启用」—— 按需懒加载会出现
     「applyUserLibs() 跑完了才补上 EXT_LIBS」的时序问题，引导页第 5 步也要立刻列得出来。 */
  var EXT_SRC = ['bank_ext_daily.js', 'bank_ext_cs.js', 'bank_ext_paper.js',
                 'bank_ext_terms.js', 'bank_ext_campus.js'];
  /* 缓存版本号照 vocal.js?v=3 的写法；改数据文件时把这个数字往上加一位 */
  function extUrl(n){ return n + '?v=1'; }

  function mb(n){ return (n / 1048576).toFixed(2); }
  function say(msg){ if(sub && msg) sub.textContent = msg; }
  function indet(msg){ if(mask) mask.className = 'indet'; say(msg); }

  function hide(){
    if(!mask) return;
    mask.className = 'gone';
    var m = mask;
    setTimeout(function(){ if(m && m.parentNode) m.parentNode.removeChild(m); }, 460);
  }
  function fatal(title, body){
    if(!mask) return;
    mask.className = '';
    mask.innerHTML = '<div class="fatal">'
      + '<div class="fatal-ic"><svg class="ic" style="width:52px;height:52px"><use href="#i-alert"></use></svg></div>'
      + '<h2>' + title + '</h2><p>' + body + '</p></div>';
  }
  function noVocal(){
    fatal('未找到 vocal.js 数据文件',
      '请确认 <b>vocal.js</b> 与 <b>index.html</b> 在同一个文件夹中，然后刷新页面。');
  }
  /* 主脚本注入执行：它自己一路跑到 render()，跑完这一帧首屏就好了 */
  function runApp(){
    if(!src){ fatal('页面结构不完整', '没找到主脚本容器 <b>#appSrc</b>，请重新下载 index.html。'); return; }
    var code = src.textContent || '';
    if(code.length < 1000){ fatal('页面结构不完整', '主脚本内容为空，请重新下载 <b>index.html</b>。'); return; }
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
    hide();
  }
  /* 拓展词库：串行取完再放主脚本。失败只少几个库，**绝不 fatal**
     （vocal.js 才是必需的），也**不并进**上面那个百分比（那是 vocal.js 专属的，
     掺进 123 KB 会让进度一下子从 100% 掉回去）。 */
  function runExt(done){
    if(!EXT_SRC.length){ done(); return; }
    say('正在加载拓展词库…');
    var i = 0, miss = 0;
    function next(){
      if(i >= EXT_SRC.length){
        if(miss) say(miss + ' 个拓展词库没加载上，已跳过');
        done();
        return;
      }
      var name = EXT_SRC[i++];
      function ok(){ next(); }
      function bad(){ miss++; next(); }
      if(location.protocol === 'file:'){
        /* 本地双击打开时 fetch 读不了本地文件，只能退回脚本标签、串行等 onload */
        var s = document.createElement('script');
        s.src = extUrl(name);
        s.onload = ok;
        s.onerror = bad;
        document.body.appendChild(s);
        return;
      }
      fetch(extUrl(name)).then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function(code){
        var t = document.createElement('script');
        t.textContent = code;
        document.body.appendChild(t);
        ok();
      }).catch(bad);
    }
    next();
  }
  /* 把 vocal.js 的源码送进来执行，然后才轮到主脚本 */
  function runVocal(code){
    if(typeof code === 'string'){
      var v = document.createElement('script');
      v.textContent = code;
      document.body.appendChild(v);
    }
    if(typeof window.BANK === 'undefined'){ noVocal(); return; }
    runExt(runApp);
  }

  /* ---- 同步老路：无头测试把 window.__bootSync 置真即可 ----
     vocal.js 与主脚本都要写进解析流：document.write 出来的脚本由解析器按顺序同步执行，
     这才真正还原「改前那份文档」的时序。不能在同一个 script 里写完就立刻去判 window.BANK
     —— 写进流里的脚本要等当前脚本跑完才会执行，那时 BANK 还是 undefined。 */
  if(window.__bootSync){
    window.__bootHide = hide;
    var bootCode = src ? (src.textContent || '') : '';
    document.write('<script src="' + SRC + '"><\/script>');
    /* 拓展词库也写进解析流：document.write 出来的脚本由解析器按顺序同步执行，
       所以它们一定排在 vocal.js 之后、主脚本之前（runVocal 那条路不会被走到）。 */
    for(var _ei = 0; _ei < EXT_SRC.length; _ei++){
      document.write('<script src="' + extUrl(EXT_SRC[_ei]) + '"><\/script>');
    }
    document.write('<script>' + bootCode + '<\/script>');
    document.write('<script>window.__bootHide()<\/script>');
    return;
  }

  /* ---- 本地双击打开：只能退回脚本标签，没有百分比 ---- */
  if(location.protocol === 'file:'){
    indet('正在加载词库（本地打开，没有进度百分比）…');
    var t = document.createElement('script');
    t.src = SRC;
    t.onload = function(){ runVocal(); };
    t.onerror = noVocal;
    document.body.appendChild(t);
    return;
  }

  /* ---- http(s)：读流拿真实进度 ---- */
  say('正在加载词库…');
  var total = 0, got = 0;
  fetch(SRC).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    total = parseInt(res.headers.get('content-length') || '0', 10) || 0;
    if(!res.body || !res.body.getReader || typeof TextDecoder === 'undefined'){
      indet('正在加载词库…');
      return res.text();
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder('utf-8');
    var out = '';
    var paint = function(){
      var pc = total ? Math.min(99, Math.floor(got * 100 / total)) : 0;
      if(total){
        if(bar) bar.style.width = pc + '%';
        if(pct) pct.textContent = '已加载 ' + mb(got) + ' / ' + mb(total) + ' MB（' + pc + '%）';
      } else if(pct){
        pct.textContent = '已加载 ' + mb(got) + ' MB';
      }
    };
    var step = function(r){
      if(r.done){ out += dec.decode(); return out; }
      if(r.value && r.value.length){
        got += r.value.length;
        out += dec.decode(r.value, { stream:true });
        paint();
      }
      return reader.read().then(step);
    };
    return reader.read().then(step);
  }).then(function(code){
    if(bar) bar.style.width = '100%';
    if(pct) pct.textContent = '已加载 ' + mb(total || got) + ' MB（100%）';
    say('正在排版首屏…');
    /* 先让浏览器把 100% 这一帧画出来，再一口气吃下主脚本 */
    setTimeout(function(){ runVocal(code); }, 16);
  }).catch(function(e){
    var why = (e && e.message) ? e.message : String(e);
    fatal('词库加载失败',
      '读取 <b>vocal.js</b> 出错（' + why + '）。<br>请检查网络后刷新页面。');
  });
})();
</script>

<!-- ============================================================
     离线缓存注册（用户第 2 项）
     ------------------------------------------------------------
     只做一件事：register('sw.js')。四条硬规矩：
       ① file:// 下**必须跳过** —— Service Worker 在 file:// 根本不可用，
          不跳过只会在控制台刷一条 SecurityError，用户什么也得不到；
       ② 不支持的浏览器也跳过（'serviceWorker' in navigator 就是判据）；
       ③ 注册失败**绝不抛出去**（.catch 吞掉），状态记进 window.__swState；
       ④ 状态由设置页「数据」卡那一行**如实**说出来（成功说成功，失败写失败，
          不写「已开启」冒充）。要求的那一行守卫原样在这里：
          if('serviceWorker' in navigator && location.protocol !== 'file:'){
            window.addEventListener('load', function(){
              navigator.serviceWorker.register('sw.js').catch(function(){});
            });
          }
     __swState.state 的取值：file / unsupported / registering / ready / failed
     缓存名与 sw.js 里的 CACHE_NAME 必须一致（juhe-v1）。
     ============================================================ -->
<script id="swReg">
(function(){
  var st = { state:'idle', err:'', cache:'juhe-v1', scope:'' };
  window.__swState = st;
  if(location.protocol === 'file:'){ st.state = 'file'; return; }
  if(!('serviceWorker' in navigator)){ st.state = 'unsupported'; return; }
  st.state = 'registering';
  function ping(){ if(typeof window.__swRefresh === 'function'){ try{ window.__swRefresh(); }catch(e){} } }
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', function(){
      try{
        navigator.serviceWorker.register('sw.js').then(function(reg){
          st.state = 'ready';
          st.scope = (reg && reg.scope) || '';
          ping();
        }).catch(function(e){
          st.state = 'failed';
          st.err = String((e && (e.message || e.name)) || '原因不明');
          ping();
        });
      }catch(e){
        st.state = 'failed';
        st.err = String((e && e.message) || e || '原因不明');
        ping();
      }
    });
  }
})();
</script>
