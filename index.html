}
/* ---------- 积木：单个模块渲染（音标已移除） ---------- */
function noteBlockHTML(w, k){
  /* 老配置里存过的 trans 已并入 meaning（见 noteNormalizeRows）；这里再兜一层，
     任何来源的 trans 都按 meaning 画 —— 既不会出错，也不会把词义丢掉。 */
  if(k === 'trans') k = 'meaning';
  if(k === 'gap'){
    var gw = parseFloat((noteOpts.blockPad || {}).gap);
    if(isNaN(gw) || gw < 0) gw = 0;
    return '<span class="nw-gap" style="width:' + gw + 'px"></span>';
  }
  var c = noteOpts.colors;
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var pad = parseFloat((noteOpts.blockPad || {})[k]) || 0;
  var st = 'color:' + (c[k] || '#0f172a') + (pad ? ';padding:0 ' + (pad / fs).toFixed(3) + 'em' : '');
  var pv, mv, tv, ex, s, a, cc, vf, mo, mh, r;
  switch(k){
    case 'word':
      if(!w.w) return '';
      return '<span class="nw-w" data-w="' + escapeHtml(w.w) + '" style="' + st + '">' + escapeHtml(w.w) + '</span>';
    case 'pos':
      pv = noteFieldValue(w, 'pos');
      return pv ? '<span class="nw-pos" style="' + st + '">' + escapeHtml(pv) + '</span>' : '';
    case 'meaning':
      mv = noteFieldValue(w, 'meaning');
      return mv ? '<span class="nw-m" style="' + st + '">' + escapeHtml(mv) + '</span>' : '';
    case 'example':
      ex = pickExample(w);
      if(!ex || (!ex.t && !ex.tr)) return '';
      return '<span class="nw-ex" style="' + st + '">' + noteClickEn(ex.t) + (ex.t && ex.tr ? '  ' : '') + '<span class="nw-tr">' + escapeHtml(ex.tr || '') + '</span></span>';
    case 'syn':
      s = getSyn(w);
      return (s && s.length) ? '<span class="nw-syn" style="' + st + '">' + s.map(function(x){ return noteLink(x.w, x.w); }).join('，') + '</span>' : '';
    case 'ant':
      a = getAnt(w);
      return (a && a.length) ? '<span class="nw-ant" style="' + st + '">' + a.map(function(x){ return noteLink(x.w, x.w); }).join('，') + '</span>' : '';
    case 'comp':
      cc = getComp(w);
      return cc ? '<span class="nw-comp" style="' + st + '">比较级 ' + (cc.c ? noteLink(cc.c, cc.c) : '') + ' · 最高级 ' + (cc.s ? noteLink(cc.s, cc.s) : '') + '</span>' : '';
    case 'verb':
      vf = getVerbForm(w);
      return vf ? '<span class="nw-verb" style="' + st + '">过去式 ' + (vf[0] ? noteLink(String(vf[0]).split('/')[0], vf[0]) : '') + ' · 过去分词 ' + (vf[1] ? noteLink(String(vf[1]).split('/')[0], vf[1]) : '') + '</span>' : '';
    case 'morph':
      mo = getMorph(w); mh = '';
      if(mo && mo.type === 'derived' && mo.root){ mh = '词根 ' + noteLink(mo.root, mo.root); }
      else if(mo && mo.type === 'root' && mo.deriv && mo.deriv.length){ mh = '衍生词 ' + mo.deriv.map(function(d){ return noteLink(d, d); }).join('，'); }
      else { r = findRootOf(w.w); if(r) mh = '词根 ' + noteLink(r, r); }
      return mh ? '<span class="nw-morph" style="' + st + '">' + mh + '</span>' : '';
    /* ---- 下面四块只给「#10 单个词的整块笔记」用：它们不在 NOTE_FIELDS 里，
       所以笔记编辑器的积木池里不会出现；排版仍旧走同一套 nw-* 类，不另写一套。
       取不到数据一律回空串，调用方据此不画空壳。 ---- */
    case 'phon':
      var ph = String(w.p || '').replace(/^\/+|\/+$/g, '');
      return ph ? '<span class="nw-phon" style="' + st + '">/' + escapeHtml(ph) + '/</span>' : '';
    case 'affix':
      var af = wordAffixText(w);
      return af ? '<span class="nw-morph" style="' + st + '">' + escapeHtml(af) + '</span>' : '';
    case 'deriv':
      var dv = wordDerivList(w);
      return dv.length ? '<span class="nw-morph" style="' + st + '">' + dv.map(function(d){ return noteLink(d, d); }).join('，') + '</span>' : '';
    case 'forms':
      var fp = wordFormParts(w), seg = [];
      if(fp.past.length) seg.push('过去式 ' + fp.past.map(function(f){ return noteLink(f, f); }).join(' / '));
      if(fp.pp.length) seg.push('过去分词 ' + fp.pp.map(function(f){ return noteLink(f, f); }).join(' / '));
      if(fp.ing.length) seg.push('现在分词 ' + fp.ing.map(function(f){ return noteLink(f, f); }).join(' / '));
      return seg.length ? '<span class="nw-verb" style="' + st + '">' + seg.join(' · ') + '</span>' : '';
  }
  return '';
}
/* 一个单词 = 若干行积木；每行占一条纸面横线，所以行高固定为纸面行距。
   所有尺寸都用 em（相对字号），这样同一份 HTML 在屏幕预览与真实纸张上完全一致。 */
function noteWordHTML(w){
  var rows = noteOpts.rows || [];
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var sp = noteLinePx();
  var lhEm = (sp / fs).toFixed(3);
  var rgEm = (((parseFloat(noteOpts.rowGap) || 0) * sp) / fs).toFixed(3);
  var bgEm = (Math.max(0, parseFloat(noteOpts.blockGap) || 0) / fs).toFixed(3);
  var out = [], first = true;
  var align = (noteOpts.rowAlign === 'top') ? 'flex-start' : 'baseline';
  rows.forEach(function(row){
    var parts = [];
    (row || []).forEach(function(k){ var h = noteBlockHTML(w, k); if(h) parts.push(h); });
    if(!parts.length) return;
    out.push('<div class="nw-row" style="line-height:' + lhEm + 'em;align-items:' + align + ';column-gap:' + bgEm + 'em' + (first ? '' : ';margin-top:' + rgEm + 'em') + '">' + parts.join('') + '</div>');
    first = false;
  });
  var gp = parseInt(noteOpts.perWordGap, 10) || 0;
  for(var g = 0; g < gp; g++) out.push('<div class="nw-row" style="line-height:' + lhEm + 'em">&#160;</div>');
  return '<div class="note-word">' + out.join('') + '</div>';
}
/* ============================================================
   #10 / #15 单词笔记与词汇补充
   ------------------------------------------------------------
   #10「识词页生成笔记」：给当前这个词生成一整块笔记（单词 / 音标 / 词性 / 词义 /
       例句 / 构词法 / 派生词 / 近义反义 / 过去式·过去分词·现在分词），排版直接
       复用笔记模式的 noteBlockHTML + noteWordHTML，不另写一套；
       生成结果能复制走（剪贴板）也能存成一条笔记。
   #15「补充信息可折叠」：识词页与单词详情共用 foldWrapHTML / bindFolds 这两件，
       折叠状态存在 foldOpen 里（同一会话内记住，刷不落盘 —— 与构词法页 mfOpen 同款）。
   ============================================================ */
/* ---------- 词形 / 构词的小取数（三处共用，别各写一份） ---------- */
/* 屈折形分组：过去式 / 过去分词 / 现在分词 / 三单。
   数据来自批次 A 的词形层 formRecords（IRREGULAR → VERB_FORMS → 规则补齐）。
   双写辅音不确定的现在分词（weak，比如 visiting / visitting 两种都收）只留第一种，
   免得笔记上并排出现两种拼法。 */
function wordFormParts(w){
  var k = String((w && w.w) || w || '').toLowerCase();
  var out = { base:k, past:[], pp:[], ing:[], s:[] };
  if(!k) return out;
  var recs = formRecords(k), ingWeak = false;
  function put(kind, list){
    var strong = [], weak = [];
    recs.forEach(function(r){ if(r.k !== kind) return; (r.weak ? weak : strong).push(r.f); });
    var seen = {};
    (strong.length ? strong : weak).forEach(function(f){ if(!seen[f]){ seen[f] = 1; list.push(f); } });
  }
  put('past', out.past); put('pp', out.pp); put('ing', out.ing); put('s', out.s);
  recs.forEach(function(r){ if(r.k === 'ing' && r.weak) ingWeak = true; });
  if(ingWeak && out.ing.length > 1) out.ing = out.ing.slice(0, 1);
  return out;
}
/* 派生词 / 同根词：本词是词根就用它自己的 deriv，否则找它的词根再取那家的 deriv。
   自己不算派生词；同一个词只留一次。 */
function wordDerivList(w){
  var k = String((w && w.w) || w || '').toLowerCase();
  if(!k) return [];
  var mo = getMorph(k), rootKey = findRootOf(k), rootMo = rootKey ? MORPH[rootKey] : null;
  var list = [];
  if(mo && mo.type === 'root' && mo.deriv) list = mo.deriv.slice();
  else if(rootMo && rootMo.deriv) list = rootMo.deriv.slice();
  var seen = {}, out = [];
  list.forEach(function(d){
    var s = String(d || '');
    if(!s || s.toLowerCase() === k || seen[s.toLowerCase()]) return;
    seen[s.toLowerCase()] = 1; out.push(s);
  });
  return out;
}
/* AFFIX_MEANING 的值本身已经带「前缀：/后缀：」（例：'-ful' → '后缀：充满的（useful 有用的）'），
   界面上前缀 / 后缀那两个字是单独标的，这里把重复的那一截去掉，别读成「后缀 -ful（后缀：…）」 */
function wordAffixGloss(a){
  return String(AFFIX_MEANING[a] || '').replace(/^(前缀|后缀)\s*[：:]\s*/, '');
}
/* 构词法一句话文字（笔记积木用）：前缀 / 后缀带含义、词根带释义 */
function wordAffixText(w){
  var k = String((w && w.w) || w || '').toLowerCase();
  var mo = getMorph(k), rootKey = findRootOf(k), bits = [];
  function aff(a, kind){
    if(!a) return;
    var m = wordAffixGloss(a);
    bits.push((kind === 'pre' ? '前缀 ' : '后缀 ') + a + (m ? '（' + m + '）' : ''));
  }
  if(mo && mo.type === 'derived'){
    aff(mo.prefix, 'pre'); aff(mo.suffix, 'suf');
    if(mo.root){
      var rw = findWord(mo.root);
      bits.push('词根 ' + mo.root + (rw && rw.m ? '（' + rw.m + '）' : ''));
    }
  }else if(mo && mo.type === 'root'){
    bits.push('本词为词根');
  }else if(rootKey){
    var rm = findWord(rootKey);
    bits.push('词根 ' + rootKey + (rm && rm.m ? '（' + rm.m + '）' : ''));
  }
  return bits.join(' · ');
}

/* ---------- #11 兼容：老配置的积木行 ---------- */
/* 把存下来的积木行洗干净再交给界面，三条规矩：
   ① trans → meaning（#11 把「翻译」并进「词义」；老用户存过的 trans 不许炸、不许丢词义）；
   ② 认不出的键一律丢掉（NOTE_FIELDS 里没有、也不是空格 gap）；
   ③ 同一行里重复的键只留第一个（trans 映射过来常与 meaning 撞车），gap 例外，可重复。
   回空数组时由调用方退回 noteDefaultRows()。 */
function noteNormalizeRows(rows){
  var out = [];
  if(!Array.isArray(rows)) return out;
  rows.forEach(function(row){
    if(!Array.isArray(row)) return;
    var seen = {}, keep = [];
    row.forEach(function(k){
      var key = (k === 'trans') ? 'meaning' : String(k == null ? '' : k);
      if(key !== 'gap' && !noteFieldMeta(key)) return;
      if(key !== 'gap'){
        if(seen[key]) return;
        seen[key] = 1;
      }
      keep.push(key);
    });
    if(keep.length) out.push(keep);
  });
  return out;
}
/* 读回存盘的笔记设置（noteOpts 落盘的读侧）。
   为什么它以前会丢：save() 的字段清单里根本没有 noteOpts，用户调好的纸张 / 积木 /
   字号 / 颜色只活在内存里，一刷新就回到 noteOpts 的初始字面量。
   这里每一项都夹到合法区间，缺项用默认值，认不出的枚举退回默认，
   trans 这类已删键直接忽略 —— 老存档读进来绝不会让页面炸。 */
function noteApplySavedOpts(src){
  if(!src || typeof src !== 'object') return noteOpts;
  function num(v, d, lo, hi){ v = parseFloat(v); if(!isFinite(v)) return d; if(v < lo) return lo; if(v > hi) return hi; return v; }
  function oneOf(v, list, d){ return list.indexOf(v) >= 0 ? v : d; }
  noteOpts.tab = oneOf(src.tab, ['setup', 'preview'], 'setup');
  noteOpts.format = oneOf(src.format, NOTE_FORMATS.map(function(f){ return f.k; }), 'a4');
  noteOpts.orientation = oneOf(src.orientation, ['portrait', 'landscape'], 'portrait');
  noteOpts.flip = oneOf(src.flip, ['h', 'v'], 'h');
  noteOpts.ruleStyle = oneOf(src.ruleStyle, ['line', 'grid', 'none'], 'line');
  noteOpts.rowAlign = oneOf(src.rowAlign, ['base', 'top'], 'base');
  noteOpts.pdfRange = oneOf(src.pdfRange, ['current', 'all', 'range'], 'all');
  noteOpts.fontSize = num(src.fontSize, 14, 8, 24);
  noteOpts.fontAuto = src.fontAuto !== false;
  noteOpts.lineHeight = num(src.lineHeight, 1.25, 1, 2);
  noteOpts.perWordGap = num(src.perWordGap, 1, 0, 6);
  noteOpts.blockGap = num(src.blockGap, 12, 0, 40);
  noteOpts.rowGap = num(src.rowGap, 0, 0, 2);
  noteOpts.ruleCount = Math.round(num(src.ruleCount, noteDefaultRules(noteOpts.format), 4, 80));
  noteOpts.wordCols = Math.round(num(src.wordCols, 1, 1, 4));
  noteOpts.pdfFrom = Math.round(num(src.pdfFrom, 1, 1, 999));
  noteOpts.pdfTo = Math.round(num(src.pdfTo, 1, 1, 999));
  var pad = {};
  if(src.blockPad && typeof src.blockPad === 'object'){
    Object.keys(src.blockPad).forEach(function(k){
      if(k !== 'gap' && !noteFieldMeta(k)) return;
      var v = parseFloat(src.blockPad[k]);
      if(!isFinite(v) || v < 0) v = 0;
      pad[k] = Math.min(v, k === 'gap' ? 160 : 40);
    });
  }
  noteOpts.blockPad = pad;
  var cols = {};
  NOTE_FIELDS.forEach(function(f){ cols[f.k] = noteOpts.colors[f.k] || '#0f172a'; });
  if(src.colors && typeof src.colors === 'object'){
    Object.keys(src.colors).forEach(function(k){
      if(!noteFieldMeta(k)) return;                      /* trans 这类已删键：忽略 */
      if(/^#[0-9a-fA-F]{6}$/.test(String(src.colors[k]))) cols[k] = src.colors[k];
    });
  }
  noteOpts.colors = cols;
  var rows = noteNormalizeRows(src.rows);
  noteOpts.rows = rows.length ? rows : noteDefaultRows();
  return noteOpts;
}
/* 笔记设置改完就落盘（防抖 350ms）。
   没有这一句的话，noteOpts 虽然进了 save() 的清单，但界面上调纸张 / 积木 / 字号
   只会 render() 不会 save()，用户不触发别的动作就刷新，照样还是丢。 */
var _noteSaveTimer = null;
function noteSaveSoon(){
  if(_noteSaveTimer) return;
  _noteSaveTimer = setTimeout(function(){ _noteSaveTimer = null; save(); }, 350);
}

/* ---------- 折叠区（#15）：沿用构词法页的写法（标题按钮 + body 切换 display） ---------- */
var foldOpen = {};   /* 折叠状态：key → 是否展开。只在内存里，同一会话内记住 */
function foldWrapHTML(key, title, icon, bodyHTML, opt){
  if(!bodyHTML) return '';
  var o = opt || {};
  var open = !!foldOpen[key];
  return '<div class="fold' + (open ? ' open' : '') + '" data-foldbox="' + escapeHtml(key) + '">'
    + '<button type="button" class="fold-h" data-fold="' + escapeHtml(key) + '" aria-expanded="' + (open ? 'true' : 'false') + '">'
    +   '<span class="fold-ar">' + IC(open ? 'down' : 'right') + '</span>'
    +   IC(icon || 'list')
    +   '<span class="fold-t">' + escapeHtml(title) + '</span>'
    +   (o.note ? '<span class="fold-n">' + escapeHtml(o.note) + '</span>' : '')
    + '</button>'
    + '<div class="fold-b"' + (open ? '' : ' style="display:none"') + '>' + bodyHTML + '</div>'
    + '</div>';
}
/* 点标题只切这一块，不重排整页 —— 所以展开状态不会被 render 冲掉 */
function bindFolds(scope){
  if(!scope || !scope.querySelectorAll) return;
  Array.prototype.slice.call(scope.querySelectorAll('.fold-h[data-fold]')).forEach(function(h){
    if(h.__foldBound) return;
    h.__foldBound = 1;
    h.onclick = function(ev){
      if(ev && ev.preventDefault) ev.preventDefault();
      var k = h.getAttribute('data-fold');
      foldOpen[k] = !foldOpen[k];
      var box = h.parentNode ? h.parentNode.querySelector('.fold-b') : null;
      if(box) box.style.display = foldOpen[k] ? '' : 'none';
      if(h.parentNode && h.parentNode.classList) h.parentNode.classList.toggle('open', !!foldOpen[k]);
      h.setAttribute('aria-expanded', foldOpen[k] ? 'true' : 'false');
      var ar = h.querySelector('.fold-ar');
      if(ar) ar.innerHTML = IC(foldOpen[k] ? 'down' : 'right');
    };
  });
}
/* 一串词做成可点的词链（点一下看详情，走全局 [data-w] 代理） */
function wxWordsHTML(list){
  var seen = {}, out = [];
  (list || []).forEach(function(x){
    var s = (x && x.w != null) ? String(x.w) : String(x || '');
    if(!s || seen[s.toLowerCase()]) return;
    seen[s.toLowerCase()] = 1;
    out.push('<span class="syn-word" data-w="' + escapeHtml(s) + '">' + escapeHtml(s) + '</span>');
  });
  return out.join('<span class="wx-sep">，</span>');
}
/* 构词法块（HTML）：前缀 / 后缀带含义、词根带释义。取不到回空串 */
function wordAffixHTML(w){
  var k = String((w && w.w) || w || '').toLowerCase();
  var mo = getMorph(k), rootKey = findRootOf(k), rows = [];
  function aff(a, cls, label){
    if(!a) return;
    var m = wordAffixGloss(a);
    rows.push('<div class="wx-line"><span class="m-tag ' + cls + '">' + label + '</span><b>' + escapeHtml(a) + '</b>'
      + (m ? '<span class="wx-v wx-mut">' + escapeHtml(m) + '</span>' : '') + '</div>');
  }
  if(mo && mo.type === 'derived'){
    aff(mo.prefix, 'pre', '前缀'); aff(mo.suffix, 'suf', '后缀');
    if(mo.root){
      var rw = findWord(mo.root);
      rows.push('<div class="wx-line"><span class="m-tag root">词根</span><span class="syn-word" data-w="' + escapeHtml(mo.root) + '">' + escapeHtml(mo.root) + '</span>'
        + (rw && rw.m ? '<span class="wx-v wx-mut">' + escapeHtml(rw.m) + '</span>' : '') + '</div>');
    }
  }else if(mo && mo.type === 'root'){
    rows.push('<div class="wx-line"><span class="m-tag root">词根</span><b>' + escapeHtml(w.w) + '</b>'
      + '<span class="wx-v wx-mut">本词是词根，「派生词」里是同根词</span></div>');
  }else if(rootKey){
    var rm = findWord(rootKey);
    rows.push('<div class="wx-line"><span class="m-tag root">词根</span><span class="syn-word" data-w="' + escapeHtml(rootKey) + '">' + escapeHtml(rootKey) + '</span>'
      + (rm && rm.m ? '<span class="wx-v wx-mut">' + escapeHtml(rm.m) + '</span>' : '') + '</div>');
  }
  return rows.join('');
}
/* #15 词汇补充：可折叠的几组，识词页与单词详情共用这一份数据与排版。
   only 给「单词详情」用 —— 它自己已经有「动词变形」「单复数」两块，别重复画。
   取不到数据的整组不返回，所以界面上不会出现「反义词 0」这种空壳。 */
function wordExtraHTML(w, scope, only){
  if(!w) return '';
  var k = String(w.w || '').toLowerCase();
  var rich = (scope === 'detail');
  var pre = rich ? 'detail:' : 'study:';
  var syn = getSyn(w) || [], ant = getAnt(w) || [];
  function want(g){ return !only || only.indexOf(g) >= 0; }
  var html = '';

  /* ① 近义词 · 反义词（详情页保留收藏 / 加错题本那套，识词页只用轻量词链） */
  if(want('rel') && (syn.length || ant.length)){
    var body;
    if(rich){
      body = relBlockHTML('', 'link', 'syn', '近义 ' + syn.length, syn, w.w)
           + relBlockHTML('', 'scale', 'ant', '反义 ' + ant.length, ant, w.w);
    }else{
      body = (syn.length ? '<div class="wx-line"><span class="m-tag syn">近义</span><span class="wx-v">' + wxWordsHTML(syn) + '</span></div>' : '')
           + (ant.length ? '<div class="wx-line"><span class="m-tag ant">反义</span><span class="wx-v">' + wxWordsHTML(ant) + '</span></div>' : '');
    }
    html += foldWrapHTML(pre + 'rel', '近义词 · 反义词', 'link', body,
      { note: [syn.length ? syn.length + ' 近' : '', ant.length ? ant.length + ' 反' : ''].filter(Boolean).join(' · ') });
  }
  /* ② 构词法 */
  if(want('morph')){
    var mb = wordAffixHTML(w);
    if(mb) html += foldWrapHTML(pre + 'morph', '构词法', 'layers', mb, {});
  }
  /* ③ 派生词 */
  if(want('deriv')){
    var dv = wordDerivList(w);
    if(dv.length){
      var miss = false;
      var chips = dv.map(function(d){
        var inBank = !!findWord(d);
        if(!inBank) miss = true;
        return '<span class="deriv-chip' + (inBank ? '' : ' root') + '" data-w="' + escapeHtml(d) + '">' + escapeHtml(d) + (inBank ? '' : ' *') + '</span>';
      }).join('');
      html += foldWrapHTML(pre + 'deriv', '派生词', 'tree',
        '<div class="deriv-list">' + chips + '</div>' + (miss ? '<div class="wx-mut">* 标记的词暂未收录词库</div>' : ''),
        { note: dv.length + ' 个' });
    }
  }
  /* ④ 过去式 / 过去分词 / 现在分词（走批次 A 的词形层，不用老 VERB_FORMS 单表） */
  if(want('forms')){
    var fp = wordFormParts(w), seg = [];
    if(fp.past.length) seg.push('<div class="wx-line"><b>过去式</b><span class="wx-v">' + wxWordsHTML(fp.past) + '</span></div>');
    if(fp.pp.length) seg.push('<div class="wx-line"><b>过去分词</b><span class="wx-v">' + wxWordsHTML(fp.pp) + '</span></div>');
    if(fp.ing.length) seg.push('<div class="wx-line"><b>现在分词</b><span class="wx-v">' + wxWordsHTML(fp.ing) + '</span></div>');
    if(seg.length) html += foldWrapHTML(pre + 'forms', '过去式 · 过去分词 · 现在分词', 'swap', seg.join(''), {});
  }
  /* ⑤ 比较级 · 最高级 */
  if(want('comp')){
    var cp = getComp(k);
    if(cp && (cp.c || cp.s)){
      html += foldWrapHTML(pre + 'comp', '比较级 · 最高级', 'sort',
        (cp.c ? '<div class="wx-line"><b>比较级</b><span class="wx-v">' + escapeHtml(cp.c) + '</span></div>' : '')
        + (cp.s ? '<div class="wx-line"><b>最高级</b><span class="wx-v">' + escapeHtml(cp.s) + '</span></div>' : ''), {});
    }
  }
  return html;
}
/* #15 识词页的「词汇补充」卡：词义在题面卡里（不重复画）→ 例句 → 折叠区。
   例句里带着这个词的英文原样，所以「要用户写出英文」的那几步（cn2en / spell /
   listen / sent）不展开例句 —— 不然等于把答案摆在屏幕上；答完（feedback）或本来
   就露着英文的那几步（read / en2cn / shadow）照常给。默认展开的块始终只有例句这一块。 */
function studyExtraCardHTML(word, step, s){
  if(!word) return '';
  var showEx = !!(s && s.feedback) || step === 'read' || step === 'en2cn' || step === 'shadow';
  var ex = showEx ? pickExample(word) : null;
  var exHTMLStr = '';
  if(ex && (ex.t || ex.tr)){
    exHTMLStr = '<div class="wx-ex">'
      + (ex.t ? '<div class="wx-ex-t">' + escapeHtml(ex.t) + '</div>' : '')
      + (ex.tr ? '<div class="wx-ex-tr">' + escapeHtml(ex.tr) + '</div>' : '')
      + '</div>';
  }
  var folds = wordExtraHTML(word, 'study', null);
  if(!exHTMLStr && !folds) return '';
  return '<section class="card" id="studyExtra">'
    + '<h2 class="h2">词汇补充 <span class="hint">点标题展开 · 不再翻屏</span></h2>'
    + exHTMLStr + folds
    + '</section>';
}

/* ---------- #10 单个词的整块笔记 ---------- */
/* 一个词「能拿到的全部信息」，HTML 与纯文本两条出口都从这里取。
   取不到的项不进数组 → 调用方直接不画（不出现空壳标题）。 */
function noteWordFacts(w){
  var out = [];
  if(!w || !w.w) return out;
  var k = String(w.w).toLowerCase();
  var ex = pickExample(w);
  var syn = getSyn(w) || [], ant = getAnt(w) || [];
  var comp = getComp(k);
  function put(key, label, text){
    text = String(text == null ? '' : text).replace(/\s+/g, ' ').replace(/^ +| +$/g, '');
    if(!text) return;
    out.push({ k:key, label:label, text:text });
  }
  var ph = String(w.p || '').replace(/^\/+|\/+$/g, '');
  if(ph) put('phon', '音标', '/' + ph + '/');
  put('pos', '词性', noteFieldValue(w, 'pos'));
  put('meaning', '词义', noteFieldValue(w, 'meaning'));
  if(ex && (ex.t || ex.tr)) put('example', '例句', (ex.t || '') + (ex.t && ex.tr ? '  ' : '') + (ex.tr || ''));
  put('affix', '构词法', wordAffixText(w));
  var dv = wordDerivList(w);
  if(dv.length) put('deriv', '派生词', dv.join('，'));
  if(syn.length) put('syn', '近义词', syn.map(function(x){ return x.w; }).join('，'));
  if(ant.length) put('ant', '反义词', ant.map(function(x){ return x.w; }).join('，'));
  if(comp && (comp.c || comp.s)) put('comp', '比较级', (comp.c ? '比较级 ' + comp.c : '') + (comp.c && comp.s ? ' · ' : '') + (comp.s ? '最高级 ' + comp.s : ''));
  var fp = wordFormParts(w), seg = [];
  if(fp.past.length) seg.push('过去式 ' + fp.past.join(' / '));
  if(fp.pp.length) seg.push('过去分词 ' + fp.pp.join(' / '));
  if(fp.ing.length) seg.push('现在分词 ' + fp.ing.join(' / '));
  if(seg.length) put('forms', '动词变形', seg.join(' · '));
  return out;
}
/* 生成笔记的积木行：只把「真取到数据」的模块排进去，顺序与 #15 一致
   （词 → 释义 → 例句 → 补充）。空行会被 noteWordHTML 自己跳过。 */
function noteWordSheetRows(w){
  var has = {};
  noteWordFacts(w).forEach(function(f){ has[f.k] = 1; });
  var rows = [];
  function row(list){
    var r = list.filter(function(k){ return k === 'word' || has[k]; });
    if(r.length) rows.push(r);
  }
  row(['word', 'phon']);
  row(['pos', 'meaning']);
  row(['example']);
  row(['affix']);
  row(['deriv']);
  row(['syn', 'ant']);
  row(['comp']);
  row(['forms']);
  return rows;
}
/* 临时换掉 noteOpts 的几项渲染一次，渲染完立刻还原（try/finally，抛错也还原）。
   这样整块笔记还是走 noteWordHTML / noteBlockHTML 那一套排版。 */
function noteWithOpts(patch, fn){
  var saved = {};
  Object.keys(patch).forEach(function(k){ saved[k] = noteOpts[k]; noteOpts[k] = patch[k]; });
  try{ return fn(); }
  finally{ Object.keys(saved).forEach(function(k){ noteOpts[k] = saved[k]; }); }
}
/* 整块笔记的 HTML（弹层里那块纸） */
function noteWordSheetHTML(w){
  var rows = noteWordSheetRows(w);
  return noteWithOpts({
    rows:rows, fontSize:15, fontAuto:false, lineHeight:1.35,
    perWordGap:0, rowGap:0.5, blockGap:12, rowAlign:'top', ruleStyle:'none'
  }, function(){ return noteWordHTML(w); });
}
/* 整块笔记的纯文本（剪贴板用）：第一行「单词  /音标/」，接着一块一行「标签：内容」 */
function noteWordSheetText(w){
  var facts = noteWordFacts(w), head = String(w.w || ''), phon = '';
  facts.forEach(function(f){ if(f.k === 'phon') phon = f.text; });
  if(phon) head += '  ' + phon;
  var lines = [head];
  facts.forEach(function(f){ if(f.k !== 'phon') lines.push(f.label + '：' + f.text); });
  return lines.join('\n');
}
/* 复制到剪贴板：优先 navigator.clipboard，不可用（或 http 下被拒）就退回
   textarea + execCommand 的老办法 —— 两条都失败才如实说失败。 */
function copyText(text, cb){
  function done(ok){ if(cb) cb(!!ok); }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallbackCopyText(text)); });
      return;
    }
  }catch(e){}
  done(fallbackCopyText(text));
}
function fallbackCopyText(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    var ok = false;
    try{ ok = document.execCommand && document.execCommand('copy'); }catch(e2){ ok = false; }
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
function closeWordNoteSheet(){
  var mask = $('#modal');
  if(mask) mask.classList.add('hidden');
}
function setNoteSheetTip(s){
  var t = $('#nsheetTip');
  if(t) t.textContent = s;
}
/* #10 生成笔记弹层：把这一个词的整块笔记摆出来，能复制、能存成一条笔记。
   识词页底部那颗按钮与单词详情右上角那颗按钮都走这里。 */
function openWordNoteSheet(w){
  if(!w || !w.w) return;
  var mask = $('#modal');
  if(!mask) return;
  var box = mask.querySelector('.modal');
  if(!box) return;
  var text = noteWordSheetText(w);
  box.innerHTML = '<button class="modal-close" id="mClose">' + IC('x') + '</button>'
    + '<div class="m-head"><div style="flex:1;min-width:0">'
    +   '<div class="m-wordline"><span class="word-big sm" style="margin:0">' + escapeHtml(w.w) + '</span></div>'
    +   '<p class="muted" style="margin:4px 0 0">这一个词的整块笔记 · 排版与「笔记模式」同一套</p>'
    + '</div></div>'
    + '<div class="nsheet-paper" id="nsheetPaper">' + noteWordSheetHTML(w) + '</div>'
    + '<div class="nsheet-acts">'
    +   '<button class="btn primary" id="nsheetCopy">' + IC('clipboard') + ' 复制到剪贴板</button>'
    +   '<button class="btn" id="nsheetSave">' + IC('notebook') + ' 存成一条笔记</button>'
    +   '<button class="btn ghost" id="nsheetClose">关闭</button>'
    + '</div>'
    + '<p class="nsheet-tip" id="nsheetTip">「复制到剪贴板」把上面整块内容转成纯文本带走；「存成一条笔记」存进本机的笔记数据，之后在单词详情里能再看、能删。</p>';
  mask.classList.remove('hidden');
  $('#mClose').onclick = closeWordNoteSheet;
  $('#nsheetClose').onclick = closeWordNoteSheet;
  mask.onclick = function(e){ if(e.target === mask) closeWordNoteSheet(); };
  var cp = $('#nsheetCopy');
  cp.onclick = function(){
    copyText(text, function(ok){
      if(ok){
        cp.innerHTML = IC('check') + ' 已复制';
        cp.classList.add('on');
        setNoteSheetTip('已复制到剪贴板（' + text.split('\n').length + ' 行），粘到聊天、备忘录、文档里都行。');
        toast('已复制到剪贴板');
      }else{
        setNoteSheetTip('这个浏览器不让网页直接写剪贴板（常见于非 https 环境）。可以长按上面那块内容手动选中复制。');
        toast('复制失败：浏览器不允许');
      }
    });
  };
  var sv = $('#nsheetSave');
  sv.onclick = function(){
    var ok = addNote('word', w.w, text);   /* 存进现有的笔记数据（S.notes），addNote 内部已 save() */
    if(!ok){ toast('这条笔记没存上'); return; }
    sv.innerHTML = IC('check') + ' 已存成笔记';
    sv.classList.add('on');
    setNoteSheetTip('已存成一条笔记（这个词共 ' + getNotes('word', w.w).length + ' 条），在单词详情页的「我的笔记」里能看、能删。');
    toast('已存成一条笔记');
  };
}
/* 单词详情里的「我的笔记」：把存过的整块笔记读回来（同一个 S.notes） */
function wordNotesHTML(w){
  if(!w || !w.w) return '';
  var list = getNotes('word', w.w);
  if(!list.length) return '';
  return '<div class="m-block">'
    + '<div class="m-ex-title" style="margin-top:0">' + IC('notebook') + ' 我的笔记 <span class="m-tag">' + list.length + ' 条</span></div>'
    + list.map(function(n){
        return '<div class="wx-note">'
          + '<pre class="wx-note-t">' + escapeHtml(n.t || '') + '</pre>'
          + '<button type="button" class="wx-note-del" data-wnote="' + Number(n.time || 0) + '" title="删除这条笔记">' + IC('x') + '</button>'
          + '</div>';
      }).join('')
    + '</div>';
}

/* 纸面几何：像素尺寸 + 内容区 + 横线数 + 行距。
   屏幕上的纸按真实比例放大（毫米 → 像素），所以小本子看起来也小。 */
var NOTE_PX_PER_MM = 2.2;
function notePaperMetrics(){
  var fmt = noteFmt();
  var landscape = noteOpts.orientation === 'landscape';
  var pw = landscape ? fmt.h : fmt.w;   /* 毫米：纸的宽 */
  var ph = landscape ? fmt.w : fmt.h;
  var spread = noteIsSpread();
  /* 纸必须装得进当前内容区：宽屏扣掉侧栏，窄屏按视口减内边距，否则手机上右边会被切掉 */
  var vw = window.innerWidth || 1024;
  var avail = (vw >= 861) ? (vw - 300) : (vw - 48);
  if(avail < 220) avail = Math.max(180, vw - 24);
  var maxW = spread ? Math.min(430, Math.round((avail - 18) / 2)) : Math.min(560, Math.round(avail));
  var maxH = spread ? 560 : 700;
  if(maxW < 120) maxW = 120;
  var scale = Math.min(maxW / pw, NOTE_PX_PER_MM);
  var w = pw * scale, h = ph * scale;
  if(h > maxH){ scale = maxH / ph; w = pw * scale; h = ph * scale; }
  w = Math.round(w); h = Math.round(h);
  var padX = Math.round(w * 0.08), padY = Math.round(h * 0.06);
  var rc = parseInt(noteOpts.ruleCount, 10);
  if(isNaN(rc) || rc < 4) rc = noteDefaultRules(noteOpts.format);
  if(rc > 80) rc = 80;
  var ch = h - padY * 2;
  return { w:w, h:h, pw:pw, ph:ph, scale:scale, padX:padX, padY:padY, cw:w - padX * 2, ch:ch, rules:rc, sp:ch / rc };
}
function noteLinePx(){ return notePaperMetrics().sp; }
/* 基线偏移：文字首行基线到内容顶部的距离（px）。用它把横线画到文字基线，字才「坐在」线上。 */
var _noteBaselineCache = null;
function noteBaselineOffset(){
  var m = notePaperMetrics();
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var sp = m.sp;
  var lhEm = (sp / fs).toFixed(3);
  var key = fs + '|' + sp.toFixed(2) + '|' + (noteOpts.rowAlign || 'base');
  if(_noteBaselineCache && _noteBaselineCache.key === key) return _noteBaselineCache.val;
  var probe = noteProbeEl();
  probe.style.width = '320px';
  probe.style.fontSize = fs + 'px';
  probe.innerHTML = '<div class="nw-row" style="line-height:' + lhEm + 'em;align-items:' + ((noteOpts.rowAlign === 'top') ? 'flex-start' : 'baseline') + '"><span class="nw-w">Ag</span><i id="__bp" style="display:inline-block;height:0;width:0"></i></div>';
  var row = probe.firstChild;
  var ib = document.getElementById('__bp');
  var val = 0;
  if(row && ib){ val = ib.offsetTop - row.offsetTop; if(val < 0) val = 0; }
  probe.innerHTML = '';
  _noteBaselineCache = { key: key, val: val };
  return val;
}
function noteRulesCSS(m){
  if(noteOpts.ruleStyle === 'none') return '';
  var sp = Math.max(2, m.sp);
  var bo = noteBaselineOffset();
  var a = Math.max(1, sp - 1).toFixed(1);
  var b = sp.toFixed(1);
  var rowsG = 'repeating-linear-gradient(to bottom,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.22) ' + a + 'px,rgba(15,23,42,.22) ' + b + 'px)';
  var pos = ';background-position:0 ' + bo.toFixed(2) + 'px';
  if(noteOpts.ruleStyle === 'grid'){
    var colsG = 'repeating-linear-gradient(to right,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.13) ' + a + 'px,rgba(15,23,42,.13) ' + b + 'px)';
    return 'background-image:' + rowsG + ',' + colsG + pos;
  }
  return 'background-image:' + rowsG + pos;
}
/* 把每一行的实际高度吸附成行距的整数倍。
   混排字号（单词 1.1em、其余 0.95em）时浏览器算出的行盒会比 line-height 高出不到 1px，
   一行看不出，几十行累积下来文字就明显离开横线。吸附之后每行都严格落在格子里，
   文字基线始终等于纸面横线位置（横线按 noteBaselineOffset() 偏移绘制）。 */
function noteSnapRows(root, spPx){
  if(!root || !root.querySelectorAll) return 0;
  var sp = spPx || noteLinePx();
  if(!(sp > 0.5)) return 0;
  var rows = root.querySelectorAll('.nw-row');
  var fixed = 0;
  for(var i = 0; i < rows.length; i++){
    var el = rows[i];
    var h = el.getBoundingClientRect().height;
    if(!(h > 0)) continue;
    var n = Math.max(1, Math.round(h / sp));
    var target = n * sp;
    /* 自然高度只比整数倍多出不到 2px：直接把这点余量压掉（眼睛看不出来，行高却回到整数倍）；
       多出更多说明这一行是真的要多占一条线，宁可多让一行，也不能被 overflow:hidden 把字裁掉 */
    if(target < h - 2){ n = n + 1; target = n * sp; }
    if(Math.abs(h - target) < 0.05) continue;
    el.style.height = target.toFixed(2) + 'px';
    fixed++;
  }
  return fixed;
}
/* 一页纸的 HTML（预览与打印共用） */
function notePaperHTML(pg){
  var m = notePaperMetrics();
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  var cws = (pg && pg.length) ? pg : [[]];
  var gap = Math.round(m.cw * 0.05);
  var body;
  if(cols > 1){
    body = '<div class="nw-cols" style="gap:' + gap + 'px">' + cws.map(function(c){
      return '<div class="nw-col">' + (c || []).map(noteWordHTML).join('') + '</div>';
    }).join('') + '</div>';
  }else{
    body = (cws[0] || []).map(noteWordHTML).join('');
  }
  return '<div class="note-paper" style="width:' + m.w + 'px;height:' + m.h + 'px;font-size:' + noteOpts.fontSize + 'px">'
    + '<div class="note-paper-rules" style="inset:' + m.padY + 'px ' + m.padX + 'px;' + noteRulesCSS(m) + '"></div>'
    + '<div class="note-paper-in" style="padding:' + m.padY + 'px ' + m.padX + 'px">'
    + body + '</div></div>';
}
/* 每词占几条横线 */
function noteLinesPerWord(){
  var n = 0;
  (noteOpts.rows || []).forEach(function(r){ if(r && r.length) n++; });
  if(!n) n = 1;
  n += parseFloat(noteOpts.rowGap) || 0;
  n += parseInt(noteOpts.perWordGap, 10) || 0;
  return Math.max(1, n);
}
function notePageCapacity(){
  var m = notePaperMetrics();
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  return Math.max(1, Math.floor(m.rules / noteLinesPerWord()) * cols);
}
/* 量词高度的离屏容器（例句会换行，行数不能按「一条横线」硬算） */
function noteProbeEl(){
  var el = document.getElementById('__noteProbe');
  if(!el){
    el = document.createElement('div');
    el.id = '__noteProbe';
    el.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none';
    document.body.appendChild(el);
  }
  return el;
}
/* 分页：每页 = 若干列，每列 = 若干词。把整批词一次渲染进离屏容器，再单次循环量高（只一次回流），
   避免逐词 innerHTML+offsetHeight 造成的 N 次强制回流（多词时卡顿的根因）。 */
function buildNotePages(){
  if(!noteWords.length) return [[[]]];
  var m = notePaperMetrics();
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  var gap = Math.round(m.cw * 0.05);
  var colW = Math.max(40, (m.cw - gap * (cols - 1)) / cols);
  var probe = noteProbeEl();
  probe.style.width = colW + 'px';
  probe.style.fontSize = (parseInt(noteOpts.fontSize, 10) || 14) + 'px';
  probe.innerHTML = noteWords.map(noteWordHTML).join('');
  var els = probe.children;
  var pages = [], page = [], col = [], colH = 0, colIdx = 0;
  for(var i = 0; i < noteWords.length; i++){
    var h = (els[i] && els[i].offsetHeight) || 0;
    if(colH > 0 && colH + h > m.ch){
      page.push(col); col = []; colH = 0; colIdx++;
      if(colIdx >= cols){ pages.push(page); page = []; colIdx = 0; }
    }
    col.push(noteWords[i]);
    colH += h;
  }
  if(col.length) page.push(col);
  if(page.length) pages.push(page);
  if(!pages.length) pages = [[[]]];
  probe.innerHTML = '';
  return pages;
}
function notePageWords(pg){
  var out = [];
  (pg || []).forEach(function(c){ (c || []).forEach(function(w){ out.push(w); }); });
  return out;
}
function noteIsSpread(){
  return typeof window !== 'undefined' && window.innerWidth >= 861;
}
/* 窄屏（手机）判定：**复用** noteIsSpread 里那条 861 的界 —— 它和 CSS 的
   @media (max-width:860px) / @media (min-width:861px) 是同一条线，工程里没有第二套宽度阈值，
   这里也不再新造 matchMedia。首屏落哪一屏（#5）就看它。 */
function isPhoneWidth(){ return !noteIsSpread(); }
/* 换纸张 / 改行数后，把字号调到刚好落在一行里 */
function noteAutoFont(){
  if(noteOpts.fontAuto === false) return;
  var m = notePaperMetrics();
  var lh = parseFloat(noteOpts.lineHeight) || 1.7;
  var fs = Math.round(m.sp / lh);
  if(fs < 8) fs = 8;
  if(fs > 24) fs = 24;
  noteOpts.fontSize = fs;
}
function noteDefaultRules(k){
  var f = null;
  for(var i = 0; i < NOTE_FORMATS.length; i++){ if(NOTE_FORMATS[i].k === k) f = NOTE_FORMATS[i]; }
  if(!f) f = NOTE_FORMATS[0];
  return (noteOpts.orientation === 'landscape') ? Math.max(8, Math.round(f.lines * f.h / f.w)) : f.lines;
}
function noteGoPage(dir){
  var pages = buildNotePages();
  var np = pages.length;
  var step = noteIsSpread() ? 2 : 1;
  var target = notePage + dir * step;
  if(target < 0) target = 0;
  else if(target >= np) target = Math.max(0, Math.floor((np - 1) / step) * step);
  if(target === notePage) return;
  var papers = $$('.note-paper');
  if(papers.length && np > step){
    var axis = noteOpts.flip === 'v' ? 'rotateX' : 'rotateY';
    papers.forEach(function(p){ p.style.transition = 'transform .2s ease'; p.style.transform = axis + '(' + (dir > 0 ? -88 : 88) + 'deg)'; });
    setTimeout(function(){
      notePage = target;
      render();
      var p2 = $$('.note-paper');
      p2.forEach(function(p){
        p.style.transition = 'none';
        p.style.transform = axis + '(' + (dir > 0 ? 88 : -88) + 'deg)';
      });
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          p2.forEach(function(p){ p.style.transition = 'transform .2s ease'; p.style.transform = axis + '(0deg)'; });
        });
      });
    }, 200);
  }else{
    notePage = target; render();
  }
}
/* ---------- 导出范围：当前页 / 全部 / 指定范围 ---------- */
function noteRangePages(){
  var pages = buildNotePages();
  var np = pages.length;
  var from = 1, to = np;
  if(noteOpts.pdfRange === 'current'){
    from = notePage + 1;
    to = Math.min(np, from + (noteIsSpread() ? 1 : 0));
  }else if(noteOpts.pdfRange === 'range'){
    from = parseInt(noteOpts.pdfFrom, 10); if(isNaN(from) || from < 1) from = 1;
    to = parseInt(noteOpts.pdfTo, 10); if(isNaN(to) || to < 1) to = np;
    if(to > np) to = np;
    if(to < from) to = from;
  }
  var list = [];
  for(var i = from; i <= to && i <= np; i++){ if(pages[i - 1]) list.push({ n:i, cols:pages[i - 1], ws:notePageWords(pages[i - 1]) }); }
  if(!list.length) list.push({ n:1, cols:pages[0] || [[]], ws:notePageWords(pages[0]) });
  return { list:list, total:np, from:from, to:to };
}
/* 生成打印页（同时就是「保存为 PDF」的入口，走浏览器打印对话框） */
function generateNotePrintable(){
  if(!noteWords.length){ toast('请先选择单词'); return; }
  var m = notePaperMetrics();
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var padXmm = m.pw * 0.08, padYmm = m.ph * 0.06;
  var cwmm = m.pw - padXmm * 2, chmm = m.ph - padYmm * 2;
  var spmm = chmm / m.rules;
  var up = (96 / 25.4) / m.scale;          /* 屏幕纸 → 真实纸张 */
  var boMm = noteBaselineOffset() / m.scale;   /* 基线偏移换算成毫米，横线画到文字基线 */
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  var sel = noteRangePages();
  var a = Math.max(0.2, spmm - 0.25).toFixed(2), b = spmm.toFixed(2);
  var bgs = '';
  if(noteOpts.ruleStyle !== 'none'){
    bgs = 'repeating-linear-gradient(to bottom,transparent 0,transparent ' + a + 'mm,rgba(15,23,42,.28) ' + a + 'mm,rgba(15,23,42,.28) ' + b + 'mm)';
    if(noteOpts.ruleStyle === 'grid'){
      bgs += ',repeating-linear-gradient(to right,transparent 0,transparent ' + a + 'mm,rgba(15,23,42,.16) ' + a + 'mm,rgba(15,23,42,.16) ' + b + 'mm)';
    }
    bgs += ';background-position:0 ' + boMm.toFixed(2) + 'mm';
  }
  var gapMm = cwmm * 0.05;
  var body = sel.list.map(function(p){
    var inner = (cols > 1)
      ? (p.cols || [p.ws]).map(function(c){
          return '<div class="pg-col">' + (c || []).map(noteWordHTML).join('') + '</div>';
        }).join('')
      : p.ws.map(noteWordHTML).join('');
    return '<section class="pg">'
      + '<div class="pg-rules" style="inset:' + padYmm.toFixed(2) + 'mm ' + padXmm.toFixed(2) + 'mm' + (bgs ? ';background-image:' + bgs : '') + '"></div>'
      + '<div class="pg-body" style="padding:' + padYmm.toFixed(2) + 'mm ' + padXmm.toFixed(2) + 'mm' + (cols > 1 ? ';display:flex;gap:' + gapMm.toFixed(2) + 'mm' : '') + '">'
      + inner
      + '</div>'
      + '<div class="pg-no">' + p.n + ' / ' + sel.total + '</div>'
      + '</section>';
  }).join('');
  var head = '单词笔记 · ' + noteWords.length + ' 词 · 第 ' + sel.from + '–' + sel.to + ' / ' + sel.total + ' 页';
  var html = '<!DOCTYPE html>\n<html lang="zh-CN"><head><meta charset="utf-8"><title>' + head + '</title>\n'
    + '<style>\n'
    + '@page{size:' + m.pw.toFixed(1) + 'mm ' + m.ph.toFixed(1) + 'mm;margin:0}\n'
    + '*{box-sizing:border-box}\n'
    + 'body{margin:0;font-family:Georgia,"Songti SC","Microsoft YaHei",serif;color:#0f172a;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n'
    + '.pg{position:relative;width:' + m.pw.toFixed(1) + 'mm;height:' + m.ph.toFixed(1) + 'mm;overflow:hidden;page-break-after:always;font-size:' + (fs * up).toFixed(1) + 'px}\n'
    + '.pg:last-child{page-break-after:auto}\n'
    + '.pg-rules{position:absolute;pointer-events:none}\n'
    + '.pg-body{position:absolute;inset:0;overflow:hidden}\n'
    + '.pg-col{flex:1 1 0;min-width:0;overflow:hidden}\n'
    + '.pg-no{position:absolute;right:' + padXmm.toFixed(1) + 'mm;bottom:4mm;font-size:9px;color:#94a3b8}\n'
    + '.nw-row{display:flex;flex-wrap:wrap;align-items:baseline;overflow:hidden}\n'
    + '.nw-w{font-family:Georgia,serif;font-weight:700;font-size:1.1em}\n'
    + '.nw-ex,.nw-tr,.nw-syn,.nw-ant,.nw-comp,.nw-verb,.nw-morph{font-size:.95em}\n'
    + '.note-word{margin-bottom:0;break-inside:avoid}\n'
    + '.bar{position:fixed;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;background:#0f172a;color:#f8fafc;font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:13px;z-index:9}\n'
    + '.bar button{font:inherit;padding:8px 18px;border:0;border-radius:8px;background:#38bdf8;color:#06283d;font-weight:700;cursor:pointer}\n'
    + '@media screen{body{padding-top:62px}}\n'
    + '@media print{.bar{display:none!important}}\n'
    + '</style>\n</head><body>\n'
    + '<div class="bar"><span>' + head + '<br>在打印对话框里选「另存为 PDF」即可保存</span><button onclick="window.print()">打印 / 保存为 PDF</button></div>\n'
    + body + '\n</body></html>';
  var win = window.open('', '_blank');
  if(!win){ toast('请允许弹出窗口'); return; }
  win.document.open(); win.document.write(html); win.document.close();
  setTimeout(function(){
    try{ noteSnapRows(win.document.body, m.sp * up); }catch(e){}
    try{ win.focus(); }catch(e){}
  }, 200);
}
/* ---------- 内置 PDF 生成（无外部库：栅格化每页 → JPEG → 手写最小 PDF） ---------- */
function noteBase64ToBytes(b64){
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
/* 单页的真实尺寸 HTML（内联样式 + 内嵌 .nw-* 样式），供 foreignObject 栅格化。
   rscale = 相对 96dpi 的放大倍数（越大越清晰）；em 是尺度无关的，改容器字号即可整体缩放，
   换行位置与屏幕预览完全一致。 */
function noteRasterPageHTML(p, rscale){
  var m = notePaperMetrics();
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var up = (96 / 25.4) / m.scale;
  var fpx = fs * up * rscale;
  var ppm = (96 / 25.4) * rscale;
  var wpx = Math.round(m.pw * ppm), hpx = Math.round(m.ph * ppm);
  var padX = Math.round(m.pw * 0.08 * ppm), padY = Math.round(m.ph * 0.06 * ppm);
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  var cw = wpx - padX * 2;
  var gap = Math.round(cw * 0.05);
  var sppx = (hpx - padY * 2) / m.rules;
  var bo = noteBaselineOffset() * up * rscale;
  var rules = '';
  if(noteOpts.ruleStyle !== 'none'){
    var a = Math.max(1, sppx - 1).toFixed(2), b = sppx.toFixed(2);
    var layers = ['repeating-linear-gradient(to bottom,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.28) ' + a + 'px,rgba(15,23,42,.28) ' + b + 'px)'];
    if(noteOpts.ruleStyle === 'grid') layers.push('repeating-linear-gradient(to right,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.16) ' + a + 'px,rgba(15,23,42,.16) ' + b + 'px)');
    rules = 'background-image:' + layers.join(',') + ';background-position:0 ' + bo.toFixed(2) + 'px';
  }
  var body = (cols > 1)
    ? '<div style="display:flex;align-items:flex-start;gap:' + gap + 'px;width:100%">'
        + (p.cols || [p.ws]).map(function(c){
            return '<div style="flex:1 1 0;min-width:0">' + (c || []).map(noteWordHTML).join('') + '</div>';
          }).join('')
        + '</div>'
    : ((p.ws || []).map(noteWordHTML).join(''));
  return '<div style="width:' + wpx + 'px;height:' + hpx + 'px;position:relative;overflow:hidden;background:#fffdf6;color:#0f172a;font-family:Georgia,\'Songti SC\',\'Microsoft YaHei\',serif;font-size:' + fpx.toFixed(2) + 'px">'
    + '<style>.nw-row{display:flex;flex-wrap:wrap;overflow:hidden}.nw-w{font-family:Georgia,serif;font-weight:700;font-size:1.1em}.nw-ex,.nw-tr,.nw-syn,.nw-ant,.nw-comp,.nw-verb,.nw-morph{font-size:.95em}.nw-gap{display:inline-block;flex:0 0 auto;height:1em}.nw-link{text-decoration:underline;text-underline-offset:2px}.note-word{break-inside:avoid}</style>'
    + '<div style="position:absolute;inset:' + padY + 'px ' + padX + 'px;' + rules + '"></div>'
    + '<div style="position:absolute;inset:0;padding:' + padY + 'px ' + padX + 'px;overflow:hidden">' + body + '</div>'
    + '</div>';
}
/* 把页面 HTML 先挂到隐藏容器里量一遍、吸附行高，再拿去栅格化——PDF 里也严格贴线 */
function noteSnapPageHTML(html, wpx, hpx, spPx){
  var holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + wpx + 'px;height:' + hpx + 'px;overflow:hidden;pointer-events:none';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  noteSnapRows(holder, spPx);
  var out = holder.innerHTML;
  holder.parentNode.removeChild(holder);
  return out;
}
function noteRasterize(html, wpx, hpx, cb){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + wpx + '" height="' + hpx + '">'
    + '<foreignObject width="100%" height="100%">'
    + '<div xmlns="http://www.w3.org/1999/xhtml">' + html + '</div>'
    + '</foreignObject></svg>';
  var img = new Image();
  img.onload = function(){
    try{
      var cv = document.createElement('canvas');
      cv.width = wpx; cv.height = hpx;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fffdf6';
      ctx.fillRect(0, 0, wpx, hpx);
      ctx.drawImage(img, 0, 0, wpx, hpx);
      var data = cv.toDataURL('image/jpeg', 0.92);
      cv.width = cv.height = 0;
      cb(data.slice(data.indexOf(',') + 1));
    }catch(e){ cb(null); }
  };
  img.onerror = function(){ cb(null); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
/* 手写最小 PDF：把若干 JPEG 逐页嵌进去（DCTDecode），正确算 xref 偏移 */
function noteBuildPdf(imgs, wpt, hpt){
  var enc = new TextEncoder();
  var parts = [];
  var pos = 0;
  var xref = [];
  function add(u8){ parts.push(u8); pos += u8.length; }
  function str(s){ add(enc.encode(s)); }
  function obj(num, dict, streamBytes){
    xref.push([num, pos]);
    str(num + ' 0 obj\n' + dict);
    if(streamBytes){
      str('stream\n');
      add(streamBytes);
      str('\nendstream\n');
    }
    str('endobj\n');
  }
  str('%PDF-1.4\n');
  add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  var n = imgs.length;
  var kids = [];
  for(var i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>\n', null);
  obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\n', null);
  for(var j = 0; j < n; j++){
    var pg = 3 + j * 3, im = 4 + j * 3, ct = 5 + j * 3;
    var jpg = noteBase64ToBytes(imgs[j].b64);
    obj(im, '<< /Type /XObject /Subtype /Image /Width ' + imgs[j].w + ' /Height ' + imgs[j].h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\n', jpg);
    var cs = enc.encode('q ' + wpt.toFixed(2) + ' 0 0 ' + hpt.toFixed(2) + ' 0 0 cm /Im0 Do Q');
    obj(ct, '<< /Length ' + cs.length + ' >>\n', cs);
    obj(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + wpt.toFixed(2) + ' ' + hpt.toFixed(2) + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>\n', null);
  }
  var xrefPos = pos;
  xref.sort(function(a, b){ return a[0] - b[0]; });
  var xs = 'xref\n0 ' + (xref.length + 1) + '\n';
  xs += '0000000000 65535 f \n';
  for(var k = 0; k < xref.length; k++){
    xs += String(xref[k][1]).padStart(10, '0') + ' 00000 n \n';
  }
  str(xs);
  str('trailer\n<< /Size ' + (xref.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n');
  var out = new Uint8Array(pos);
  var off = 0;
  parts.forEach(function(p){ out.set(p, off); off += p.length; });
  return out;
}
function noteDownloadBlob(bytes, filename){
  var blob = new Blob([bytes], { type:'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function generateNotePdf(){
  if(!noteWords.length){ toast('请先选择单词'); return; }
  var m = notePaperMetrics();
  var sel = noteRangePages();
  var rscale = 2;
  var ppm = (96 / 25.4) * rscale;
  var wpx = Math.round(m.pw * ppm), hpx = Math.round(m.ph * ppm);
  var wpt = m.pw * 72 / 25.4, hpt = m.ph * 72 / 25.4;
  var imgs = [];
  toast('正在生成 PDF…');
  var idx = 0;
  function next(){
    if(idx >= sel.list.length){
      var bytes = noteBuildPdf(imgs, wpt, hpt);
      noteDownloadBlob(bytes, '单词笔记_' + sel.from + '-' + sel.to + '.pdf');
      toast('PDF 已生成');
      return;
    }
    var p = sel.list[idx];
    var padY = Math.round(m.ph * 0.06 * ppm);
    var spPx = (hpx - padY * 2) / m.rules;
    var pageHtml = noteSnapPageHTML(noteRasterPageHTML(p, rscale), wpx, hpx, spPx);
    noteRasterize(pageHtml, wpx, hpx, function(b64){
      if(b64) imgs.push({ b64:b64, w:wpx, h:hpx });
      idx++;
      next();
    });
  }
  next();
}
/* ---------- 积木编辑器 ---------- */
function noteBlkChip(k, ri, ki, inPool){
  var md = noteFieldMeta(k);
  if(!md) return '';
  var pad = parseFloat((noteOpts.blockPad || {})[k]) || 0;
  if(inPool){
    return '<button class="blk" data-add="' + k + '" title="加进积木">＋ ' + md.short + '</button>';
  }
  var padMax = (k === 'gap') ? 160 : 40;
  var padTitle = (k === 'gap') ? '空格宽度（px）' : '这个模块的前后间距（px）';
  return '<span class="blk" draggable="true" data-k="' + k + '" data-ri="' + ri + '" data-ki="' + ki + '">'
    + '<span class="blk-grip" title="按住拖动">::</span>' + md.short
    + '<button class="blk-more" data-more="1" title="点开操作菜单（上移 / 下移 / 左移 / 右移）">⋯</button>'
    + '<button class="blk-b" data-mv="-1" title="往前挪">◀</button>'
    + '<button class="blk-b" data-mv="1" title="往后挪">▶</button>'
    + '<button class="blk-b" data-rm="1" title="移出积木">✕</button>'
    + '<input class="blk-pad" type="number" min="0" max="' + padMax + '" value="' + pad + '" data-pad="' + k + '" title="' + padTitle + '">'
    + '</span>';
}
function noteBlkEditorHTML(){
  var rows = noteOpts.rows || [];
  var buf = ['<div class="blk-wrap">'];
  buf.push('<p class="blk-tap-hint">电脑端可直接拖动积木；手机 / 平板端点一下积木（或点 ⋯）打开操作菜单，可上移 / 下移 / 左移 / 右移。</p>');
  rows.forEach(function(row, i){
    buf.push('<div class="blk-row" data-drop="' + i + '">');
    buf.push('<span class="blk-lab">第 ' + (i + 1) + ' 行</span>');
    (row || []).forEach(function(k, j){ buf.push(noteBlkChip(k, i, j, false)); });
    buf.push('<span class="blk-drop">拖到这里</span></div>');
  });
  buf.push('<div class="blk-row" data-drop="' + rows.length + '">');
  buf.push('<span class="blk-lab">新行</span><span class="blk-drop">拖到这里 = 另起一行</span>');
  buf.push('<button class="blk-b" id="noteNewRow" style="font-size:13px">＋ 加一行</button>');
  buf.push('<button class="blk-b" id="noteDelRow" style="font-size:13px">－ 减一行</button></div>');
  /* 可加模块池：未用到的字段 + 空格（空格占位恒可加，不限个数） */
  var pool = NOTE_FIELDS.filter(function(f){ return !noteFieldOn(f.k); });
  buf.push('<div class="blk-pool"><span class="blk-lab">可加模块：</span>');
  buf.push(pool.map(function(f){ return noteBlkChip(f.k, null, null, true); }).join(''));
  buf.push(noteBlkChip('gap', null, null, true));
  buf.push('</div>');
  /* 点在积木上弹出的操作菜单（手机端主要交互） */
  buf.push('<div class="blk-menu" id="blkMenu" hidden>'
    + '<div class="blk-menu-t">这块积木</div>'
    + '<button class="blk-mi" type="button" data-bm="up">↑ 上移一行</button>'
    + '<button class="blk-mi" type="button" data-bm="down">↓ 下移一行</button>'
    + '<button class="blk-mi" type="button" data-bm="left">← 左移一位</button>'
    + '<button class="blk-mi" type="button" data-bm="right">→ 右移一位</button>'
    + '<button class="blk-mi danger" type="button" data-bm="del">✕ 移出积木</button>'
    + '</div>');
  buf.push('</div>');
  return buf.join('');
}
/* 格式预览：取一个样例词，用当前积木/颜色/行距设置渲染成小纸卡，方便看格式 */
function noteSampleWord(){
  if(noteWords.length) return noteWords[0];
  return { w:'example', m:'n. 例子；范例', ex:[{ t:'This is a good example.', tr:'这是一个好例子。', s:'' }] };
}
function noteSampleCard(){
  var w = noteSampleWord();
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var sp = noteLinePx();
  var bo = noteBaselineOffset();
  var rules = '';
  if(noteOpts.ruleStyle !== 'none'){
    var a = Math.max(1, sp - 1).toFixed(1), b = sp.toFixed(1);
    var layers = ['repeating-linear-gradient(to bottom,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.22) ' + a + 'px,rgba(15,23,42,.22) ' + b + 'px)'];
    if(noteOpts.ruleStyle === 'grid') layers.push('repeating-linear-gradient(to right,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.13) ' + a + 'px,rgba(15,23,42,.13) ' + b + 'px)');
    rules = 'background-image:' + layers.join(',') + ';background-position:0 ' + bo.toFixed(2) + 'px';
  }

    + '<div class="note-sample" style="font-size:' + fs + 'px">'
    +   '<div class="note-sample-rules" style="' + rules + '"></div>'
    +   '<div class="note-sample-in">' + noteWordHTML(w) + '</div>'
    + '</div></section>';
}
function noteColorCard(){
  return '<section class="card"><h2 class="h2">模块颜色</h2><div class="note-fields">'
    + NOTE_FIELDS.map(function(fd){
        return '<div class="note-field-row"><span class="blk-lab">' + fd.short + '</span>'
          + '<input type="color" class="note-color" data-c="' + fd.k + '" value="' + (noteOpts.colors[fd.k] || '#0f172a') + '"></div>';
      }).join('')
    + '</div></section>';
}
function noteCleanRows(){
  var out = [];
  (noteOpts.rows || []).forEach(function(r){ if(r && r.length) out.push(r); });
  if(!out.length) out.push([]);
  noteOpts.rows = out;
}
/* 按「行号 + 列号」精确操作积木（支持空格模块重复出现，不再靠 key 的 indexOf） */
function noteRemoveBlockAt(ri, ki){
  var rows = noteOpts.rows;
  if(rows[ri] && rows[ri][ki] !== undefined){ rows[ri].splice(ki, 1); noteCleanRows(); render(); }
}
function noteMoveBlockAt(ri, ki, dir){
  var rows = noteOpts.rows;
  var k = rows[ri] && rows[ri][ki];
  if(k === undefined) return;
  if(dir < 0){
    if(ki > 0){ var t = rows[ri][ki - 1]; rows[ri][ki - 1] = k; rows[ri][ki] = t; }
    else if(ri > 0){ rows[ri].splice(ki, 1); rows[ri - 1].push(k); }
  }else{
    if(ki < rows[ri].length - 1){ var t2 = rows[ri][ki + 1]; rows[ri][ki + 1] = k; rows[ri][ki] = t2; }
    else if(ri < rows.length - 1){ rows[ri].splice(ki, 1); rows[ri + 1].unshift(k); }
  }
  noteCleanRows(); render();
}
/* 上下移一行（菜单里的「上移 / 下移」）：尽量落在目标行的同一列号 */
function noteMoveVertAt(ri, ki, dir){
  var rows = noteOpts.rows;
  if(!rows[ri] || rows[ri][ki] === undefined) return;
  var k = rows[ri][ki];
  var to = ri + dir;
  if(to < 0){
    rows.unshift([k]);
    rows[ri + 1].splice(ki, 1);
  }else if(to >= rows.length){
    rows[ri].splice(ki, 1);
    rows.push([k]);
  }else{

function noteDropAt(k, tri, tki, sri, ski){

/* 触屏拖动积木（替代 HTML5 拖放——手机/平板没有拖拽事件；桌面鼠标仍走原生拖拽，不受影响） */
function noteTouchDragSupport(){
  var active = null;   // { k, ri, ki, el, pid, sx, sy, moved, clone, offX, offY }
  function clearOver(){ $$('.blk-row').forEach(function(r){ r.classList.remove('over'); }); }
  function highlight(x, y){
    var t = document.elementFromPoint(x, y);
    var target = null;
    if(t && active){
      var chip = t.closest ? t.closest('.blk[data-k]') : null;
      if(chip && chip !== active.el){ target = chip.closest('.blk-row'); }
      else { target = t.closest ? t.closest('.blk-row[data-drop]') : null; }
    }
    $$('.blk-row').forEach(function(r){ r.classList.toggle('over', r === target); });
  }
  function end(e, cancel){
    if(!active) return;
    var a = active;
    active = null;
    if(a.clone){ a.clone.remove(); a.clone = null; }
    a.el.classList.remove('dragging');
    clearOver();
    if(cancel || !a.moved) return;
    window.__noteDraggedAt = Date.now();   /* 标记刚拖过，免得随后的 click 又弹出菜单 */
    var t = document.elementFromPoint(e.clientX, e.clientY);
    if(!t) return;
    var chip = t.closest ? t.closest('.blk[data-k]') : null;
    if(chip && chip !== a.el){
      noteDropAt(a.k, parseInt(chip.dataset.ri, 10), parseInt(chip.dataset.ki, 10), a.ri, a.ki);
      return;
    }
    var row = t.closest ? t.closest('.blk-row[data-drop]') : null;
    if(row) noteDropAt(a.k, parseInt(row.dataset.drop, 10), null, a.ri, a.ki);
  }
  $$('.blk-grip').forEach(function(grip){
    grip.addEventListener('pointerdown', function(e){
      if(e.pointerType !== 'touch') return;   // 桌面鼠标仍走 HTML5 拖拽
      var el = grip.closest('.blk[data-k]');
      if(!el) return;
      e.preventDefault();
      var r = el.getBoundingClientRect();
      active = {
        k: el.dataset.k, ri: parseInt(el.dataset.ri, 10), ki: parseInt(el.dataset.ki, 10),
        el: el, pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, clone: null,
        offX: e.clientX - r.left, offY: e.clientY - r.top
      };
      try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    });
    grip.addEventListener('pointermove', function(e){
      if(!active || e.pointerId !== active.pid) return;
      e.preventDefault();
      if(!active.moved){
        var dx = e.clientX - active.sx, dy = e.clientY - active.sy;
        if(dx * dx + dy * dy < 36) return;   // 6px 起拖阈值
        active.moved = true;
        active.el.classList.add('dragging');
        var c = active.el.cloneNode(true);
        c.classList.add('blk-clone');
        c.removeAttribute('draggable');
        var rb = active.el.getBoundingClientRect();
        c.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;left:0;top:0;margin:0;transform:translate(' + rb.left + 'px,' + rb.top + 'px)';
        document.body.appendChild(c);
        active.clone = c;
      }
      active.clone.style.transform = 'translate(' + (e.clientX - active.offX) + 'px,' + (e.clientY - active.offY) + 'px)';
      highlight(e.clientX, e.clientY);
    });
    var up = function(e){ if(active && e.pointerId === active.pid) end(e, false); };
    var canc = function(e){ if(active && e.pointerId === active.pid) end(e, true); };
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', canc);
  });
}
function bindNoteBlkEditor(){

      if(!k) return;

    };

  }else{
    /* 没选词时预览模板里根本不渲染 #notePrev / #noteNext（它们在 has 三元之内），

  $$('#noteAlign .chip').forEach(function(b){

  $$('.note-color').forEach(function(inp){

/* ============================================================
   5. 复习中心 / 小短文 / 考试 / 听写
   ============================================================ */
var revSource = 'batch';
var revCount = 20;
var revTypes = ['cn2en'];
function reviewPool(){
  var words;
  if(revSource === 'wrong') words = uniqueWrongWords();
  else if(revSource === 'favs') words = S.favs.map(findWord).filter(Boolean);
  else words = S.batch.map(findWord).filter(Boolean);
  var seen = {}, out = [];
  words.forEach(function(w){
    if(!w) return;
    var k = w.w.toLowerCase();
    if(!seen[k]){ seen[k] = 1; out.push(w); }
  });
  return out;
}
function reviewPick(){
  var pool = reviewPool();
  var n = revCount > 0 ? Math.min(revCount, pool.length) : pool.length;
  return shuffle(pool).slice(0, n);
}
function reviewFlow(){
  var f = revTypes.filter(function(t){ return STEPS[t] && t !== 'read'; });
  if(!f.length) f = ['cn2en'];
  return f;
}
/* ------------------------------------------------------------
   随机复习「学过的词」（用户第 13 项）
   ------------------------------------------------------------
   池子的唯一判据是 S.seen 的键：S.seen[k] 是 noteAnswer 每答一题写下来的
   学习痕迹，没有记录 = 没学过 ⇒ 一个都不许进来。刻意不复用 S.batch
   （那只是「最后一批」），也不按当前学段过滤：换过学段之后，以前学过的词
   仍然是学过的词。

   几条定死的取舍（改之前先读完）：
     · 不设「今天已经复习过」之类的锁：这一轮结束（或中途退出）之后，同一个
       按钮立刻可以再抽一次；每次都用 Math.random 重新洗牌，组合不固定；
     · 抽不满就抽多少给多少，绝不为凑数把 S.seen 里没有的词拉进来；
     · 不写 S.batch / S.batchStage：那两个字段是「开始学习 / 继续上次学习」的进度，
       复习轮次去改它只会让首页那条进度条指着复习的词（见 advance() 里 mode
       分支的注释）。会话复用现成的 mode:'review' —— advance() 只给
       'learn' / 'wrong' 写 batchStage，finishSession() 里的错题结算只认
       'wrong'，所以这个 mode 是空转；错题照旧走 addWrong 那一条老路，
       没有第三套记账。 */
function seenWords(){
  var seen = (S && S.seen && typeof S.seen === 'object') ? S.seen : {};
  var out = [], used = {};
  Object.keys(seen).forEach(function(k){
    var key = String(k || '').toLowerCase();
    if(!key || used[key]) return;
    var w = findWord(key);
    if(!w) return;            /* 词库里已经没有这个词（换过词库）→ 跳过，不硬凑 */
    used[key] = 1;
    out.push(w);
  });
  return out;
}
function seenPick(n){
  var pool = seenWords();
  var k = (n > 0) ? Math.min(n, pool.length) : pool.length;
  return shuffle(pool).slice(0, k);
}
/* 随机复习那张卡上的说明文字：池子空 / 数量不足 / 正常 三种，各有明确一句话。
   「抽不满」必须长期写在界面上（不能只靠一次性 toast），所以单独成一个函数；
   node 侧自检 _work/review_assert.js 直接调它。 */
function seenPoolNote(pool, n){
  var size = (pool && pool.length) || 0;
  var c = parseInt(n, 10);
  if(!isFinite(c) || c < 0) c = 0;
  if(!size) return '还没有学过的词，先去「开始学习」学一轮 —— 只有留下作答记录的词才会进这个池子。';
  if(c > 0 && size < c) return '池子里只有 <b style="color:var(--accent)">' + size + '</b> 个学过的词，不够 ' + c + ' 个，这次就抽这 ' + size + ' 个（绝不用没学过的词凑数）。';
  return '池子里共 <b style="color:var(--accent)">' + size + '</b> 个学过的词，每次随机抽 <b style="color:var(--accent)">' + (c > 0 ? (c + ' 个') : '全部') + '</b>；数量取上面「数量」那一行，抽完立刻可以再抽一次。';
}

/* ------------------------------------------------------------
   间隔重复（SM-2，用户第 4 项）
   ------------------------------------------------------------
   老底子只有 S.seen[k] = { ok, bad, t }（对错计数 + 最后一次作答时刻），
   复习全靠「随机复习」洗牌 —— 同一个词可能连抽三次，也可能两周不出现。
   现在在**同一个对象上追加**五个字段，老存档一个字节都不用迁移：

     · due    —— 下次到期时刻（ms）。**缺字段 / 0 = 从未排期 ⇒ 视为「现在到期」**；
     · ef     —— 难度因子，初值 2.5，下限 1.3；
     · ivl    —— 间隔天数，初值 0；
     · reps   —— 连续答对次数（q>=3 才 +1，q<3 归零）；
     · lapses —— 遗忘次数（q<3 时 +1）。

   追加而不是新开一张表，是为了 noteAnswer / wordStat / dictSeenCount /
   startLearning 那些老判据（只看键在不在、只看 ok/bad 真假）语义一个字节不变。

   质量 q 的口径（这一轮结束后按**本轮表现**折算，落在 sm2Quality）：
     全对且不慢、没看答案   → 5
     全对但慢 / 看过答案     → 4
     错 1 次                → 3
     错 2 次                → 2
     错 3 次以上            → 1
   「慢」= 这一轮里它平均每题用时超过 sm2SlowMs()（默认 6 秒，跟着「每题时限」走）；
   「看过答案」= 点过「不会，看答案」。注意：看答案本身就会记一次错，所以实际
   落到 q=4 的几乎都是「慢」；hint 这一位留着，将来加提示按钮时不用再改判据。

   SM-2 公式（顺序同本轮要求，与经典 SM-2 的差别只在「先算间隔、再更新 ef」）：
     q >= 3：reps+1；reps==1 → ivl=1；reps==2 → ivl=6；否则 ivl=round(ivl*ef)；
             ef = max(1.3, ef + (0.1 - (5-q)*(0.08 + (5-q)*0.02)))
     q <  3：reps=0、lapses+1、ivl=1（ef 不动 —— 需求就是这么定的）
     最后 due = now + ivl * 86400000
   已知用例（同 q=5 连续三次）：ef 2.5→2.6→2.7，ivl 1→6→16（= round(6*2.7)），
   钉在 _work/sm2_assert.js 里。
   ------------------------------------------------------------ */
var SM2_DAY = 86400000;
var SM2_EF0 = 2.5;
var SM2_EF_MIN = 1.3;

/* 一题多慢算「慢」：跟着设置里的每题时限走，取 60%，最低 4 秒（默认 10 秒 → 6 秒） */
function sm2SlowMs(){
  var per = (S && S.settings && parseFloat(S.settings.secPerQ)) || 10;
  if(!isFinite(per) || per <= 0) per = 10;
  return Math.max(4000, Math.round(per * 600));
}
/* 把一条 S.seen 记录读成「排期视图」。老记录（只有 ok/bad/t）读出来就是
   ef=2.5 / ivl=0 / reps=0 / lapses=0 / due=0（= 现在到期），不报错、不写回、不迁移。 */
function sm2Of(rec){
  var o = (rec && typeof rec === 'object') ? rec : {};
  var ef = parseFloat(o.ef), ivl = parseInt(o.ivl, 10);
  var reps = parseInt(o.reps, 10), lapses = parseInt(o.lapses, 10);
  var due = parseFloat(o.due);
  if(!isFinite(ef)) ef = SM2_EF0;
  if(ef < SM2_EF_MIN) ef = SM2_EF_MIN;
  if(!isFinite(ivl) || ivl < 0) ivl = 0;
  if(!isFinite(reps) || reps < 0) reps = 0;
  if(!isFinite(lapses) || lapses < 0) lapses = 0;
  if(!isFinite(due) || due < 0) due = 0;
  return { ef:ef, ivl:ivl, reps:reps, lapses:lapses, due:due };
}
/* 纯函数：算下一组排期字段（不改入参、不含 due）。已知用例钉在 _work/sm2_assert.js */
function sm2Next(prev, q){
  var st = sm2Of(prev);
  var n = parseInt(q, 10);
  if(!isFinite(n)) n = 0;
  if(n < 0) n = 0;
  if(n > 5) n = 5;
  var ef = st.ef, ivl = st.ivl, reps = st.reps, lapses = st.lapses;
  if(n >= 3){
    reps = reps + 1;
    if(reps === 1) ivl = 1;
    else if(reps === 2) ivl = 6;
    else ivl = Math.round(ivl * ef);
    if(!isFinite(ivl) || ivl < 1) ivl = 1;
    if(ivl > 36500) ivl = 36500;          /* 兜底：别让浮点/坏存档把间隔撑到几千年 */
    ef = Math.max(SM2_EF_MIN, ef + (0.1 - (5 - n) * (0.08 + (5 - n) * 0.02)));
  }else{
    reps = 0;
    lapses = lapses + 1;
    ivl = 1;
  }
  return { ef:ef, ivl:ivl, reps:reps, lapses:lapses };
}
/* 就地把排期写回 S.seen[k]（q 与 now 都可注入，方便断言用固定时刻钉 due） */
function sm2Apply(rec, q, now){
  if(!rec || typeof rec !== 'object') return null;
  var next = sm2Next(rec, q);
  var t = isFinite(now) ? now : Date.now();
  rec.ef = next.ef;
  rec.ivl = next.ivl;
  rec.reps = next.reps;
  rec.lapses = next.lapses;
  rec.due = t + next.ivl * SM2_DAY;
  return rec;
}
/* 本轮表现 → q（口径见上面那段注释）。slowMs 可注入，平时不传 */
function sm2Quality(st, slowMs){
  var r = (st && typeof st === 'object') ? st : {};
  var n = parseInt(r.n, 10), bad = parseInt(r.bad, 10);
  var skip = parseInt(r.skip, 10), ms = parseFloat(r.ms);
  if(!isFinite(n) || n < 0) n = 0;
  if(!isFinite(bad) || bad < 0) bad = 0;
  if(!isFinite(skip) || skip < 0) skip = 0;
  if(!isFinite(ms) || ms < 0) ms = 0;
  if(bad === 0){
    var limit = isFinite(slowMs) ? slowMs : sm2SlowMs();
    var slow = (n > 0 && ms / n > limit);
    return (slow || skip > 0) ? 4 : 5;
  }
  if(bad === 1) return 3;
  if(bad === 2) return 2;
  return 1;
}
/* 到期池：due <= now（老记录的 due=0 一律算「现在到期」），最该复习的排最前。
   和「随机复习」刻意分开：那边不管到期，这边只给到期的。 */
function sm2DueWords(now){
  var t = isFinite(now) ? now : Date.now();
  var seen = (S && S.seen && typeof S.seen === 'object') ? S.seen : {};
  var rows = [];
  Object.keys(seen).forEach(function(k){
    var key = String(k || '').toLowerCase();
    if(!key) return;
    var st = sm2Of(seen[key]);
    if(st.due > t) return;
    var w = findWord(key);
    if(!w) return;                 /* 词库里已经没有这个词（换过词库）→ 跳过，不硬凑 */
    rows.push({ w:w, due:st.due, key:key });
  });
  rows.sort(function(a, b){
    if(a.due !== b.due) return a.due - b.due;
    return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0);
  });
  return rows.map(function(x){ return x.w; });
}
/* 最近一次到期时刻（ms）；一个都没排过就回 0 */
function sm2NextDueAt(now){
  var t = isFinite(now) ? now : Date.now();
  var seen = (S && S.seen && typeof S.seen === 'object') ? S.seen : {};
  var best = 0;
  Object.keys(seen).forEach(function(k){
    var st = sm2Of(seen[k]);
    if(st.due <= t) return;
    if(!best || st.due < best) best = st.due;
  });
  return best;
}
/* 到期卡上那句说明：N>0 / N=0 但排过期 / N=0 又从没排过 —— 三种各一句，不许含糊 */
function sm2DueNote(n, now){
  var c = parseInt(n, 10);
  if(!isFinite(c) || c < 0) c = 0;
  if(c > 0) return '有 <b style="color:var(--accent)">' + c + '</b> 个词到了该复习的时候，点上面那颗按钮就开始（只抽到期的词）。';
  var next = sm2NextDueAt(now);
  if(!next) return '现在没有到期的词，也还没有排过期的词 —— 先学一轮，系统才会按遗忘曲线给它排期。';
  return '现在没有到期的词，下次到期在 <b style="color:var(--accent)">' + escapeHtml(fmtTime(next)) + '</b>。';
}
/* 结算：一轮学习/复习结束时，把这一轮**真正作答过**的每个词按本轮表现走一遍 SM-2。
   s.roundSeen 是 submitAnswer 逐题记下来的（n / ok / bad / skip / ms）。
   只在阅读卡上出现过（n === 0）的词不排期 —— 它这一轮没被判过分，拿它算 q 就是编数据。
   返回这一轮排了几个词。 */
function finishSm2(s, now){
  if(!s || !s.roundSeen) return 0;
  var t = isFinite(now) ? now : Date.now();
  if(!S || !S.seen || typeof S.seen !== 'object') return 0;
  var n = 0;
  Object.keys(s.roundSeen).forEach(function(k){
    var r = s.roundSeen[k];
    if(!r || !(parseInt(r.n, 10) > 0)) return;
    var rec = S.seen[k];
    if(!rec || typeof rec !== 'object') return;   /* 记录被删了就当没学过，不凭空造 */
    sm2Apply(rec, sm2Quality(r), t);
    n++;
  });
  if(n) save();
  return n;
}

function renderReview(app){
  var batch = S.batch.map(findWord).filter(Boolean);
  var pool = reviewPool();
  var hasPool = pool.length > 0;
  var srcLabel = revSource === 'wrong' ? '错题本' : (revSource === 'favs' ? '收藏本' : '已学单词');
  var cntLabel = revCount > 0 ? revCount + ' 词' : '全部';
  /* 随机复习（#13）的池子与说明：池子空 / 数量不足 两种情形各有一句明说，

  var seenPool = seenWords();
  var seenNote = seenPoolNote(seenPool, revCount);
  /* 间隔重复（#4）：到期池与「随机复习」是两个池子，界面上必须把区别说清。 */
  var duePool = sm2DueWords();
  var dueNote = sm2DueNote(duePool.length);

  app.innerHTML = '<section class="card">'
    + '<h2 class="h2">复习设置</h2>'

    +   '本批 <b style="color:var(--accent)">' + batch.length + '</b> 词 · '
    +   '错题 <b style="color:var(--accent)">' + uniqueWrongWords().length + '</b> 词 · '

    +   '<button class="chip' + (revSource === 'favs' ? ' on' : '') + '" data-s="favs">收藏本</button>'

        }).join('')
    + '</div>'
    + '<p class="muted" style="margin:10px 0 0">当前范围：<b style="color:var(--accent)">' + srcLabel + '</b> · 每次 <b style="color:var(--accent)">' + cntLabel + '</b> · 共 <b style="color:var(--accent)">' + pool.length + '</b> 词</p>'
    + (S.settings.showStageProgress && hasPool && revSource === 'batch' ? '<div class="divider" style="margin:12px 0"></div><div class="stage-status">' + stageStatusHTML(batch.length) + '</div>' : '')
    + '</section>'

    + '<section class="card">'
    + '<h2 class="h2">到期复习（' + duePool.length + ' 个）</h2>'
    + '<p class="muted" style="margin:0 0 10px">按遗忘曲线排期：答得越稳间隔越长（1 天 → 6 天 → 之后每次乘难度因子），忘了就退回 1 天重来。这里<b style="color:var(--accent)">只抽已经到期的词</b>，最该复习的排在前面，到期的词一次给全、不按上面的「数量」截断。</p>'
    + '<button class="btn primary big" id="dueReview">' + IC('calendar') + ' 开始到期复习</button>'
    + '<p class="muted" style="margin:10px 0 0">' + dueLine + '</p>'
    + '<p class="muted" style="margin:6px 0 0">' + dueNote + '</p>'
    + '</section>'

var CONNECTORS = ['', 'Besides, ', 'What is more, ', 'In addition, ', 'Meanwhile, ', 'However, ', 'As a result, ', 'For example, ', 'Later, ', 'Finally, '];
function buildCoherentItems(words, maxN){
  var n = Math.min(maxN || 6, words.length);
  var picked = shuffle(words).slice(0, n);
  return picked.map(function(w, i){
    var ex = pickExample(w);
    return { word:w, text:ex.t, src:ex.s, connector:i === 0 ? '' : CONNECTORS[(i - 1) % (CONNECTORS.length - 1) + 1] };
  });
}
function itemsToSentences(items){ return items.map(function(it){ return it.connector + it.text; }); }
function buildPassage(words){
  var items = buildCoherentItems(words, 6);
  passage = { items:items, words:items.map(function(i){ return i.word; }) };
  view = 'passage'; render();
}
function renderPassage(app){

    + '<h2 class="h2">小短文 <span class="hint">涵盖 ' + passage.words.length + ' 个单词</span></h2>'
    + '<div class="passage">' + highlightAll(text, wordSet) + '</div>'

function makeGrammarExam(words){
  var items = buildCoherentItems(words, 6);
  return items.map(function(it){
    var sentence = it.connector + it.text;
    /* 只抹这一句里真实出现的那个词形（可能是不规则过去式 went）。
       以前是 new RegExp('\\b' + word + '\\w*') 硬抹：go 会吃掉 government，
       而 went 匹配不上 \bgo\w*，hasBlank 永远是假，整题被下面的 filter 静默丢掉。 */
    var b = blankWordInSentence(sentence, it.word);
    return {
      word:it.word, original:it.text,
      sentence:b ? b.text : sentence,
      blank:b ? b.form : '', blankKind:b ? b.kind : '',
      src:it.src, hasBlank:!!b
    };
  }).filter(function(x){ return x.hasBlank; });
}
function makeClozeExam(words){
  var items = buildCoherentItems(words, 6);
  var picked = [];
  items.forEach(function(it){
    var sentence = it.connector + it.text;
    var b = blankWordInSentence(sentence, it.word);
    if(!b) return;
    picked.push({
      text:sentence, word:it.word, src:it.src, form:b.form, kind:b.kind,
      re:new RegExp('\\b' + escapeRe(b.form) + '\\b', 'i')
    });
  });
  return {
    sentences:picked.map(function(x){ return x.text; }),
    blanks:picked.map(function(x){ return x.word; }),
    forms:picked.map(function(x){ return x.form; }),
    kinds:picked.map(function(x){ return x.kind; }),
    regexps:picked.map(function(x){ return x.re; })
  };
}

function makeClozeOptions(word, pool, kind, form){
  var pos = getPOS(word);
  var want = kind || 'base';
  var correct = form || word.w;
  var baseKey = String(word.w).toLowerCase();
  var used = {};
  used[String(correct).toLowerCase()] = 1;
  var cands = pool.filter(function(x){ return String(x.w).toLowerCase() !== baseKey; });
  var picked = [];
  /* 干扰项尽量用「同一种形」：空里是 went，干扰项就也该是过去式，
     否则四个选项里只有一个过去式，答案一眼就看出来了。
     形取不到（这个词没有那种形 / 规则拼不准被标 weak）就跳过这个候选；
     同词性的凑不满再放宽词性。 */
  function fill(pred){
    shuffle(cands).forEach(function(x){
      if(picked.length >= 3) return;
      if(pred && !pred(x)) return;
      var v = formOfKind(x, want);
      if(!v) return;
      if(used[String(v).toLowerCase()]) return;
      used[String(v).toLowerCase()] = 1;
      picked.push({ w:v, src:x });
    });
  }
  fill(function(x){ return getPOS(x) === pos; });
  fill(null);
  return shuffle([{ w:correct, src:word }].concat(picked).slice(0, 4));
}
function renderClozeExam(app){

  var answered = d.blanks.filter(function(w, i){ return e.picked[i]; }).length;
  app.innerHTML = '<section class="card">'

   6. 词典 / 同义反义总览
   ============================================================ */
/* ---- 词典的两个新维度（用户第 8 项） -------------------------------------
   数据现实：词条是位置数组 [词,音标,释义,例句]，没有任何「考频 / 常考」字段。
   现成的真实信号只有两个：
     · 学段归属 —— ALL_MAP[k].levels（这个词出现在哪几个学段的内置词库里）；
     · 本机答题记录 —— S.seen[k].ok / S.seen[k].bad（noteAnswer 写的）。
   所以：「常考」= 学段归属，「考察次数」= 本机答过它的次数（ok + bad）。
   这两个都不是「真题考了几次」—— 界面上的说明必须如实这么写。 */
function dictExamMatch(levels, exam){
  if(!exam || exam === 'all') return true;
  return (levels || []).indexOf(exam) >= 0;
}
/* 本机考察次数：没有记录就是 0（意思不是「没考过」，是「你没在本机答过它」） */
function dictSeenCount(word){
  var s = S.seen[String(word || '').toLowerCase()];
  if(!s) return 0;
  var a = parseInt(s.ok, 10), b = parseInt(s.bad, 10);
  if(!isFinite(a)) a = 0;
  if(!isFinite(b)) b = 0;
  return a + b;
}
/* 排序只作用于「已经筛过的列表」；纯函数：不改入参、不碰全局页码。
   cnt 用「原下标」当第二关键字 —— 次数相同的词保持来时的顺序，显式稳定，
   不赌各家浏览器 Array.prototype.sort 稳不稳定。 */
function dictSortList(list, key, dir){
  var arr = (list || []).map(function(w, i){ return { w:w, i:i }; });
  if(key === 'cnt'){
    var sign = dir === 'asc' ? 1 : -1;
    arr.sort(function(a, b){
      var d = dictSeenCount(a.w.w) - dictSeenCount(b.w.w);
      if(d) return d * sign;
      return a.i - b.i;
    });
  }else{
    arr.sort(function(a, b){
      var x = String(a.w.w).toLowerCase(), y = String(b.w.w).toLowerCase();
      if(x < y) return -1;
      if(x > y) return 1;
      return a.i - b.i;
    });
  }
  return arr.map(function(o){ return o.w; });
}
/* 分页一律夹到 [0, pages-1]；空列表也回 1 页。
   排序 / 换筛选之后页码越界时不会出现「第 3 页空白」—— renderDict 把这里回的 page 写回 dictPage。 */
function dictPageOf(list, page, per){
  var n = (list || []).length;
  var perN = (per > 0) ? per : 80;
  var pages = Math.max(1, Math.ceil(n / perN));
  var p = parseInt(page, 10);
  if(!isFinite(p) || p < 0) p = 0;
  if(p > pages - 1) p = pages - 1;
  return { page:p, pages:pages, slice:(list || []).slice(p * perN, (p + 1) * perN) };
}
function dictSeek(){
  var q = dictQuery.trim().toLowerCase();
  var arr = ALL_WORDS.slice();
  if(q){
    arr = arr.filter(function(w){
      return matchQuery(w.w, q)
          || matchQuery(w.m, q)
          || matchQuery(cleanMeaning(w.m), q);
    });
  }else{
    arr.sort(function(a, b){
      var x = a.w.toLowerCase(), y = b.w.toLowerCase();
      return x < y ? -1 : x > y ? 1 : 0;
    });
    if(dictLetter !== 'all') arr = arr.filter(function(w){ return w.w.charAt(0).toUpperCase() === dictLetter; });
  }
  return arr;
}

var wordsQuery = '';
function wordsKeysList(){
  var table = wordsMode === 'ant' ? ANTONYMS : SYNONYMS;
  var q = wordsQuery.trim().toLowerCase();
  var out = [];
  for(var k in table){
    var arr = table[k] || [];
    if(!arr.length) continue;
    if(!inLevel(k, wordsLevel)) continue;
    if(q){
      var hit = matchQuery(k, q);
      if(!hit){
        for(var i = 0; i < arr.length; i++){
          if(matchQuery(arr[i].w, q)){ hit = true; break; }
        }
      }
      if(!hit){
        var w0 = findWord(k);
        if(w0 && matchQuery(w0.m, q)) hit = true;
      }
      if(!hit) continue;
    }
    out.push(k);
  }
  return out.sort();
}
function renderWords(app){

function matchAnswer(user, correct){
  var u = String(user || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return String(correct).split('|').some(function(a){
    var c = a.trim().toLowerCase().replace(/,/g, ' ').replace(/\s+/g, ' ');
    return u === c || u === c.replace(/\s+/g, '');
  });
}

var PV_TAG_ORDER = ['励志','学习','时间','友谊','家庭','行动','坚持','智慧','金钱','健康','谨慎','品格','合作','言语','机会','习惯','勇气','逆境','经验'];
/* 数据里出现过的主题（按上面的偏好顺序排，未知主题附在最后） */
function allProverbTags(){
  var cnt = {};
  getAllProverbsUnique().forEach(function(p){ if(p && p.tag) cnt[p.tag] = (cnt[p.tag] || 0) + 1; });
  var known = PV_TAG_ORDER.filter(function(t){ return cnt[t]; });
  var extra = Object.keys(cnt).filter(function(t){ return PV_TAG_ORDER.indexOf(t) < 0; }).sort();
  return known.concat(extra).map(function(t){ return { t: t, n: cnt[t] }; });
}
