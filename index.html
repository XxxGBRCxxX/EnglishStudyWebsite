/* ============================================================
   打卡：每日学习量（单词数 / 时长 / 正确率）
   ============================================================ */
var _lastBump = 0;
function checkinDay(k){
  if(!S.checkin[k]) S.checkin[k] = { words:0, seconds:0, correct:0, total:0, rounds:0 };
  return S.checkin[k];
}
function checkinToday(){ return checkinDay(todayKey()); }
function checkinActive(d){ return !!(d && ((d.words || 0) > 0 || (d.total || 0) > 0)); }
function checkinBump(ok){
  var now = Date.now();
  var d = checkinToday();
  if(_lastBump){
    var gap = Math.round((now - _lastBump) / 1000);
    if(gap > 0 && gap <= 300) d.seconds += gap;
  }
  _lastBump = now;
  d.total++;
  if(ok) d.correct++;
  save();
}
function checkinWordDone(){ checkinToday().words++; save(); }
function checkinRoundDone(){ checkinToday().rounds++; save(); }
function dateKeyOf(dt){ return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }
function checkinStats(){
  var days = Object.keys(S.checkin).filter(function(k){ return checkinActive(S.checkin[k]); }).sort();
  var words = 0, seconds = 0, correct = 0, total = 0;
  days.forEach(function(k){
    var d = S.checkin[k];
    words += d.words || 0; seconds += d.seconds || 0;
    correct += d.correct || 0; total += d.total || 0;
  });
  /* 当前连续天数：今天没学就从昨天往前数 */
  var probe = new Date(), cur = 0;
  if(!checkinActive(S.checkin[dateKeyOf(probe)])) probe.setDate(probe.getDate() - 1);
  while(checkinActive(S.checkin[dateKeyOf(probe)])){ cur++; probe.setDate(probe.getDate() - 1); }
  /* 历史最长连续 */
  var max = 0, run = 0, prev = null;
  days.forEach(function(k){
    if(prev && Math.round((new Date(k) - new Date(prev)) / 86400000) === 1) run++;
    else run = 1;
    prev = k;
    if(run > max) max = run;
  });
  return {
    cur:cur, max:Math.max(max, cur), days:days.length, words:words,
    seconds:seconds, correct:correct, total:total,
    today:dateKeyOf(new Date()),
    todayData:S.checkin[dateKeyOf(new Date())] || { words:0, seconds:0, correct:0, total:0, rounds:0 },
    keys:days
  };
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if(h > 0) return h + ' 小时 ' + m + ' 分';
  if(m > 0) return m + ' 分钟';
  return sec + ' 秒';
}
/* 某月的打卡格子：[{k, day, active, today, future}] */
function checkinMonth(year, month){
  var first = new Date(year, month, 1);
  var startPad = (first.getDay() + 6) % 7;   /* 周一为一周开头 */
  var total = new Date(year, month + 1, 0).getDate();
  var out = [];
  for(var i = 0; i < startPad; i++) out.push({ blank:true });
  var todayK = dateKeyOf(new Date());
  for(var d = 1; d <= total; d++){
    var k = year + '-' + pad2(month + 1) + '-' + pad2(d);
    out.push({ k:k, day:d, active:checkinActive(S.checkin[k]), today:k === todayK, future:k > todayK });
  }
  return out;
}

/* ============================================================
   词库管理：内置词库 + 拓展词库 + 用户导入词库
   ------------------------------------------------------------
   拓展词库（bank_ext_daily / cs / paper / terms / campus.js）与「用户导入词库」
   是两回事，别混：
   · 它们随程序分发，只写 window.EXT_LIBS，不进 S.libs —— 进了 S.libs 会被
     renderLibs 画上删除按钮，removeLib() 会把 S.activeLibs 弄脏；
   · 开关只有一个：S.settings.extLibsOn[key]（缺省取 L.enabledByDefault）；
   · 词条并进同一个「我的词库」学段（applyUserLibs），与自建词库一起学。
   ============================================================ */
var EXT_CAT = [
  { k:'daily',  n:'日常' },
  { k:'cs',     n:'计算机' },
  { k:'paper',  n:'论文' },
  { k:'term',   n:'专业术语' },
  { k:'campus', n:'校园与考试' }
];
function extLib(k){ var m = window.EXT_LIBS || {}; return m[k] || null; }
function extCatOf(k){ var L = extLib(k); return (L && L.category) || k; }
function extCatOrder(c){
  var i = EXT_CAT.length;
  EXT_CAT.forEach(function(x, j){ if(x.k === c) i = j; });
  return i;
}
function extCatName(c){
  var n = c;
  EXT_CAT.forEach(function(x){ if(x.k === c) n = x.n; });
  return n;
}
/* 按 EXT_CAT 的顺序排：日常 → 计算机 → 论文 → 专业术语 → 校园与考试 */
function extKeys(){
  var m = window.EXT_LIBS || {};
  var out = Object.keys(m).filter(function(k){ return !!m[k]; });
  out.sort(function(a, b){
    var d = extCatOrder(extCatOf(a)) - extCatOrder(extCatOf(b));
    return d || (a < b ? -1 : a > b ? 1 : 0);
  });
  return out;
}
/* 开没开：用户显式选过就以用户为准，没选过就取数据文件里的 enabledByDefault */
function extOn(k){
  var m = (S.settings && S.settings.extLibsOn) || {};
  if(m[k] === true || m[k] === false) return m[k];
  var L = extLib(k);
  return !L || L.enabledByDefault !== false;
}
function extOnKeys(){ return extKeys().filter(function(k){ return extOn(k); }); }
function extWordCount(L){ var n = 0; ((L && L.groups) || []).forEach(function(g){ n += ((g && g.words) || []).length; }); return n; }
function extAllWordCount(){ var n = 0; extKeys().forEach(function(k){ n += extWordCount(extLib(k)); }); return n; }
function extAllGroupCount(){ var n = 0; extKeys().forEach(function(k){ var L = extLib(k); n += ((L && L.groups) || []).length; }); return n; }
/* 写开关一律换成新对象：S.settings 是 DEFAULT_SETTINGS 的浅拷贝，
   就地改 extLibsOn[k] 会把默认值一起改掉 */
function extSetOn(k, on){
  var m = Object.assign({}, (S.settings && S.settings.extLibsOn) || {});
  m[k] = !!on;
  S.settings.extLibsOn = m;
}
function allLibs(){
  var out = [{ id:'default', name:'内置词库', sys:true, count:bankWordCount() }];
  S.libs.forEach(function(L){ out.push({ id:L.id, name:L.name, sys:false, count:(L.items || []).length, time:L.time }); });
  /* 拓展库只做投影（id 加 ext: 前缀，保证不会与 S.libs 的 id 撞上）：
     它们没有删除按钮，也不能进「启用中的词库」那张卡（那儿的按钮走 toggleLib） */
  extKeys().forEach(function(k){
    var L = extLib(k);
    out.push({ id:'ext:' + k, ext:true, key:k, name:L.name, desc:L.desc || '',
               sys:false, cat:extCatOf(k), groups:((L && L.groups) || []).length,
               on:extOn(k), count:extWordCount(L) });
  });
  return out;
}
/* 「内置词库」到底多少个词：ALL_MAP 里不含只属于「我的词库」的那些键。
   不能直接用 ALL_WORDS.length —— 它把自建库与拓展库并进来之后会虚高。 */
function bankWordCount(){
  var n = 0;
  ALL_MAP.forEach(function(v){ if(!v.levels || v.levels.indexOf('user') < 0) n++; });
  return n;
}
/* 拓展词库卡：按 category 分组，一行一个库，展开它的二级分类与词数
   （用户原话：「计算机词库可以创建代码 / 术语等」） */
function extGroupText(L){

function extRowHTML(k){

    +   '</div>'

function extRowsHTML(){
  var cats = EXT_CAT.slice();
  extKeys().forEach(function(k){
    var c = extCatOf(k);
    if(!cats.some(function(x){ return x.k === c; })) cats.push({ k:c, n:c });
  });

  cats.forEach(function(c){
    var keys = extKeys().filter(function(k){ return extCatOf(k) === c.k; });
    if(!keys.length) return;
    out += '<p class="muted" style="margin:12px 0 4px;font-weight:600">' + escapeHtml(extCatName(c.k)) + '</p>'
      + keys.map(extRowHTML).join('');
  });

}
function activeLibIds(){ return S.activeLibs.slice(); }
function isLibActive(id){ return S.activeLibs.indexOf(id) >= 0; }
function toggleLib(id){

  if(i >= 0){
    if(S.activeLibs.length <= 1){ toast('至少保留一个词库'); return; }

    S.activeLibs.push(id);
  }
  save();
}
function libById(id){
  if(id === 'default') return { id:'default', name:'内置词库', sys:true, items:null };
  for(var i = 0; i < S.libs.length; i++) if(S.libs[i].id === id) return S.libs[i];
  return null;
}
function libWordCountOf(id){
  if(id === 'default') return ALL_WORDS.length;
  var L = libById(id);
  return L ? (L.items || []).length : 0;
}
function removeLib(id){

  S.activeLibs = S.activeLibs.filter(function(x){ return x !== id; });

  save();

function resetLibs(){

  S.activeLibs = ['default'];
  save();

}
/* 当前可见的学段：内置学段需启用「内置词库」，my 学段需启用至少一个用户词库
   或任一拓展词库 —— 只开拓展库、一个自建库都没有时，「我的词库」学段也必须出现，
   否则拓展词等于白加载（S.activeLibs 这时只有 'default'）。 */
function visibleLevels(){
  var out = [];
  LEVELS.forEach(function(k){
    if(k === 'user'){
      if(DATA.user && DATA.user.words.length && (S.activeLibs.some(function(x){ return x !== 'default'; }) || extOnKeys().length)) out.push(k);
      return;
    }
    if(isLibActive('default')) out.push(k);
  });
  return out.length ? out : ['default'].concat(LEVELS);
}
/* 把已启用的用户词库并成 DATA.user，导入后立即可学 */
function applyUserLibs(){
  /* 先摘掉上一轮并入的 user 词条，否则停用 / 删除词库后词会残留在词表和词典里 */
  var stale = [];
  ALL_MAP.forEach(function(v, k){ if(v.levels && v.levels.indexOf('user') >= 0) stale.push(k); });
  stale.forEach(function(k){
    var v = ALL_MAP.get(k);
    v.levels = v.levels.filter(function(x){ return x !== 'user'; });
    if(!v.levels.length){
      /* 只属于用户词库：从索引里彻底摘掉；仍属内置学段的则保留 */
      ALL_MAP.delete(k);
      delete WORD_INDEX[k];
    }
  });

  var list = [], seen = {};
  S.activeLibs.forEach(function(id){
    if(id === 'default') return;
    var L = libById(id);
    if(!L) return;
    (L.items || []).forEach(function(e){
      if(!Array.isArray(e) || !e[0]) return;
      var k = String(e[0]).toLowerCase();
      if(seen[k]) return;
      seen[k] = 1;
      var ex = (Array.isArray(e[3]) && e[3].length ? e[3] : [['', '', '例句']]).map(function(g){
        return { t:g[0], tr:g[1], s:g[2] || '例句' };
      });
      list.push({ w:e[0], p:e[1] || '', m:e[2] || '', ex:ex });
    });
  });
  /* 拓展词库：与自建库用同一套字段映射并进同一个 list，两条去重口径缺一不可 ——
     · seen：自建库与拓展库之间重复（按小写拼写）；
     · bankKeys：与内置词表撞车就整条跳过。五个库与 BANK 有 395 个拼写交集，
       不挡的话同一个词会同时挂在内置学段与「我的词库」下。
     注：函数开头那段「摘掉上一轮并入的 user 词条」是按 levels.indexOf('user') 认的，
     拓展库的词条同样带 user 标记，所以停用 / 改开关后它们会被正确摘掉，不用另写清理。 */
  var bankKeys = {};
  ALL_MAP.forEach(function(v, k){ bankKeys[k] = 1; });
  extOnKeys().forEach(function(k){
    var EL = extLib(k);
    if(!EL) return;
    (EL.groups || []).forEach(function(g){
      ((g && g.words) || []).forEach(function(e){
        if(!Array.isArray(e) || !e[0]) return;
        var kk = String(e[0]).toLowerCase();
        if(seen[kk] || bankKeys[kk]) return;
        seen[kk] = 1;
        var ex = (Array.isArray(e[3]) && e[3].length ? e[3] : [['', '', '例句']]).map(function(g2){
          return { t:g2[0], tr:g2[1], s:g2[2] || '例句' };
        });
        list.push({ w:e[0], p:e[1] || '', m:e[2] || '', ex:ex });
      });
    });
  });
  list.sort(function(a, b){ return a.w.toLowerCase().localeCompare(b.w.toLowerCase(), 'en'); });
  DATA.user = { name:'我的词库', words:list };
  if(LEVELS.indexOf('user') < 0) LEVELS.push('user');
  list.forEach(function(w){
    var k = w.w.toLowerCase();
    if(!WORD_INDEX[k]) WORD_INDEX[k] = w;
    if(!ALL_MAP.has(k)) ALL_MAP.set(k, { w:w.w, p:w.p, m:w.m, ex:w.ex, levels:['user'] });
    else if(ALL_MAP.get(k).levels.indexOf('user') < 0) ALL_MAP.get(k).levels.push('user');
  });
  ALL_WORDS = Array.from(ALL_MAP.values());
  /* 多选学段也一起夹：把「已经看不见的学段」（词库被停用、自建库被删）从 S.levels 里摘掉，
     一个都不剩时退回可见的第一个 —— 不然 S.level 会指向一个 DATA 里没了的键。 */
  var vis = visibleLevels();
  var alive = curLevels().filter(function(k){ return vis.indexOf(k) >= 0 && !!DATA[k]; });
  if(!alive.length) alive = [vis[0]];
  S.levels = alive.slice();
  syncLevel();
}

    + '</svg>';

/* 反向索引：过去式/过去分词 → 原型（规则动词全表 + 不规则动词表 + 用户自加） */
var _annoVerbBase = null;
function annoVerbBaseMap(){
  if(_annoVerbBase) return _annoVerbBase;
  var m = {};
  function put(form, base){
    if(!form || String(form).indexOf(' ') >= 0) return;
    var f = String(form).toLowerCase();
    if(f && !m[f]) m[f] = String(base).toLowerCase();
  }
  for(var k in VERB_FORMS){
    var vf = VERB_FORMS[k];
    if(vf && vf.length){ put(vf[0], k); put(vf[1], k); }
  }
  for(var lv in IRREGULAR){
    (IRREGULAR[lv] || []).forEach(function(v){ put(v.p, v.b); put(v.pp, v.b); });
  }
  (S && S.extras && S.extras.irregular || []).forEach(function(v){ put(v.p, v.b); put(v.pp, v.b); });
  /* 现在分词 / 三单（批次 A · #9）：VERB_FORMS 只给过去式与过去分词，而
     「running / goes / studying 被当成生词」正是用户报的那一条。这里把规则补出来的形
     也挂进反查表，认词与标注着色就都回到原型了。
     注意：形本身在词库里另有词条的（lay、annoyed）已被 formRecords 挡掉，
     不会被吃成 lie / annoy 的变形。 */
  Object.keys(VERB_FORMS).forEach(function(k){
    formRecords(k).forEach(function(r){
      if(r.k === 'ing' || r.k === 's') put(r.f, k);
    });
  });
  _annoVerbBase = m;
  return m;
}
/* 反向索引：比较级/最高级 → 原型（含用户自加） */
var _annoCompBase = null;
function annoCompBaseMap(){
  if(_annoCompBase) return _annoCompBase;
  var m = {};
  function put(form, base){
    if(!form || String(form).indexOf(' ') >= 0) return;
    var f = String(form).toLowerCase();
    if(f && !m[f]) m[f] = String(base).toLowerCase();
  }
  for(var lv in COMPARATIVES){
    (COMPARATIVES[lv] || []).forEach(function(v){ put(v.c, v.b); put(v.s, v.b); });
  }
  _annoCompBase = m;
  return m;
}
/* 复数 → 单数（children→child、knives→knife、boxes→box 等特殊变化） */
function annoPluralBaseMap(){ return pluralBaseMap(); }
function findBase(tok){
  var t = tok.toLowerCase();
  if(t.length < 3) return null;
  var tries = [
    t.replace(/ies$/, 'y'), t.replace(/es$/, ''), t.replace(/s$/, ''),
    t.replace(/ing$/, 'e'), t.replace(/ing$/, ''), t.replace(/ied$/, 'y'),
    t.replace(/ed$/, 'e'), t.replace(/ed$/, ''), t.replace(/ly$/, '')
  ];
  for(var i = 0; i < tries.length; i++){
    if(tries[i].length >= 2){ var w = findWord(tries[i]); if(w) return w; }
  }
  /* 过去式/过去分词 → 原型（went→go、bought→buy、abode→abide 等不规则变化） */
  var vb = annoVerbBaseMap()[t];
  if(vb){ var wv = findWord(vb); if(wv) return wv; }
  /* 比较级/最高级 → 原型（bigger→big、worse→bad、best→good 等） */
  var cb = annoCompBaseMap()[t];
  if(cb){ var wc = findWord(cb); if(wc) return wc; }
  /* 复数 → 单数（children→child、knives→knife、boxes→box 等特殊变化） */
  var pb = pluralBaseMap()[t];
  if(pb){ var wp = findWord(pb); if(wp) return wp; }
  return null;
}
function highlightAll(text, forceSet){
  var tokens = String(text).split(/(\b[A-Za-z][A-Za-z'-]*\b)/);
  return tokens.map(function(tok){
    if(!tok) return '';
    var direct = findWord(tok);
    if(direct && (!forceSet || forceSet.has(direct.w)))
      return '<span class="w-link" data-w="' + escapeHtml(direct.w) + '">' + escapeHtml(tok) + '</span>';
    var base = findBase(tok);
    if(base && (!forceSet || forceSet.has(base.w)))
      return '<span class="w-link" data-w="' + escapeHtml(base.w) + '">' + escapeHtml(tok) + '</span>';
    return escapeHtml(tok);
  }).join('');
}

/* ------------------------------------------------------------
   用户第 12 项：返回上一级（别让手机的返回键直接把网页关掉）
   ------------------------------------------------------------
   这个工程没有路由 —— view 就是一个裸全局变量，所以这里自己维护一份「应用内历史栈」：

   · NAV_STACK 的每一帧是一屏的快照：view + 那一屏**子页**的状态 + 滚动位置。
     子页不是单独一帧，而是记在所属那一帧里（标注的 粘贴/拍照、笔记的 生成/预览、
     语法 列表/详情、作品详情），于是「回到这一屏」时子页原样还在，不会被重置成默认页。
   · 快照在 render() 里压栈，**不是**在 navTo() 里：工程里还有十几处直接
     `view = 'x'; render();`（开学习、开作品详情、开选择器、从搜索结果跳词典…），
     只挂 navTo 会漏掉它们。navTo 仍旧只管它原来那三件事，一个字没改。
   · 浏览器 / 安卓返回键：页面一启动就 history.pushState 压一枚哨兵，所以返回键
     先落到 popstate 上。popstate 时：
       栈非空 → 取出上一帧、还原、**再压一枚哨兵**（保证不退出网页）；
       栈空   → 什么都不做 —— 这一条是有意的：最后一次返回已经把哨兵消耗掉了，
                落在页面自己那条历史记录上（同一份文档，画面不变），再按一次就
                真的退出。**只有栈空时才让浏览器真的退**。
   · 不用 beforeunload 弹确认框：PWA 里会烦人，而且安卓返回键根本拦不住。
   ------------------------------------------------------------ */
var NAV_STACK = [];
var NAV_STACK_MAX = 40;
var NAV_SENT = { nav:'en-route' };
var _navSkipPush = false;   /* navBack / popstate 还原时置真，别把「还原」又记成一帧 */
var navHistOn = false;
var _navHistTried = false;

/* 当前这一屏的快照（pv 传上一屏的 view 名字；子页状态此刻还是旧的，正好一起带走） */
function navSnapNow(pv){
  var v = pv || view;
  var s = { v: v, y: 0 };
  try{ s.y = window.pageYOffset || document.documentElement.scrollTop || 0; }catch(e){}
  if(v === 'annotate') s.at = (_annoTab === 'ocr') ? 'ocr' : 'text';
  if(v === 'note') s.nt = (typeof noteOpts !== 'undefined' && noteOpts && noteOpts.tab === 'preview') ? 'preview' : 'setup';
  if(v === 'grammar') s.gi = (grammarTopic && GRAMMAR) ? GRAMMAR.indexOf(grammarTopic) : -1;
  if(v === 'mediaDetail' && curMedia){ s.mk = mediaKindOf(curMedia.kind); s.mt = curMedia.t; }
  return s;
}
function navPush(s){
  if(!s || !s.v) return false;
  NAV_STACK.push(s);
  while(NAV_STACK.length > NAV_STACK_MAX) NAV_STACK.shift();
  return true;
}
/* 还原一帧：先把子页状态写回去，再切 view 渲染 */
function navApply(s){
  if(!s || !s.v) return false;
  if(s.v === 'annotate') _annoTab = (s.at === 'ocr') ? 'ocr' : 'text';
  if(s.v === 'note' && typeof noteOpts !== 'undefined' && noteOpts) noteOpts.tab = (s.nt === 'preview') ? 'preview' : 'setup';
  if(s.v === 'grammar'){ grammarTopic = (s.gi >= 0 && GRAMMAR && GRAMMAR[s.gi]) ? GRAMMAR[s.gi] : null; grammarState = null; }
  if(s.v === 'mediaDetail' && s.mt) curMedia = { kind: mediaKindOf(s.mk), t: s.mt };
  /* 作品详情没有具体作品时退回它所属的库，别渲染一屏空白 */
  var v = (s.v === 'mediaDetail' && !curMedia) ? mediaKindOf(s.mk || lastMediaKind) : s.v;
  _navSkipPush = true;
  try{
    view = v;
    render();
    if(s.y) window.scrollTo(0, s.y);
  }finally{ _navSkipPush = false; }
  return true;
}
/* 再压一枚哨兵：下一次返回仍旧落在 popstate 上 */
function navArm(){
  if(!navHistOn) return false;
  try{ history.pushState(NAV_SENT, ''); return true; }
  catch(e){ navHistOn = false; return false; }
}
/* 浏览器返回键 / 安卓返回键落在这里。返回值只给自检用：
   1 = 拦下来并回到上一屏，0 = 栈空、不拦（让浏览器真的退）。 */
function navOnPop(){
  if(!NAV_STACK.length) return 0;
  var s = NAV_STACK.pop();
  navApply(s);
  navArm();
  return 1;
}
/* 界面上那颗「←」：栈里有就回上一屏；栈空就退回这一屏归属的一级页（仍不退出） */
function navBack(){
  var s = NAV_STACK.pop();
  if(s){ navApply(s); return true; }
  var up = VIEW_ALIAS[view] || BN_OF[view] || 'home';
  if(up === view) return false;
  if(view === 'study' && session) saveSession();
  _navSkipPush = true;
  try{ view = up; render(); window.scrollTo(0, 0); }
  finally{ _navSkipPush = false; }
  return false;
}
/* 二级页 = 不是首页、也不是手机底栏那五屏（底栏那五屏是平级的一级页，不给箭头） */
function navIsSecondary(v){
  if(!v) return false;
  if(v === 'home' || v === 'mhome') return false;
  if(typeof isMobileTab === 'function' && isMobileTab(v)) return false;
  return true;
}
function navBackSync(){
  var b = document.getElementById('navBack');
  if(!b) return;
  var sec = navIsSecondary(view);
  if(b.classList) b.classList.toggle('hidden', !sec);
  b.setAttribute('aria-label', sec ? ('返回上一级（离开「' + (VIEW_TITLE[view] || '这一屏') + '」）') : '返回上一级');
}
/* 启动时调一次：压哨兵 + 接住 popstate + 绑定那颗箭头。history 不可用（老浏览器、
   某些 file:// 环境）只会让浏览器的返回键不再被拦，**应用内的箭头与栈照常工作**。 */
function navHistInit(){
  if(_navHistTried) return navHistOn;
  _navHistTried = true;
  var h = null;
  try{ h = window.history; }catch(e){}
  navHistOn = !!(h && h.pushState && h.replaceState);
  if(navHistOn){
    try{
      h.replaceState({ nav:'base' }, '');
      h.pushState(NAV_SENT, '');
    }catch(e){ navHistOn = false; }
  }
  if(!window.__navPopBound){
    window.__navPopBound = true;
    window.addEventListener('popstate', function(){ navOnPop(); });
  }
  var b = document.getElementById('navBack');
  if(b) b.onclick = function(){ navBack(); };
  navBackSync();
  return navHistOn;
}
/* 点导航（侧栏 / 子导航 / 底栏）用这个：就算点的就是当前这一页，也回到页首；
   页面内部的重新渲染走 render()，原地不动。 */
function navTo(v){
  /* 批次 A · #4：离开学习页先把进度落盘。以前这里只有 view = v + render()，
     切一趟标签页再回来，上一次 saveSession 之后答的题就全丢了。 */
  if(view === 'study' && v !== 'study' && session) saveSession();
  /* 会话还在内存里时，「学习」这一项就是那道题：从学习页切到词典、再点回来，
     应该接着当前这个词，而不是被甩回首页把这一轮丢掉（#4 用户原话
     「切换标签页等会自动退出学习页面」）。真要结束这一轮，
     学习页上的「暂停并保存」「退出本轮」两颗按钮会把 session 置空。 */
  if(session && (v === 'study' || v === 'home')) v = 'study';
  view = v;
  render();
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------
   添加到桌面（PWA 安装）

var _installEvt = null;
function installDeviceKind(){

  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
  if(/Android|HarmonyOS/i.test(ua)) return 'android';
  return 'desk';
}
function installStepsHTML(){
  var d = installDeviceKind();
  if(d === 'ios'){
    return '<p>苹果手机 / iPad：用 <b>Safari</b> 打开这一页，点底部中间的「分享」（方框加向上箭头），'
      + '在菜单里往下滑，选「<b>添加到主屏幕</b>」，再点右上角「添加」。</p>'
      + '<p class="muted">必须用 Safari。微信、QQ 这些内置浏览器里没有这一项。</p>';

function stageStatusHTML(batchSize){
  var prog = S.batchStage || {};
  return S.flow.map(function(step){
    var done = Math.min(prog[step] || 0, batchSize);
    var pct = batchSize ? Math.round(done / batchSize * 100) : 0;
    var isDone = done >= batchSize && batchSize > 0;
    return '<div class="stage-row ' + (isDone ? 'done' : '') + '">'
      + '<span class="nm">' + escapeHtml(STEP_LABEL(step)) + '</span>'
      + '<span class="bg"><span class="fg" style="width:' + pct + '%"></span></span>'
      + '<span class="num">' + done + '/' + batchSize + (isDone ? ' ' + IC('check') : '') + '</span>'
      + '</div>';
  }).join('');
}

/* ============================================================
   学习引擎
   ============================================================ */
/* 开始一轮学习（批次 A · #1）
   ------------------------------------------------------------
   用户报的问题：不点「选择单词」、直接点「开始学习」，会学到重复的词组。

   老实现：pool = 当前学段全部词 → 只排除「上一批」S.batch → 剩下的不够 n 时
   `cand = pool.slice()` 整库重来 ⇒ 词库比学习数量小的时候，上一批原样再现。

   现在的取舍（按优先级，KDoc 写清是为了以后别再改回整库重来）：
     ① 批内唯一 —— 词库里同一个词（忽略大小写）只留第一条。这是硬约束，
        任何分支都得过：同一批里绝不允许同一个 w.w 出现两次；
     ② 没学过的词（S.seen 里没有记录）优先，洗牌后取前 n；
     ③ 没学过的够 n 就只用它们，一个学过的词都不重复；
     ④ 不够 n 才用学过的补，顺序是「答错多的先补 → 最久没见的先补」，
        补进来的正好是最该复习的，而不是把上一批原样再来一遍；
     ⑤ S.seen 是空的（第一次用 / 刚清过数据）就退回老行为：先排除上一批
        S.batch，不够再整库重来 —— 但「批内唯一」照旧成立。

   S.seen[k] = { ok, bad, t } 是 noteAnswer 每一题写下来的学习痕迹，这里只读不写。 */
function startLearning(n){
  var pool = curWords();
  var seen = (S && S.seen && typeof S.seen === 'object') ? S.seen : {};
  /* ① 批内唯一 */
  var uniq = [], uni = {};
  pool.forEach(function(w){
    var k = String(w.w || '').toLowerCase();
    if(!k || uni[k]) return;
    uni[k] = 1;
    uniq.push(w);
  });
  var fresh = [], old = [];
  uniq.forEach(function(w){
    var rec = seen[String(w.w).toLowerCase()];
    if(!rec){ fresh.push(w); return; }
    old.push({ w:w, bad:rec.bad || 0, t:rec.t || 0 });
  });
  var picked = [];
  if(!old.length){
    /* ⑤ S.seen 为空：老行为兜底（仍保证批内唯一） */
    var known = {};
    (S.batch || []).forEach(function(x){ known[String(x).toLowerCase()] = 1; });
    var cand = uniq.filter(function(w){ return !known[String(w.w).toLowerCase()]; });
    if(cand.length < n) cand = uniq.slice();
    picked = shuffle(cand).slice(0, Math.min(n, cand.length));
  }else{
    /* ②③ 没学过的先上；够 n 就一个学过的都不碰 */
    picked = shuffle(fresh).slice(0, Math.min(n, fresh.length));
    if(picked.length < n){
      /* ④ 不够才补：答错多的优先，其次最久没见的 */
      old.sort(function(a, b){
        if(b.bad !== a.bad) return b.bad - a.bad;
        if(a.t !== b.t) return a.t - b.t;
        return 0;
      });
      var room = n - picked.length;
      for(var i = 0; i < old.length && room > 0; i++){ picked.push(old[i].w); room--; }
    }
  }
  if(!picked.length){ toast('词库为空'); return; }
  S.batch = picked.map(function(w){ return w.w; });
  S.batchStage = {};
  S.flow.forEach(function(k){ S.batchStage[k] = 0; });
  save();
  startSession(picked, S.flow.slice(), { mode:'learn' });
}
/* 模块内打乱：每个阶段各洗一遍下标顺序。
   关掉开关时就是原样 0..n-1，和以前完全一样；打开时逐阶段独立洗牌，
   所以「中译英」里排在第 1 个的词，到「听音选词」不一定还在第 1 个。 */
function makeStepOrder(n, prev){
  var idx = [];
  for(var i = 0; i < n; i++) idx.push(i);
  if(!(S.settings && S.settings.shuffleStep)) return idx;
  if(n < 2) return idx;
  var out = shuffle(idx);
  /* 万一洗出来和上一个阶段一模一样（n 小的时候概率不低），再洗一次 */
  if(prev && prev.length === out.length){
    var same = true;
    for(var j = 0; j < out.length; j++){ if(out[j] !== prev[j]){ same = false; break; } }
    if(same) out = shuffle(idx);
  }
  return out;
}
function makeSessionOrders(n, flow){
  var out = [], prev = null;
  (flow || []).forEach(function(){ var o = makeStepOrder(n, prev); out.push(o); prev = o; });
  return out;
}
/* 存档里的顺序还能不能用：阶段数对得上、每阶段都是 0..n-1 的一个排列 */
function ordUsable(ord, n, flow){
  if(!ord || !ord.length) return false;
  if(ord.length !== (flow || []).length) return false;
  for(var i = 0; i < ord.length; i++){
    var a = ord[i];
    if(!a || a.length !== n) return false;
    for(var j = 0; j < a.length; j++){
      if(typeof a[j] !== 'number' || a[j] < 0 || a[j] >= n) return false;
    }
  }
  return true;
}
/* 当前这一题到底是哪条词：ord 是每个阶段各自的下标顺序 */
function curWordOf(s){
  if(!s || !s.words || !s.words.length) return null;
  var o = s.ord && s.ord[s.stepIdx];
  var i = (o && o[s.wordIdx] != null) ? o[s.wordIdx] : s.wordIdx;
  return s.words[i] || s.words[s.wordIdx] || null;
}
/* 某条错题是哪些模块答错的：老记录（只有 step/count）在这里兜底成一条 */
function wrongStepsOf(it){
  var out = [];
  if(it && it.steps && typeof it.steps === 'object'){
    Object.keys(it.steps).forEach(function(k){
      var n = parseInt(it.steps[k], 10);
      if(n > 0) out.push({ k:k, n:n });
    });
  }
  if(!out.length && it && it.step) out.push({ k:it.step, n:it.count || 1 });
  out.sort(function(a, b){ return b.n - a.n; });
  return out;
}
function startSession(words, flow, opts){
  if(!words.length){ toast('没有可学习的单词'); return; }
  if(!flow.length) flow = ['cn2en'];
  session = {
    words:words, flow:flow, stepIdx:0, wordIdx:0,
    ord:makeSessionOrders(words.length, flow), byStep:{},
    correct:0, total:0, feedback:null, stageIntro:false,
    timed:!!opts.timed, mode:opts.mode || 'learn', timerLeft:null,
    quest:(opts.quest === undefined ? null : opts.quest),
    startedAt:Date.now(), level:S.level
  };
  view = 'study';
  saveSession();
  render();
}
function resumeSession(saved){
  var words = saved.words.map(findWord).filter(Boolean);
  if(!words.length){ toast('无法恢复：单词已丢失'); clearSavedSession(); return; }
  var flow = saved.flow || ['cn2en'];
  session = {
    words:words, flow:flow,
    stepIdx:saved.stepIdx || 0, wordIdx:saved.wordIdx || 0,
    /* 存档里带着顺序就照原样接着走（刷新一下不该把当前这个词换掉）；
       维度对不上（老存档 / 词数或流程变了）才重洗一遍 */
    ord:ordUsable(saved.ord, words.length, flow) ? saved.ord : makeSessionOrders(words.length, flow),
    byStep:saved.byStep || {},
    correct:saved.correct || 0, total:saved.total || 0,
    feedback:null, stageIntro:false, timed:!!saved.timed,
    mode:saved.mode || 'learn', timerLeft:null,
    /* 老存档没有 wrongSeen ⇒ null：这一轮结算时一个字都不标（不知道之前错过没有，
       宁可不标也不误标） */
    wrongSeen:saved.wrongSeen || null,
    quest:(saved.quest === undefined ? null : saved.quest),
    startedAt:saved.savedAt || Date.now(), level:S.level
  };
  view = 'study';
  render();
}

  var qSig = s.stepIdx + '/' + s.wordIdx;

/* #3c 识词页「点单词看详情」的泄题判断（写在这里，免得以后被人当成漏做）：

function makeOptions(word, pool){

/* 反馈态（答完之后）：答案已经写在下面，词形这里再点开详情不泄任何东西 */

function bindStudy(word, step, s){

  var wt = $('#studyWordTap');
  if(wt){
    wt.onclick = function(ev){
      if(ev && ev.stopPropagation) ev.stopPropagation();

    };
    wt.onkeydown = function(ev){
      if(ev && (ev.key === 'Enter' || ev.key === ' ')){
        ev.preventDefault();
        if(ev.stopPropagation) ev.stopPropagation();
        showWordDetail(word.w);
      }
    };
  }
  /* #10：生成笔记 —— 这一屏每一道题（含反馈态）都挂着，所以要排在下面几个 return 之前 */
  var noteBtn = $('#noteWordBtn');
  if(noteBtn) noteBtn.onclick = function(){ openWordNoteSheet(word); };
  $('#pauseBtn').onclick = function(){
    saveSession(); session = null;
    toast('已保存，下次可继续');
    view = 'home'; render();
  };
  $('#quitBtn').onclick = function(){
    uiConfirm('退出本轮？学习进度将保留，可稍后继续。', function(){
      saveSession(); session = null;
      view = 'home'; render();
    }, { title:'退出本轮', okText:'退出', danger:false });
  };
  if(s.feedback){
    $('#contBtn').onclick = advance;
    $('#fbSpeak').onclick = function(){ speak(word.w, 'en'); };
    $('#fbDetail').onclick = function(){ showWordDetail(word.w); };
    autoSpeakFeedback(word.w);
    return;
  }
  if(step === 'read'){
    var card = $('#readCard');
    card.onclick = function(){ speak(word.w, 'en'); };
    autoSpeakWord(word.w);
    $('#nextBtn').onclick = advance;
    return;
  }
  if(step === 'cn2en' || step === 'en2cn' || step === 'spell'){
    var inp = $('#ansInput');
    if(inp){
      inp.focus();
      inp.onkeydown = function(e){ if(e.key === 'Enter') doSubmit(); };
      $('#submitBtn').onclick = doSubmit;
    }else{
      $$('.opt').forEach(function(b){ b.onclick = function(){ submitAnswer(b.dataset.v); }; });
    }
    if(step === 'spell'){
      var sp = $('#spellPlay'); if(sp) sp.onclick = function(){ speak(word.w, 'en'); };
    }
    $('#skipBtn').onclick = function(){ submitAnswer(null); };
    return;
  }
  if(step === 'listen' || step === 'sent'){
    $$('.opt').forEach(function(b){ b.onclick = function(){ submitAnswer(b.dataset.v); }; });
    if(step === 'listen'){
      $('#playBtn').onclick = function(){ speak(word.w, 'en'); };
      autoSpeakWord(word.w);
    }
    $('#skipBtn').onclick = function(){ submitAnswer(null); };
    return;

  if(step === 'shadow'){
    $('#shadowPlay').onclick = function(){ shadowPlayDemo(word.w); };
    bindShadowHold($('#shadowRecord'), $('#shadowHoldTip'), $('#shadowStatus'));
    $('#skipBtn').onclick = function(){ submitAnswer(null); };
    shadowPlayDemo(word.w);
    return;
  }

    var v = $('#ansInput').value;
    if(!v.trim()){ toast('先输入答案吧'); return; }

  }
}
/* 六种 step 的答案比较收敛到这一处（批次 A · #2）。
   以前 listen / sent 是裸的 value === word.w：没 trim、没小写，选项按钮或语音识别结果
   带一个首尾空格（甚至是全角空格）就判错；而 cn2en / spell 却是 trim + 小写 ——
   同一个答案在不同 step 上结论不一样，用户看到的就是「明明对得上却显示错误」。
   现在统一走 normAnswer（压连续空白 + 去首尾 + 小写）再比。

   只有两处**故意**不合并进来：
     · en2cn 仍走 checkMeaning（同义/近义/词性后缀那套中文语义匹配）；

function submitAnswer(value){
  var s = session;

  var word = curWordOf(s), step = s.flow[s.stepIdx];
  var ok = answerMatches(step, value, word);
  var correct = (step === 'en2cn') ? word.m : word.w;
  s.total++;
  var bs = s.byStep || (s.byStep = {});
  var b = bs[step] || (bs[step] = { c:0, t:0 });
  b.t++;

  if(s.mode === 'wrong'){
    var wb = s.wrongSeen || (s.wrongSeen = {});
    var wk = String(word.w || '').toLowerCase();
    var wr = wb[wk] || (wb[wk] = { n:0, ok:0, bad:0 });
    wr.n++;
    if(ok) wr.ok++; else wr.bad++;

  var rb = s.roundSeen || (s.roundSeen = {});
  var rk = String(word.w || '').toLowerCase();
  var rr = rb[rk] || (rb[rk] = { n:0, ok:0, bad:0, skip:0, ms:0 });
  rr.n++;
  if(ok) rr.ok++; else rr.bad++;
  if(value == null) rr.skip++;                 /* 点「不会，看答案」= 看过答案 */
  if(s.qAt && Date.now() > s.qAt) rr.ms += (Date.now() - s.qAt);

function advance(){
  var s = session;

    /* 错题本「重新学习」也走 S.batch 这套进度（#wrongLearn 先把 S.batch 写成那些错词），

    if(s.mode === 'learn' || s.mode === 'wrong'){ S.batchStage[step] = s.words.length; save(); }
    checkinWordDone();
    s.wordIdx = 0; s.stepIdx++;
    if(s.stepIdx >= s.flow.length){ finishSession(); return; }
    s.stageIntro = true;
  }else{
    if(s.mode === 'learn' || s.mode === 'wrong'){ S.batchStage[step] = s.wordIdx; save(); }
  }

  render();

function finishSession(){
  var s = session;
  var acc = s.total ? Math.round(s.correct / s.total * 100) : 0;
  var words = s.words;
  var secs = Math.max(1, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000));
  checkinRoundDone();
  clearSavedSession();
  /* 错题本「重新学习」结算（用户第 14 项）：这一轮里零错、且至少答对一次的词
     在对应的 S.wrong 记录上打 relearned / relearnedAt。mode 不是 'wrong' 时直接空转。
     放在 clearSavedSession 之后、session 置空之前 —— 只读 s，不依赖已清掉的存档。 */
  try{ finishWrongRelearn(s); }catch(e){}

      var qs2 = qr.stars || questStars(acc);
      qHTML = '<div class="q-done ' + (qr.pass ? 'ok' : 'no') + '">'
        + '<i class="q-hex"><b>' + (s.quest + 1) + '</b></i>'
        + '<div class="q-done-tx"><b>' + (qr.pass ? ('第 ' + (s.quest + 1) + ' 关 · 通关' + (qr.first ? '（首次通过）' : ''))

        + '<span>本轮正确率 ' + acc + '%，通关线是 ' + qr.need + '%'
        + (qr.pass ? ' · ' + '★'.repeat(qs2) + '☆'.repeat(Math.max(0, 3 - qs2))
                   : '，再打一次就能拿下这一关') + '</span></div>'
        + '<button class="btn ' + (qr.pass ? 'ghost' : 'primary') + ' sm" id="qRetry">' + (qr.pass ? '再刷一次' : '重打这一关') + '</button>'
        + '</div>'
        + (qr.pass && s.quest + 1 < totalQ

            : '');

  var app = $('#app');
  app.innerHTML = '<div class="card center">'
    + '<div class="done-icon">' + IC('trophy') + '</div>'
    + '<h2 class="h2" style="font-size:var(--fs-lg);margin-bottom:6px;justify-content:center;display:flex">本轮完成</h2>'
    + (rec ? '<div style="display:flex;justify-content:center;margin:6px 0 2px">' + gradeBadge(rec.grade, true) + '</div>' : '')
    + '<p class="muted" style="margin:0">共学习 ' + words.length + ' 个单词 · 答题 ' + s.total + ' 次 · 用时 ' + fmtDuration(secs) + '</p>'
    + (sm2Count ? '<p class="muted" style="margin:6px 0 0">已按遗忘曲线给 <b style="color:var(--accent)">' + sm2Count + '</b> 个词排好下次复习时间</p>' : '')
    + '<div class="stats">'
    +   (S.settings.showScore ? '<div class="stat"><b>' + s.correct + '</b><span>答对</span></div>' : '')
    +   (S.settings.showAccuracy ? '<div class="stat"><b>' + acc + '%</b><span>正确率</span></div>' : '')
    +   (rec ? '<div class="stat"><b>' + rec.score + '</b><span>综合分</span></div>' : '<div class="stat"><b>' + S.wrong.length + '</b><span>错题</span></div>')
    + '</div>'

    +   (rec && S.settings.evalShow ? '<button class="btn primary" id="showEval">查看评价图片</button>' : '')
    +   '<button class="btn' + (rec && S.settings.evalShow ? '' : ' primary') + '" id="goReview">去复习</button>'
    +   '<button class="btn" id="again">再学一组</button>'

  $('#again').onclick = function(){ session = null; view = 'home'; render(); };

  var qn = $('#qNext');

function startTimer(s){

/* ============================================================
   错题记录
   ============================================================ */
function addWrong(word, step, your, correct){
  var key = word.w.toLowerCase();
  var exist = null;
  S.wrong.forEach(function(x){ if(x.w.toLowerCase() === key) exist = x; });
  if(exist){
    exist.step = step;
    exist.your = your == null ? '(未作答)' : your;
    exist.correct = correct;
    exist.time = Date.now();
    exist.count = (exist.count || 1) + 1;
    if(!exist.steps || typeof exist.steps !== 'object') exist.steps = {};
    exist.steps[step] = (exist.steps[step] || 0) + 1;
    /* 又答错了 ⇒ 之前那条「已重学」作废（用户第 14 项：它又错了，就不算重新学会）。
       两个字段直接删掉而不是写 false —— 与老记录的「没有这个字段」保持同一种形状，
       截断、导出、备份都不用为它多写分支。 */
    if(exist.relearned || exist.relearnedAt){ delete exist.relearned; delete exist.relearnedAt; }
  }else{
    var one = {}; one[step] = 1;
    S.wrong.unshift({ w:word.w, step:step, your:your == null ? '(未作答)' : your, correct:correct, time:Date.now(), count:1, steps:one });
  }
  /* 上限 500 条：被截掉的记录连 relearned / relearnedAt 一起丢 —— 没有另存一份，
     别以为它还在（这里不假装能保住，也不在别处补写）。 */
  if(S.wrong.length > 500) S.wrong.length = 500;
  save();
}
function uniqueWrongWords(){
  var seen = {}, out = [];
  S.wrong.forEach(function(it){
    var k = it.w.toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    var w = findWord(it.w);
    if(w) out.push(w);
  });
  return out;
}
/* ------------------------------------------------------------
   「已重学」标记（用户第 14 项）

   一条错题算不算「已重学」：只看 it.relearned 是不是真值。
   老记录（这一版之前收的错题）根本没有这个字段 ⇒ 一律当「未重学」，不需要迁移。
   只有 finishWrongRelearn 会写 true，addWrong 在它又答错时把两个字段一起删掉。 */

/* 三段筛选本体：认不出的 tab 一律落回「全部」（宁可多显示，也别把整本藏起来） */
function wrongTabList(list, tab){
  var arr = list || [];
  if(tab === 'todo') return arr.filter(function(it){ return !wrongRelearned(it); });
  if(tab === 'done') return arr.filter(function(it){ return wrongRelearned(it); });

/* 错题本「重新学习」的结算：只在 mode==='wrong' 的那一轮里（#wrongLearn 起的会话）动手。

     1) 这个词在这一轮里真的出现过、并且被作答过（s.wrongSeen[k].n > 0）——

     2) 这一轮它零错（bad === 0）—— 任何一个 step 答错，整条就不算；

function finishWrongRelearn(s){

  var n = 0, now = Date.now();
  S.wrong.forEach(function(it){

  if(picker.pos !== 'all') u = u.filter(function(w){ return wordPOSList(w.m).indexOf(picker.pos) >= 0; });

  if(picker.scene !== 'all') u = u.filter(function(w){ return wordScenes(w).indexOf(picker.scene) >= 0; });
  if(picker.query){
    var q = picker.query;
    u = u.filter(function(w){
      if(matchQuery(w.w, q) || matchQuery(w.m, q)) return true;
      /* 中文场景名也能搜（打「职场」「饮食」直接筛出这一类） */

function pickerClick(k, pool){

    else if(picker.anchor === k){ picker.anchor = null; }
    else{
      var keys = pool.map(function(w){ return w.w.toLowerCase(); });
      var a = keys.indexOf(picker.anchor), b = keys.indexOf(k);
      if(a >= 0 && b >= 0){
        var lo = Math.min(a, b), hi = Math.max(a, b);

      }
      picker.anchor = null;

/* 纸张：w/h 用毫米；lines = 该纸型「横线款」的默认行数（按 8mm 行距折算，见笔记本实物说明） */

/* 积木模块（已移除音标）：每个都能拖到任意行、任意位置。

   它跟「词义」读的是同一份数据（w.m），摆在面板上等于让用户二选一、还多一层概念。
   现在整块删掉，只留「词义」（name 从「意思」改成「词义」与用户的说法对齐）；
   老用户存过的 trans 由 noteNormalizeRows() 映射成 meaning，读配置不会报错。 */
var NOTE_FIELDS = [
  { k:'word',    name:'原词',             short:'原词',  ic:'book' },
  { k:'pos',     name:'词性',             short:'词性',  ic:'tag' },
  { k:'meaning', name:'词义',             short:'词义',  ic:'message' },
  { k:'example', name:'例句',             short:'例句',  ic:'file' },
  { k:'syn',     name:'近义词',           short:'近义',  ic:'link' },
  { k:'ant',     name:'反义词',           short:'反义',  ic:'scale' },
  { k:'comp',    name:'比较级·最高级',     short:'比较',  ic:'sort' },
  { k:'verb',    name:'过去式·过去分词',   short:'变形',  ic:'swap' },
  { k:'morph',   name:'衍生词',           short:'衍生',  ic:'layers' }
];
/* 空格占位模块：仅占横向位置，可无限添加，宽度由 blockPad.gap 控制 */
var NOTE_GAP = { k:'gap', name:'空格（占位）', short:'空格', ic:'space' };
function noteFieldMeta(k){
  if(k === 'gap') return NOTE_GAP;
  for(var i = 0; i < NOTE_FIELDS.length; i++){ if(NOTE_FIELDS[i].k === k) return NOTE_FIELDS[i]; }
  return null;
}
/* 默认积木：原词 词性 词义 / 例句 / 衍生词（与用户给的示意一致） */
function noteDefaultRows(){

}
var noteOpts = {
  tab:'setup',
  format:'a4', orientation:'portrait', flip:'h',
  fontSize:14, fontAuto:true, lineHeight:1.25, perWordGap:1,
  rows:noteDefaultRows(),
  blockGap:12, rowGap:0, blockPad:{}, rowAlign:'base',   /* rowAlign: base=基线对齐(贴横线) / top=顶部对齐 */
  ruleStyle:'line',        /* line=横线 / grid=方格 / none=空白 */
  ruleCount:32,            /* 行数，随纸张切换自动取该纸型默认值，也可自己改 */
  wordCols:1,              /* 整词布局：1=竖向堆叠，2/3=多列 */
  pdfRange:'all', pdfFrom:1, pdfTo:1,
  colors:{ word:'#0f172a', pos:'#6366f1', meaning:'#0f172a', example:'#475569', syn:'#059669', ant:'#dc2626', comp:'#d97706', verb:'#2563eb', morph:'#7c3aed' }
};
/* 某字段是否出现在积木里（兼作「显示开关」） */
function noteFieldOn(k){

/* 笔记里的「词义」：整条释义，只去掉开头的词性标记 —— 词性有自己那块积木，
   重复一遍只占地方。#11 把「翻译」并进「词义」时，用户的说法是「内容仍是 w.m」。 */
function noteMeaningText(m){
  var raw = String(m == null ? '' : m).trim();
  var t = raw.replace(/^[a-zA-Z]+\.\s*/, '').trim();
  return t || raw;
}
function noteFieldValue(w, k){
  var ex, s, a, c, vf, mo;
  switch(k){
    case 'word': return w.w;
    case 'pos':
      var ms = String(w.m || '').match(/[a-zA-Z]+\./g) || [];
      var seen = {}, parts = [];
      ms.forEach(function(p){ var q = p.replace(/\.$/, ''); if(!seen[q]){ seen[q] = 1; parts.push(q); } });
      return parts.join(' / ');
    case 'meaning': return noteMeaningText(w.m);
    case 'example': ex = pickExample(w); return ex ? ((ex.t || '') + '  ' + (ex.tr || '')) : '';
    case 'syn': s = getSyn(w); return (s && s.length) ? s.map(function(x){ return x.w; }).join('，') : '';
    case 'ant': a = getAnt(w); return (a && a.length) ? a.map(function(x){ return x.w; }).join('，') : '';
    case 'comp': c = getComp(w); return c ? ('比较级 ' + (c.c || '') + ' · 最高级 ' + (c.s || '')) : '';
    case 'verb': vf = getVerbForm(w); return vf ? ('过去式 ' + (vf[0] || '') + ' · 过去分词 ' + (vf[1] || '')) : '';
    case 'morph':
      mo = getMorph(w);
      if(mo && mo.type === 'derived' && mo.root) return '词根 ' + mo.root;
      if(mo && mo.type === 'root' && mo.deriv && mo.deriv.length) return '衍生词 ' + mo.deriv.join('，');
      var r = findRootOf(w.w);
      return r ? '词根 ' + r : '';

}
function noteLink(word, text){
  return '<span class="nw-link" data-w="' + escapeHtml(word) + '">' + escapeHtml(text) + '</span>';
}
function noteClickEn(text){
  return String(text == null ? '' : text).replace(/([A-Za-z]+(?:['’-][A-Za-z]+)*)|([^A-Za-z]+)/g, function(m, word){
    return word ? noteLink(word, word) : escapeHtml(m);
