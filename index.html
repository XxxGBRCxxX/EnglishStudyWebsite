.lib-ic svg.ic{width:19px;height:19px}
.lib-main{flex:1;min-width:0}
.lib-name{font-weight:700;font-size:var(--fs-base);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lib-meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.lib-acts{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.drop-zone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;
  color:var(--muted);font-size:13px;cursor:pointer;transition:.15s;background:var(--soft)}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop-zone svg.ic{width:30px;height:30px;display:block;margin:0 auto 8px}
/* ============================================================
   关于
   ============================================================ */
.ab-hero{display:flex;align-items:center;gap:14px}
.ab-logo{width:56px;height:56px;border-radius:16px;flex:0 0 auto;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ab-logo svg{width:100%;height:100%;display:block}
.ab-name{font-weight:700;font-size:19px;line-height:1.3}
.ab-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ab-list{display:flex;flex-direction:column;gap:9px}
.ab-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.7}
.ab-row svg.ic{width:17px;height:17px;color:var(--accent);flex:0 0 auto;margin-top:3px}
.ab-row b{font-weight:600}
.log-item{display:flex;gap:12px;font-size:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-v{flex:0 0 78px;font-weight:700;color:var(--accent);font-family:Georgia,serif;font-size:13.5px}
.log-d{flex:1;min-width:0;line-height:1.7;color:var(--muted)}
.log-d b{color:var(--fg);font-weight:600}
.kv-row{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv-row:last-child{border-bottom:0}
.kv-k{flex:0 0 120px;color:var(--muted)}
.kv-v{flex:1;min-width:0;word-break:break-word}
/* ============================================================
   自定义对话框（替代原生 alert / confirm / prompt）
   ============================================================ */
.dlg{max-width:430px;width:calc(100% - 32px);animation:cardIn .2s ease}
.dlg-h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16.5px;margin-bottom:8px}
.dlg-h svg.ic{width:21px;height:21px;color:var(--accent);flex:0 0 auto}
.dlg-h.warn svg.ic{color:var(--no)}
.dlg-b{font-size:14px;color:var(--muted);line-height:1.78;white-space:pre-wrap;word-break:break-word}
.dlg-b.dlg-html{white-space:normal}
.dlg-b.dlg-html .grade{color:#fff}
.dlg-in{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);
  padding:10px 12px;font-family:inherit;font-size:14px;outline:none;resize:vertical;min-height:80px;line-height:1.7}
.dlg-in:focus{border-color:var(--accent)}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg-f .btn{min-width:84px}
@media (max-width:560px){
  .dlg-f{flex-direction:column-reverse}
  .dlg-f .btn{width:100%}
}
/* ============================================================
   新增组件：环境提示条 / 首次引导 / 全局搜索 / 分享 / 构词法 /
   形容词变化 / 日程 / 学习报告 / 评价徽章
   ============================================================ */
.text-input{font:inherit;font-size:var(--fs-base);width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--surface);color:var(--fg);transition:.15s}
.text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.time-input{font:inherit;font-size:var(--fs-base);width:132px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--surface);color:var(--fg)}
.time-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.num-input.tiny{width:62px;padding:7px 8px;text-align:center}
.cut-lab{font-size:12.5px;color:var(--muted);margin-left:8px;align-self:center}
.cut-lab:first-child{margin-left:0}

/* 顶栏全局搜索按钮 */
.top-search{margin-left:8px}
@media (max-width:860px){.top-search{display:none}}

/* 内置浏览器 / 浏览器引导条 */
.env-bar{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--accent-line);background:var(--accent-soft);margin-bottom:14px}
.env-bar .eb-ic{flex:0 0 auto;color:var(--accent);margin-top:1px}
.env-bar .eb-main{flex:1;min-width:0}
.env-bar .eb-t{font-weight:700;color:var(--fg);margin-bottom:3px}
.env-bar .eb-d{font-size:12.5px;color:var(--muted);line-height:1.7}
.env-bar .eb-act{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.env-bar .eb-act .btn{white-space:nowrap}
@media (max-width:640px){
  .env-bar{flex-direction:column}
  .env-bar .eb-act{flex-direction:row;flex-wrap:wrap;width:100%}
  .env-bar .eb-act .btn{flex:1 1 auto}
}

/* 首次引导 */
.ob-mask{position:fixed;inset:0;background:rgba(9,13,19,.62);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.ob-box{position:relative;width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.ob-hero{padding:26px 60px 20px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.ob-hero .ob-ic{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.ob-hero .ob-ic svg.ic{width:26px;height:26px}
.ob-hero h3{margin:0;font-size:19px}
.ob-hero p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.ob-body{padding:18px 24px 4px}
.ob-body p{margin:0 0 12px;font-size:14px;line-height:1.85;color:var(--fg)}
.ob-body ul{margin:0 0 12px;padding-left:20px;font-size:13.5px;line-height:1.9;color:var(--muted)}
.ob-body li b{color:var(--fg)}
.ob-foot{display:flex;align-items:center;gap:12px;padding:16px 24px 22px}
.ob-dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.ob-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.ob-dots i.on{background:var(--accent);width:20px;border-radius:5px}
.ob-foot .btn{min-width:88px}
/* 首次引导：真实结构用的是 .ob-x / .ob-step / .ob-t / .ob-d / .ob-tags / .ob-f */
.ob-x{position:absolute;right:12px;top:12px;z-index:2;width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ob-x:hover{background:var(--soft);color:var(--fg)}
.ob-x svg.ic{width:15px;height:15px}
.ob-step{flex:0 0 auto;margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted)}
.ob-t{padding:18px 24px 0;margin:0;font-size:19px}
.ob-d{padding:0 24px;margin:8px 0 0;font-size:14px;line-height:1.85;color:var(--muted)}
.ob-tags{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 0}
.ob-tag{font-size:11.5px;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.ob-dots{padding:16px 24px 0;flex:none}
.ob-f{display:flex;align-items:center;gap:12px;padding:18px 24px 22px}
.ob-f .spacer{flex:1}
.ob-f .btn{min-width:88px;white-space:nowrap}
@media (max-width:560px){.ob-f{padding:14px 18px 18px;gap:8px}.ob-f .btn{min-width:0;flex:0 0 auto;padding-left:12px;padding-right:12px}}
/* 首次引导：配置步骤（目的 / 重点练什么 / 界面偏好） */
.ob-opts{display:flex;flex-direction:column;gap:9px;padding:16px 24px 2px}
.ob-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer;font:inherit;transition:.15s}
.ob-opt:hover{border-color:var(--accent);background:var(--soft)}
.ob-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.ob-opt .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);transition:.15s}
.ob-opt.on .ic{background:var(--accent);color:var(--accent-fg)}
.ob-opt .tx{flex:1;min-width:0}
.ob-opt .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.5}
.ob-opt .tx i{display:block;font-style:normal;font-size:12.5px;line-height:1.65;color:var(--muted);margin-top:2px}
.ob-opt .mk{flex:0 0 auto;align-self:center;color:var(--accent);opacity:0;transition:.15s;display:flex}
.ob-opt .mk svg.ic{width:16px;height:16px}
.ob-opt.on .mk{opacity:1}
.ob-grp{padding:14px 24px 0}
.ob-grp:first-of-type{padding-top:18px}
.ob-grp-t{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ob-grp .chips{display:flex;flex-wrap:wrap;gap:8px}
.ob-grp .theme-grid{margin:0}
.ob-note{margin:15px 24px 0;padding:11px 13px;border-radius:10px;background:var(--soft);border:1px dashed var(--line);font-size:12.5px;line-height:1.75;color:var(--muted)}
.ob-note b{color:var(--fg)}
.ob-prev{margin:14px 24px 0;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg);display:flex;align-items:center;gap:11px}
.ob-prev .sw{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--accent)}
.ob-prev .tx{flex:1;min-width:0}
.ob-prev .tx b{display:block;font-size:13.5px;color:var(--fg);line-height:1.5}
.ob-prev .tx i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.ob-sum{margin:15px 24px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ob-sum-row{display:flex;gap:12px;align-items:baseline;padding:10px 13px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.7}
.ob-sum-row:first-child{border-top:0}
.ob-sum-row b{flex:0 0 72px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ob-sum-row span{flex:1;min-width:0;color:var(--fg)}
@media (max-width:560px){
  .ob-opts{padding:12px 18px 2px;gap:8px}
  .ob-grp{padding:12px 18px 0}
  .ob-grp:first-of-type{padding-top:14px}
  .ob-note,.ob-sum{margin-left:18px;margin-right:18px}
  .ob-opt{padding:10px 11px;gap:10px}
  .ob-opt .ic{width:30px;height:30px;flex:0 0 30px}
  .ob-sum-row b{flex:0 0 62px}
}

/* 全局搜索 */
/* ---------- 三级标题（各页面通用） ---------- */
.h3{font-size:var(--fs-sm);font-weight:700;margin:0 0 10px;letter-spacing:.3px;color:var(--fg)}
.h3 .hint{font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0;font-size:12px}
.dict-list{display:block}

/* ---------- 全站搜索面板 ---------- */
.gs-mask{position:fixed;inset:0;background:rgba(9,13,19,.55);backdrop-filter:blur(3px);z-index:58;display:flex;align-items:flex-start;justify-content:center;padding:64px 18px 20px}
.gs-box{width:100%;max-width:660px;max-height:78vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.gs-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.gs-head>svg.ic{flex:0 0 auto;width:17px;height:17px;color:var(--muted)}
.gs-in{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);font:inherit;font-size:16px}
.gs-in::placeholder{color:var(--muted)}
.gs-x{flex:0 0 auto;width:28px;height:28px;border:0;border-radius:8px;background:var(--soft);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.gs-x:hover{color:var(--fg);background:var(--line)}
.gs-x svg.ic{width:14px;height:14px}
.gs-body{overflow:auto;padding:4px 0 12px}
.gs-tip{margin:0;padding:26px 20px;text-align:center;font-size:13.5px;color:var(--muted);line-height:1.7}
.gs-cat{display:block}
.gs-cat-t{display:block;padding:12px 18px 6px;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
.gs-item{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:9px 18px;cursor:pointer;border:0;border-left:3px solid transparent;background:transparent;font:inherit;color:var(--fg)}
.gs-item:hover,.gs-item.on{background:var(--soft);border-left-color:var(--accent)}
.gs-item .gs-ic{flex:0 0 auto;display:flex;align-items:center;color:var(--accent)}
.gs-item .gs-ic svg.ic{width:16px;height:16px}
.gs-item .gs-main{flex:1;min-width:0;display:block}
.gs-item .gs-main b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-item .gs-main i{display:block;font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
@media (max-width:640px){.gs-mask{padding:40px 10px 10px}}

/* ---------- 分享配置包 ---------- */
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;margin-top:6px}
.sh-item{position:relative;display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.15s}
.sh-item:hover{border-color:var(--accent-line)}
.sh-item.on{border-color:var(--accent);background:var(--accent-soft)}
.sh-item>input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.sh-ic{flex:0 0 20px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px;color:transparent;transition:.15s;background:var(--surface)}
.sh-item.on .sh-ic{background:var(--accent);border-color:var(--accent);color:#fff}
.sh-ic svg.ic{width:12px;height:12px}
.sh-main{flex:1;min-width:0;display:block}
.sh-main b{display:block;font-size:13.5px;font-weight:600}
.sh-main i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6}

/* ---------- 构词法 ---------- */
.mf-stat{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.mf-stat b{color:var(--fg)}
.mf-item{display:block}
.mf-h{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:11px;cursor:pointer;margin-top:9px;transition:.15s;font:inherit;color:var(--fg);background:var(--surface)}
.mf-h:hover{border-color:var(--accent-line)}
.mf-h.open{border-color:var(--accent);background:var(--accent-soft)}
.mf-ar{flex:0 0 auto;display:flex;align-items:center;color:var(--muted);transition:transform .18s}
.mf-ar svg.ic{width:13px;height:13px}
.mf-h.open .mf-ar{transform:rotate(90deg)}
.mf-h .mf-a{font-family:Georgia,serif;font-size:16px;font-weight:700;flex:0 0 auto;min-width:74px}
.mf-h .mf-tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;flex:0 0 auto}
.mf-h .mf-d{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.mf-h .mf-n{font-size:12px;color:var(--muted);flex:0 0 auto}
.mf-h .mf-k{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;flex:0 0 auto}
.mf-k.prefix{background:rgba(139,92,246,.14);color:#8b5cf6}
.mf-k.suffix{background:rgba(14,165,233,.14);color:#0ea5e9}
.mf-k.root{background:rgba(16,185,129,.14);color:#10b981}
.mf-body{display:block;padding:0 4px}
.mf-words{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px}
.mf-w{font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);color:var(--fg);display:inline-flex;align-items:baseline}
.mf-w:hover{border-color:var(--accent);color:var(--accent)}
.mf-w i,.mf-w .mf-p{font-style:normal;font-size:11px;color:var(--muted);margin-left:5px}
.mf-more{font-size:13px;padding:6px 11px;border:1px dashed var(--line);border-radius:8px;cursor:pointer;background:var(--surface);color:var(--muted);display:inline-flex;align-items:baseline}
.mf-more:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 形容词变化：构成规则 ---------- */
.cmp-rules{display:block}
.cmp-rule{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:9px}
.cmp-rule b{display:block;font-weight:700;font-size:14px;margin-bottom:4px;color:var(--fg)}
.cmp-rule span{display:block;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;color:var(--accent);line-height:1.75}

/* ---------- 学习日程 ---------- */
.sw-row{display:flex;align-items:center;gap:14px;padding:12px 0}
.sw-l{flex:1;min-width:0}
.sw-l b{display:block;font-size:14px;font-weight:600}
.sw-l span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.sw{position:relative;width:44px;height:25px;flex:0 0 auto;cursor:pointer;display:block}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;display:block;border-radius:13px;background:var(--line);transition:.2s}
.sw i:after{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked + i{background:var(--accent)}
.sw input:checked + i:after{transform:translateX(19px)}
.sch-bar{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.sch-bar .bg{flex:1;height:8px;border-radius:5px;background:var(--soft);overflow:hidden;display:block}
.sch-bar .fg{display:block;height:100%;background:var(--accent);border-radius:5px}
.sch-bar .num{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.sc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.sc-day{border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center}
.sc-day>b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;white-space:nowrap}
.sc-day.today{border-color:var(--accent);background:var(--accent-soft)}
.sc-day.today>b{color:var(--accent)}
.sc-day.rest .sc-chips{opacity:.58}
.sc-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.sc-chips{gap:4px;margin:0;justify-content:center}
.sc-chips .chip{padding:3px 7px;font-size:11px;border-radius:6px;min-width:0}
.sc-day .btn.ghost.sm{font-size:11px;padding:3px 8px;margin-top:6px}
.sc-day .sd-t{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sc-day .sd-v{font-size:16px;font-weight:700}
@media (max-width:560px){.sc-week{grid-template-columns:repeat(4,1fr)}}
.sc-list{display:block;margin-top:6px}
.sc-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sc-row:last-child{border-bottom:0}
.sc-row.now{background:var(--accent-soft);border-radius:9px;padding-left:10px;padding-right:10px;border-bottom-color:transparent}
.sc-k{flex:0 0 104px;min-width:0;font-weight:600;display:flex;align-items:baseline;gap:6px}
.sc-k i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:400}
.sc-t{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.sc-t b.rest{color:var(--muted);font-weight:600;font-size:12.5px}
.sc-ov{font-style:normal;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.sc-bar{flex:0 0 118px;height:6px;border-radius:4px;background:var(--soft);overflow:hidden;display:block}
.sc-bar b{display:block;height:100%;background:var(--accent);border-radius:4px}
.sc-d{flex:0 0 32px;text-align:right;font-weight:600;color:var(--muted);font-size:12.5px}
.sc-row .btn.ghost.sm{font-size:11.5px;padding:3px 9px}
.sc-date{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sc-date:last-child{border-bottom:0}
.sc-date .scd-k{flex:1;min-width:0}
@media (max-width:640px){.sc-k{flex-basis:78px}.sc-bar{flex-basis:64px}}

/* ---------- 学习报告 ---------- */
.grade{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:10px;color:#fff;line-height:1}
.grade.sm{width:30px;height:30px;font-size:15px;border-radius:9px}
.grade.big{width:64px;height:64px;font-size:34px;border-radius:18px}
.grade.g-S{background:#8b5cf6}.grade.g-A{background:#0ea5e9}.grade.g-B{background:#16a34a}
.grade.g-C{background:#f59e0b}.grade.g-D{background:#ef4444}
.grade.g-m{background:var(--line);color:var(--muted)}
.rp-hero{display:block}
.rp-grade{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.rp-grade-t{min-width:0}
.rp-grade-t b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.rp-grade-t span{display:block;font-size:19px;font-weight:800;margin-top:2px}
.rp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:12px}
.rp-stats .ci-stat{padding:14px 8px}
.rp-dist{display:block;margin-top:14px}
.rp-bar{display:flex;align-items:center;gap:10px;margin-top:8px}
.rp-g{flex:0 0 24px;height:24px;border-radius:7px;color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rp-bar>i{flex:1;height:8px;border-radius:5px;background:var(--soft);overflow:hidden;display:block}
.rp-bar>i>b{display:block;height:100%;border-radius:5px}
.rp-c{flex:0 0 46px;text-align:right;font-size:12.5px;color:var(--muted)}
.rp-list{display:block}
.rp-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rp-item:last-child{border-bottom:0}
.rp-item:hover{background:var(--soft)}
.rp-main{flex:1;min-width:0}
.rp-main b{display:block;font-size:14px;font-weight:600}
.rp-main span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rp-t{font-size:14px;font-weight:600}
.rp-s{font-size:12px;color:var(--muted);margin-top:2px}
.rp-score{font-size:17px;font-weight:800;flex:0 0 auto}
.rp-acts{flex:0 0 auto}
.rp-legend{display:block;margin-top:6px}
.rp-lg{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rp-lg:last-child{border-bottom:0}
.rp-lg>b{flex:0 0 54px;font-size:13.5px}
.rp-lg>span:last-child{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.rp-crit{font-size:12.5px;color:var(--muted);line-height:1.9}
.rp-crit b{color:var(--fg)}
.rp-styles{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.rp-thumb{width:104px;border:2px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:#fff}
.rp-thumb.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rp-thumb img,.rp-thumb canvas{display:block;width:100%;height:auto}
/* 总体评价（按总正确率折算，和「最高评级」并列） */
.rp-verdict{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border:1px dashed var(--line);border-radius:13px;background:var(--surface)}
.rp-verdict .rp-grade-t b{color:var(--accent);font-size:13px;font-weight:700}
.rp-verdict .rp-grade-t span{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.75;margin-top:3px;display:block}
/* 分模块正确率（跟读 / 中译英 / 听音选词…） */
.stp-head{font-size:14px;font-weight:600;margin:0 0 8px}
.stp-head .hint{font-size:12px;color:var(--muted);font-weight:400}
.stp-list{display:block}
.stp-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.stp-row:last-child{border-bottom:0}
.stp-ic{flex:0 0 20px;display:inline-flex;color:var(--accent)}
.stp-ic svg.ic{width:17px;height:17px}
.stp-n{flex:0 0 78px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp-bar{flex:1;min-width:36px;height:8px;border-radius:5px;background:var(--soft);overflow:hidden;display:block}
.stp-bar>i{display:block;height:100%;border-radius:5px}
.stp-a{flex:0 0 44px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.stp-c{flex:0 0 54px;text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stp-tip{font-size:12.5px;color:var(--muted);margin:2px 0 8px 29px;line-height:1.7}
.stp-weak{margin-top:4px}
.wrong-step{display:inline-flex;align-items:center;gap:3px;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--fg);font-size:11.5px;font-weight:600}
.wrong-step svg.ic{width:12px;height:12px;color:var(--accent)}
/* ---------- 手机端主页：正方形小方块 ---------- */
.mh-hero{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mh-hero-tx{flex:1;min-width:0}
.mh-hero-tx b{display:block;font-size:16px;font-weight:800}
.mh-hero-tx span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.mh-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:12px}
.mh-tile{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:8px 5px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);
  font:inherit;cursor:pointer;transition:.14s;min-width:0;overflow:hidden}
.mh-tile:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.mh-tile .mh-ic{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.mh-tile .mh-ic svg.ic{width:19px;height:19px}
.mh-tile .mh-t{font-size:11.5px;font-weight:600;line-height:1.35;text-align:center;word-break:break-all}
.mh-n{position:absolute;top:-7px;right:-9px;min-width:16px;padding:1px 4px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:9.5px;font-weight:700;font-style:normal;line-height:1.5;text-align:center}
@media (max-width:400px){
  .mh-grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
  .stp-n{flex-basis:64px;font-size:12.5px}
  .stp-c{flex-basis:46px}
}

/* ---------- 评价详情弹窗（uiDialog 的 html 模式） ---------- */
.dlg-b .rd-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dlg-b .rd-head>div{min-width:0}
.dlg-b .rd-head b{display:block;font-size:15px;color:var(--fg)}
/* 只作用于弹窗内右侧的文字说明，避免把同级的 .grade 徽章一起改掉
   （.dlg-b .rd-head span 优先级 0,2,1 会盖过 .grade.big 的 0,2,0，
    导致徽章变成 display:block + font-size:12.5px，字母小到看不见） */
.dlg-b .rd-head>div>span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.7}
.dlg-b .rd-head>.grade{display:inline-flex;flex:none}
.dlg-b .rd-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;line-height:1.7}
.dlg-b .rd-grid>span{color:var(--muted)}
.dlg-b .rd-grid>b{color:var(--fg);font-weight:600;text-align:right}
.dlg-b .rd-words{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;max-height:132px;overflow:auto}
.dlg-b .rd-w{font-size:12px;padding:3px 9px;border-radius:7px;background:var(--soft);color:var(--fg)}
.dlg-b .muted{font-size:12.5px;color:var(--muted);line-height:1.75}

/* 评价弹窗 */
.ev-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ev-wrap canvas{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.ev-row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;width:100%}
@media (max-width:560px){.ev-row .btn{flex:1 1 100%}}

/* 打卡图大图比例 */

.sc-home .h2{display:flex;align-items:center;gap:8px}
.sc-home .h2 svg.ic{width:17px;height:17px;color:var(--accent)}

/* ============ 布局设置（用户可覆盖响应式默认） ============ */
/* 简化布局：侧边栏收成图标导轨（同平板样式） */

html[data-layout="simple"] .sb-brand>span:last-child{display:none}
html[data-layout="simple"] .sb-group-t{display:none}
html[data-layout="simple"] .sb-item{justify-content:center;padding:10px 0;gap:0}
html[data-layout="simple"] .sb-item .sb-t,
html[data-layout="simple"] .sb-item .sb-n{display:none}
html[data-layout="simple"] .sb-item .si{width:auto}
html[data-layout="simple"] .sb-item .si svg.ic{width:20px;height:20px}

html[data-layout="simple"] .h2{font-size:15px}
html[data-layout="simple"] .word-cloud{display:none}
/* ============ 文本标注 ============ */
.text-input{font:inherit;font-size:var(--fs-base);width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:var(--bg);color:var(--fg);transition:.15s;box-sizing:border-box}
.text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.anno-input{width:100%;min-height:180px;resize:vertical;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-family:Georgia,serif;font-size:15.5px;line-height:1.75;box-sizing:border-box;outline:none;transition:.15s}
.anno-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.anno-stats{display:flex;gap:16px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.anno-stats b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.anno-stats-hint{margin-left:auto;font-size:12px}
.anno-result{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:2.1;word-break:break-word;white-space:pre-wrap}
.anno{font-weight:600}
.anno-known{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:2px}
.anno-known:hover{background:var(--accent-soft)}
.anno-unknown{color:var(--no);cursor:pointer;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:3px;border-radius:2px}
.anno-unknown:hover{background:rgba(220,38,38,.1)}
.anno-form{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.anno-lab{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
.anno-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.anno-mrow{display:flex;gap:8px;align-items:center}
.anno-mrow .text-input{flex:1}
.anno-ocr-img{max-width:100%;max-height:320px;border-radius:10px;border:1.5px solid var(--line);display:block;margin-top:12px;background:var(--soft)}
.anno-ocr-st{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.anno-ocr-bar{flex:1;min-width:120px;height:7px;border-radius:999px;background:var(--soft);overflow:hidden}
.anno-ocr-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .18s}
.anno-pane{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.anno-pane h3{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600}
.anno-pane pre{margin:0;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:Georgia,"Times New Roman",serif;font-size:14px;line-height:1.85;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.anno-fixmark{color:var(--accent);font-weight:700;cursor:help;border-bottom:1.5px dotted var(--accent)}
.anno-warn{margin-top:12px;font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:9px;padding:9px 11px;line-height:1.75}
.anno-warn b{color:var(--fg)}
@media(max-width:820px){.anno-pane{grid-template-columns:1fr}}
/* 文本标注：子标签页（纯文本 / 拍照识别各自一页，手机端不再一长条） */
.anno-seg{display:flex;gap:5px;margin:10px 0 14px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.anno-seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.14s;min-width:0}
.anno-seg button .ic{width:16px;height:16px;flex:0 0 auto}
.anno-seg button:hover{color:var(--fg)}
.anno-seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.anno-seg button.on .ic{color:var(--accent)}
.anno-pane-body{min-width:0}
/* 文本标注 · 语音输入（用户第 19 项）：录音中按钮变红 + 图标呼吸；提示走 aria-live */
.btn.anno-voice.rec{border-color:var(--no);color:var(--no);background:rgba(220,38,38,.09)}
.btn.anno-voice.rec .ic{animation:annoRec 1.1s ease-in-out infinite}
@keyframes annoRec{0%,100%{opacity:1}50%{opacity:.3}}
.anno-voice-tip{display:block;margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--muted);min-height:19px}
.anno-voice-tip.bad{color:var(--no)}
.anno-voice-tip.on{color:var(--accent)}
/* 顶栏左上角「返回上一级」：只在二级页出现（首页 / 手机底栏那五屏一律不给） */
.topbar .nav-back{flex:0 0 auto;margin-right:-4px}
/* 图片裁剪 / 框选 */
.crop-outer{text-align:center;margin-top:12px}
.crop-wrap{position:relative;display:inline-block;max-width:100%;border-radius:12px;overflow:hidden;background:#0b1016;border:1.5px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;line-height:0}
.crop-wrap img{display:block;max-width:100%;max-height:min(56vh,460px);width:auto;height:auto;pointer-events:none;-webkit-user-drag:none}
.crop-sel{position:absolute;left:0;top:0;width:100%;height:100%;border:1.5px solid #7dd3fc;border-radius:3px;cursor:move;box-shadow:0 0 0 9999px rgba(6,10,18,.58)}
.crop-h{position:absolute;width:20px;height:20px;border-radius:5px;background:rgba(125,211,252,.95);border:2px solid #0b1016;touch-action:none}
.crop-h.nw{left:0;top:0;cursor:nwse-resize}
.crop-h.ne{right:0;top:0;cursor:nesw-resize}
.crop-h.sw{left:0;bottom:0;cursor:nesw-resize}
.crop-h.se{right:0;bottom:0;cursor:nwse-resize}
.crop-note{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.7}
/* 拖拽上传：桌面端才提示，手机上没有拖拽这回事，省掉这块高度 */
.drop-zone{margin-top:12px;border:1.5px dashed var(--line);border-radius:11px;padding:14px 12px;text-align:center;background:var(--soft);color:var(--muted);font-size:13px;line-height:1.7;transition:border-color .15s,background .15s,color .15s}
.drop-zone b{display:block;color:var(--fg);font-size:13.5px;margin-bottom:2px;font-weight:600}
.drop-zone.over{border-color:var(--accent);color:var(--accent);background:rgba(79,124,255,.08)}
.drop-zone.over b{color:var(--accent)}
@media(max-width:820px){.drop-zone{display:none}}
/* 识别记录 */
.hist-head{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.hist-head .hint{margin-left:auto}
.hist-row{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0;padding-top:4px}
.hist-th{width:52px;height:52px;border-radius:9px;flex:0 0 auto;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.hist-ic{width:52px;height:52px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid var(--line);color:var(--accent)}
.hist-tx{flex:1;min-width:0}
.hist-t{font-size:13.5px;line-height:1.5;color:var(--fg);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist-m{margin-top:4px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.hist-badge{font-size:10.5px;padding:1px 7px;border-radius:99px;font-weight:700;background:var(--soft);color:var(--muted)}
.hist-badge.ocr{background:rgba(56,189,248,.16);color:#0ea5e9}
.hist-act{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.hist-mini{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.hist-mini:hover{border-color:var(--accent);color:var(--accent)}
.hist-mini.danger:hover{border-color:var(--no);color:var(--no)}
.hist-detail pre{margin:8px 0 0;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.8;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--fg)}
.hist-detail img{max-width:100%;max-height:180px;border-radius:9px;border:1px solid var(--line);margin-top:8px}
@media(max-width:820px){
  .anno-input{min-height:130px}
  .anno-stats{gap:12px}
  .anno-stats-hint{display:none}
  .crop-wrap img{max-height:44vh}
  /* 窄屏上「详情 / 删除」竖着排会白白拉高每一行，改成并排 */
  .hist-act{flex-direction:row;gap:6px;align-items:center}
  .hist-mini{padding:5px 9px}
}
@media(max-width:560px){.hist-th,.hist-ic{width:44px;height:44px}}
/* ============ 单词选择器 ============ */
.picker-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.pick-word{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;transition:.13s;font:inherit;color:var(--fg)}
.pick-word:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick-word.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pick-word.anchor{border-color:var(--no);box-shadow:0 0 0 2px var(--accent-line)}
.pick-w{font-family:Georgia,serif;font-weight:700;font-size:15px;word-break:break-word}
.pick-m{font-size:12px;color:var(--muted);line-height:1.35;word-break:break-word}
.pick-badge{font-size:10.5px;padding:1px 7px;border-radius:99px;font-weight:600}
.pick-badge.new{background:var(--soft);color:var(--muted)}
.pick-badge.ok{background:rgba(59,130,246,.14);color:#3b82f6}
.pick-badge.wrong{background:rgba(220,38,38,.13);color:#dc2626}
html[data-dark="true"] .pick-badge.ok{color:#60a5fa}
html[data-dark="true"] .pick-badge.wrong{color:#f87171}
/* ============ 笔记模式 ============ */
.note-stage{display:flex;justify-content:center;padding:12px 0;perspective:1600px}
.note-paper{position:relative;background:#fffdf6;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 34px rgba(15,23,42,.16);overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease;flex:none}
.note-paper-rules{position:absolute;pointer-events:none;z-index:0}
.note-paper-in{position:absolute;inset:0;overflow:hidden;color:#0f172a;z-index:1}
.note-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;font-size:var(--fs-sm)}
.note-grid{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:14px}
.note-num{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.note-auto-tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.nw-cols{display:flex;align-items:flex-start;width:100%}
.nw-col{flex:1 1 0;min-width:0}
.note-num input{width:62px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.note-word{margin-bottom:0;break-inside:avoid}
.nw-row{display:flex;flex-wrap:wrap;align-items:baseline;overflow:hidden}
.nw-gap{display:inline-block;flex:0 0 auto;height:1em}
.nw-w{font-family:Georgia,serif;font-weight:700;font-size:1.1em}
.nw-sep{opacity:.4;padding:0 1px}
.nw-ex,.nw-tr,.nw-syn,.nw-ant,.nw-comp,.nw-verb,.nw-morph{font-size:.95em}
.note-stage.spread{gap:18px;flex-wrap:nowrap}
.note-paper [data-w]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;text-decoration-thickness:1px}
.note-paper .nw-w[data-w]{text-decoration:none}
.note-paper .nw-w[data-w]:hover{text-decoration:underline dotted}
/* 页内子页签（生成+打印 / 预览） */
.note-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
/* 积木编辑器 */
.blk-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:42px;padding:6px 8px;border:1px dashed var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg);transition:border-color .15s,background .15s}
.blk-row.over{border-color:var(--accent);background:var(--accent-soft)}
.blk-lab{font-size:12px;color:var(--muted);flex:0 0 auto}
.blk{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;cursor:grab;user-select:none}
.blk.dragging{opacity:.35}
.blk-pad{width:44px;font:inherit;font-size:12px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.blk-b{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font:inherit;font-size:13px;line-height:1}
.blk-b:hover{color:var(--accent)}
.blk-drop{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:4px 8px;background:none;cursor:pointer}
.blk-drop.over{border-color:var(--accent);color:var(--accent)}
.blk-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.blk-pool .blk{opacity:.75}
.blk-grip{touch-action:none;cursor:grab;color:var(--muted);font-weight:700;padding:0 3px;user-select:none}
.blk-clone{box-shadow:0 8px 22px rgba(15,23,42,.3);opacity:.96;cursor:grabbing}
.blk-clone .blk-b,.blk-clone .blk-pad,.blk-clone .blk-more{display:none}
/* 点积木弹出的操作菜单（手机端没有可靠拖拽，改成点开菜单上下左右移） */
.blk-menu{position:fixed;z-index:9998;min-width:158px;padding:6px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);box-shadow:0 14px 36px rgba(15,23,42,.24);display:flex;flex-direction:column;gap:3px}
.blk-menu[hidden]{display:none}
.blk-menu-t{font-size:11.5px;color:var(--muted);padding:4px 8px 2px}
.blk-mi{font:inherit;font-size:14px;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.blk-mi:hover{background:var(--accent-soft);color:var(--accent)}
.blk-mi.danger{color:var(--no)}
.blk-mi.danger:hover{background:rgba(239,68,68,.12);color:var(--no)}
.blk-more{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font:inherit;font-size:14px;line-height:1}
.blk-more:hover{color:var(--accent)}
.blk-tap-hint{margin:0 0 10px;font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:8px;background:var(--soft)}
.note-pdf-range{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.pk-rand{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.pk-rand input{width:56px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.pk-range-hint{margin:10px 0 0;font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:8px;background:var(--soft)}
.pk-range-hint.on{color:var(--accent);background:var(--accent-soft)}
/* 多维筛选：脚注那一行（命中数 + 重置） */
.pk-filter-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pk-filter-foot b{color:var(--accent)}
@media(max-width:560px){.pk-filter-foot{font-size:12.5px}}
/* 单词语格式预览（一个样例词） */
.note-sample{position:relative;max-width:430px;margin:0 auto;padding:22px 26px;background:#fffdf6;border:1px solid var(--line);border-radius:8px;overflow:auto}
.note-sample-rules{position:absolute;inset:22px 26px;pointer-events:none}
.note-sample-in{position:relative;min-height:60px}
/* 三个等大动作按钮（生成打印页 / 存为PDF / 预览） */
.note-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.note-actions .btn{flex:1 1 0;min-width:130px;justify-content:center}
/* ---------- #15 折叠区（识词页词汇补充 / 单词详情共用；写法与构词法页 mf-item 一致） ---------- */
.fold{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:var(--bg);overflow:hidden}
.fold.open{background:var(--surface)}
.fold-h{width:100%;display:flex;align-items:center;gap:7px;font:inherit;font-size:13.5px;font-weight:700;
  color:var(--fg);padding:10px 12px;background:none;border:0;cursor:pointer;text-align:left;min-width:0}
.fold-h:hover{color:var(--accent)}
.fold-h .ic{width:16px;height:16px;flex:0 0 auto}
.fold-ar{display:inline-flex;align-items:center;color:var(--muted);flex:0 0 auto}
.fold-ar .ic{width:13px;height:13px}
.fold-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-n{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted);flex:0 0 auto}
.fold-b{padding:0 12px 12px;min-width:0}
.fold-b .syn-item:first-child{padding-top:2px}
/* 词汇补充的一行「标签 / 内容」与例句 */
.wx-folds{margin-top:2px}
.wx-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:var(--fs-sm);line-height:1.75;word-break:break-word}
.wx-line b{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--muted)}
.wx-v{flex:1 1 0;min-width:0;word-break:break-word}
.wx-mut{color:var(--muted);font-size:12.5px}
.wx-sep{color:var(--muted)}
.wx-ex{margin-top:2px;padding:9px 12px;border-radius:10px;background:var(--soft)}
.wx-ex-t{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.6;word-break:break-word}
.wx-ex-tr{margin-top:3px;font-size:13px;color:var(--muted);line-height:1.6;word-break:break-word}
.wx-note{position:relative;margin-top:8px;padding:9px 40px 9px 11px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
.wx-note-t{margin:0;font:inherit;font-size:12.5px;line-height:1.65;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.wx-note-del{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;line-height:1}
.wx-note-del:hover{color:var(--no)}
.wx-note-del .ic{width:13px;height:13px}
/* ---------- #10 生成笔记弹层 ---------- */
.nsheet-paper{margin-top:12px;padding:16px 16px;background:#fffdf6;border:1px solid var(--line);border-radius:10px;
  color:#0f172a;font-size:15px;overflow-wrap:anywhere}
.nsheet-paper .nw-row{overflow:visible}
.nsheet-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
/* 三颗按钮在 520px 的弹层里要能挤在一行：靠 nowrap + 收紧内边距，别让「复制到剪贴板」
   被折成「复制到剪贴 / 板」（那是第一版的实拍，很难看） */
.nsheet-acts .btn{flex:1 1 auto;min-width:0;justify-content:center;white-space:nowrap;padding:10px 14px;font-size:13.5px}
.nsheet-acts .btn.on{border-color:var(--ok);color:var(--ok)}
.nsheet-tip{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.6}
/* 单词详情底部那颗「生成这个单词的整块笔记」 */
.m-note-cta{display:flex;margin-top:16px}
.m-note-cta .btn{flex:1 1 auto;min-width:0;justify-content:center;white-space:nowrap;font-size:13.5px}
@media (max-width:640px){
  .fold-h{font-size:14px;padding:11px 10px}
  .fold-b{padding:0 10px 12px}
  .nsheet-paper{padding:13px;font-size:14px}
  .nsheet-acts .btn{flex:1 1 100%;min-width:0}
}
/* 手机端积木编辑器 */
@media (max-width:640px){
  .blk-row{padding:8px;gap:6px}
  .blk{font-size:14px;padding:6px 10px;gap:6px}
  .blk-b{font-size:16px;padding:4px 8px;min-width:30px;min-height:30px}
  .blk-pad{width:56px;font-size:14px;padding:4px 6px}
  .blk-grip{font-size:18px;padding:2px 10px;min-height:30px;display:inline-flex;align-items:center}
  .blk-more{font-size:19px;padding:2px 8px;min-height:30px}
  .blk-menu{min-width:184px}
  .blk-mi{font-size:15px;padding:12px 14px}
  .blk-drop{flex:1 1 100%}
  .note-actions .btn{min-width:0;flex:1 1 100%}
  .note-sample{max-width:100%;padding:16px 16px}
  .note-sample-rules{inset:16px 16px}
}
.fb-qrs{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:16px}
.fb-qr{flex:1 1 150px;max-width:190px;text-align:center}
/* 两张好友码截图长宽比不一样（微信 1.483 / QQ 1.814），原来同宽不同高；
   现在统一成同一个 3:4 的框 + cover，两张卡片就一样大了，二维码本体也都还在框里 */
.fb-qr img{width:100%;aspect-ratio:3/4;height:auto;object-fit:cover;object-position:center;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
.fb-qr-t{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--fg)}
.fb-qr-t .ic{width:16px;height:16px}
/* ---------- 用户第 18 项：娱乐区（娱乐首页 / 宾果 / 老虎机 / 接龙 / 听音猜词） ----------
   一律复用主题变量（--accent / --soft / --line…），不写死颜色，八个主题 + 夜间都跟着走。 */
.fun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.fun-tile{display:flex;flex-direction:column;gap:9px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.fun-tile-t{display:flex;align-items:center;gap:9px;font-weight:700;font-size:var(--fs-base);line-height:1.4}
.fun-tile-ic{flex:0 0 34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.fun-tile p{margin:0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.fun-tile .btn{margin-top:auto;justify-content:center}
.fun-acts{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}
.fun-status{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fun-call{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:var(--fs-base);line-height:1.6}
.fun-call b{font-family:Georgia,serif;font-size:var(--fs-lg)}
.fun-win{margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;letter-spacing:.5px}
/* 宾果卡 */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.bg-cell{font:inherit;font-size:13px;line-height:1.25;min-height:58px;padding:6px 4px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer;word-break:break-word;
  display:flex;align-items:center;justify-content:center;text-align:center;transition:.15s}
.bg-cell:hover{border-color:var(--accent)}
.bg-cell.call{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.bg-cell.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
@media(max-width:560px){
  .bingo{gap:5px}
  .bg-cell{font-size:11.5px;min-height:50px;padding:4px 2px}
}
/* 老虎机 */
.slot-reels{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.slot-reel{flex:1 1 156px;min-width:132px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center}
.slot-w{display:block;font-family:Georgia,serif;font-size:var(--fs-lg);font-weight:700;line-height:1.3;word-break:break-word}
.slot-p{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.slot-m{display:block;font-size:12.5px;margin-top:6px;color:var(--fg);line-height:1.55;word-break:break-word}
.slot-reel.spinning .slot-w{opacity:.5}
.slot-reel .btn{margin-top:9px;justify-content:center}
/* 接龙 / 听音猜词 */
/* 本区里「这一局结束」会把按钮置灰，但全站没有 .btn[disabled] 的样式 ——
   不补这一条，灰不了，看着还像能点（实拍确认过）。 */
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fun-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.fun-in{flex:1 1 200px;min-width:0;font:inherit;font-size:var(--fs-base);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
.fun-in:focus{border-color:var(--accent)}
.fun-cur{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:12px}
.fun-cur b{font-family:Georgia,serif;font-size:var(--fs-lg)}
.fun-need{font-size:12.5px;color:var(--muted)}
.fun-need i{font-style:normal;font-family:Georgia,serif;font-weight:700;color:var(--accent);font-size:var(--fs-lg)}
.fun-msg{margin-top:12px;padding:10px 13px;border-radius:11px;background:var(--soft);font-size:13px;line-height:1.65}
.fun-msg.bad{background:rgba(220,38,38,.10);color:var(--no)}
.fun-msg.good{background:var(--accent-soft);color:var(--accent)}
.ear-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px;margin-top:12px}
.ear-opt{font-family:Georgia,serif;font-weight:600;font-size:var(--fs-base);padding:13px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer;word-break:break-word;transition:.15s}
.ear-opt:hover{border-color:var(--accent)}
.ear-opt.right{border-color:var(--ok);color:var(--ok);background:rgba(22,163,74,.12)}
.ear-opt.wrong{border-color:var(--no);color:var(--no);background:rgba(220,38,38,.12)}
@keyframes funPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.fun-win{animation:funPulse .5s ease 2}
@media print{.sidebar,.topbar,.bottom-nav,.daily-bar,.subnav{display:none!important}}
/* 首屏加载遮罩：vocal.js 有 3MB，加载期间给转圈 + 真实进度，别让用户对着白屏
   注意这里一律用固定色，不能用 --accent / --bg —— 遮罩出现时主脚本还没跑，
   data-theme / data-dark 都还没写到 <html> 上，主题变量这一刻是空的。 */
#boot{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(1000px 560px at 50% -8%,rgba(79,124,255,.20),transparent 62%),#0b1016;
  color:#e6edf3;transition:opacity .34s ease,visibility .34s ease}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
#boot .bt-logo{width:66px;height:66px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  font-size:31px;font-weight:800;color:#fff;background:linear-gradient(140deg,#4f7cff,#8b5cf6 58%,#22d3ee);
  box-shadow:0 16px 38px rgba(79,124,255,.32)}
#boot .bt-name{font-size:19px;font-weight:800;letter-spacing:.6px;text-align:center}
#boot .bt-sub{font-size:13.5px;color:#8b96a5;margin-top:5px;text-align:center;min-height:19px}
#boot .bt-ring{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.13);border-top-color:#4f7cff;
  animation:btSpin .85s linear infinite}
@keyframes btSpin{to{transform:rotate(360deg)}}
#boot .bt-barwrap{width:min(320px,72vw);height:7px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
#boot .bt-bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4f7cff,#22d3ee);transition:width .2s ease}
#boot.indet .bt-bar{width:36%;animation:btIndet 1.15s ease-in-out infinite}
@keyframes btIndet{0%{margin-left:-38%}100%{margin-left:102%}}
#boot .bt-pct{font-size:12.5px;color:#8b96a5;font-variant-numeric:tabular-nums;text-align:center}
#boot .fatal{background:#151b23;border-color:#242c38;color:#e6edf3}
#boot .fatal p{color:#8b96a5}
</style>

<!-- 主脚本不直接执行，而是当惰性源码放在 type="text/plain" 里：
     它的顶层立刻就要读 window.BANK 等（下面第 1 节），所以必须等 vocal.js 真的就位。
     由文档末尾的 #bootLoader 取 textContent 注入执行——这样解析不被 3MB 外部脚本卡住，
     首屏遮罩才画得出来，也才有真实进度。无头测试把 window.__bootSync 置真即可走同步老路。 -->
<script type="text/plain" id="appSrc">
/* ============================================================
   1. 数据层
   ------------------------------------------------------------
   所有词库 / 谚语 / 不规则动词 / 近义 / 反义 / 词根 / 词缀 / 语法
   全部来自 vocal.js（window.*）。
   本文件（index.html）不保存任何词库内容。
   ============================================================ */
if(typeof window.BANK === 'undefined'){
  var _app = document.getElementById('app');
  if(_app){
    _app.innerHTML = '<div class="fatal">'
      + '<div class="fatal-ic"><svg class="ic" style="width:52px;height:52px"><use href="#i-alert"></use></svg></div>'
      + '<h2>未找到 vocal.js 数据文件</h2>'
      + '<p>请确认 <b>vocal.js</b> 与 <b>index.html</b> 在同一个文件夹中，<br>然后刷新页面。</p>'
      + '</div>';
  }
  throw new Error('vocal.js not loaded');
}

var BANK            = window.BANK;
var PROVERBS        = window.PROVERBS        || {};
var IRREGULAR       = window.IRREGULAR       || {};
var VERB_FORMS      = window.VERB_FORMS      || {};
var SYNONYMS        = window.SYNONYMS        || {};
var ANTONYMS        = window.ANTONYMS        || {};
var MORPH           = window.MORPH           || {};
var AFFIX_MEANING   = window.AFFIX_MEANING   || {};
var GRAMMAR         = window.GRAMMAR         || [];
var COMPARATIVES    = window.COMPARATIVES    || {};
var PHRASES         = window.PHRASES         || [];
var WRITING         = window.WRITING         || { patterns:[], elevate:[], templates:[] };
var CN_SYN          = window.CN_SYN          || {};
var MEDIA           = window.MEDIA           || { film:[], book:[] };
var BOOKS           = window.BOOKS           || [];
/* 用户导入的词库（多词库并存，index 0 为内置默认库） */
var USER_LIBS       = [];

/* ------------------------------------------------------------
   图标：全站零 emoji，统一用内联 SVG 精灵
   ------------------------------------------------------------ */
function IC(name, extra){
  return '<svg class="ic"' + (extra ? ' style="' + extra + '"' : '') + ' aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
}
function BRAND_SVG(){
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<rect width="64" height="64" rx="15" fill="var(--accent)"/>'
    + '<text x="32" y="46" font-size="38" font-weight="700" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="var(--accent-fg)">聚</text>'
    + '</svg>';
}
function fillStaticIcons(){
  var list = document.querySelectorAll('[data-ic]');
  for(var i = 0; i < list.length; i++){
    var el = list[i];
    if(el.dataset.icDone) continue;
    el.innerHTML = IC(el.dataset.ic);
    el.dataset.icDone = '1';
  }
  var sb = document.getElementById('sbBrandIc');   if(sb) sb.innerHTML = BRAND_SVG();
  var mb = document.getElementById('mobBrandIc');  if(mb) mb.innerHTML = BRAND_SVG();
}

/* ------------------------------------------------------------
   索引
   ------------------------------------------------------------ */
var DATA = {}, WORD_INDEX = {}, ALL_MAP = new Map();
var LEVELS = [];
for(var _key in BANK){
  if(!BANK[_key] || !BANK[_key].list) continue;
  LEVELS.push(_key);
  var _words = BANK[_key].list.map(function(a){
    return { w:a[0], p:a[1], m:a[2], ex:(a[3] || []).map(function(e){ return { t:e[0], tr:e[1], s:e[2] }; }) };
  });
  DATA[_key] = { name:BANK[_key].name, words:_words };
  _words.forEach(function(w){
    var k = w.w.toLowerCase();
    WORD_INDEX[k] = w;
    if(!ALL_MAP.has(k)) ALL_MAP.set(k, { w:w.w, p:w.p, m:w.m, ex:w.ex, levels:[_key] });
    else ALL_MAP.get(k).levels.push(_key);
  });
}
var ALL_WORDS = Array.from(ALL_MAP.values());
function LEVEL_NAME(k){ return DATA[k] ? DATA[k].name : k; }
function findWord(k){ return WORD_INDEX[String(k || '').toLowerCase()] || null; }
function wordLevels(k){ var it = ALL_MAP.get(String(k || '').toLowerCase()); return it ? it.levels : []; }
function inLevel(k, lv){ return lv === 'all' || wordLevels(k).indexOf(lv) >= 0; }
/* ------------------- 学段（词库）多选（#6） -------------------
   S.levels 是唯一真相源；S.level 只是它的**第一个**，留给还按「单个学段」说话的地方
   （存档格式、评价记录、闯关键、分享包…）。老存档里只有 S.level 一个字符串，
   load() 里补一句 S.levels = [S.level] 就够，零迁移。
   顺序一律按 LEVELS（= BANK 的固定序）来，**不按用户点击顺序**：否则同一批词
   每次点选顺序不同，取词池与分页都会跟着抖。 */
function curLevels(){
  var raw = (Array.isArray(S.levels) && S.levels.length) ? S.levels : [S.level];
  var out = [];
  LEVELS.forEach(function(k){
    if(raw.indexOf(k) >= 0 && DATA[k] && out.indexOf(k) < 0) out.push(k);
  });
  if(!out.length && DATA[S.level]) out.push(S.level);
  if(!out.length && DATA[LEVELS[0]]) out.push(LEVELS[0]);
  return out;
}
/* 把 S.levels / S.level 两个字段对齐（顺序按 BANK 固定序，S.level = 第一个） */
function syncLevel(){
  var lv = curLevels();
  S.levels = lv.slice();
  S.level = lv[0];
  return lv;
}
function levelShortName(){ return curLevels().map(LEVEL_NAME).join(' + '); }
/* 「当前：四级 + 六级（3,100 词）」那种汇总，首页 / 选词器 / 打印页共用 */
function levelSummary(){ return levelShortName() + '（' + curWords().length + ' 词）'; }
/* 当前学段的词池 = 多选学段的**并集**：按 w 小写去重，顺序按 BANK 固定序
   （先走完整个学段再走下一个，同一个词以先出现的那个学段为准）。
   单选时结果与老版逐字相同（就是 DATA[S.level].words）。 */
function curWords(){
  var out = [], seen = {};
  curLevels().forEach(function(k){
    var ws = (DATA[k] && DATA[k].words) || [];
    for(var i = 0; i < ws.length; i++){
      var w = ws[i];
      var key = String((w && w.w) || '').toLowerCase();
      if(!key || seen[key]) continue;
      seen[key] = 1;
      out.push(w);
    }
  });
  return out;
}
/* 点学段芯片：多选开关。点掉最后一个时**拒绝并提示**（不自动补一个 ——
   自动补会让人以为「点了没反应」）；返回是否真的改了，调用方据此决定要不要重画。 */
function toggleLevel(k){
  if(!DATA[k]) return false;
  var lv = curLevels();
  var i = lv.indexOf(k);
  if(i >= 0){
    if(lv.length <= 1){ toast('至少要留一个词库'); return false; }
    lv.splice(i, 1);
  }else{
    lv.push(k);
  }
  S.levels = lv.slice();
  syncLevel();
  save();
  return true;
}
/* 学段多选芯片的公共 HTML（首页与选词器共用同一套口径与文案） */
function levelChipsHTML(id){
  var on = curLevels();
  return '<div class="chips" id="' + id + '">'
    + visibleLevels().map(function(k){
        var isOn = on.indexOf(k) >= 0;
        var cnt = (DATA[k] && DATA[k].words) ? DATA[k].words.length : 0;
        return '<button class="chip ' + (isOn ? 'on' : '') + '" data-lv="' + k + '" aria-pressed="' + (isOn ? 'true' : 'false') + '" title="点一下开 / 关这个词库">'
          + escapeHtml(LEVEL_NAME(k)) + '<span class="n">' + cnt + '</span></button>';
      }).join('')
    + '</div>';
}

/* ------------------------------------------------------------
   附表：谚语 / 不规则动词 的学段标签（7 档）
   ------------------------------------------------------------ */
var LV_TABS = [
  { k:'primary',    name:'小学', ic:'sprout' },
  { k:'junior',     name:'初中', ic:'leaf'   },
  { k:'senior',     name:'高中', ic:'tree'   },
  { k:'cet4',       name:'四级', ic:'target' },
  { k:'cet6',       name:'六级', ic:'flame'  },
  { k:'kaoyan',     name:'考研', ic:'bolt'   },
  { k:'university', name:'大学', ic:'grad'   }
];
/* 词库档（用于按学段筛选浏览） */
var BANK_TABS = [
  { k:'all',      name:'全部' },
  { k:'primary',  name:'小学' },
  { k:'junior',   name:'初中' },
  { k:'senior',   name:'高中' },
  { k:'cet4',     name:'四级' },
  { k:'cet6',     name:'六级' },
  { k:'kaoyan',   name:'考研' }
];

/* ------------------------------------------------------------
   学习流程
   ------------------------------------------------------------ */
var STEPS = {
  read:   { name:'朗读认知', ic:'volume',     desc:'点击卡片朗读，看意思与读法' },
  cn2en:  { name:'中译英',   ic:'translate',  desc:'给出中文，写出英文单词' },
  en2cn:  { name:'英译中',   ic:'bookopen',   desc:'给出英文，写出中文意思' },
  listen: { name:'听音选词', ic:'headphones', desc:'听发音，从四个选项中选出单词' },
  spell:  { name:'拼写',     ic:'pencil',     desc:'看中文释义，拼写出英文单词' },
  sent:   { name:'句子选词', ic:'file',       desc:'看句子语境，选出正确单词' },
  shadow: { name:'跟读训练', ic:'mic',        desc:'听示范发音后自己跟读，验证发音' }
};
var STEP_ORDER = ['read', 'cn2en', 'en2cn', 'listen', 'shadow'];
function STEP_LABEL(k){ return STEPS[k] ? STEPS[k].name : k; }
function STEP_ICON(k){ return STEPS[k] ? IC(STEPS[k].ic) : ''; }

/* ------------------------------------------------------------
   词条附属信息读取
   ------------------------------------------------------------ */
function getPOS(w){ var m = String(w.m || '').match(/^([a-zA-Z]+)\./); return m ? m[1].toLowerCase() : ''; }
function getVerbForm(w){
  var k = String(w.w || w).toLowerCase();
  if(VERB_FORMS[k]) return VERB_FORMS[k];
  var ir = (S && S.extras && S.extras.irregular) || [];
  for(var i = 0; i < ir.length; i++){ if(String(ir[i].b).toLowerCase() === k) return [ir[i].p, ir[i].pp]; }
  return null;
}
/* ------------------------------------------------------------
   词形（批次 A · #9）：过去式 / 过去分词 / 现在分词 / 三单
   ------------------------------------------------------------
   用户原话：「单纯过去式或现在分词会被作为新单词，仅展示原型，
   除非过去式是新的词」。因此这里有且只有两件事：

   ① 认形 —— 给一个原型，列出它所有屈折形。三处共用：
        · 判分（formAccepted / grammarAnswerOk）：原型与屈折形都算对；
        · 出题（wordFormInSentence / blankWordInSentence）：只抹这一句里真实出现的那个形；
        · 认词（annoVerbBaseMap）：running / goes 这类形回到原型，不再当成新词。
   ② 分家 —— 某个屈折形本身在词库里也是一条独立词条（findWord 查得到、又不是同一个词，
      例如 lay 对 lie、annoyed 对 annoy），按独立词处理，不进这张表。

   数据来源优先级：IRREGULAR（含用户自加的不规则动词）→ VERB_FORMS（本工程从词库自动
   派生的 3013 条，里面混着 accepted → accepteded 这种自己叠自己的脏数据，由
   _plausibleForm 挡掉）→ 规则补齐（VERB_FORMS 只给过去式/过去分词，
   现在分词与三单只能靠规则）。

   ⚠ 现在分词的「双写辅音」是猜的：单音节（run → running）直接双写；多音节双写不一定
   （visit → visiting 对、begin → beginning 错），这时**两种拼法都收但标 weak**。
   weak 只用于「认词」与「判分放宽」，绝不拿去当完形填空的选项 ——
   选项里出现 visitting 这种拼法是硬伤。详见 formOfKind。
   ------------------------------------------------------------ */
/* 答案归一化（#2 与 #9 共用这一份）：连续空白（含全角空格 U+3000、不换行空格 U+00A0）
   压成一个半角空格，去掉首尾空白，再整体小写。
   listen / sent 的值来自选项按钮或语音识别结果，常带首尾空格 —— 以前这两步直接
   value === word.w，所以「看起来一模一样的答案」被判错（批次 A · #2）。 */
function normAnswer(v){
  return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().toLowerCase();
}
var _inflCache = {};
function _inflIsVowel(ch){ return 'aeiou'.indexOf(ch) >= 0; }
function _inflSyllables(w){
  var n = 0, prev = false;
  for(var i = 0; i < w.length; i++){
    var v = _inflIsVowel(w.charAt(i));
    if(v && !prev) n++;
    prev = v;
  }
  return n;
}
/* 词尾是「一个辅音 + 一个元音 + 一个辅音」（且末辅音不是 w/x/y）：可能双写 */
function _inflCvc(w){
  return w.length >= 3 && /[^aeiou][aeiou][^aeiouwxy]$/.test(w);
}
function _inflPastRule(base){
  if(/e$/.test(base)) return base + 'd';
  if(/[^aeiou]y$/.test(base)) return base.slice(0, -1) + 'ied';
  if(_inflCvc(base) && _inflSyllables(base) === 1) return base + base.slice(-1) + 'ed';
  return base + 'ed';
}
/* 现在分词：返回数组；多音节双写不确定时给两种拼法，并标 weak */
function _inflIngRule(base){
  if(/ie$/.test(base)) return [{ f:base.slice(0, -2) + 'ying', weak:false }];
  if(/e$/.test(base) && !/ee$/.test(base)) return [{ f:base.slice(0, -1) + 'ing', weak:false }];
  if(_inflCvc(base)){
    if(_inflSyllables(base) === 1) return [{ f:base + base.slice(-1) + 'ing', weak:false }];
    return [{ f:base + 'ing', weak:true }, { f:base + base.slice(-1) + 'ing', weak:true }];
  }
  return [{ f:base + 'ing', weak:false }];
}
function _inflSRule(base){
  if(/[^aeiou]y$/.test(base)) return base.slice(0, -1) + 'ies';
  if(/(s|x|z|ch|sh|o)$/.test(base)) return base + 'es';
  return base + 's';
}

    for(var j = 0; j < q.size; j++){
      if(!q.m[i][j]) continue;
      var px = x + (j + quiet) * unit, py = y + (i + quiet) * unit;
      ctx.fillRect(Math.floor(px), Math.floor(py), Math.ceil(unit), Math.ceil(unit));

  }

  for(var i = 0; i < q.size; i++){
    for(var j = 0; j < q.size; j++){

    ['syn', 'ant'].forEach(function(k){
      if(!S.extras[k] || typeof S.extras[k] !== 'object') S.extras[k] = {};
    });
    if(!Array.isArray(S.activeLibs) || !S.activeLibs.length) S.activeLibs = ['default'];
    if(!Array.isArray(S.flow) || !S.flow.length) S.flow = DEFAULT_FLOW.slice();
    if(!DATA[S.level]) S.level = LEVELS[0];
    /* 学段多选与单值对齐：S.level 必须是 S.levels 里的第一个（BANK 固定序） */
    syncLevel();
  }catch(e){
    /* 存档读不出来（或者读出来但恢复中途炸了）：**先把原始字符串另存一份，再说话**。
       这里绝不重新抛、也绝不静默 —— 2026-10-20 之前这里是空的 catch(e){}，
       用户看到的是「一觉醒来进度全没了，还一句提示都没有」。 */
    _loadBadWhy = 'parse';
    try{ if(JSON.parse(localStorage.getItem(LS_KEY))) _loadBadWhy = 'restore'; }catch(e2){ _loadBadWhy = 'parse'; }
    _loadBadKey = loadBadBackup();
  }
  /* 下面两段**必须留在这个 catch 之外、各带自己的 try**：
     它们恢复的是用户的显示设置，一旦被上面任何一步的异常连坐吞掉，读回来的就是默认值。
     （note_assert 从 57/57 掉到 47/57 就是这么来的：load() 里新加的一步抛错，
     一直挂在同一个 try 里的 noteApplySavedOpts 一次都没跑过，10 条全在报「读回默认值」。）
     顺序与原来一致：先笔记设置，再拓展词库并表。
     笔记设置：以前从来没存过，所以老存档里一定没有这一项 ——
     noteApplySavedOpts 只在真有时才动手，没有就保留 noteOpts 的当前值；
     有的话逐项夹到合法区间（老配置里的 trans 会被映射成 meaning）。 */
  if(d && d.noteOpts && typeof noteApplySavedOpts === 'function'){
    try{ noteApplySavedOpts(d.noteOpts); }catch(e){}
  }
  if(d && typeof applyExtras === 'function'){
    try{ applyExtras(); }catch(e){}
  }
}

function speak(text, lang){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var rate = S.settings.speechRate || 1;
    if(lang === 'cn'){
      u.lang = 'zh-CN'; u.rate = Math.max(0.5, Math.min(2, 0.95 * rate));
      var v = _voices.filter(function(x){ return /zh[-_]CN/i.test(x.lang); })[0]
           || _voices.filter(function(x){ return /^zh/i.test(x.lang); })[0];
      if(v) u.voice = v;
    }else{
      /* 口音（#3a）：默认美式；设置里选「英式」就换 en-GB。
         找不到对应口音的 voice 时退回任意英文 voice —— 但 u.lang 仍是用户选的那一种，
         这样浏览器至少还会用该口音的默认发音，绝不静默不出声。 */
      var wantUK = !!(S.settings && S.settings.speechAccent === 'uk');
      u.lang = wantUK ? 'en-GB' : 'en-US';
      u.rate = Math.max(0.5, Math.min(2, 0.85 * rate));
      var accentRe = wantUK ? /en[-_]GB/i : /en[-_]US/i;
      var v2 = _voices.filter(function(x){ return accentRe.test(x.lang); })[0]
            || _voices.filter(function(x){ return /^en/i.test(x.lang); })[0];
      if(v2) u.voice = v2;
    }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ------------------------------------------------------------
   跟读训练：语音识别
   ------------------------------------------------------------ */
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function normSpeech(s){
  return String(s || '').toLowerCase().replace(/[^a-z']/g, '');
}
function levDist(a, b){
  a = normSpeech(a); b = normSpeech(b);
  var m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  var d = [], i, j;
  for(i = 0; i <= m; i++){ d[i] = [i]; }
  for(j = 0; j <= n; j++){ d[0][j] = j; }
  for(i = 1; i <= m; i++){
    for(j = 1; j <= n; j++){
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
  }
  return d[m][n];
}
function shadowMatch(input, word){
  var a = normSpeech(input), b = normSpeech(word);
  if(!a) return false;
  if(a === b) return true;
  if(a.indexOf(b) >= 0) return true;
  return levDist(a, b) <= 1;
}
/* 按住跟读：只有按住按钮才开始识别，松手才判定。
   旧版是「点一下就自动开始」，浏览器在静音几秒后会自己结束识别并把结果交回来，
   用户根本不知道自己按上没有，答案就已经被判定了。
   现在按下有明确的按下特效 + 计时 + 实时字幕；松手之前绝不提交；没听清就提示重来。 */
var _shadowHold = null;
function shadowHoldFinalize(h, text){
  if(!h || h.done) return;
  h.done = true;
  if(h.grace) clearTimeout(h.grace);
  if(h.timer) clearInterval(h.timer);
  try{ if(h.rec && h.rec.stop) h.rec.stop(); }catch(e){}
  if(h.btn) h.btn.classList.remove('holding');
  if(h.tip) h.tip.classList.remove('on');
  if(text){
    if(h.st) h.st.textContent = '识别结果：' + text;
    if(h.tip) h.tip.textContent = '判定中…';
    submitAnswer(text);
  }else{
    if(h.st) h.st.textContent = '';
    if(h.tip){ h.tip.textContent = '没听清，请按住按钮再说一次'; h.tip.classList.add('on'); }
  }
}
function shadowHoldStop(reason){
  var h = _shadowHold;
  if(!h) return;
  _shadowHold = null;
  if(h.timer){ clearInterval(h.timer); h.timer = null; }
  if(h.btn) h.btn.classList.remove('holding');
  h.released = true;
  h.reason = reason || 'up';
  try{ if(h.rec && h.rec.stop) h.rec.stop(); }catch(e){}
  /* 松手后留一点时间等最后一次识别结果回来；空结果不提交 */
  h.grace = setTimeout(function(){ shadowHoldFinalize(h, (h.text || '').trim()); }, 900);
}
function bindShadowHold(btn, tip, st){
  if(!btn) return;
  function start(e){
    if(e && e.preventDefault) e.preventDefault();
    if(_shadowHold) return;
    if(!speechSupported()){ toast('此浏览器不支持语音识别，请使用 Chrome / Edge'); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var h = { btn:btn, tip:tip, st:st, text:'', done:false, released:false, t0:Date.now(), rec:null, timer:null, grace:null };
    try{
      var r = new SR();
      r.lang = 'en-US';
      r.interimResults = true;
      r.continuous = true;
      r.maxAlternatives = 3;
      r.onresult = function(ev){
        var s = '';
        for(var i = 0; i < ev.results.length; i++){
          if(ev.results[i] && ev.results[i][0]) s += ev.results[i][0].transcript + ' ';
        }
        h.text = s.replace(/\s+/g, ' ').trim();
        if(h.st) h.st.textContent = h.text ? ('听到：' + h.text) : '';
      };
      r.onerror = function(ev){
        var err = ev && ev.error;
        if(err === 'not-allowed' || err === 'service-not-allowed') toast('麦克风被拒绝，请在浏览器里允许麦克风');
        else if(err && err !== 'no-speech' && err !== 'aborted') toast('识别失败：' + err);
      };
      r.onend = function(){
        h.rec = null;
        if(h.released && !h.done) shadowHoldFinalize(h, (h.text || '').trim());
      };
      h.rec = r;
      r.start();
    }catch(err){ toast('无法启动语音识别'); return; }
    _shadowHold = h;
    btn.classList.add('holding');
    if(tip){ tip.classList.add('on'); tip.textContent = '● 正在聆听 0.0 秒 · 松手结束判定'; }
    h.timer = setInterval(function(){
      if(!btn.isConnected){ shadowHoldStop('detached'); return; }
      var sec = (Date.now() - h.t0) / 1000;
      if(tip) tip.textContent = '● 正在聆听 ' + sec.toFixed(1) + ' 秒 · 松手结束判定';
      if(sec > 15) shadowHoldStop('timeout');   /* 最多 15 秒，避免一直按着不放 */
    }, 100);
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
  }
  function end(e){
    if(e && e.preventDefault) e.preventDefault();
    if(!_shadowHold) return;
    shadowHoldStop('up');
  }
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  btn.addEventListener('dragstart', function(e){ e.preventDefault(); });
  /* 键盘可达：按住空格 / 回车开始，松开判定 */
  btn.addEventListener('keydown', function(e){ if((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
  btn.addEventListener('keyup', function(e){ if(e.key === ' ' || e.key === 'Enter') end(e); });
}

function favId(item){
  if(item.type === 'word') return 'word|' + item.key;
  if(item.type === 'ex') return 'ex|' + item.key + '|' + item.en;
  if(item.type === 'proverb') return 'proverb|' + item.en;
  if(item.type === 'rel') return 'rel|' + item.key + '|' + item.w;
  if(item.type === 'phrase') return 'phrase|' + item.en;
  return 'x|' + JSON.stringify(item);
}
function findFav(item){
  var id = favId(item), i = -1;
  S.favs.forEach(function(f, idx){ if(favId(f) === id) i = idx; });
  return i;
}

function addWrongWord(word, m){
  var w = findWord(word);

  var mm = m || (w ? w.m : '');

  S.wrong.forEach(function(x){ if(x.w && String(x.w).toLowerCase() === nm.toLowerCase() && x.step === 'manual') exist = x; });
  if(exist){ exist.time = Date.now(); exist.count = (exist.count || 1) + 1; toast('错题本里已有这个词'); return; }
  S.wrong.unshift({ w:nm, m:mm, step:'manual', your:'', correct:mm, time:Date.now(), count:1 });

function noteAnswer(word, ok){
  var k = String(word || '').toLowerCase();
  if(!k) return;
  if(!S.seen[k]) S.seen[k] = { ok:0, bad:0 };
  if(ok) S.seen[k].ok++; else S.seen[k].bad++;
  S.seen[k].t = Date.now();
  save();
}

  if(s && s.bad > 0) return 'wrong';
  if(s && s.ok > 0) return 'ok';
  return 'new';
}

    + '<div class="dlg-f">'
    +   (o.cancelText === '' ? '' :
          '<button class="btn ghost" id="dlgCancel">' + escapeHtml(o.cancelText || '取消') + '</button>')
    +   '<button class="btn' + (warn ? ' danger' : '') + '" id="dlgOk">' + escapeHtml(o.okText || '确定') + '</button>'
    + '</div>';
  mask.classList.remove('hidden');
  var inp = $('#dlgInput');
  if(inp) setTimeout(function(){ inp.focus(); inp.select(); }, 30);
  function done(ok){
    var val = inp ? inp.value.trim() : '';
    closeDialog();
    if(ok){ if(o.onOk) o.onOk(val); } else if(o.onCancel) o.onCancel();
  }
  $('#dlgOk').onclick = function(){ done(true); };
  var c = $('#dlgCancel'); if(c) c.onclick = function(){ done(false); };
  mask.onclick = function(e){ if(e.target === mask) done(false); };
  _dlgOnKey = function(e){
    if(e.key === 'Escape') done(false);
    else if(e.key === 'Enter' && (!inp || document.activeElement === inp)) done(true);
  };
  document.addEventListener('keydown', _dlgOnKey);
}
