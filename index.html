<!DOCTYPE html>
<html lang="zh-CN" data-theme="sky" data-dark="false" data-fs="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聚合英语 · 单词学习</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230ea5e9'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='700' font-family='PingFang SC,Microsoft YaHei,sans-serif' text-anchor='middle' fill='white'%3E%E8%81%9A%3C/text%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0ea5e9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="聚合英语">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html{
  --bg:#fff;--surface:#fff;--fg:#0f1419;--muted:#7b8494;--line:#e8ecf1;--soft:#f6f8fb;
  --ok:#16a34a;--no:#dc2626;--radius:14px;--star:#f59e0b;
  --fs-base:15px;--fs-sm:13px;--fs-lg:17px;--fs-word:38px;--fs-q:26px;
}
html[data-fs="small"] { --fs-base:13.5px;--fs-sm:12px;--fs-lg:15px;--fs-word:30px;--fs-q:21px; }
html[data-fs="normal"]{ --fs-base:15px;  --fs-sm:13px;--fs-lg:17px;--fs-word:38px;--fs-q:26px; }
html[data-fs="large"] { --fs-base:16.5px;--fs-sm:14px;--fs-lg:19px;--fs-word:44px;--fs-q:30px; }
html[data-fs="xlarge"]{ --fs-base:18.5px;--fs-sm:15.5px;--fs-lg:21px;--fs-word:52px;--fs-q:34px; }
html[data-theme="sky"]  { --accent:#0ea5e9;--accent-fg:#fff;--accent-soft:#e7f5fd;--accent-line:#b7dff4; }
html[data-theme="green"]{ --accent:#10b981;--accent-fg:#fff;--accent-soft:#e6f8f1;--accent-line:#a9e7cd; }
html[data-theme="pink"] { --accent:#ec4899;--accent-fg:#fff;--accent-soft:#fdebf4;--accent-line:#f9bcd9; }
html[data-theme="mono"] { --accent:#18181b;--accent-fg:#fff;--accent-soft:#f2f2f4;--accent-line:#d4d4d8; }
html[data-theme="violet"]{ --accent:#8b5cf6;--accent-fg:#fff;--accent-soft:#f1ecfe;--accent-line:#d3c4fb; }
html[data-theme="amber"] { --accent:#f59e0b;--accent-fg:#fff;--accent-soft:#fef4e2;--accent-line:#f8d99a; }
html[data-theme="teal"]  { --accent:#0d9488;--accent-fg:#fff;--accent-soft:#e3f5f3;--accent-line:#a3dbd6; }
html[data-theme="slate"] { --accent:#475569;--accent-fg:#fff;--accent-soft:#eef1f5;--accent-line:#c7d0db; }
html[data-dark="true"]{
  --bg:#0d1117;--surface:#151b23;--fg:#e6edf3;--muted:#8b96a5;--line:#242c38;--soft:#1a222c;
  --ok:#3fb950;--no:#f85149;--accent-fg:#0b1016;--star:#fbbf24;
}
html[data-dark="true"][data-theme="sky"]  { --accent:#38bdf8;--accent-soft:rgba(56,189,248,.14);--accent-line:rgba(56,189,248,.34); }
html[data-dark="true"][data-theme="green"]{ --accent:#34d399;--accent-soft:rgba(52,211,153,.14);--accent-line:rgba(52,211,153,.34); }
html[data-dark="true"][data-theme="pink"] { --accent:#f472b6;--accent-soft:rgba(244,114,182,.14);--accent-line:rgba(244,114,182,.34); }
html[data-dark="true"][data-theme="mono"] { --accent:#f4f4f5;--accent-soft:rgba(244,244,245,.12);--accent-line:rgba(244,244,245,.30); }
html[data-dark="true"][data-theme="violet"]{ --accent:#a78bfa;--accent-soft:rgba(167,139,250,.14);--accent-line:rgba(167,139,250,.34); }
html[data-dark="true"][data-theme="amber"] { --accent:#fbbf24;--accent-soft:rgba(251,191,36,.14);--accent-line:rgba(251,191,36,.34); }
html[data-dark="true"][data-theme="teal"]  { --accent:#2dd4bf;--accent-soft:rgba(45,212,191,.14);--accent-line:rgba(45,212,191,.34); }
html[data-dark="true"][data-theme="slate"] { --accent:#94a3b8;--accent-soft:rgba(148,163,184,.16);--accent-line:rgba(148,163,184,.34); }
/* 背景柔和光色（仅日间模式生效） */
html[data-bg="cream"]:not([data-dark="true"]){ --bg:#faf6ec; }
html[data-bg="green"]:not([data-dark="true"]){ --bg:#f0f7f1; }
html[data-bg="blue"]:not([data-dark="true"]){ --bg:#eef5fb; }
html[data-bg="pink"]:not([data-dark="true"]){ --bg:#fdf3f7; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);line-height:1.65;font-size:var(--fs-base);
  transition:background .25s,color .25s;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
/* ============ 图标 ============ */
svg.ic{
  width:1em;height:1em;display:inline-block;vertical-align:-.14em;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  flex:0 0 auto;pointer-events:none;
}
.si svg.ic,.bi svg.ic{width:19px;height:19px;vertical-align:middle}
.sb-brand svg.ic,.mob-brand svg.ic{width:26px;height:26px;stroke-width:1.7}
.icon-btn{
  border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:9px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px;transition:.15s;
}
.icon-btn:hover{background:var(--soft);color:var(--accent)}
.si{display:inline-flex;align-items:center;justify-content:center}
.app{display:flex;min-height:100vh}
/* ============ 侧边栏（平板/电脑） ============ */
.sidebar{
  width:224px;flex:0 0 224px;border-right:1px solid var(--line);background:var(--surface);
  padding:18px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sb-brand{display:flex;align-items:center;gap:9px;padding:6px 10px 18px;font-weight:700;font-size:15px}
.sb-brand .brand-ic{width:28px;height:28px;border-radius:8px;flex:0 0 auto;overflow:hidden;display:block}
.sb-brand .brand-ic svg{width:100%;height:100%;display:block}
.sb-brand small{color:var(--muted);font-weight:400;font-size:11.5px;display:block;letter-spacing:.2px}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;
  color:var(--muted);font-size:var(--fs-sm);font-weight:500;transition:.15s;border:0;background:transparent;
  font-family:inherit;text-align:left;width:100%;
}
.sb-item:hover{background:var(--soft);color:var(--fg)}
.sb-item.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.sb-item .si{width:18px;flex:0 0 auto}
.sb-dark{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 11px 4px}
.sb-dark button{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;
  padding:7px 12px;border-radius:9px;font-size:var(--fs-sm);font-family:inherit;flex:1;transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.sb-dark button:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:12px;transition:background .25s;
}
@supports (backdrop-filter: blur(10px)){.topbar{background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px)}}
.topbar .t-title{font-weight:700;font-size:15px}
.topbar .spacer{margin-left:auto}
.mob-brand{display:none;align-items:center;gap:8px;font-weight:700;font-size:14px}
.mob-brand .brand-ic{width:24px;height:24px;border-radius:7px;overflow:hidden;display:block}
.mob-brand .brand-ic svg{width:100%;height:100%;display:block}
.content{max-width:880px;width:100%;margin:0 auto;padding:18px 18px 40px;flex:1}
/* ============ 每日谚语栏 ============ */
.daily-bar{
  position:fixed;left:224px;right:0;bottom:0;z-index:26;
  background:var(--surface);border-top:1px solid var(--line);
  padding:7px 18px;display:flex;align-items:center;gap:14px;font-size:var(--fs-sm);
  box-shadow:0 -2px 12px rgba(0,0,0,.03);
}
@supports (backdrop-filter: blur(10px)){.daily-bar{background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(12px)}}
.dq-wrap{flex:1;min-width:0;display:flex;gap:10px;align-items:baseline;cursor:pointer;padding:3px 0}
.dq-wrap:hover{color:var(--accent)}
.dq-en{font-family:Georgia,serif;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.dq-cn{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.dq-play{flex:0 0 auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:3px;display:inline-flex}
.dq-time{flex:0 0 auto;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;display:flex;gap:5px;align-items:center}
.dq-time .lab{color:var(--muted);font-weight:400;font-size:11.5px}
/* ============ 底部导航（手机） ============ */
.bottom-nav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 16px rgba(0,0,0,.04);
}
@supports (backdrop-filter: blur(10px)){.bottom-nav{background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(12px)}}
.bottom-nav .bn-inner{display:flex;justify-content:flex-start;gap:2px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 auto;padding:0 8px}
.bottom-nav .bn-inner::-webkit-scrollbar{display:none}
.bn-item{
  flex:0 0 auto;border:0;background:transparent;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;min-width:54px;
  font-family:inherit;font-size:10.5px;font-weight:500;border-radius:9px;transition:.15s;position:relative;
}
.bn-item .bi{font-size:20px;line-height:1;display:inline-flex}
.bn-item .bn-n{position:absolute;top:1px;right:2px;background:var(--accent);color:var(--accent-fg);font-size:9px;font-weight:700;line-height:1;padding:2px 4px;border-radius:7px;min-width:14px;text-align:center}
.bn-item.on{color:var(--accent);background:var(--accent-soft)}
/* 「小方块主页」模式：底栏只有五项，平铺撑满、均匀分布（默认那套是左对齐 + 横向滚动，五项时会挤在左边） */
.bottom-nav .bn-inner.bn-grid{justify-content:space-between;gap:0;overflow-x:visible;padding:0 2px}
.bottom-nav .bn-inner.bn-grid .bn-item{flex:1 1 0;min-width:0;padding-left:2px;padding-right:2px;max-width:96px}
/* ============ 卡片 ============ */
.card{border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;background:var(--surface);transition:background .25s,border-color .25s;animation:cardIn .28s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.h2{font-size:var(--fs-sm);font-weight:700;margin:0 0 14px;letter-spacing:.5px;color:var(--fg)}
.h2 .hint{font-weight:400;color:var(--muted);margin-left:6px;letter-spacing:0}
.muted{color:var(--muted);font-size:var(--fs-sm);margin:10px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.center{text-align:center}
.divider{height:1px;background:var(--line);margin:16px 0}
/* ============ 按钮 ============ */
.btn{font:inherit;font-size:var(--fs-base);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 20px;border-radius:10px;cursor:pointer;transition:.15s;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{color:var(--muted)}
.btn.big{width:100%;padding:15px;font-size:var(--fs-lg);font-weight:600}
.btn.sm{padding:7px 14px;font-size:var(--fs-sm);border-radius:8px}
/* ============ 横向标签页 ============ */
.tabs-h{
  display:flex;gap:4px;background:var(--soft);
  padding:4px;border-radius:12px;margin-bottom:16px;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
.tabs-h::-webkit-scrollbar{display:none}
.th-item{
  flex:1 0 auto;min-width:72px;
  border:0;background:transparent;
  padding:9px 16px;border-radius:9px;cursor:pointer;
  font:inherit;font-size:var(--fs-sm);font-weight:600;
  color:var(--muted);transition:.15s;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.th-item:hover{color:var(--fg)}
.th-item.on{
  background:var(--surface);color:var(--accent);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.th-item .cnt{font-size:11px;opacity:.6;font-weight:400}
/* ============ 标签面板 ============ */
.panel{display:none}
.panel.on{display:block;animation:panelIn .24s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* ============ 谚语列表 ============ */
.pv-item{border-bottom:1px solid var(--line);padding:13px 0;position:relative;padding-right:72px}
.pv-item:last-child{border-bottom:0}
.pv-en{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.75;color:var(--fg)}
.pv-cn{font-size:var(--fs-sm);color:var(--muted);margin-top:4px;line-height:1.7}
.pv-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11px;line-height:1.6;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);vertical-align:1px}
.pv-play{position:absolute;top:13px;right:0;border:0;background:var(--soft);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s}
.pv-play:hover{background:var(--accent-soft);color:var(--accent)}
.pv-acts{position:absolute;top:13px;right:38px;display:flex;gap:4px}
.pv-acts .dict-act{width:30px;height:30px;border-radius:8px}
.pv-acts .dict-act svg.ic{width:15px;height:15px}
/* ============ 不规则动词表 ============ */
.irr-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.irr-table th{text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--line);color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.3px}
.irr-table td{padding:10px 8px;border-bottom:1px solid var(--line);font-family:Georgia,serif;font-size:var(--fs-base)}
.irr-table tr:last-child td{border-bottom:0}
.irr-table tr:hover td{background:var(--soft)}
.irr-table .ic-base{font-weight:700;color:var(--accent);cursor:pointer;font-family:Georgia,serif}
.irr-table .ic-base:hover{text-decoration:underline}
.irr-table .ic-cn{font-family:-apple-system,sans-serif;color:var(--muted);font-size:12.5px}
/* 变形列（过去式 / 过去分词 / 比较级 / 最高级 / 复数）：点一下看原形详情 */
.irr-table .ic-infl{color:var(--fg);cursor:pointer;border-bottom:1px dashed transparent;transition:.12s}
.irr-table .ic-infl:hover{color:var(--accent);border-bottom-color:var(--accent)}
/* ============ 单复数 · 变化类型筛选 ============ */
.pl-rules{display:flex;flex-wrap:wrap;gap:8px}
.pl-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font:inherit;font-size:var(--fs-sm);cursor:pointer;transition:.15s;white-space:nowrap}
.pl-chip svg.ic{width:14px;height:14px;color:var(--muted)}
.pl-chip:hover{border-color:var(--accent);color:var(--accent)}
.pl-chip:hover svg.ic{color:var(--accent)}
.pl-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pl-chip.on svg.ic{color:var(--accent)}
.pl-chip .cnt{font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 7px;line-height:1.5}
.pl-rule{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-family:-apple-system,sans-serif;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pl-rule.pl-irr{background:#fef3c7;color:#92400e}
.pl-rule.pl-same{background:#e0e7ff;color:#3730a3}
.pl-rule.pl-ves,.pl-rule.pl-fs{background:#dbeafe;color:#1e40af}
.pl-rule.pl-oes,.pl-rule.pl-os{background:#dcfce7;color:#166534}
.pl-rule.pl-ies,.pl-rule.pl-es{background:#f3e8ff;color:#6b21a8}
[data-theme="dark"] .pl-rule.pl-irr{background:#4a3a10;color:#fcd34d}
[data-theme="dark"] .pl-rule.pl-same{background:#28304d;color:#a5b4fc}
[data-theme="dark"] .pl-rule.pl-ves,[data-theme="dark"] .pl-rule.pl-fs{background:#1e3a5f;color:#93c5fd}
[data-theme="dark"] .pl-rule.pl-oes,[data-theme="dark"] .pl-rule.pl-os{background:#14351f;color:#86efac}
[data-theme="dark"] .pl-rule.pl-ies,[data-theme="dark"] .pl-rule.pl-es{background:#3b2350;color:#d8b4fe}
.pl-chip.on .cnt{background:var(--accent);color:#fff}
[data-theme="dark"] .pl-chip.on .cnt{background:#fff;color:var(--accent)}
/* ============ 分段切换（日程表 / 闯关 等） ============ */
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}
.seg button{font:inherit;font-size:var(--fs-sm);border:0;background:none;color:var(--muted);padding:6px 15px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* ============ 闯关地图 ============ */
.q-bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:14px}
.q-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:.35s}
.q-map{display:flex;flex-direction:column;gap:12px}
.q-row{display:flex;align-items:stretch}
.q-link{flex:0 0 16px;align-self:center;height:3px;border-radius:2px;background:var(--line);display:block}
.q-node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;transition:.15s}
.q-node:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.q-node.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.q-node.lock{opacity:.55;cursor:not-allowed}
.q-node.lock:hover{transform:none;border-color:var(--line)}
.q-hex{width:46px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);font-style:normal;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:0 0 auto}
.q-node.done .q-hex,.q-node.now .q-hex,.q-done.ok .q-hex{background:var(--accent);color:var(--accent-fg)}
.q-node.lock .q-hex{background:var(--line);color:var(--muted)}
.q-done.no .q-hex{background:var(--muted);color:#fff}
.q-hex b{font-family:Georgia,serif;font-size:17px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.q-hex svg.ic{width:16px;height:16px}
.q-star{font-size:11px;color:#f59e0b;letter-spacing:1px;line-height:1.2}
.q-node.lock .q-star{color:var(--muted);letter-spacing:0}
.q-range{font-size:10.5px;color:var(--muted);font-family:Georgia,serif}
.q-done{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);text-align:left}
.q-done.ok{border-color:var(--accent);background:var(--accent-soft)}
.q-done .q-hex{width:42px;height:48px}
.q-done-tx{flex:1;min-width:170px}
.q-done-tx b{display:block;font-size:var(--fs-base);line-height:1.4}
.q-done-tx span{font-size:12.5px;color:var(--muted)}
/* ============ 勋章 ============ */
.ml-bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:14px}
.ml-bar i{display:block;height:100%;background:linear-gradient(90deg,#b4632a,#8e9aa8,#d99a13);border-radius:999px;transition:.35s}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.ml-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px 13px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font:inherit;color:inherit;transition:.15s;text-align:center}
.ml-card:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.07)}
.ml-card.has{background:linear-gradient(180deg,var(--surface),var(--soft))}
.ml-hex{display:inline-flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--soft);color:var(--muted);font-style:normal;flex:0 0 auto}
.ml-hex.t1{background:linear-gradient(150deg,#eab07a,#a9551f);color:#fff}
.ml-hex.t2{background:linear-gradient(150deg,#e3e9f0,#7c8896);color:#fff}
.ml-hex.t3{background:linear-gradient(150deg,#ffe289,#c8890a);color:#fff}
.ml-hex-in{display:inline-flex;align-items:center;justify-content:center;width:74%;height:74%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(255,255,255,.20)}
.ml-hex svg.ic{width:1em;height:1em}
.ml-n{font-size:var(--fs-base);font-weight:700;margin-top:6px;line-height:1.3}
.ml-t{font-size:12px;color:var(--muted);font-weight:600}
.ml-card.has .ml-t{color:var(--accent)}
.ml-dots{display:inline-flex;gap:4px;margin:3px 0 1px}
.ml-dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.ml-dot.t1.on{background:#b4632a}
.ml-dot.t2.on{background:#8e9aa8}
.ml-dot.t3.on{background:#d99a13}
.ml-prog{width:100%;height:5px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:6px}
.ml-prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.ml-p{font-size:11px;color:var(--muted)}
.ml-rows{display:flex;flex-direction:column;gap:8px}
.ml-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--soft);font-size:13px}
.ml-row.on{border-color:var(--accent);background:var(--accent-soft)}
.ml-rt{flex:0 0 auto;font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.ml-rt.t1{color:#a9551f;border-color:#eab07a}
.ml-rt.t2{color:#5a6672;border-color:#b9c3cd}
.ml-rt.t3{color:#a06f04;border-color:#f2cf6a}
.ml-rq{flex:1;min-width:0;color:var(--fg)}
.ml-rd{flex:0 0 auto;color:var(--muted);font-size:12px}
/* ============ ENTI 英语人格测试 ============ */
.enti-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 2px 2px}
.enti-head b{display:block;font-size:var(--fs-lg);font-family:Georgia,serif;letter-spacing:.5px}
.enti-head span{font-size:12.5px;color:var(--muted)}
.enti-logo{font-family:Georgia,serif;font-size:56px;font-weight:700;letter-spacing:6px;line-height:1;background:linear-gradient(120deg,var(--accent),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.enti-dims{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:18px}
.enti-dim{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.enti-dim svg.ic{width:13px;height:13px;color:var(--accent)}
.enti-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.enti-i{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.enti-p{font-family:Georgia,serif;font-size:15px;color:var(--accent);font-weight:700}
.enti-bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:9px}
.enti-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:.3s}
.enti-opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.enti-opt{display:flex;align-items:flex-start;gap:11px;text-align:left;font:inherit;color:inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface);cursor:pointer;transition:.15s;line-height:1.5}
.enti-opt:hover{border-color:var(--accent-line);background:var(--soft)}
.enti-opt.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.enti-k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-style:normal;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.enti-opt.on .enti-k{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.enti-type{display:flex;align-items:center;gap:14px}
.enti-tic{flex:0 0 54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-style:normal}
.enti-tic svg.ic{width:26px;height:26px}
.enti-tn{display:block;font-size:var(--fs-lg);line-height:1.3}
.enti-te{display:block;font-family:Georgia,serif;font-size:13px;color:var(--accent);letter-spacing:.4px}
.enti-tt{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.enti-desc{margin:14px 0 0;line-height:1.75;font-size:var(--fs-base)}
.enti-good{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.enti-good span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.enti-good span svg.ic{width:13px;height:13px;color:var(--accent)}
.enti-radar{margin:6px 0 14px;text-align:center}
.enti-radar img{width:100%;max-width:340px;height:auto;display:inline-block;border-radius:14px}
.enti-bars{display:flex;flex-direction:column;gap:9px}
.enti-brow{display:flex;align-items:center;gap:11px}
.enti-bn{flex:0 0 64px;font-size:13px;color:var(--muted)}
.enti-bb{flex:1;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.enti-bb b{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6);border-radius:999px;transition:.4s}
.enti-bp{flex:0 0 44px;text-align:right;font-family:Georgia,serif;font-size:13px;font-weight:700;color:var(--accent)}
.enti-tips{margin:10px 0 0;padding-left:20px;line-height:1.9;font-size:var(--fs-base)}
.enti-tips li{margin:2px 0}
.enti-h1{font-size:var(--fs-lg);font-family:Georgia,serif;letter-spacing:.5px}
.enti-h2{font-size:12.5px;color:var(--muted);margin-top:2px}
.enti-card{text-align:left}
.enti-card .enti-logo{display:block;margin-top:6px}
.enti-sub{margin:6px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.5px}
.enti-card .enti-logo,.enti-card .enti-sub{text-align:center}
.enti-intro{margin:12px 0 0;line-height:1.8;font-size:var(--fs-base)}
.enti-how{margin:16px 0 0;padding-left:20px;line-height:1.95;font-size:var(--fs-base)}
.enti-how li{margin:3px 0}
.enti-q{margin:14px 0 0;font-size:var(--fs-lg);line-height:1.6;font-weight:700}
.enti-acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;align-items:center}
.enti-acts .btn{display:inline-flex;align-items:center;gap:6px}
.enti-acts .btn svg.ic{width:14px;height:14px}
.enti-ot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.enti-oen{font-style:normal;font-weight:600;line-height:1.45}
.enti-ocn{font-style:normal;font-size:12.5px;color:var(--muted)}
.enti-opt.on .enti-ocn{color:var(--accent)}
.enti-hero,.enti-type{text-align:center}
.enti-hero .enti-tic{width:64px;height:64px;margin:0 auto 10px}
.enti-hero .enti-tic svg.ic{width:30px;height:30px}
.enti-hero .enti-tn{font-size:26px;font-weight:700;letter-spacing:.5px}
.enti-hero .enti-te{font-size:14px;margin-top:4px}
.enti-hero .enti-tt{margin-top:8px}
.enti-comment{margin:10px 0 0;line-height:1.85;font-size:var(--fs-base)}
.enti-verdict{display:flex;align-items:flex-start;gap:9px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:var(--fs-base);line-height:1.7}
.enti-verdict svg.ic{flex:0 0 16px;width:16px;height:16px;margin-top:3px;color:var(--accent)}
.enti-reads{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.enti-read{padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.enti-read.b-hi{border-color:var(--accent-line);background:var(--accent-soft)}
.enti-rd-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.enti-rd-h .enti-bn{flex:1;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);font-weight:600}
.enti-rd-h .enti-bn svg.ic{width:14px;height:14px;color:var(--accent)}
.enti-rd-p{font-family:Georgia,serif;font-size:14px;font-weight:700;color:var(--accent);display:inline-flex;align-items:baseline;gap:5px}
.enti-rd-p i{font-style:normal;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-family:inherit}
.enti-read p{margin:6px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.enti-brow.top .enti-bn{color:var(--fg);font-weight:700}
.enti-good-i{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.enti-good-i svg.ic{width:13px;height:13px;color:var(--accent)}
.enti-rx{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.enti-rx-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.enti-rx-ic{flex:0 0 32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.enti-rx-ic svg.ic{width:16px;height:16px}
.enti-rx-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.enti-rx-tx b{font-size:var(--fs-base)}
.enti-rx-tx em{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.6}
.enti-rx-row .btn{font-size:12.5px;padding:6px 13px;flex:0 0 auto}
.enti-ans{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.enti-ans-row{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:11px;background:var(--soft)}
.enti-ans-q{font-size:12.5px;color:var(--muted);line-height:1.6}
.enti-ans-a{font-size:var(--fs-base);font-weight:600}
.enti-ans-a.on{color:var(--accent)}
.enti-cnt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.enti-cnt-l{font-size:12.5px;color:var(--muted);font-weight:600}
.enti-cnt-in{font:inherit;font-size:var(--fs-base);width:82px;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
.enti-cnt-in:focus{border-color:var(--accent)}
.enti-bank{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.enti-bank-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.enti-bank-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.enti-bank-tx b{font-size:var(--fs-base);line-height:1.55}
.enti-bank-tx span{font-size:12px;color:var(--muted);line-height:1.6;word-break:break-word}
.enti-bank-acts{flex:0 0 auto;display:flex;gap:7px}
.enti-bank-acts .btn{font-size:12.5px;padding:6px 12px}
.enti-f{display:flex;flex-direction:column;gap:9px}
.enti-f-l{font-size:12.5px;color:var(--muted);font-weight:600}
.enti-f-q{font:inherit;font-size:var(--fs-base);width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);color:var(--fg);outline:none;resize:vertical;line-height:1.6}
.enti-f-q:focus{border-color:var(--accent)}
.enti-f-hint{margin:0;font-size:12px;color:var(--muted);line-height:1.65}
.enti-f-row{display:grid;grid-template-columns:22px 1fr 1fr 96px 96px;gap:7px;align-items:center}
.enti-f-k{font-family:Georgia,serif;font-size:13px;color:var(--accent);text-align:center}
.enti-f-en,.enti-f-cn,.enti-f-p{font:inherit;font-size:12.5px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg);outline:none;width:100%}
.enti-f-en:focus,.enti-f-cn:focus,.enti-f-p:focus{border-color:var(--accent)}
@media (max-width:720px){
  .enti-f-row{grid-template-columns:22px 1fr;gap:6px}
  .enti-f-en,.enti-f-cn,.enti-f-p{grid-column:2}
}
/* ============ 搜索 ============ */
.search-input{font:inherit;font-size:var(--fs-base);width:100%;padding:13px 60px 13px 42px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:var(--surface);color:var(--fg);transition:.15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap{position:relative}
.search-wrap .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.sm-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:4px 9px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
.sm-toggle:hover{color:var(--fg);border-color:var(--accent-line)}
.sm-toggle.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);font-weight:600}
.sm-toggle.inline{position:static;transform:none;flex:0 0 auto}
/* ============ 徽章/杂项 ============ */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:var(--fs-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 15px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent-line)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip .n{font-size:11px;opacity:.6}
.rev-label{font-size:var(--fs-sm);color:var(--muted);font-weight:600;margin:14px 0 7px}
.rev-label:first-of-type{margin-top:0}
/* 学习流程排序 */
.flow-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.flow-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.flow-row .fl-idx{flex:0 0 20px;height:20px;border-radius:6px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flow-row .fl-name{flex:1;display:flex;align-items:center;gap:7px;font-weight:600}
.flow-row .fl-acts{display:flex;gap:4px}
.flow-row .fl-btn{width:28px;height:28px;border-radius:8px;color:var(--muted)}
.flow-row .fl-btn svg.ic{width:15px;height:15px}
.flow-row .fl-btn:disabled{opacity:.28;cursor:not-allowed}
.flow-row .fl-del:hover:not(:disabled){color:#dc2626;border-color:rgba(220,38,38,.4)}
/* 导出打印预览 */
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px}
.pv-row{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px dashed var(--line);border-radius:9px;font-size:var(--fs-sm);overflow:hidden}
.pv-row b{font-family:Georgia,serif;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-row .pv-ph{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-row .pv-blank{flex:1;border-bottom:1px solid var(--line);height:14px}
.pv-row i{color:var(--muted);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num-input{font:inherit;font-size:var(--fs-base);width:110px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:var(--surface);color:var(--fg);transition:.15s}
.num-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);transition:width .35s;border-radius:2px}
.study-meta{display:flex;gap:14px;font-size:var(--fs-sm);color:var(--muted);margin-top:10px;flex-wrap:wrap;align-items:center}
.study-meta .timer{color:var(--no);font-variant-numeric:tabular-nums;font-weight:600}
.study-meta .chip-mini{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.stage{padding:34px 22px;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.word-big{font-size:var(--fs-word);font-weight:700;letter-spacing:-.5px;line-height:1.15;font-family:Georgia,"Times New Roman",serif;word-break:break-word}
.word-big.sm{font-size:calc(var(--fs-word) * .72)}
/* #3c 识词页里「点这个词看详情」的词形：虚下划线一眼看得出能点，键盘聚焦也给一圈 */
.word-tap{cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:4px}
.word-tap:hover{color:var(--accent)}
.word-tap:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.phon{color:var(--muted);font-size:var(--fs-base);font-family:Georgia,serif}
.meaning{font-size:var(--fs-lg);margin-top:4px}
.q-tag{font-size:12px;color:var(--accent);letter-spacing:1.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.q-text{font-size:var(--fs-q);font-weight:600;line-height:1.4}
.q-text.big-en{font-family:Georgia,serif;font-weight:700}
/* 按住跟读：按住时的明确反馈（缩放 + 光环 + 波纹 + 计时） */
.hold-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 6px}
.hold-btn{position:relative;overflow:hidden;font-size:16px;padding:16px 34px;border-radius:14px;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.hold-btn.holding{transform:scale(.955);filter:saturate(1.15) brightness(1.04);
  box-shadow:0 0 0 9px var(--accent-soft),0 8px 20px rgba(15,23,42,.2)}
.hold-btn.holding .hold-txt{letter-spacing:.08em}
.hold-ring{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  background:rgba(255,255,255,.5);opacity:0;pointer-events:none}
.hold-btn.holding .hold-ring{animation:holdRipple 1.1s ease-out infinite}
@keyframes holdRipple{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(10)}}
.hold-tip{font-size:12.5px;color:var(--muted);text-align:center}
.hold-tip.on{color:var(--accent);font-weight:600}
.tap-card{cursor:pointer;border:1.5px dashed var(--accent-line);border-radius:var(--radius);padding:30px 18px;transition:.15s;text-align:center;background:var(--accent-soft)}
.tap-card:hover{border-style:solid}
.tap-hint{font-size:var(--fs-sm);color:var(--accent);margin-top:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.input{font:inherit;font-size:var(--fs-lg);width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:11px;outline:none;transition:.15s;background:var(--surface);color:var(--fg)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:var(--fs-lg);padding:16px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;cursor:pointer;transition:.15s;font-family:Georgia,serif;color:var(--fg)}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.fb{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.fb-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.fb-icon svg.ic{width:24px;height:24px;stroke-width:2.6}
.fb.ok .fb-icon{background:rgba(22,163,74,.12);color:var(--ok)}
.fb.no .fb-icon{background:rgba(220,38,38,.12);color:var(--no)}
.fb-note{font-size:var(--fs-sm);color:var(--muted)}
.fb-note b{color:var(--fg)}
.your-wrong{color:var(--no)}
.stage-badge{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
.stage-badge svg.ic{width:28px;height:28px;stroke-width:2.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:4px;color:var(--fg)}
.tile:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.04)}
.tile b{font-size:var(--fs-base);font-weight:600;display:flex;align-items:center;gap:7px}
.tile span{font-size:var(--fs-sm);color:var(--muted);line-height:1.5}
.tile .ic{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.tile .ic svg.ic{width:15px;height:15px;stroke-width:2.1}
.stage-status{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.stage-row{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm)}
.stage-row .nm{width:74px;flex:0 0 auto;color:var(--fg)}
.stage-row .bg{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.stage-row .fg{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.stage-row .num{width:56px;flex:0 0 auto;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.stage-row.done .nm{color:var(--accent);font-weight:600}
.word-cloud{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:180px;overflow:auto}
.w-link{cursor:pointer;border-bottom:1px dashed var(--accent-line);transition:.15s;padding-bottom:1px}
.w-link:hover{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.word-cloud .w-link{font-size:var(--fs-sm);padding:3px 9px;background:var(--soft);border-radius:7px;border:0}
.passage{font-size:var(--fs-lg);line-height:2.1;font-family:Georgia,"Times New Roman",serif;color:var(--fg)}
.passage .w-link{font-weight:600;color:var(--accent);border-bottom-color:var(--accent)}
.qitem{border-bottom:1px solid var(--line);padding:16px 0}
.qitem:last-child{border-bottom:0}
.qitem .qnum{font-size:12px;color:var(--muted);margin-bottom:4px}
.qitem .qsent{font-size:var(--fs-base);line-height:2;font-family:Georgia,serif}
.blank-in{font:inherit;font-family:Georgia,serif;font-size:var(--fs-base);border:0;border-bottom:1.5px solid var(--accent);outline:none;width:130px;padding:2px 6px;margin:0 4px;background:var(--accent-soft);text-align:center;color:var(--accent);font-weight:600;border-radius:4px 4px 0 0}
.blank-in:focus{background:var(--surface);border-bottom-width:2px}
.blank-in.ok{color:var(--ok);border-color:var(--ok);background:rgba(22,163,74,.1)}
.blank-in.no{color:var(--no);border-color:var(--no);background:rgba(220,38,38,.1)}
.blank-select{font:inherit;font-family:Georgia,serif;font-size:var(--fs-base);border:0;border-bottom:1.5px solid var(--accent);outline:none;padding:2px 6px;margin:0 3px;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:4px 4px 0 0;cursor:pointer}
.blank-select.ok{color:var(--ok);border-color:var(--ok);background:rgba(22,163,74,.1)}
.blank-select.no{color:var(--no);border-color:var(--no);background:rgba(220,38,38,.1)}
/* 试卷式完形填空 */
.blank-slot{display:inline-block;min-width:66px;padding:1px 8px;margin:0 3px;text-align:center;text-decoration:none;font-family:Georgia,serif;font-weight:700;color:var(--accent);background:var(--accent-soft);border-bottom:1.5px solid var(--accent);border-radius:4px 4px 0 0}
.blank-slot.filled{color:var(--fg);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.sl-blank{display:inline-block;text-decoration:none;margin:0 3px;white-space:nowrap}
.sl-blank b{font-family:Georgia,serif}
.sl-blank .sl-ok{color:var(--ok)}
.sl-blank .sl-no{color:var(--no)}
.sl-blank .sl-fix{font-style:normal;font-size:.86em;color:var(--ok);margin-left:4px}
.qline{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px dashed var(--line)}
.qline:first-child{border-top:0}
.qno{flex:0 0 26px;font-weight:700;color:var(--muted);font-size:13.5px;line-height:2.1;text-align:right}
.qopts{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.qopt{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;cursor:pointer;font:inherit;font-size:var(--fs-sm);transition:.12s;line-height:1.5}
.qopt:hover{border-color:var(--accent);background:var(--accent-soft)}
.qopt .lt{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.qopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.qopt.on .lt{background:var(--accent);color:#fff}
@media (max-width:560px){ .qno{flex-basis:20px;font-size:12.5px} .qopt{padding:4px 10px 4px 5px;font-size:12.5px} }
.hint-cn{color:var(--muted);font-size:var(--fs-sm);font-family:-apple-system,sans-serif;margin-left:4px}
.stats{display:flex;gap:28px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--fs-sm);color:var(--muted)}
.done-icon{font-size:46px;margin-bottom:6px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.done-icon svg.ic{width:46px;height:46px;stroke-width:1.7}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(10,14,20,.46);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .16s;backdrop-filter:blur(3px)}
.modal-mask.hidden{display:none}
/* 通用显隐：这份样式表里原先只定义了 .modal-mask.hidden 与 .to-top.hidden 两条，
   裸的 .hidden 一直没有 display 规则 —— 文本标注页整套显隐都挂在它上面，所以在这里补一条。
   加 !important 是因为 .btn{display:inline-flex}、.anno-ocr-st{display:flex} 这些组件规则
   排在它后面、优先级又一样，不加就会被它们盖掉（按钮与进度条藏不住）。 */
.hidden{display:none!important}
/* 回到顶部 */
.to-top{
  position:fixed;right:18px;bottom:76px;z-index:50;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:.2s;font-size:18px;
}
.to-top:hover{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.to-top .ic{width:20px;height:20px}
/* 回到顶部要的是淡出，不能跟着通用 .hidden 一起 display:none；这里选择器更具体，能压过它 */
.to-top.hidden{display:flex!important;opacity:0;pointer-events:none;transform:translateY(8px)}
@media (max-width:860px){.to-top{right:12px;bottom:118px;width:38px;height:38px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:22px;position:relative;animation:pop .18s;border:1px solid var(--line)}
.modal::-webkit-scrollbar{width:6px}
.modal::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--muted);line-height:1;transition:.15s;z-index:2;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--accent-soft);color:var(--accent)}
.preview-wrap{display:flex;justify-content:center;background:var(--soft);border-radius:12px;padding:12px;max-height:58vh;overflow:auto}
.preview-img{max-width:100%;height:auto;max-height:52vh;border-radius:8px;display:block;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.m-img svg{width:100%;border-radius:12px;display:block;margin-bottom:16px}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.m-wordline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pos-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);letter-spacing:.3px}
.m-btns{display:flex;gap:6px;flex-wrap:wrap}
.m-ex-title{font-size:11.5px;color:var(--muted);letter-spacing:1.5px;margin-bottom:10px;font-weight:700;margin-top:18px;display:flex;align-items:center;gap:6px}
.ex{border-left:2px solid var(--accent-line);padding:2px 0 2px 12px;margin-bottom:14px;position:relative}
.ex-t{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.8;padding-right:64px}
.ex-tr{font-size:var(--fs-sm);color:var(--fg);opacity:.78;margin-top:4px;line-height:1.7;padding-right:10px}
.ex-s{font-size:12px;color:var(--muted);margin-top:4px}
.ex-btns{position:absolute;top:0;right:0;display:flex;gap:4px}
.ex-play,.ex-fav,.ex-word-fav{border:0;background:var(--soft);color:var(--muted);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.15s}
.ex-play:hover,.ex-fav:hover{background:var(--accent-soft);color:var(--accent)}
.ex-play svg.ic,.ex-fav svg.ic,.ex-word-fav svg.ic{width:13px;height:13px}
.ex-fav.on,.ex-word-fav.on{color:var(--star);background:rgba(245,158,11,.12)}
.ex-fav.on svg.ic,.ex-word-fav.on svg.ic{fill:currentColor}
.m-block{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.m-block:first-of-type{border-top:0;padding-top:4px;margin-top:14px}
.m-tag{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted);margin-top:2px;min-width:46px;text-align:center}
.m-tag.pre{background:rgba(14,165,233,.13);color:#0284c7}
.m-tag.suf{background:rgba(168,85,247,.13);color:#9333ea}
.m-tag.root{background:rgba(16,185,129,.13);color:#059669}
.m-tag.der{background:rgba(245,158,11,.15);color:#d97706}
.m-tag.vform{background:rgba(99,102,241,.13);color:#4f46e5}
.m-tag.ant{background:rgba(220,38,38,.11);color:#dc2626}
.m-tag.syn{background:rgba(14,165,233,.13);color:#0284c7}
html[data-dark="true"] .m-tag.pre,html[data-dark="true"] .m-tag.syn{color:#38bdf8}
html[data-dark="true"] .m-tag.suf{color:#c084fc}
html[data-dark="true"] .m-tag.root{color:#34d399}
html[data-dark="true"] .m-tag.der{color:#fbbf24}
html[data-dark="true"] .m-tag.vform{color:#a5b4fc}
html[data-dark="true"] .m-tag.ant{color:#f87171}
.m-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:9px;font-size:var(--fs-sm);line-height:1.7}
.m-body{flex:1;min-width:0}
.m-body b{font-family:Georgia,serif;font-size:var(--fs-base)}
.syn-item{padding:9px 62px 9px 0;border-bottom:1px dashed var(--line);position:relative}
.syn-item:last-child{border-bottom:0;padding-bottom:0}
.syn-acts{position:absolute;top:8px;right:0;display:flex;gap:4px}
.syn-acts .dict-act{width:26px;height:26px;border-radius:7px}
.syn-acts .dict-act svg.ic{width:14px;height:14px}
.syn-word{font-family:Georgia,serif;font-size:var(--fs-base);font-weight:700;color:var(--accent);cursor:pointer}
.syn-word:hover{text-decoration:underline}
.syn-diff{font-size:var(--fs-sm);color:var(--fg);opacity:.78;margin-top:3px;line-height:1.7}
.deriv-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.deriv-chip{font-family:Georgia,serif;font-size:var(--fs-sm);padding:4px 11px;border-radius:8px;background:var(--soft);cursor:pointer;transition:.15s;border:1px solid transparent}
.deriv-chip:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.deriv-chip.root{background:rgba(16,185,129,.12);color:#059669}
/* 词汇总览（近义 / 反义） */
.wx-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.wx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wx-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);transition:.15s;cursor:default}
.wx-card:hover{border-color:var(--accent-line);box-shadow:0 3px 12px rgba(0,0,0,.035)}
.wx-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wx-key{font-family:Georgia,serif;font-size:var(--fs-lg);font-weight:700;color:var(--fg);cursor:pointer}
.wx-key:hover{color:var(--accent);text-decoration:underline}
.wx-pos{font-size:11px;color:var(--muted)}
.wx-m{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.wx-arrow{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--muted);font-size:12px}
.wx-arrow svg.ic{width:14px;height:14px;color:var(--accent)}
.wx-item{padding:8px 0;border-bottom:1px dashed var(--line)}
.wx-item:last-child{border-bottom:0;padding-bottom:0}
.wx-w{font-family:Georgia,serif;font-weight:700;color:var(--accent);cursor:pointer;font-size:var(--fs-base)}
.wx-w:hover{text-decoration:underline}
.wx-d{font-size:12.5px;color:var(--fg);opacity:.78;line-height:1.65;margin-top:2px}
.wx-none{color:var(--muted);font-size:12.5px;font-style:italic}
.wx-item{position:relative;padding-right:66px}
.wx-rowacts{position:absolute;top:6px;right:0;display:flex;gap:4px}
.wx-rowacts .dict-act{width:26px;height:26px;border-radius:7px}
.wx-rowacts .dict-act svg.ic{width:14px;height:14px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;font-size:var(--fs-sm);color:var(--muted)}
/* 词典 */
.dict-level{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.2px;flex:0 0 auto}
/* 「考察 N 次」：本机答过这个词的次数（答对 + 答错），不是真题频次 —— 只在有记录、
   或正在按考察次数排序时才出现，免得满屏「考察 0 次」全是噪音 */
.dict-cnt{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--muted);font-weight:600;letter-spacing:.2px;flex:0 0 auto}
.dict-result{border-bottom:1px solid var(--line);padding:13px 0;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.dict-result:last-child{border-bottom:0}
.dict-result:hover{background:var(--soft);margin:0 -12px;padding:13px 12px;border-radius:10px}
.dict-result .dw{font-family:Georgia,serif;font-size:var(--fs-lg);font-weight:700;flex:0 0 auto}
.dict-result .dp{font-family:Georgia,serif;font-size:var(--fs-sm);color:var(--muted);flex:0 0 auto}
.dict-result .dm{font-size:var(--fs-sm);color:var(--muted);flex:1;min-width:120px}
.dict-result .dl{display:flex;gap:4px;flex-wrap:wrap;flex:0 0 auto}
/* 词典：状态着色 + 快捷收藏/错题 */
.dict-result[data-stat="ok"]{border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 7%,transparent);padding-left:10px}
.dict-result[data-stat="wrong"]{border-left:3px solid var(--no);background:color-mix(in srgb,var(--no) 7%,transparent);padding-left:10px}
.dict-result[data-stat="new"]{border-left:3px solid transparent;padding-left:10px}
.dict-result[data-stat="ok"] .dw{color:var(--ok)}
.dict-result[data-stat="wrong"] .dw{color:var(--no)}
.dict-acts{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.dict-act{width:28px;height:28px;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.dict-act svg.ic{width:15px;height:15px}
.dict-act:hover{border-color:var(--accent);color:var(--accent)}
.dict-act.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.dict-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.dict-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.dict-legend i.l-ok{background:var(--ok)}
.dict-legend i.l-no{background:var(--no)}
.dict-legend i.l-new{background:var(--line)}
.letter-chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.letter-chips button{min-width:30px;padding:4px 0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;transition:.15s}
.letter-chips button:hover{border-color:var(--accent);color:var(--accent)}
.letter-chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* 作文素材库 */
.wp-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface);transition:.15s}
.wp-item:hover{border-color:var(--accent-line);box-shadow:0 3px 12px rgba(0,0,0,.035)}
.wp-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wp-tag{font-size:10.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.2px}
.wp-tag.sub{background:var(--soft);color:var(--muted)}
.wp-acts{margin-left:auto;display:flex;gap:4px}
.wp-acts .dict-act{width:26px;height:26px;border-radius:7px}
.wp-acts .dict-act svg.ic{width:14px;height:14px}
.wp-en{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.75;color:var(--fg)}
.wp-cn{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.7}
.wp-tip{font-size:12px;color:var(--accent);margin-top:6px;line-height:1.65;display:flex;gap:5px;align-items:flex-start}
.wp-tip svg.ic{width:14px;height:14px;flex:0 0 auto;margin-top:3px}
.tpl-part{border-top:1px dashed var(--line);padding:11px 0}
.tpl-part:first-of-type{border-top:0}
.tpl-name{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;letter-spacing:.2px}
.tpl-en{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.85;white-space:pre-wrap}
.tpl-cn{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.75;white-space:pre-wrap}
/* 语法 */
.gr-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.gr-nav button{font:inherit;font-size:var(--fs-sm);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;transition:.15s}
.gr-nav button:hover{border-color:var(--accent-line);color:var(--accent)}
.gr-nav button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.gr-topic{border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;cursor:pointer;transition:.15s;background:var(--surface)}
.gr-topic:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.04)}
.gr-topic h3{margin:0 0 4px;font-size:var(--fs-base);font-weight:700}
.gr-topic p{margin:0;font-size:var(--fs-sm);color:var(--muted);line-height:1.6}
.gr-topic .gr-en{font-family:Georgia,serif;font-size:12.5px;color:var(--accent);letter-spacing:.3px;margin-bottom:6px}
.gr-topic .gr-idx{float:right;font-size:11.5px;color:var(--muted);font-weight:500}
.gr-sec-title{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--accent);margin-bottom:10px}
.gr-point{display:flex;gap:9px;font-size:var(--fs-sm);line-height:1.85;margin-bottom:7px;align-items:flex-start}
.gr-point .dot{flex:0 0 auto;color:var(--accent);font-weight:700;margin-top:1px}
.gr-ex{padding:9px 0;border-bottom:1px dashed var(--line);position:relative;padding-right:34px}
.gr-ex:last-child{border-bottom:0}
.gr-ex-en{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.75}
.gr-ex-cn{font-size:var(--fs-sm);color:var(--muted);margin-top:3px;line-height:1.7}
.gr-ex-play{position:absolute;top:9px;right:0;border:0;background:var(--soft);color:var(--muted);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.gr-ex-play:hover{background:var(--accent-soft);color:var(--accent)}
.gr-ex-play svg.ic{width:13px;height:13px}
.gr-sample{background:var(--accent-soft);border-radius:11px;padding:14px 16px;margin-top:8px}
.gr-sample .gr-s-q{font-size:var(--fs-base);line-height:1.8;font-family:Georgia,serif}
.gr-sample .gr-s-a{margin-top:8px;font-size:var(--fs-sm);color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
.gr-sample .gr-s-tip{margin-top:6px;font-size:var(--fs-sm);color:var(--muted);line-height:1.7;display:flex;gap:6px}
.gr-page-ind{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
/* 设置 */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .lab{font-size:var(--fs-base)}
.set-row .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:44px;height:25px;flex:0 0 auto;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.slider:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(19px)}
.theme-grid{display:flex;gap:10px;flex-wrap:wrap}
.theme-dot{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);cursor:pointer;transition:.15s;position:relative}
.theme-dot.on{border-color:var(--fg);transform:scale(1.06)}
.theme-dot.on:after{content:"";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.theme-dot[data-t="sky"]{background:linear-gradient(135deg,#0ea5e9 50%,#fff 50%)}
.theme-dot[data-t="green"]{background:linear-gradient(135deg,#10b981 50%,#fff 50%)}
.theme-dot[data-t="pink"]{background:linear-gradient(135deg,#ec4899 50%,#fff 50%)}
.theme-dot[data-t="mono"]{background:linear-gradient(135deg,#18181b 50%,#fff 50%)}
.theme-dot[data-t="violet"]{background:linear-gradient(135deg,#8b5cf6 50%,#fff 50%)}
.theme-dot[data-t="amber"]{background:linear-gradient(135deg,#f59e0b 50%,#fff 50%)}
.theme-dot[data-t="teal"]{background:linear-gradient(135deg,#0d9488 50%,#fff 50%)}
.theme-dot[data-t="slate"]{background:linear-gradient(135deg,#475569 50%,#fff 50%)}
html[data-dark="true"] .theme-dot[data-t="sky"]{background:linear-gradient(135deg,#38bdf8 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="green"]{background:linear-gradient(135deg,#34d399 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="pink"]{background:linear-gradient(135deg,#f472b6 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="mono"]{background:linear-gradient(135deg,#f4f4f5 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="violet"]{background:linear-gradient(135deg,#a78bfa 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="amber"]{background:linear-gradient(135deg,#fbbf24 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="teal"]{background:linear-gradient(135deg,#2dd4bf 50%,#151b23 50%)}
html[data-dark="true"] .theme-dot[data-t="slate"]{background:linear-gradient(135deg,#94a3b8 50%,#151b23 50%)}
/* 错题本/收藏 */
.wrong-item,.fav-item{border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:12px;align-items:flex-start}
.wrong-item:last-child,.fav-item:last-child{border-bottom:0}
.wrong-main,.fav-main{flex:1;min-width:0}
.wrong-word{font-family:Georgia,serif;font-size:var(--fs-lg);font-weight:700}
.wrong-meta,.fav-meta{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.65}
.wrong-you{color:var(--no)}
.wrong-count{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:rgba(220,38,38,.12);color:var(--no);margin-left:6px;font-weight:600}
/* 「已重学」角标（用户第 14 项）：错题记录右上角。工程里没有现成的 .badge / .chip 角标写法，
   照 .wrong-count 的形状另起一个；动作按钮收成一列，角标压在列顶，不盖住朗读 / 删除 */
.wrong-acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.wrong-relearned{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(22,163,74,.12);color:var(--ok);white-space:nowrap}
.wrong-relearned svg.ic{width:11px;height:11px}
.fav-en{font-family:Georgia,serif;font-size:var(--fs-base);line-height:1.8}
.fav-cn{font-size:var(--fs-sm);color:var(--muted);margin-top:3px;line-height:1.7}
.empty-box{padding:56px 20px;text-align:center}
.empty-box .done-icon{opacity:.5}
/* 听写 */
.dict-panel{display:flex;flex-direction:column;gap:14px;align-items:center;padding:10px 0}
.dict-play{width:96px;height:96px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.dict-play svg.ic{width:36px;height:36px}
.dict-play:hover{background:var(--accent);color:var(--accent-fg)}
.dict-play:active{transform:scale(.95)}
.dict-play.playing{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 14px transparent}}
/* Toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--accent);color:var(--accent-fg);
  padding:11px 22px;border-radius:12px;font-size:var(--fs-sm);font-weight:600;
  z-index:200;animation:toastIn .22s ease;box-shadow:0 8px 28px rgba(0,0,0,.18);
  max-width:86vw;text-align:center;letter-spacing:.2px;
  display:flex;align-items:center;gap:8px;justify-content:center;
}
.toast svg.ic{width:15px;height:15px}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast.out{animation:toastOut .2s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px) scale(.96)}}
/* ============================================================
   2026-10-20 · 用户第 1 / 2 / 5 / 6 项新增样式
   ------------------------------------------------------------
   .save-warn  顶栏那条「这次没能保存到本机」的常驻提示（默认不占地方，.on 才出现）
   .data-acts  数据卡里「导出全部数据 / 导入数据」两颗按钮
   .sw-line    数据卡里离线缓存那一行（如实反映注册成功 / 没成功）
   .ear-tip / .ear-hint  听音猜词的兜底说明与「听不到声音？」提示块
   ============================================================ */
.save-warn{
  display:none;align-items:center;gap:5px;margin-right:2px;padding:6px 10px;border-radius:999px;
  border:1px solid #f0c2c2;background:#fdecec;color:#b42318;font-size:12px;font-weight:700;
  line-height:1;font-family:inherit;cursor:pointer;flex:0 0 auto;
}
.save-warn.on{display:inline-flex}
.save-warn svg.ic{width:13px;height:13px;color:#b42318;stroke-width:2.2}
html[data-dark="true"] .save-warn{border-color:#6b2b2b;background:#3a1616;color:#ffb4ab}
html[data-dark="true"] .save-warn svg.ic{color:#ffb4ab}
@media (max-width:520px){.save-warn{padding:6px 7px}.save-warn .sw-t{display:none}}
.set-note{margin:10px 0 0;font-size:var(--fs-sm);color:var(--muted);line-height:1.75}
.set-note b{color:var(--fg);font-weight:700}
.data-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sw-line{
  display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--soft);
  font-size:var(--fs-sm);color:var(--muted);line-height:1.7;
}
.sw-line .sw-ic{display:flex;flex:0 0 auto;margin-top:1px;color:var(--accent)}
.sw-line .sw-ic svg.ic{width:15px;height:15px}
.ear-tip{margin:8px 0 0;font-size:var(--fs-sm);color:var(--muted);line-height:1.7}
.ear-hint{
  margin:10px 0 0;padding:10px 13px;border:1px dashed var(--accent-line);border-radius:11px;
  background:var(--accent-soft);color:var(--fg);font-size:var(--fs-sm);line-height:1.8;
}
.ear-hint .eh-spell{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;font-weight:700;
  letter-spacing:2px;word-break:break-all;color:var(--accent);
}
.ear-hint .eh-tip{display:block;margin-top:5px;color:var(--muted);letter-spacing:0;font-weight:400;font-family:inherit;font-size:var(--fs-sm)}
.resume-banner{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.resume-banner .rb-icon{font-size:26px;flex:0 0 auto;color:var(--accent);display:flex}
.resume-banner .rb-info{flex:1;min-width:180px}
.resume-banner .rb-title{font-weight:700;font-size:var(--fs-base);color:var(--accent)}
.resume-banner .rb-sub{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
/* 加载失败 */
.fatal{max-width:560px;margin:80px auto;padding:32px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:center;color:var(--fg)}
.fatal .fatal-ic{color:var(--no);display:flex;justify-content:center;margin-bottom:8px}
.fatal .fatal-ic svg.ic{width:52px;height:52px;stroke-width:1.6}
.fatal h2{font-size:18px;margin:8px 0}
.fatal p{color:var(--muted);font-size:14px;line-height:1.8;margin:0}
/* ============================================================
   一级分类：侧边栏分组
   ============================================================ */
.sb-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px;scrollbar-width:thin}
.sb-scroll::-webkit-scrollbar{width:5px}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.sb-group{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.sb-group.collapsed{margin-bottom:4px}
.sb-group-t{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:9px 12px 3px;opacity:.85;
  display:flex;align-items:center;gap:5px;background:transparent;border:0;font-family:inherit;text-align:left;width:100%;cursor:pointer}
.sb-group-t:hover{opacity:1;color:var(--fg)}
.sb-caret{display:inline-flex;width:11px;flex:0 0 auto;align-items:center}
.sb-caret svg.ic{width:11px;height:11px}
.sb-item .sb-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .sb-n{flex:0 0 auto;font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.sb-item.on .sb-n{background:rgba(255,255,255,.24);color:var(--accent-fg)}
html[data-dark="true"] .sb-item.on .sb-n{background:rgba(0,0,0,.22)}
/* ============================================================
   二级分类条
   ============================================================ */
.subnav{display:none;gap:5px;overflow-x:auto;padding:7px 14px;border-bottom:1px solid var(--line);
  background:var(--surface);scrollbar-width:none;align-items:center}
.subnav::-webkit-scrollbar{display:none}
.subnav:empty{display:none!important}
.sn-item{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;
  padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:.14s}
.sn-item:hover{background:var(--soft);color:var(--fg)}
.sn-item.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.sn-item svg.ic{width:15px;height:15px}
.sn-item .sn-n{font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
/* ============ 分类管理 ============ */
.nm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.nm-group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nm-name{max-width:260px;padding:6px 10px;font-size:13px}
.nm-chip{display:inline-flex;align-items:center;gap:6px;cursor:default}
.nm-chip .nm-rm{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0;font-weight:700}
.nm-chip .nm-rm:hover{color:var(--no)}
.nm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nm-row:last-child{border-bottom:0}
.nm-it{display:inline-flex;align-items:center;gap:7px;flex:1;min-width:0}
.nm-it svg.ic{width:16px;height:16px}
.nm-sel{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
/* ============================================================
   影视库 / 文学库
   ============================================================ */
.md-toolbar{display:flex;flex-direction:column;gap:10px}
.md-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px;align-items:start}
.md-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;
  display:flex;flex-direction:column;gap:8px;transition:.15s;animation:cardIn .24s ease}
.md-card:hover{border-color:var(--accent-line);box-shadow:0 8px 24px rgba(0,0,0,.07)}
.md-top{display:flex;align-items:flex-start;gap:11px}
.md-poster{width:44px;height:60px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-weight:700;font-size:19px;color:#fff;letter-spacing:.5px;
  background:linear-gradient(140deg,var(--accent),#6366f1);box-shadow:0 3px 10px rgba(0,0,0,.14);text-transform:uppercase}
.md-h{flex:1;min-width:0}
.md-t{font-weight:700;font-size:var(--fs-base);line-height:1.35}
.md-cn{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.md-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.md-chip{padding:1px 8px;border-radius:7px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.md-chip.g{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);font-weight:600}
.md-lv{display:inline-flex;gap:2.5px;align-items:center}
.md-lv i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.md-lv i.on{background:var(--accent)}
.md-note{font-size:12.5px;color:var(--muted);line-height:1.7;border-left:2px solid var(--accent-line);padding-left:9px}
.md-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.md-link{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);
  color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-weight:600;transition:.14s}
.md-link:hover{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.md-link svg.ic{width:13px;height:13px}
/* 在线观看 / 在线阅读：平台直达链接（chip 样式的 a 元素需要去掉下划线） */
a.chip, a.md-link{text-decoration:none}
.md-watch .chip{color:var(--accent)}
.md-watch-alt{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.md-watch-t{color:var(--accent);text-decoration:none;margin:0 2px}
.md-watch-t:hover{text-decoration:underline}
.md-acts{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.md-acts .dict-act{width:28px;height:28px}
/* 观后感 / 读后感 */
.note-box{margin-top:6px;border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:7px}
.note-list{display:flex;flex-direction:column;gap:6px}
.note-item{font-size:12.5px;line-height:1.7;display:flex;gap:7px;align-items:flex-start}
.note-round{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;
  background:var(--accent-soft);color:var(--accent);margin-top:2px;white-space:nowrap}
.note-txt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.note-del{flex:0 0 auto;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 3px;align-self:flex-start;display:inline-flex}
.note-del:hover{color:var(--no)}
.note-del svg.ic{width:13px;height:13px}
.note-add{display:flex;gap:7px;align-items:flex-end}
.note-add textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);
  padding:7px 10px;font-family:inherit;font-size:13px;line-height:1.6;outline:none;resize:vertical;min-height:44px}
.note-add textarea:focus{border-color:var(--accent)}
.note-add .btn{flex:0 0 auto}
.note-empty{font-size:12.5px;color:var(--muted)}
/* ============================================================
   打卡
   ============================================================ */
.ci-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.ci-stat{border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center;background:var(--soft)}
.ci-stat b{display:block;font-size:25px;font-family:Georgia,serif;color:var(--accent);line-height:1.25}
.ci-stat span{font-size:11.5px;color:var(--muted)}
.ci-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:430px;width:100%}
.ci-cell{aspect-ratio:1;border-radius:7px;background:var(--soft);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);transition:.14s}
.ci-cell.head{background:transparent;border:0;font-weight:700;font-size:11.5px}
.ci-cell.blank{background:transparent;border:0}
.ci-cell.l1{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:transparent;color:var(--fg)}
.ci-cell.l2{background:color-mix(in srgb,var(--accent) 42%,transparent);border-color:transparent;color:var(--fg)}
.ci-cell.l3{background:color-mix(in srgb,var(--accent) 68%,transparent);border-color:transparent;color:var(--accent-fg)}
.ci-cell.l4{background:var(--accent);border-color:transparent;color:var(--accent-fg);font-weight:700}
.ci-cell.today{outline:2px solid var(--accent);outline-offset:1px}
.ci-styles{display:flex;gap:9px;flex-wrap:wrap}
.ci-style{border:2px solid var(--line);border-radius:11px;padding:3px;background:var(--surface);cursor:pointer;transition:.14s;line-height:0}
.ci-style:hover{border-color:var(--accent-line)}
.ci-style.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ci-style canvas{display:block;width:66px;height:99px;border-radius:7px}
.ci-preview{display:flex;justify-content:center;padding:4px 0}
.ci-preview canvas{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 32px rgba(0,0,0,.1)}
#ciBig{width:360px}
.ci-range{display:flex;gap:8px;flex-wrap:wrap}
/* ============================================================
   词库管理
   ============================================================ */
.tool-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.tool-row .btn{flex:1 1 auto;min-width:132px}
.tool-row + .drop-zone{margin-top:14px}
@media (max-width:560px){.tool-row .btn{flex:1 1 100%}}
/* ---------- 我的页：统计趋势 ---------- */
.me-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.me-trend{overflow:hidden}
.trend-svg{width:100%;height:auto;display:block}
.trend-svg .tg{stroke:var(--line);stroke-width:1}
.trend-svg .tax{fill:var(--muted);font-size:10px}
.trend-svg .tbar{fill:var(--accent);opacity:.85}
.trend-svg .tbar-empty{fill:var(--soft)}
.trend-svg .tw{fill:var(--fg);font-size:10.5px;font-weight:700}
.trend-svg .td{fill:var(--muted);font-size:10.5px}
.trend-svg .tgrd{font-size:11px;font-weight:800}
.trend-svg .tp{fill:var(--no)}
.trend-svg .tl{stroke:var(--no);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.me-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:12px;align-items:center}
.me-legend .lg-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.me-evals{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.me-eval{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
.me-eval-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.me-eval-main b{font-size:var(--fs-sm)}
.me-eval-main span{color:var(--muted);font-size:12px}
.me-eval-time{color:var(--muted);font-size:12px;flex:0 0 auto}
.me-sched{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.me-sched-day{border:1px solid var(--line);border-radius:12px;padding:13px 12px;background:var(--soft);display:flex;flex-direction:column;gap:4px}
.me-sched-day b{font-size:var(--fs-sm)}
.me-sched-day span{color:var(--muted);font-size:12.5px}
@media (max-width:480px){.me-sched{grid-template-columns:1fr}}
.lib-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);
  padding:13px;margin-bottom:10px;background:var(--surface);transition:.15s}
.lib-item.on{border-color:var(--accent-line);background:var(--accent-soft)}
.lib-item.sys{background:var(--soft)}
.lib-ic{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent)}
