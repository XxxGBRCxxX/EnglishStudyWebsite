/* ============ 布局设置（用户可覆盖响应式默认） ============ */
/* 简化布局：侧边栏收成图标导轨（同平板样式） */
html[data-layout="simple"] .sidebar{width:68px;flex:0 0 68px;padding:14px 8px}
html[data-layout="simple"] .sb-brand{padding:4px 0 14px;justify-content:center}
html[data-layout="simple"] .sb-brand>span:last-child{display:none}
html[data-layout="simple"] .sb-group-t{display:none}
html[data-layout="simple"] .sb-item{justify-content:center;padding:10px 0;gap:0}
html[data-layout="simple"] .sb-item .sb-t,
html[data-layout="simple"] .sb-item .sb-n{display:none}
html[data-layout="simple"] .sb-item .si{width:auto}
html[data-layout="simple"] .sb-item .si svg.ic{width:20px;height:20px}
html[data-layout="simple"] .sb-dark{padding:10px 0 4px}
html[data-layout="simple"] .sb-dark button{padding:9px 0}
html[data-layout="simple"] .sb-dark button span:last-child{display:none}
html[data-layout="simple"] .subnav{display:flex}
html[data-layout="simple"] .daily-bar{left:68px}
/* 简化布局：同时收紧页面内卡片与留白、隐藏纯装饰元素 */
html[data-layout="simple"] .card{padding:15px 16px;border-radius:14px}
html[data-layout="simple"] .grid2,html[data-layout="simple"] .grid3{gap:10px}
html[data-layout="simple"] .h2{font-size:15px}
html[data-layout="simple"] .word-cloud{display:none}
/* ============ 文本标注 ============ */
.text-input{font:inherit;font-size:var(--fs-base);width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:var(--bg);color:var(--fg);transition:.15s;box-sizing:border-box}
.text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.anno-input{width:100%;min-height:180px;resize:vertical;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-family:Georgia,serif;font-size:15.5px;line-height:1.75;box-sizing:border-box;outline:none;transition:.15s}
.anno-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.anno-stats{display:flex;gap:16px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.anno-stats b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.anno-stats-hint{margin-left:auto;font-size:12px}
.anno-result{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:2.1;word-break:break-word;white-space:pre-wrap}
.anno{font-weight:600}
.anno-known{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:2px}
.anno-known:hover{background:var(--accent-soft)}
.anno-unknown{color:var(--no);cursor:pointer;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:3px;border-radius:2px}
.anno-unknown:hover{background:rgba(220,38,38,.1)}
.anno-form{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.anno-lab{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
.anno-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.anno-mrow{display:flex;gap:8px;align-items:center}
.anno-mrow .text-input{flex:1}
/* ============ 单词选择器 ============ */
.picker-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.pick-word{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;transition:.13s;font:inherit;color:var(--fg)}
.pick-word:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick-word.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pick-word.anchor{border-color:var(--no);box-shadow:0 0 0 2px var(--accent-line)}
.pick-w{font-family:Georgia,serif;font-weight:700;font-size:15px;word-break:break-word}
.pick-m{font-size:12px;color:var(--muted);line-height:1.35;word-break:break-word}
.pick-badge{font-size:10.5px;padding:1px 7px;border-radius:99px;font-weight:600}
.pick-badge.new{background:var(--soft);color:var(--muted)}
.pick-badge.ok{background:rgba(59,130,246,.14);color:#3b82f6}
.pick-badge.wrong{background:rgba(220,38,38,.13);color:#dc2626}
html[data-dark="true"] .pick-badge.ok{color:#60a5fa}
html[data-dark="true"] .pick-badge.wrong{color:#f87171}
/* ============ 笔记模式 ============ */
.note-stage{display:flex;justify-content:center;padding:12px 0;perspective:1600px}
.note-paper{position:relative;background:#fffdf6;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 34px rgba(15,23,42,.16);overflow:hidden;transform-style:preserve-3d;transition:transform .2s ease;flex:none}
.note-paper-rules{position:absolute;pointer-events:none;z-index:0}
.note-paper-in{position:absolute;inset:0;overflow:hidden;color:#0f172a;z-index:1}
.note-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;font-size:var(--fs-sm)}
.note-grid{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:14px}
.note-num{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.note-auto-tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.nw-cols{display:flex;align-items:flex-start;width:100%}
.nw-col{flex:1 1 0;min-width:0}
.note-num input{width:62px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.note-word{margin-bottom:0;break-inside:avoid}
.nw-row{display:flex;flex-wrap:wrap;align-items:baseline;overflow:hidden}
.nw-gap{display:inline-block;flex:0 0 auto;height:1em}
.nw-w{font-family:Georgia,serif;font-weight:700;font-size:1.1em}
.nw-sep{opacity:.4;padding:0 1px}
.nw-ex,.nw-tr,.nw-syn,.nw-ant,.nw-comp,.nw-verb,.nw-morph{font-size:.95em}
.note-stage.spread{gap:18px;flex-wrap:nowrap}
.note-paper [data-w]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;text-decoration-thickness:1px}
.note-paper .nw-w[data-w]{text-decoration:none}
.note-paper .nw-w[data-w]:hover{text-decoration:underline dotted}
/* 页内子页签（生成+打印 / 预览） */
.note-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
/* 积木编辑器 */
.blk-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:42px;padding:6px 8px;border:1px dashed var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg);transition:border-color .15s,background .15s}
.blk-row.over{border-color:var(--accent);background:var(--accent-soft)}
.blk-lab{font-size:12px;color:var(--muted);flex:0 0 auto}
.blk{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;cursor:grab;user-select:none}
.blk.dragging{opacity:.35}
.blk-pad{width:44px;font:inherit;font-size:12px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.blk-b{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font:inherit;font-size:13px;line-height:1}
.blk-b:hover{color:var(--accent)}
.blk-drop{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:4px 8px;background:none;cursor:pointer}
.blk-drop.over{border-color:var(--accent);color:var(--accent)}
.blk-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.blk-pool .blk{opacity:.75}
.blk-grip{touch-action:none;cursor:grab;color:var(--muted);font-weight:700;padding:0 3px;user-select:none}
.blk-clone{box-shadow:0 8px 22px rgba(15,23,42,.3);opacity:.96;cursor:grabbing}
.blk-clone .blk-b,.blk-clone .blk-pad,.blk-clone .blk-more{display:none}
/* 点积木弹出的操作菜单（手机端没有可靠拖拽，改成点开菜单上下左右移） */
.blk-menu{position:fixed;z-index:9998;min-width:158px;padding:6px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);box-shadow:0 14px 36px rgba(15,23,42,.24);display:flex;flex-direction:column;gap:3px}
.blk-menu[hidden]{display:none}
.blk-menu-t{font-size:11.5px;color:var(--muted);padding:4px 8px 2px}
.blk-mi{font:inherit;font-size:14px;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.blk-mi:hover{background:var(--accent-soft);color:var(--accent)}
.blk-mi.danger{color:var(--no)}
.blk-mi.danger:hover{background:rgba(239,68,68,.12);color:var(--no)}
.blk-more{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 3px;font:inherit;font-size:14px;line-height:1}
.blk-more:hover{color:var(--accent)}
.blk-tap-hint{margin:0 0 10px;font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:8px;background:var(--soft)}
.note-pdf-range{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.pk-rand{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.pk-rand input{width:56px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.pk-range-hint{margin:10px 0 0;font-size:12.5px;color:var(--muted);padding:7px 10px;border-radius:8px;background:var(--soft)}
.pk-range-hint.on{color:var(--accent);background:var(--accent-soft)}
/* 单词语格式预览（一个样例词） */
.note-sample{position:relative;max-width:430px;margin:0 auto;padding:22px 26px;background:#fffdf6;border:1px solid var(--line);border-radius:8px;overflow:auto}
.note-sample-rules{position:absolute;inset:22px 26px;pointer-events:none}
.note-sample-in{position:relative;min-height:60px}
/* 三个等大动作按钮（生成打印页 / 存为PDF / 预览） */
.note-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.note-actions .btn{flex:1 1 0;min-width:130px;justify-content:center}
/* 手机端积木编辑器 */
@media (max-width:640px){
  .blk-row{padding:8px;gap:6px}
  .blk{font-size:14px;padding:6px 10px;gap:6px}
  .blk-b{font-size:16px;padding:4px 8px;min-width:30px;min-height:30px}
  .blk-pad{width:56px;font-size:14px;padding:4px 6px}
  .blk-grip{font-size:18px;padding:2px 10px;min-height:30px;display:inline-flex;align-items:center}
  .blk-more{font-size:19px;padding:2px 8px;min-height:30px}
  .blk-menu{min-width:184px}
  .blk-mi{font-size:15px;padding:12px 14px}
  .blk-drop{flex:1 1 100%}
  .note-actions .btn{min-width:0;flex:1 1 100%}
  .note-sample{max-width:100%;padding:16px 16px}
  .note-sample-rules{inset:16px 16px}
}
.fb-qrs{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:16px}
.fb-qr{flex:1 1 150px;max-width:190px;text-align:center}
.fb-qr img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
.fb-qr-t{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--fg)}
.fb-qr-t .ic{width:16px;height:16px}
@media print{.sidebar,.topbar,.bottom-nav,.daily-bar,.subnav{display:none!important}}
</style>

if(typeof window.BANK === 'undefined'){

      + '<div class="fatal-ic"><svg class="ic" style="width:52px;height:52px"><use href="#i-alert"></use></svg></div>'

      + '</div>';

}

/* ------------------------------------------------------------
   图标：全站零 emoji，统一用内联 SVG 精灵
   ------------------------------------------------------------ */
function IC(name, extra){
  return '<svg class="ic"' + (extra ? ' style="' + extra + '"' : '') + ' aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
}
function BRAND_SVG(){
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<rect width="64" height="64" rx="15" fill="var(--accent)"/>'
    + '<text x="32" y="46" font-size="38" font-weight="700" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="var(--accent-fg)">聚</text>'
    + '</svg>';
}
function fillStaticIcons(){
  var list = document.querySelectorAll('[data-ic]');
  for(var i = 0; i < list.length; i++){
    var el = list[i];
    if(el.dataset.icDone) continue;
    el.innerHTML = IC(el.dataset.ic);
    el.dataset.icDone = '1';
  }
  var sb = document.getElementById('sbBrandIc');   if(sb) sb.innerHTML = BRAND_SVG();
  var mb = document.getElementById('mobBrandIc');  if(mb) mb.innerHTML = BRAND_SVG();
}

/* ------------------------------------------------------------
   索引
   ------------------------------------------------------------ */
var DATA = {}, WORD_INDEX = {}, ALL_MAP = new Map();
var LEVELS = [];
for(var _key in BANK){
  if(!BANK[_key] || !BANK[_key].list) continue;
  LEVELS.push(_key);
  var _words = BANK[_key].list.map(function(a){
    return { w:a[0], p:a[1], m:a[2], ex:(a[3] || []).map(function(e){ return { t:e[0], tr:e[1], s:e[2] }; }) };
  });
  DATA[_key] = { name:BANK[_key].name, words:_words };
  _words.forEach(function(w){
    var k = w.w.toLowerCase();
    WORD_INDEX[k] = w;
    if(!ALL_MAP.has(k)) ALL_MAP.set(k, { w:w.w, p:w.p, m:w.m, ex:w.ex, levels:[_key] });
    else ALL_MAP.get(k).levels.push(_key);
  });
}
var ALL_WORDS = Array.from(ALL_MAP.values());
function LEVEL_NAME(k){ return DATA[k] ? DATA[k].name : k; }
function findWord(k){ return WORD_INDEX[String(k || '').toLowerCase()] || null; }
function wordLevels(k){ var it = ALL_MAP.get(String(k || '').toLowerCase()); return it ? it.levels : []; }
function inLevel(k, lv){ return lv === 'all' || wordLevels(k).indexOf(lv) >= 0; }
function curWords(){ return DATA[S.level].words; }

/* ------------------------------------------------------------

   ------------------------------------------------------------ */

];

var BANK_TABS = [
  { k:'all',      name:'全部' },

  { k:'senior',   name:'高中' },

/* ------------------------------------------------------------

/* ------------------------------------------------------------
   中文释义判分：标准义项、它的近义词、写得更简略/更完整 都算对

function normalizeCn(s){
  return String(s == null ? '' : s)
    .replace(/[\s，。！？、；：""''（）()\[\]「」【】~～·…—\-_,.!?;:]/g, '')
    .trim();
}
function senseList(m){
  var str = String(m == null ? '' : m).replace(/^((?:n|v|vt|vi|adj|adv|prep|conj|pron|num|int|art|aux|abbr)\.\s*)+/i, '');
  var out = [];
  str.replace(/[（(][^）)]*[）)]/g, ' ').split(/[；;，,、\/]/).forEach(function(x){
    var t = normalizeCn(x);
    if(t) out.push(t);
  });
  return out;
}
function cnSynOf(sense){
  var k = String(sense || '').trim();
  if(!k) return null;
  if(CN_SYN[k]) return CN_SYN[k];
  var k2 = k.replace(/[的地得]$/, '');
  if(k2 !== k && CN_SYN[k2]) return CN_SYN[k2];
  return null;
}
function cnHit(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  if(a.length < 2 || b.length < 2) return false;
  return a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}
function checkMeaning(input, m){
  var inp = normalizeCn(input);
  if(!inp) return false;
  var senses = senseList(m);
  for(var i = 0; i < senses.length; i++){
    var sd = senses[i];
    if(cnHit(inp, sd)) return true;
    var syn = cnSynOf(sd);
    if(syn){
      for(var j = 0; j < syn.length; j++){
        if(cnHit(inp, normalizeCn(syn[j]))) return true;
      }
    }
    var back = cnSynOf(inp);
    if(back){
      for(var j2 = 0; j2 < back.length; j2++){
        if(cnHit(sd, normalizeCn(back[j2]))) return true;
      }
    }
  }
  return false;
}

/* ============================================================

var QR_EC_M = 0;   /* 本实现只做 M 级 */

var QR_INFO = {
  1:  { ec:10, g:[[1,16]] },
  2:  { ec:16, g:[[1,28]] },
  3:  { ec:26, g:[[1,44]] },
  4:  { ec:18, g:[[2,32]] },
  5:  { ec:24, g:[[2,43]] },
  6:  { ec:16, g:[[4,27]] },
  7:  { ec:18, g:[[4,31]] },
  8:  { ec:22, g:[[2,38],[2,39]] },
  9:  { ec:22, g:[[3,36],[2,37]] },
  10: { ec:26, g:[[4,43],[1,44]] }

  1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],
  6:[6,34], 7:[6,22,38], 8:[6,24,42], 9:[6,26,46], 10:[6,28,50]

/* ---------- GF(256) ---------- */
var _qrExp = null, _qrLog = null;
function qrInitGF(){
  if(_qrExp) return;
  _qrExp = new Array(512);
  _qrLog = new Array(256);
  var x = 1;
  for(var i = 0; i < 255; i++){
    _qrExp[i] = x;
    _qrLog[x] = i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(var j = 255; j < 512; j++) _qrExp[j] = _qrExp[j - 255];
}
function qrMul(a, b){
  if(a === 0 || b === 0) return 0;
  return _qrExp[_qrLog[a] + _qrLog[b]];
}
/* 生成多项式 g(x) = (x-a^0)(x-a^1)…(x-a^(n-1))
   返回 n 个系数，降幂排列，不含恒为 1 的首项
   （即 ISO/IEC 18004 / Nayuki qrcodegen 的 divisor） */
function qrGenPoly(n){
  qrInitGF();
  var res = new Array(n);
  for(var i = 0; i < n; i++) res[i] = 0;
  res[n - 1] = 1;
  var root = 1;
  for(var i = 0; i < n; i++){
    for(var j = 0; j < n; j++){
      res[j] = qrMul(res[j], root);
      if(j + 1 < n) res[j] ^= res[j + 1];
    }
    root = qrMul(root, 0x02);
  }
  return res;
}
/* 对数据码字求 n 个纠错码字（移位寄存器除法取余） */
function qrRS(data, n){
  var div = qrGenPoly(n);
  var res = new Array(n);
  for(var i = 0; i < n; i++) res[i] = 0;
  for(var k = 0; k < data.length; k++){
    var factor = data[k] ^ res[0];
    for(var j = 0; j < n - 1; j++) res[j] = res[j + 1];
    res[n - 1] = 0;
    if(factor !== 0){
      for(var m = 0; m < n; m++) res[m] ^= qrMul(div[m], factor);
    }
  }
  return res;
}

/* ---------- 位流 ---------- */
function qrBytes(text){
  /* UTF-8 编码 */
  var out = [];
  for(var i = 0; i < text.length; i++){
    var c = text.charCodeAt(i);
    if(c < 0x80) out.push(c);
    else if(c < 0x800){ out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
    else if(c >= 0xD800 && c <= 0xDBFF && i + 1 < text.length){
      var c2 = text.charCodeAt(i + 1);
      if(c2 >= 0xDC00 && c2 <= 0xDFFF){
        var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
        i++;
      }else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }

function qrTotalData(ver){
  var info = QR_INFO[ver], n = 0;
  info.g.forEach(function(p){ n += p[0] * p[1]; });

function qrPickVersion(len){

  }

  var totalData = qrTotalData(ver);
  var bits = [];
  function put(val, n){ for(var i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
  put(4, 4);                                   /* 字节模式 */
  put(bytes.length, ver <= 9 ? 8 : 16);
  for(var i = 0; i < bytes.length; i++) put(bytes[i], 8);
  var cap = totalData * 8;
  var term = Math.min(4, cap - bits.length);
  for(var t = 0; t < term; t++) bits.push(0);
  while(bits.length % 8 !== 0) bits.push(0);
  var words = [];
  for(var b = 0; b < bits.length; b += 8){
    var w = 0;
    for(var k = 0; k < 8; k++) w = (w << 1) | bits[b + k];
    words.push(w);

  while(words.length < totalData){ words.push(pad[pi % 2]); pi++; }

  info.g.forEach(function(p){
    for(var i = 0; i < p[0]; i++){

      idx += p[1];
      blocks.push({ d:d, e:qrRS(d, ecLen) });
      if(p[1] > maxData) maxData = p[1];
    }
  });
  var out = [];
  for(var c = 0; c < maxData; c++){
    blocks.forEach(function(b){ if(c < b.d.length) out.push(b.d[c]); });
  }
  for(var c2 = 0; c2 < ecLen; c2++){
    blocks.forEach(function(b){ out.push(b.e[c2]); });
  }
  return out;
}

function levDist(a, b){
  a = normSpeech(a); b = normSpeech(b);
  var m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  var d = [], i, j;
  for(i = 0; i <= m; i++){ d[i] = [i]; }
  for(j = 0; j <= n; j++){ d[0][j] = j; }
  for(i = 1; i <= m; i++){
    for(j = 1; j <= n; j++){
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));

}

  var a = normSpeech(input), b = normSpeech(word);

  }else{
    if(h.st) h.st.textContent = '';
    if(h.tip){ h.tip.textContent = '没听清，请按住按钮再说一次'; h.tip.classList.add('on'); }
  }
}
function shadowHoldStop(reason){
  var h = _shadowHold;
  if(!h) return;
  _shadowHold = null;
  if(h.timer){ clearInterval(h.timer); h.timer = null; }
  if(h.btn) h.btn.classList.remove('holding');
  h.released = true;
  h.reason = reason || 'up';
  try{ if(h.rec && h.rec.stop) h.rec.stop(); }catch(e){}
  /* 松手后留一点时间等最后一次识别结果回来；空结果不提交 */
  h.grace = setTimeout(function(){ shadowHoldFinalize(h, (h.text || '').trim()); }, 900);
}
function bindShadowHold(btn, tip, st){
  if(!btn) return;
  function start(e){
    if(e && e.preventDefault) e.preventDefault();
    if(_shadowHold) return;
    if(!speechSupported()){ toast('此浏览器不支持语音识别，请使用 Chrome / Edge'); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var h = { btn:btn, tip:tip, st:st, text:'', done:false, released:false, t0:Date.now(), rec:null, timer:null, grace:null };
    try{
      var r = new SR();
      r.lang = 'en-US';
      r.interimResults = true;
      r.continuous = true;
      r.maxAlternatives = 3;
      r.onresult = function(ev){
        var s = '';
        for(var i = 0; i < ev.results.length; i++){
          if(ev.results[i] && ev.results[i][0]) s += ev.results[i][0].transcript + ' ';
        }
        h.text = s.replace(/\s+/g, ' ').trim();
        if(h.st) h.st.textContent = h.text ? ('听到：' + h.text) : '';
      };
      r.onerror = function(ev){
        var err = ev && ev.error;
        if(err === 'not-allowed' || err === 'service-not-allowed') toast('麦克风被拒绝，请在浏览器里允许麦克风');
        else if(err && err !== 'no-speech' && err !== 'aborted') toast('识别失败：' + err);
      };
      r.onend = function(){
        h.rec = null;
        if(h.released && !h.done) shadowHoldFinalize(h, (h.text || '').trim());
      };
      h.rec = r;
      r.start();
    }catch(err){ toast('无法启动语音识别'); return; }
    _shadowHold = h;
    btn.classList.add('holding');
    if(tip){ tip.classList.add('on'); tip.textContent = '● 正在聆听 0.0 秒 · 松手结束判定'; }
    h.timer = setInterval(function(){
      if(!btn.isConnected){ shadowHoldStop('detached'); return; }
      var sec = (Date.now() - h.t0) / 1000;
      if(tip) tip.textContent = '● 正在聆听 ' + sec.toFixed(1) + ' 秒 · 松手结束判定';
      if(sec > 15) shadowHoldStop('timeout');   /* 最多 15 秒，避免一直按着不放 */
    }, 100);
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
  }
  function end(e){
    if(e && e.preventDefault) e.preventDefault();
    if(!_shadowHold) return;
    shadowHoldStop('up');
  }
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  btn.addEventListener('dragstart', function(e){ e.preventDefault(); });
  /* 键盘可达：按住空格 / 回车开始，松开判定 */
  btn.addEventListener('keydown', function(e){ if((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
  btn.addEventListener('keyup', function(e){ if(e.key === ' ' || e.key === 'Enter') end(e); });
}

  var n = parseInt(S.settings.shadowRepeat, 10);

    i++;
    if(i < n) setTimeout(one, 1000);
  }

}

function favId(item){
  if(item.type === 'word') return 'word|' + item.key;
  if(item.type === 'ex') return 'ex|' + item.key + '|' + item.en;
  if(item.type === 'proverb') return 'proverb|' + item.en;
  if(item.type === 'rel') return 'rel|' + item.key + '|' + item.w;
  if(item.type === 'phrase') return 'phrase|' + item.en;

}
function findFav(item){

}

var _dlgOnKey = null;
function closeDialog(){

function uiDialog(o){
  o = o || {};
  var mask = $('#dlg'), box = $('#dlgBox');
  if(!mask || !box) return;
  var warn = !!o.danger;
  box.innerHTML =
      '<div class="dlg-h' + (warn ? ' warn' : '') + '">' + IC(warn ? 'shield' : 'info')
    + '<span>' + escapeHtml(o.title || '提示') + '</span></div>'

        ? '<div class="dlg-b dlg-html">' + o.html + '</div>'
        : '<div class="dlg-b">' + escapeHtml(o.body || '') + '</div>')

        + escapeHtml(o.placeholder || '') + '" value="' + escapeHtml(o.value || '') + '">' : '')
    + '<div class="dlg-f">'

          '<button class="btn ghost" id="dlgCancel">' + escapeHtml(o.cancelText || '取消') + '</button>')
    +   '<button class="btn' + (warn ? ' danger' : '') + '" id="dlgOk">' + escapeHtml(o.okText || '确定') + '</button>'

  };

}

/* ============================================================
   打卡：每日学习量（单词数 / 时长 / 正确率）
   ============================================================ */
var _lastBump = 0;
function checkinDay(k){
  if(!S.checkin[k]) S.checkin[k] = { words:0, seconds:0, correct:0, total:0, rounds:0 };
  return S.checkin[k];
}
function checkinToday(){ return checkinDay(todayKey()); }
function checkinActive(d){ return !!(d && ((d.words || 0) > 0 || (d.total || 0) > 0)); }
function checkinBump(ok){
  var now = Date.now();
  var d = checkinToday();
  if(_lastBump){
    var gap = Math.round((now - _lastBump) / 1000);
    if(gap > 0 && gap <= 300) d.seconds += gap;
  }
  _lastBump = now;
  d.total++;
  if(ok) d.correct++;
  save();
}
function checkinWordDone(){ checkinToday().words++; save(); }
function checkinRoundDone(){ checkinToday().rounds++; save(); }
function dateKeyOf(dt){ return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }
function checkinStats(){
  var days = Object.keys(S.checkin).filter(function(k){ return checkinActive(S.checkin[k]); }).sort();
  var words = 0, seconds = 0, correct = 0, total = 0;
  days.forEach(function(k){
    var d = S.checkin[k];
    words += d.words || 0; seconds += d.seconds || 0;
    correct += d.correct || 0; total += d.total || 0;
  });
  /* 当前连续天数：今天没学就从昨天往前数 */
  var probe = new Date(), cur = 0;
  if(!checkinActive(S.checkin[dateKeyOf(probe)])) probe.setDate(probe.getDate() - 1);
  while(checkinActive(S.checkin[dateKeyOf(probe)])){ cur++; probe.setDate(probe.getDate() - 1); }
  /* 历史最长连续 */
  var max = 0, run = 0, prev = null;
  days.forEach(function(k){
    if(prev && Math.round((new Date(k) - new Date(prev)) / 86400000) === 1) run++;
    else run = 1;
    prev = k;
    if(run > max) max = run;
  });
  return {
    cur:cur, max:Math.max(max, cur), days:days.length, words:words,
    seconds:seconds, correct:correct, total:total,
    today:dateKeyOf(new Date()),
    todayData:S.checkin[dateKeyOf(new Date())] || { words:0, seconds:0, correct:0, total:0, rounds:0 },
    keys:days
  };
}
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if(h > 0) return h + ' 小时 ' + m + ' 分';
  if(m > 0) return m + ' 分钟';
  return sec + ' 秒';
}
/* 某月的打卡格子：[{k, day, active, today, future}] */
function checkinMonth(year, month){
  var first = new Date(year, month, 1);
  var startPad = (first.getDay() + 6) % 7;   /* 周一为一周开头 */
  var total = new Date(year, month + 1, 0).getDate();
  var out = [];
  for(var i = 0; i < startPad; i++) out.push({ blank:true });
  var todayK = dateKeyOf(new Date());
  for(var d = 1; d <= total; d++){
    var k = year + '-' + pad2(month + 1) + '-' + pad2(d);
    out.push({ k:k, day:d, active:checkinActive(S.checkin[k]), today:k === todayK, future:k > todayK });
  }
  return out;
}

/* ============================================================
   词库管理：内置词库 + 用户导入词库
   ============================================================ */
function allLibs(){
  var out = [{ id:'default', name:'内置词库', sys:true, count:ALL_WORDS.length }];
  S.libs.forEach(function(L){ out.push({ id:L.id, name:L.name, sys:false, count:(L.items || []).length, time:L.time }); });
  return out;
}
function activeLibIds(){ return S.activeLibs.slice(); }
function isLibActive(id){ return S.activeLibs.indexOf(id) >= 0; }
function toggleLib(id){
  var i = S.activeLibs.indexOf(id);
  if(i >= 0){
    if(S.activeLibs.length <= 1){ toast('至少保留一个词库'); return; }
    S.activeLibs.splice(i, 1);
  }else{
    S.activeLibs.push(id);
  }
  save();
}
function libById(id){
  if(id === 'default') return { id:'default', name:'内置词库', sys:true, items:null };
  for(var i = 0; i < S.libs.length; i++) if(S.libs[i].id === id) return S.libs[i];
  return null;
}
function libWordCountOf(id){
  if(id === 'default') return ALL_WORDS.length;
  var L = libById(id);
  return L ? (L.items || []).length : 0;
}
function removeLib(id){
  S.libs = S.libs.filter(function(L){ return L.id !== id; });
  S.activeLibs = S.activeLibs.filter(function(x){ return x !== id; });
  if(!S.activeLibs.length) S.activeLibs = ['default'];
  save();
  applyUserLibs();
}
function resetLibs(){
  S.libs = [];
  S.activeLibs = ['default'];
  save();
  applyUserLibs();
}
/* 当前可见的学段：内置学段需启用「内置词库」，my 学段需启用至少一个用户词库 */
function visibleLevels(){
  var out = [];
  LEVELS.forEach(function(k){
    if(k === 'user'){
      if(DATA.user && DATA.user.words.length && S.activeLibs.some(function(x){ return x !== 'default'; })) out.push(k);
      return;
    }
    if(isLibActive('default')) out.push(k);
  });
  return out.length ? out : ['default'].concat(LEVELS);
}
/* 把已启用的用户词库并成 DATA.user，导入后立即可学 */
function applyUserLibs(){
  /* 先摘掉上一轮并入的 user 词条，否则停用 / 删除词库后词会残留在词表和词典里 */
  var stale = [];
  ALL_MAP.forEach(function(v, k){ if(v.levels && v.levels.indexOf('user') >= 0) stale.push(k); });
  stale.forEach(function(k){
    var v = ALL_MAP.get(k);
    v.levels = v.levels.filter(function(x){ return x !== 'user'; });
    if(!v.levels.length){
      /* 只属于用户词库：从索引里彻底摘掉；仍属内置学段的则保留 */
      ALL_MAP.delete(k);
      delete WORD_INDEX[k];
    }
  });

  var list = [], seen = {};
  S.activeLibs.forEach(function(id){
    if(id === 'default') return;
    var L = libById(id);
    if(!L) return;
    (L.items || []).forEach(function(e){
      if(!Array.isArray(e) || !e[0]) return;
      var k = String(e[0]).toLowerCase();
      if(seen[k]) return;
      seen[k] = 1;
      var ex = (Array.isArray(e[3]) && e[3].length ? e[3] : [['', '', '例句']]).map(function(g){
        return { t:g[0], tr:g[1], s:g[2] || '例句' };
      });
      list.push({ w:e[0], p:e[1] || '', m:e[2] || '', ex:ex });
    });
  });
  list.sort(function(a, b){ return a.w.toLowerCase().localeCompare(b.w.toLowerCase(), 'en'); });
  DATA.user = { name:'我的词库', words:list };
  if(LEVELS.indexOf('user') < 0) LEVELS.push('user');
  list.forEach(function(w){
    var k = w.w.toLowerCase();
    if(!WORD_INDEX[k]) WORD_INDEX[k] = w;
    if(!ALL_MAP.has(k)) ALL_MAP.set(k, { w:w.w, p:w.p, m:w.m, ex:w.ex, levels:['user'] });
    else if(ALL_MAP.get(k).levels.indexOf('user') < 0) ALL_MAP.get(k).levels.push('user');
  });
  ALL_WORDS = Array.from(ALL_MAP.values());
  if(visibleLevels().indexOf(S.level) < 0) S.level = visibleLevels()[0];
}

/* 反向索引：过去式/过去分词 → 原型（规则动词全表 + 不规则动词表 + 用户自加） */
var _annoVerbBase = null;
function annoVerbBaseMap(){
  if(_annoVerbBase) return _annoVerbBase;
  var m = {};
  function put(form, base){
    if(!form || String(form).indexOf(' ') >= 0) return;
    var f = String(form).toLowerCase();
    if(f && !m[f]) m[f] = String(base).toLowerCase();
  }
  for(var k in VERB_FORMS){
    var vf = VERB_FORMS[k];
    if(vf && vf.length){ put(vf[0], k); put(vf[1], k); }
  }
  for(var lv in IRREGULAR){
    (IRREGULAR[lv] || []).forEach(function(v){ put(v.p, v.b); put(v.pp, v.b); });
  }
  (S && S.extras && S.extras.irregular || []).forEach(function(v){ put(v.p, v.b); put(v.pp, v.b); });
  _annoVerbBase = m;
  return m;
}
/* 反向索引：比较级/最高级 → 原型（含用户自加） */
var _annoCompBase = null;
function annoCompBaseMap(){
  if(_annoCompBase) return _annoCompBase;
  var m = {};
  function put(form, base){
    if(!form || String(form).indexOf(' ') >= 0) return;
    var f = String(form).toLowerCase();
    if(f && !m[f]) m[f] = String(base).toLowerCase();
  }
  for(var lv in COMPARATIVES){
    (COMPARATIVES[lv] || []).forEach(function(v){ put(v.c, v.b); put(v.s, v.b); });
  }
  _annoCompBase = m;
  return m;
}
function findBase(tok){
  var t = tok.toLowerCase();
  if(t.length < 3) return null;
  var tries = [
    t.replace(/ies$/, 'y'), t.replace(/es$/, ''), t.replace(/s$/, ''),
    t.replace(/ing$/, 'e'), t.replace(/ing$/, ''), t.replace(/ied$/, 'y'),
    t.replace(/ed$/, 'e'), t.replace(/ed$/, ''), t.replace(/ly$/, '')
  ];
  for(var i = 0; i < tries.length; i++){
    if(tries[i].length >= 2){ var w = findWord(tries[i]); if(w) return w; }
  }
  /* 过去式/过去分词 → 原型（went→go、bought→buy、abode→abide 等不规则变化） */
  var vb = annoVerbBaseMap()[t];
  if(vb){ var wv = findWord(vb); if(wv) return wv; }
  /* 比较级/最高级 → 原型（bigger→big、worse→bad、best→good 等） */
  var cb = annoCompBaseMap()[t];
  if(cb){ var wc = findWord(cb); if(wc) return wc; }
  return null;
}
function highlightAll(text, forceSet){
  var tokens = String(text).split(/(\b[A-Za-z][A-Za-z'-]*\b)/);
  return tokens.map(function(tok){
    if(!tok) return '';
    var direct = findWord(tok);
    if(direct && (!forceSet || forceSet.has(direct.w)))
      return '<span class="w-link" data-w="' + escapeHtml(direct.w) + '">' + escapeHtml(tok) + '</span>';
    var base = findBase(tok);
    if(base && (!forceSet || forceSet.has(base.w)))
      return '<span class="w-link" data-w="' + escapeHtml(base.w) + '">' + escapeHtml(tok) + '</span>';
    return escapeHtml(tok);
  }).join('');
}

document.addEventListener('click', function(e){

  if(sp){ e.preventDefault(); speak(sp.dataset.say, 'en'); return; }
  var spc = t.closest ? t.closest('[data-say-cn]') : null;
  if(spc){ e.preventDefault(); speak(spc.dataset.sayCn, 'cn'); return; }
  var fe = t.closest ? t.closest('[data-fav-ex]') : null;
  if(fe){
    e.preventDefault();
    toggleFavEx(fe.dataset.favEx, fe.dataset.en, fe.dataset.cn, fe.dataset.src);
    fe.classList.toggle('on', isFavEx(fe.dataset.favEx, fe.dataset.en));
    return;
  }
  var fr = t.closest ? t.closest('[data-fav-rel]') : null;
  if(fr){
    e.preventDefault(); e.stopPropagation();
    var item = fr.closest('.syn-item');
    var diffEl = item ? item.querySelector('.syn-diff') : null;
    var keyw = item ? item.dataset.relkey : '';
    var mode = item ? item.dataset.relmode : 'syn';
    toggleFavRel(keyw, fr.dataset.favRel, diffEl ? diffEl.textContent : '', mode);
    var nowOn = S.favs.some(function(f){ return f.type === 'rel' && f.key === String(keyw).toLowerCase() && f.w === fr.dataset.favRel; });
    fr.classList.toggle('on', nowOn);
    return;
  }
  var wr = t.closest ? t.closest('[data-wr-rel]') : null;
  if(wr){
    e.preventDefault(); e.stopPropagation();
    var it2 = wr.closest('.syn-item');
    var d2 = it2 ? it2.querySelector('.syn-diff') : null;
    addWrongWord(wr.dataset.wrRel, d2 ? d2.textContent : '');

    return;

  var aa = t.closest ? t.closest('[data-anno-add]') : null;
  if(aa){ e.preventDefault(); annoAddOpen(aa.dataset.annoAdd); return; }
});

/* ============================================================
   学习引擎
   ============================================================ */
function startLearning(n){
  var pool = curWords();
  var known = {};
  S.batch.forEach(function(w){ known[w] = 1; });
  var cand = pool.filter(function(w){ return !known[w.w]; });
  if(cand.length < n) cand = pool.slice();
  var picked = shuffle(cand).slice(0, Math.min(n, cand.length));
  if(!picked.length){ toast('词库为空'); return; }
  S.batch = picked.map(function(w){ return w.w; });
  S.batchStage = {};
  S.flow.forEach(function(k){ S.batchStage[k] = 0; });
  save();
  startSession(picked, S.flow.slice(), { mode:'learn' });
}
function startSession(words, flow, opts){
  if(!words.length){ toast('没有可学习的单词'); return; }
  if(!flow.length) flow = ['cn2en'];
  session = {
    words:words, flow:flow, stepIdx:0, wordIdx:0,
    correct:0, total:0, feedback:null, stageIntro:false,
    timed:!!opts.timed, mode:opts.mode || 'learn', timerLeft:null,
    startedAt:Date.now(), level:S.level
  };
  view = 'study';
  saveSession();
  render();
}
function resumeSession(saved){
  var words = saved.words.map(findWord).filter(Boolean);
  if(!words.length){ toast('无法恢复：单词已丢失'); clearSavedSession(); return; }
  session = {
    words:words, flow:saved.flow || ['cn2en'],
    stepIdx:saved.stepIdx || 0, wordIdx:saved.wordIdx || 0,
    correct:saved.correct || 0, total:saved.total || 0,
    feedback:null, stageIntro:false, timed:!!saved.timed,
    mode:saved.mode || 'learn', timerLeft:null,
    startedAt:saved.savedAt || Date.now(), level:S.level
  };
  view = 'study';
  render();
}
function renderStudy(app){
  if(!session){ view = 'home'; render(); return; }
  var s = session;
  if(s.stepIdx >= s.flow.length){ finishSession(); return; }
  if(s.stageIntro){
    var prev = s.flow[s.stepIdx - 1], next = s.flow[s.stepIdx];
    app.innerHTML = '<div class="card center" style="padding:48px 24px">'
      + '<div class="stage-badge">' + IC('check') + '</div>'
      + '<h2 class="h2" style="font-size:var(--fs-lg);margin-bottom:4px;justify-content:center;display:flex">' + escapeHtml(STEP_LABEL(prev)) + ' 阶段完成</h2>'
      + '<p class="muted" style="margin:0">' + s.words.length + ' 个单词已全部完成本阶段</p>'
      + '<div class="divider"></div>'
      + '<p class="muted" style="margin:0">接下来进入</p>'
      + '<h3 style="font-size:22px;margin:8px 0 4px;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px">' + STEP_ICON(next) + escapeHtml(STEP_LABEL(next)) + '</h3>'
      + '<p class="muted" style="margin:0">' + escapeHtml(STEPS[next].desc) + '</p>'
      + '<button class="btn primary big" id="stageGo" style="margin-top:22px">开始</button>'
      + '</div>';
    $('#stageGo').onclick = function(){ s.stageIntro = false; render(); };
    return;
  }
  var word = s.words[s.wordIdx];
  var step = s.flow[s.stepIdx];
  var totalSteps = s.words.length * s.flow.length;
  var doneSteps = s.stepIdx * s.words.length + s.wordIdx;
  var pct = Math.round(doneSteps / totalSteps * 100);
  var meta = [];
  meta.push('<span>' + (s.wordIdx + 1) + ' / ' + s.words.length + '</span>');
  meta.push('<span class="chip-mini">' + STEP_ICON(step) + escapeHtml(STEP_LABEL(step)) + '</span>');
  if(S.settings.showScore) meta.push('<span>得分 ' + s.correct + '/' + s.total + '</span>');
  if(S.settings.showAccuracy && s.total) meta.push('<span>正确率 ' + Math.round(s.correct / s.total * 100) + '%</span>');
  if(S.settings.timer && step !== 'read' && !s.feedback) meta.push('<span class="timer" id="timerBox">' + IC('clock') + ' --</span>');
  app.innerHTML = '<div style="margin-bottom:14px">'
    + '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="study-meta">' + meta.join('') + '</div>'
    + '</div>'
    + '<div class="card stage" id="stage">' + (s.feedback ? feedbackHTML(s.feedback, word) : stepBodyHTML(word, step)) + '</div>'
    + '<div style="text-align:center;margin-top:4px">'
    + '<button class="btn ghost sm" id="pauseBtn">' + IC('pause') + ' 暂停并保存</button>'
    + '<button class="btn ghost sm" id="quitBtn">' + IC('exit') + ' 退出本轮</button>'
    + '</div>';
  bindStudy(word, step, s);
  if(!s.feedback && step !== 'read' && S.settings.timer) startTimer(s);
}
function stepBodyHTML(word, step){
  if(step === 'read'){
    return '<div class="tap-card" id="readCard">'
      + '<div class="word-big">' + escapeHtml(word.w) + '</div>'
      + '<div class="phon">' + escapeHtml(word.p) + '</div>'
      + '<div class="divider"></div>'
      + '<div class="meaning">' + escapeHtml(word.m) + '</div>'
      + '<div class="tap-hint">' + IC('volume') + ' 点击卡片朗读</div>'
      + '</div>'
      + '<button class="btn primary" id="nextBtn">记住了，继续</button>';
  }
  var choice = !!S.settings.choiceMode;
  if(step === 'cn2en'){
    if(choice){
      var o1 = shuffle([word].concat(shuffle(curWords().filter(function(x){ return x.w.toLowerCase() !== word.w.toLowerCase(); })).slice(0, 3)));
      return '<div class="q-tag">' + IC('translate') + ' 中 → 英 <span class="hint">选择模式</span></div>'

  if(step === 'sent'){
    var ex = pickExample(word);

      + '<div class="row" style="justify-content:center"><button class="btn ghost" id="skipBtn">不会，看答案</button></div>';

  }

function bindStudy(word, step, s){
  $('#pauseBtn').onclick = function(){
    saveSession(); session = null;
    toast('已保存，下次可继续');
    view = 'home'; render();
  };
  $('#quitBtn').onclick = function(){
    uiConfirm('退出本轮？学习进度将保留，可稍后继续。', function(){
      saveSession(); session = null;
      view = 'home'; render();
    }, { title:'退出本轮', okText:'退出', danger:false });
  };
  if(s.feedback){
    $('#contBtn').onclick = advance;
    $('#fbSpeak').onclick = function(){ speak(word.w, 'en'); };
    $('#fbDetail').onclick = function(){ showWordDetail(word.w); };
    autoSpeakFeedback(word.w);
    return;
  }
  if(step === 'read'){
    var card = $('#readCard');
    card.onclick = function(){ speak(word.w, 'en'); };
    autoSpeakWord(word.w);
    $('#nextBtn').onclick = advance;
    return;
  }
  if(step === 'cn2en' || step === 'en2cn' || step === 'spell'){
    var inp = $('#ansInput');
    if(inp){
      inp.focus();
      inp.onkeydown = function(e){ if(e.key === 'Enter') doSubmit(); };
      $('#submitBtn').onclick = doSubmit;
    }else{
      $$('.opt').forEach(function(b){ b.onclick = function(){ submitAnswer(b.dataset.v); }; });
    }
    if(step === 'spell'){
      var sp = $('#spellPlay'); if(sp) sp.onclick = function(){ speak(word.w, 'en'); };
    }
    $('#skipBtn').onclick = function(){ submitAnswer(null); };
    return;
  }
  if(step === 'listen' || step === 'sent'){
    $$('.opt').forEach(function(b){ b.onclick = function(){ submitAnswer(b.dataset.v); }; });
    if(step === 'listen'){
      $('#playBtn').onclick = function(){ speak(word.w, 'en'); };
      autoSpeakWord(word.w);
    }
    $('#skipBtn').onclick = function(){ submitAnswer(null); };
    return;
  }
  if(step === 'shadow'){
    $('#shadowPlay').onclick = function(){ shadowPlayDemo(word.w); };
    bindShadowHold($('#shadowRecord'), $('#shadowHoldTip'), $('#shadowStatus'));
    $('#skipBtn').onclick = function(){ submitAnswer(null); };
    shadowPlayDemo(word.w);
    return;
  }
  function doSubmit(){
    var v = $('#ansInput').value;
    if(!v.trim()){ toast('先输入答案吧'); return; }
    submitAnswer(v);
  }
}
function submitAnswer(value){
  var s = session;
  if(!s || s.feedback) return;
  var word = s.words[s.wordIdx], step = s.flow[s.stepIdx];
  var ok = false, correct = '';
  if(step === 'cn2en'){
    correct = word.w;
    ok = value != null && value.trim().toLowerCase() === word.w.toLowerCase();
  }else if(step === 'en2cn'){
    correct = word.m;
    ok = value != null && checkMeaning(value, word.m);
  }else if(step === 'listen'){
    correct = word.w;
    ok = value === word.w;
  }else if(step === 'spell'){
    correct = word.w;
    ok = value != null && value.trim().toLowerCase() === word.w.toLowerCase();
  }else if(step === 'sent'){
    correct = word.w;
    ok = value === word.w;
  }else if(step === 'shadow'){
    correct = word.w;
    ok = value != null && shadowMatch(value, word.w);
  }
  s.total++;
  if(ok) s.correct++; else addWrong(word, step, value, correct);
  noteAnswer(word.w, ok);
  checkinBump(ok);
  s.feedback = { ok:ok, your:value, correct:correct };
  clearTimer(); s.timerLeft = null;
  saveSession();
  render();
}
function advance(){
  var s = session;
  if(!s) return;
  s.feedback = null;
  var step = s.flow[s.stepIdx];
  s.wordIdx++;
  if(s.wordIdx >= s.words.length){
    if(s.mode === 'learn'){ S.batchStage[step] = s.words.length; save(); }
    checkinWordDone();
    s.wordIdx = 0; s.stepIdx++;
    if(s.stepIdx >= s.flow.length){ finishSession(); return; }
    s.stageIntro = true;
  }else{
    if(s.mode === 'learn'){ S.batchStage[step] = s.wordIdx; save(); }
  }
  saveSession();
  render();
}
function finishSession(){
  var s = session;
  var acc = s.total ? Math.round(s.correct / s.total * 100) : 0;
  var words = s.words;
  var secs = Math.max(1, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000));
  checkinRoundDone();
  clearSavedSession();
  /* 评价记录（D~S） */
  var rec = null;
  try{
    var c = evalCompute({ correct:(s.total ? s.correct : 0), total:s.total, sec:secs });
    rec = evalRecord({
      correct:c.correct, total:c.total, sec:secs,
      acc:c.acc, speed:c.speed, score:c.score, grade:c.grade,
      words:words.map(function(w){ return w.w; }),
      mode:s.mode,
      level:s.level || S.level
    });
  }catch(e){ rec = null; }
  var app = $('#app');
  app.innerHTML = '<div class="card center">'
    + '<div class="done-icon">' + IC('trophy') + '</div>'
    + '<h2 class="h2" style="font-size:var(--fs-lg);margin-bottom:6px;justify-content:center;display:flex">本轮完成</h2>'
    + (rec ? '<div style="display:flex;justify-content:center;margin:6px 0 2px">' + gradeBadge(rec.grade, true) + '</div>' : '')
    + '<p class="muted" style="margin:0">共学习 ' + words.length + ' 个单词 · 答题 ' + s.total + ' 次 · 用时 ' + fmtDuration(secs) + '</p>'
    + '<div class="stats">'
    +   (S.settings.showScore ? '<div class="stat"><b>' + s.correct + '</b><span>答对</span></div>' : '')
    +   (S.settings.showAccuracy ? '<div class="stat"><b>' + acc + '%</b><span>正确率</span></div>' : '')
    +   (rec ? '<div class="stat"><b>' + rec.score + '</b><span>综合分</span></div>' : '<div class="stat"><b>' + S.wrong.length + '</b><span>错题</span></div>')
    + '</div>'
    + (S.settings.showStageProgress ? '<div class="divider"></div><div class="stage-status" style="text-align:left">' + stageStatusHTML(words.length) + '</div>' : '')
    + '<div class="row" style="justify-content:center;margin-top:20px">'
    +   (rec && S.settings.evalShow ? '<button class="btn primary" id="showEval">查看评价图片</button>' : '')
    +   '<button class="btn' + (rec && S.settings.evalShow ? '' : ' primary') + '" id="goReview">去复习</button>'
    +   '<button class="btn" id="again">再学一组</button>'
    + '</div>'
    + '</div>';
  $('#goReview').onclick = function(){ session = null; view = 'review'; render(); };
  $('#again').onclick = function(){ session = null; view = 'home'; render(); };
  var se = $('#showEval');
  if(se) se.onclick = function(){ if(rec) showEvalDialog(rec); };
  session = null;
  if(rec && S.settings.evalShow){
    setTimeout(function(){ if(rec) showEvalDialog(rec); }, 320);
  }
}
function startTimer(s){
  clearTimer();
  var base = s.timed ? Math.max(8, Math.round(S.settings.secPerQ * 0.75)) : S.settings.secPerQ;
  s.timerLeft = base;
  var box = $('#timerBox'); if(box) box.innerHTML = IC('clock') + ' ' + s.timerLeft + 's';
  _tick = setInterval(function(){
    s.timerLeft--;
    var b = $('#timerBox'); if(b) b.innerHTML = IC('clock') + ' ' + s.timerLeft + 's';
    if(s.timerLeft <= 0){ clearTimer(); submitAnswer(null); }
  }, 1000);
}

/* ============================================================
   错题记录
   ============================================================ */
function addWrong(word, step, your, correct){
  var key = word.w.toLowerCase();
  var exist = null;
  S.wrong.forEach(function(x){ if(x.w.toLowerCase() === key) exist = x; });
  if(exist){
    exist.step = step;
    exist.your = your == null ? '(未作答)' : your;
    exist.correct = correct;
    exist.time = Date.now();
    exist.count = (exist.count || 1) + 1;
  }else{
    S.wrong.unshift({ w:word.w, step:step, your:your == null ? '(未作答)' : your, correct:correct, time:Date.now(), count:1 });
  }
  if(S.wrong.length > 500) S.wrong.length = 500;
  save();
}
function uniqueWrongWords(){
  var seen = {}, out = [];
  S.wrong.forEach(function(it){
    var k = it.w.toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    var w = findWord(it.w);
    if(w) out.push(w);
  });
  return out;
}
/* ============================================================
   4.5 单词选择器（学习 / 复习 / 笔记共用）
   ============================================================ */
var picker = { mode:'learn', source:'level', filter:'all', query:'', page:0, perPage:40, selected:{}, anchor:null, rangeMode:false };
function pickerModeName(){
  return picker.mode === 'learn' ? '学习' : (picker.mode === 'review' ? '复习' : (picker.mode === 'print' ? '打印' : '笔记'));
}
function pickerSources(){
  if(picker.mode === 'learn') return [{ k:'level', name:'当前阶段 · ' + LEVEL_NAME(S.level) }];
  if(picker.mode === 'review') return [
    { k:'batch', name:'已学单词 (' + S.batch.length + ')' },
    { k:'wrong', name:'错题本 (' + uniqueWrongWords().length + ')' },
    { k:'favs', name:'收藏本 (' + S.favs.filter(function(f){ return f.type === 'word'; }).length + ')' }
  ];
  var list = [{ k:'all', name:'全部词汇 (' + ALL_WORDS.length + ')' }];
  LEVELS.forEach(function(k){ list.push({ k:'lv:' + k, name:LEVEL_NAME(k) + ' (' + (DATA[k] ? DATA[k].words.length : 0) + ')' }); });
  list.push({ k:'wrong', name:'错题本 (' + uniqueWrongWords().length + ')' });
  list.push({ k:'favs', name:'收藏本 (' + S.favs.filter(function(f){ return f.type === 'word'; }).length + ')' });
  if(picker.mode === 'print') list.unshift({ k:'batch', name:'已学单词 (' + S.batch.length + ')' });
  return list;
}
function pickerPool(){
  var src = picker.source, out;
  if(src === 'batch') out = S.batch.map(findWord);
  else if(src === 'wrong') out = uniqueWrongWords();
  else if(src === 'favs') out = S.favs.filter(function(f){ return f.type === 'word'; }).map(function(f){ return findWord(f.key); });
  else if(src === 'all') out = ALL_WORDS.slice();
  else if(src.indexOf('lv:') === 0){ var k = src.slice(3); out = (DATA[k] ? DATA[k].words : []).slice(); }
  else out = curWords().slice();
  out = out.filter(Boolean);
  var seen = {}, u = [];
  out.forEach(function(w){ var k = w.w.toLowerCase(); if(!seen[k]){ seen[k] = 1; u.push(w); } });
  if(picker.filter === 'learned') u = u.filter(function(w){ return wordStat(w.w) !== 'new'; });
  else if(picker.filter === 'new') u = u.filter(function(w){ return wordStat(w.w) === 'new'; });
  if(picker.query) u = u.filter(function(w){ return matchQuery(w.w, picker.query) || matchQuery(w.m, picker.query); });
  return u;
}
function pickerWordHTML(w){
  var k = w.w.toLowerCase();

    : (st === 'wrong' ? '<span class="pick-badge wrong">错</span>' : '<span class="pick-badge ok">已学</span>');
  return '<button class="pick-word' + (picker.selected[k] ? ' on' : '') + (picker.anchor === k ? ' anchor' : '') + '" data-k="' + escapeHtml(k) + '">'
    + '<span class="pick-w">' + escapeHtml(w.w) + '</span>'
    + '<span class="pick-m">' + escapeHtml(cleanMeaning(w.m) || w.m) + '</span>'
    + badge + '</button>';
}
function pickerRangeHint(){
  if(!picker.rangeMode) return '框选已关：点词单个增删。';
  if(!picker.anchor) return '框选已开：先点第一个词作为起点。';
  var w = picker.selected[picker.anchor] || findWord(picker.anchor);
  return '框选已开：起点「' + (w ? w.w : picker.anchor) + '」，再点一个词把中间整段选上。';

function pickerRefresh(){
  var cnt = Object.keys(picker.selected).length;
  var el = $('#pkCount'); if(el) el.textContent = '已选 ' + cnt + ' 词';
  var go = $('#pkGo'); if(go) go.innerHTML = IC('play') + ' 开始 (' + cnt + ' 词)';
  $$('.pick-word').forEach(function(b){
    var k = b.dataset.k;
    b.classList.toggle('on', !!picker.selected[k]);
    b.classList.toggle('anchor', picker.anchor === k);
  });
  var rm = $('#pkRangeMode');
  if(rm){
    rm.classList.toggle('on', !!picker.rangeMode);
    rm.innerHTML = IC('link') + ' 框选 ' + (picker.rangeMode ? '开' : '关');
  }
  var rh = $('#pkRangeHint');
  if(rh){
    rh.innerHTML = pickerRangeHint();
    rh.classList.toggle('on', !!picker.rangeMode);
  }
  var cr = $('#pkCancelRange');
  if(cr) cr.style.display = picker.rangeMode ? '' : 'none';
}
function pickerClick(k, pool){
  if(picker.rangeMode){
    if(!picker.anchor){ picker.anchor = k; }
    else if(picker.anchor === k){ picker.anchor = null; }
    else{
      var keys = pool.map(function(w){ return w.w.toLowerCase(); });
      var a = keys.indexOf(picker.anchor), b = keys.indexOf(k);
      if(a >= 0 && b >= 0){
        var lo = Math.min(a, b), hi = Math.max(a, b);
        for(var i = lo; i <= hi; i++){ picker.selected[keys[i]] = findWord(keys[i]); }
      }
      picker.anchor = null;
    }
  }else{
    if(picker.selected[k]) delete picker.selected[k];
    else picker.selected[k] = findWord(k);
  }
  pickerRefresh();
}
function pickerStart(){
  var words = Object.keys(picker.selected).map(function(k){ return picker.selected[k]; }).filter(Boolean);
  if(!words.length){ toast('请先选择单词'); return; }
  if(picker.mode === 'learn'){
    S.batch = words.map(function(w){ return w.w; });
    S.batchStage = {};
    S.flow.forEach(function(st){ S.batchStage[st] = 0; });
    save();
    startSession(words, S.flow.slice(), { mode:'learn' });
  }else if(picker.mode === 'review'){
    startSession(shuffle(words), reviewFlow(), { mode:'review' });
  }else if(picker.mode === 'note'){
    noteWords = words.slice();
    notePage = 0;
    view = 'note'; render();
  }else if(picker.mode === 'print'){
    printCustom = words.slice();
    printPreview = words.slice();
    printKey = printSig();
    view = 'print'; render();
  }
}

/* ---------- 积木：单个模块渲染（音标已移除） ---------- */
function noteBlockHTML(w, k){

    case 'comp':

/* 一个单词 = 若干行积木；每行占一条纸面横线，所以行高固定为纸面行距。
   所有尺寸都用 em（相对字号），这样同一份 HTML 在屏幕预览与真实纸张上完全一致。 */
function noteWordHTML(w){
  var rows = noteOpts.rows || [];
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var sp = noteLinePx();
  var lhEm = (sp / fs).toFixed(3);
  var rgEm = (((parseFloat(noteOpts.rowGap) || 0) * sp) / fs).toFixed(3);
  var bgEm = (Math.max(0, parseFloat(noteOpts.blockGap) || 0) / fs).toFixed(3);
  var out = [], first = true;
  var align = (noteOpts.rowAlign === 'top') ? 'flex-start' : 'baseline';
  rows.forEach(function(row){
    var parts = [];
    (row || []).forEach(function(k){ var h = noteBlockHTML(w, k); if(h) parts.push(h); });
    if(!parts.length) return;
    out.push('<div class="nw-row" style="line-height:' + lhEm + 'em;align-items:' + align + ';column-gap:' + bgEm + 'em' + (first ? '' : ';margin-top:' + rgEm + 'em') + '">' + parts.join('') + '</div>');
    first = false;
  });
  var gp = parseInt(noteOpts.perWordGap, 10) || 0;
  for(var g = 0; g < gp; g++) out.push('<div class="nw-row" style="line-height:' + lhEm + 'em">&#160;</div>');
  return '<div class="note-word">' + out.join('') + '</div>';
}
/* 纸面几何：像素尺寸 + 内容区 + 横线数 + 行距。
   屏幕上的纸按真实比例放大（毫米 → 像素），所以小本子看起来也小。 */
var NOTE_PX_PER_MM = 2.2;
function notePaperMetrics(){
  var fmt = noteFmt();
  var landscape = noteOpts.orientation === 'landscape';
  var pw = landscape ? fmt.h : fmt.w;   /* 毫米：纸的宽 */
  var ph = landscape ? fmt.w : fmt.h;
  var spread = noteIsSpread();
  /* 纸必须装得进当前内容区：宽屏扣掉侧栏，窄屏按视口减内边距，否则手机上右边会被切掉 */
  var vw = window.innerWidth || 1024;
  var avail = (vw >= 861) ? (vw - 300) : (vw - 48);
  if(avail < 220) avail = Math.max(180, vw - 24);
  var maxW = spread ? Math.min(430, Math.round((avail - 18) / 2)) : Math.min(560, Math.round(avail));
  var maxH = spread ? 560 : 700;
  if(maxW < 120) maxW = 120;
  var scale = Math.min(maxW / pw, NOTE_PX_PER_MM);
  var w = pw * scale, h = ph * scale;
  if(h > maxH){ scale = maxH / ph; w = pw * scale; h = ph * scale; }
  w = Math.round(w); h = Math.round(h);
  var padX = Math.round(w * 0.08), padY = Math.round(h * 0.06);
  var rc = parseInt(noteOpts.ruleCount, 10);
  if(isNaN(rc) || rc < 4) rc = noteDefaultRules(noteOpts.format);
  if(rc > 80) rc = 80;
  var ch = h - padY * 2;
  return { w:w, h:h, pw:pw, ph:ph, scale:scale, padX:padX, padY:padY, cw:w - padX * 2, ch:ch, rules:rc, sp:ch / rc };
}
function noteLinePx(){ return notePaperMetrics().sp; }
/* 基线偏移：文字首行基线到内容顶部的距离（px）。用它把横线画到文字基线，字才「坐在」线上。 */
var _noteBaselineCache = null;
function noteBaselineOffset(){
  var m = notePaperMetrics();
  var fs = parseInt(noteOpts.fontSize, 10) || 14;
  var sp = m.sp;
  var lhEm = (sp / fs).toFixed(3);
  var key = fs + '|' + sp.toFixed(2) + '|' + (noteOpts.rowAlign || 'base');
  if(_noteBaselineCache && _noteBaselineCache.key === key) return _noteBaselineCache.val;
  var probe = noteProbeEl();
  probe.style.width = '320px';
  probe.style.fontSize = fs + 'px';
  probe.innerHTML = '<div class="nw-row" style="line-height:' + lhEm + 'em;align-items:' + ((noteOpts.rowAlign === 'top') ? 'flex-start' : 'baseline') + '"><span class="nw-w">Ag</span><i id="__bp" style="display:inline-block;height:0;width:0"></i></div>';
  var row = probe.firstChild;
  var ib = document.getElementById('__bp');
  var val = 0;
  if(row && ib){ val = ib.offsetTop - row.offsetTop; if(val < 0) val = 0; }
  probe.innerHTML = '';
  _noteBaselineCache = { key: key, val: val };
  return val;
}
function noteRulesCSS(m){
  if(noteOpts.ruleStyle === 'none') return '';
  var sp = Math.max(2, m.sp);
  var bo = noteBaselineOffset();
  var a = Math.max(1, sp - 1).toFixed(1);
  var b = sp.toFixed(1);
  var rowsG = 'repeating-linear-gradient(to bottom,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.22) ' + a + 'px,rgba(15,23,42,.22) ' + b + 'px)';
  var pos = ';background-position:0 ' + bo.toFixed(2) + 'px';
  if(noteOpts.ruleStyle === 'grid'){
    var colsG = 'repeating-linear-gradient(to right,transparent 0,transparent ' + a + 'px,rgba(15,23,42,.13) ' + a + 'px,rgba(15,23,42,.13) ' + b + 'px)';
    return 'background-image:' + rowsG + ',' + colsG + pos;
  }

}
/* 把每一行的实际高度吸附成行距的整数倍。
   混排字号（单词 1.1em、其余 0.95em）时浏览器算出的行盒会比 line-height 高出不到 1px，
   一行看不出，几十行累积下来文字就明显离开横线。吸附之后每行都严格落在格子里，
   文字基线始终等于纸面横线位置（横线按 noteBaselineOffset() 偏移绘制）。 */
function noteSnapRows(root, spPx){
  if(!root || !root.querySelectorAll) return 0;
  var sp = spPx || noteLinePx();
  if(!(sp > 0.5)) return 0;
  var rows = root.querySelectorAll('.nw-row');
  var fixed = 0;
  for(var i = 0; i < rows.length; i++){
    var el = rows[i];
    var h = el.getBoundingClientRect().height;
    if(!(h > 0)) continue;
    var n = Math.max(1, Math.round(h / sp));
    var target = n * sp;
    /* 自然高度只比整数倍多出不到 2px：直接把这点余量压掉（眼睛看不出来，行高却回到整数倍）；
       多出更多说明这一行是真的要多占一条线，宁可多让一行，也不能被 overflow:hidden 把字裁掉 */
    if(target < h - 2){ n = n + 1; target = n * sp; }
    if(Math.abs(h - target) < 0.05) continue;
    el.style.height = target.toFixed(2) + 'px';
    fixed++;
  }
  return fixed;
}
/* 一页纸的 HTML（预览与打印共用） */
function notePaperHTML(pg){
  var m = notePaperMetrics();
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  var cws = (pg && pg.length) ? pg : [[]];
  var gap = Math.round(m.cw * 0.05);
  var body;
  if(cols > 1){
    body = '<div class="nw-cols" style="gap:' + gap + 'px">' + cws.map(function(c){
      return '<div class="nw-col">' + (c || []).map(noteWordHTML).join('') + '</div>';
    }).join('') + '</div>';
  }else{
    body = (cws[0] || []).map(noteWordHTML).join('');
  }
  return '<div class="note-paper" style="width:' + m.w + 'px;height:' + m.h + 'px;font-size:' + noteOpts.fontSize + 'px">'
    + '<div class="note-paper-rules" style="inset:' + m.padY + 'px ' + m.padX + 'px;' + noteRulesCSS(m) + '"></div>'
    + '<div class="note-paper-in" style="padding:' + m.padY + 'px ' + m.padX + 'px">'
    + body + '</div></div>';
}
/* 每词占几条横线 */
function noteLinesPerWord(){
  var n = 0;
  (noteOpts.rows || []).forEach(function(r){ if(r && r.length) n++; });
  if(!n) n = 1;
  n += parseFloat(noteOpts.rowGap) || 0;
  n += parseInt(noteOpts.perWordGap, 10) || 0;
  return Math.max(1, n);
}
function notePageCapacity(){
  var m = notePaperMetrics();
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  return Math.max(1, Math.floor(m.rules / noteLinesPerWord()) * cols);

/* 量词高度的离屏容器（例句会换行，行数不能按「一条横线」硬算） */
function noteProbeEl(){
  var el = document.getElementById('__noteProbe');
  if(!el){
    el = document.createElement('div');
    el.id = '__noteProbe';
    el.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none';
    document.body.appendChild(el);
  }
  return el;
}
/* 分页：每页 = 若干列，每列 = 若干词。把整批词一次渲染进离屏容器，再单次循环量高（只一次回流），
   避免逐词 innerHTML+offsetHeight 造成的 N 次强制回流（多词时卡顿的根因）。 */
function buildNotePages(){
  if(!noteWords.length) return [[[]]];
  var m = notePaperMetrics();
  var cols = Math.max(1, Math.min(4, parseInt(noteOpts.wordCols, 10) || 1));
  var gap = Math.round(m.cw * 0.05);

    }
    col.push(noteWords[i]);

  else if(target >= np) target = Math.max(0, Math.floor((np - 1) / step) * step);
  if(target === notePage) return;

  if(papers.length && np > step){
    var axis = noteOpts.flip === 'v' ? 'rotateX' : 'rotateY';
    papers.forEach(function(p){ p.style.transition = 'transform .2s ease'; p.style.transform = axis + '(' + (dir > 0 ? -88 : 88) + 'deg)'; });

function noteRangePages(){

  var np = pages.length;
  var from = 1, to = np;
  if(noteOpts.pdfRange === 'current'){
    from = notePage + 1;
    to = Math.min(np, from + (noteIsSpread() ? 1 : 0));
  }else if(noteOpts.pdfRange === 'range'){
    from = parseInt(noteOpts.pdfFrom, 10); if(isNaN(from) || from < 1) from = 1;
    to = parseInt(noteOpts.pdfTo, 10); if(isNaN(to) || to < 1) to = np;
    if(to > np) to = np;
    if(to < from) to = from;
  }
  var list = [];
  for(var i = from; i <= to && i <= np; i++){ if(pages[i - 1]) list.push({ n:i, cols:pages[i - 1], ws:notePageWords(pages[i - 1]) }); }

}

/* ---------- 内置 PDF 生成（无外部库：栅格化每页 → JPEG → 手写最小 PDF） ---------- */

function noteRasterize(html, wpx, hpx, cb){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + wpx + '" height="' + hpx + '">'
    + '<foreignObject width="100%" height="100%">'
    + '<div xmlns="http://www.w3.org/1999/xhtml">' + html + '</div>'
    + '</foreignObject></svg>';
  var img = new Image();
  img.onload = function(){
    try{
      var cv = document.createElement('canvas');

/* 手写最小 PDF：把若干 JPEG 逐页嵌进去（DCTDecode），正确算 xref 偏移 */
function noteBuildPdf(imgs, wpt, hpt){
  var enc = new TextEncoder();
  var parts = [];
  var pos = 0;
  var xref = [];
  function add(u8){ parts.push(u8); pos += u8.length; }
  function str(s){ add(enc.encode(s)); }
  function obj(num, dict, streamBytes){
    xref.push([num, pos]);
    str(num + ' 0 obj\n' + dict);
    if(streamBytes){
      str('stream\n');
      add(streamBytes);
      str('\nendstream\n');
    }
    str('endobj\n');
  }
  str('%PDF-1.4\n');
  add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  var n = imgs.length;
  var kids = [];
  for(var i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>\n', null);
  obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>\n', null);
  for(var j = 0; j < n; j++){
    var pg = 3 + j * 3, im = 4 + j * 3, ct = 5 + j * 3;
    var jpg = noteBase64ToBytes(imgs[j].b64);
    obj(im, '<< /Type /XObject /Subtype /Image /Width ' + imgs[j].w + ' /Height ' + imgs[j].h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\n', jpg);
    var cs = enc.encode('q ' + wpt.toFixed(2) + ' 0 0 ' + hpt.toFixed(2) + ' 0 0 cm /Im0 Do Q');
    obj(ct, '<< /Length ' + cs.length + ' >>\n', cs);
    obj(pg, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + wpt.toFixed(2) + ' ' + hpt.toFixed(2) + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>\n', null);
  }
  var xrefPos = pos;
  xref.sort(function(a, b){ return a[0] - b[0]; });
  var xs = 'xref\n0 ' + (xref.length + 1) + '\n';
  xs += '0000000000 65535 f \n';
  for(var k = 0; k < xref.length; k++){
    xs += String(xref[k][1]).padStart(10, '0') + ' 00000 n \n';
  }
  str(xs);
  str('trailer\n<< /Size ' + (xref.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n');
  var out = new Uint8Array(pos);
  var off = 0;
  parts.forEach(function(p){ out.set(p, off); off += p.length; });
  return out;
}
function noteDownloadBlob(bytes, filename){

function generateNotePdf(){
  if(!noteWords.length){ toast('请先选择单词'); return; }
  var m = notePaperMetrics();
  var sel = noteRangePages();
  var rscale = 2;
  var ppm = (96 / 25.4) * rscale;
  var wpx = Math.round(m.pw * ppm), hpx = Math.round(m.ph * ppm);
  var wpt = m.pw * 72 / 25.4, hpt = m.ph * 72 / 25.4;
  var imgs = [];

  function next(){

function noteRemoveBlockAt(ri, ki){

function noteMoveBlockAt(ri, ki, dir){
  var rows = noteOpts.rows;
  var k = rows[ri] && rows[ri][ki];
  if(k === undefined) return;
  if(dir < 0){
    if(ki > 0){ var t = rows[ri][ki - 1]; rows[ri][ki - 1] = k; rows[ri][ki] = t; }
    else if(ri > 0){ rows[ri].splice(ki, 1); rows[ri - 1].push(k); }
  }else{
    if(ki < rows[ri].length - 1){ var t2 = rows[ri][ki + 1]; rows[ri][ki + 1] = k; rows[ri][ki] = t2; }

  }

  if(!rows[ri] || rows[ri][ki] === undefined) return;
  var k = rows[ri][ki];
  var to = ri + dir;
  if(to < 0){
    rows.unshift([k]);
    rows[ri + 1].splice(ki, 1);
  }else if(to >= rows.length){
    rows[ri].splice(ki, 1);
    rows.push([k]);

  if(sri != null && ski != null && rows[sri] && rows[sri][ski] === k){
    rows[sri].splice(ski, 1);
    if(sri === tri && ski < tki) tki--;
  }

/* 触屏拖动积木（替代 HTML5 拖放——手机/平板没有拖拽事件；桌面鼠标仍走原生拖拽，不受影响） */
function noteTouchDragSupport(){
  var active = null;   // { k, ri, ki, el, pid, sx, sy, moved, clone, offX, offY }
  function clearOver(){ $$('.blk-row').forEach(function(r){ r.classList.remove('over'); }); }
  function highlight(x, y){
    var t = document.elementFromPoint(x, y);
    var target = null;
    if(t && active){
      var chip = t.closest ? t.closest('.blk[data-k]') : null;
      if(chip && chip !== active.el){ target = chip.closest('.blk-row'); }
      else { target = t.closest ? t.closest('.blk-row[data-drop]') : null; }
    }
    $$('.blk-row').forEach(function(r){ r.classList.toggle('over', r === target); });
  }
  function end(e, cancel){
    if(!active) return;
    var a = active;
    active = null;
    if(a.clone){ a.clone.remove(); a.clone = null; }
    a.el.classList.remove('dragging');
    clearOver();
    if(cancel || !a.moved) return;
    window.__noteDraggedAt = Date.now();   /* 标记刚拖过，免得随后的 click 又弹出菜单 */
    var t = document.elementFromPoint(e.clientX, e.clientY);
    if(!t) return;
    var chip = t.closest ? t.closest('.blk[data-k]') : null;
    if(chip && chip !== a.el){
      noteDropAt(a.k, parseInt(chip.dataset.ri, 10), parseInt(chip.dataset.ki, 10), a.ri, a.ki);
      return;
    }
    var row = t.closest ? t.closest('.blk-row[data-drop]') : null;
    if(row) noteDropAt(a.k, parseInt(row.dataset.drop, 10), null, a.ri, a.ki);
  }
  $$('.blk-grip').forEach(function(grip){
    grip.addEventListener('pointerdown', function(e){
      if(e.pointerType !== 'touch') return;   // 桌面鼠标仍走 HTML5 拖拽
      var el = grip.closest('.blk[data-k]');
      if(!el) return;
      e.preventDefault();
      var r = el.getBoundingClientRect();
      active = {
        k: el.dataset.k, ri: parseInt(el.dataset.ri, 10), ki: parseInt(el.dataset.ki, 10),
        el: el, pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, clone: null,
        offX: e.clientX - r.left, offY: e.clientY - r.top
      };
      try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    });
    grip.addEventListener('pointermove', function(e){
      if(!active || e.pointerId !== active.pid) return;
      e.preventDefault();
      if(!active.moved){
        var dx = e.clientX - active.sx, dy = e.clientY - active.sy;
        if(dx * dx + dy * dy < 36) return;   // 6px 起拖阈值
        active.moved = true;
        active.el.classList.add('dragging');
        var c = active.el.cloneNode(true);
        c.classList.add('blk-clone');
        c.removeAttribute('draggable');
        var rb = active.el.getBoundingClientRect();
        c.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;left:0;top:0;margin:0;transform:translate(' + rb.left + 'px,' + rb.top + 'px)';
        document.body.appendChild(c);
        active.clone = c;
      }
      active.clone.style.transform = 'translate(' + (e.clientX - active.offX) + 'px,' + (e.clientY - active.offY) + 'px)';
      highlight(e.clientX, e.clientY);
    });
    var up = function(e){ if(active && e.pointerId === active.pid) end(e, false); };
    var canc = function(e){ if(active && e.pointerId === active.pid) end(e, true); };
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', canc);
  });
}
function bindNoteBlkEditor(){

function reviewPool(){
  var words;
  if(revSource === 'wrong') words = uniqueWrongWords();
  else if(revSource === 'favs') words = S.favs.map(findWord).filter(Boolean);
  else words = S.batch.map(findWord).filter(Boolean);
  var seen = {}, out = [];
  words.forEach(function(w){
    if(!w) return;
    var k = w.w.toLowerCase();
    if(!seen[k]){ seen[k] = 1; out.push(w); }
  });
  return out;
}

var CONNECTORS = ['', 'Besides, ', 'What is more, ', 'In addition, ', 'Meanwhile, ', 'However, ', 'As a result, ', 'For example, ', 'Later, ', 'Finally, '];
function buildCoherentItems(words, maxN){
  var n = Math.min(maxN || 6, words.length);
  var picked = shuffle(words).slice(0, n);
  return picked.map(function(w, i){
    var ex = pickExample(w);
    return { word:w, text:ex.t, src:ex.s, connector:i === 0 ? '' : CONNECTORS[(i - 1) % (CONNECTORS.length - 1) + 1] };
  });
}
function itemsToSentences(items){ return items.map(function(it){ return it.connector + it.text; }); }
function buildPassage(words){
  var items = buildCoherentItems(words, 6);
  passage = { items:items, words:items.map(function(i){ return i.word; }) };
  view = 'passage'; render();
}
function renderPassage(app){
  if(!passage){ view = 'review'; render(); return; }
  var wordSet = new Set(passage.words.map(function(w){ return w.w; }));
  var sentences = itemsToSentences(passage.items);
  var text = sentences.join(' ');
  app.innerHTML = '<section class="card">'
    + '<h2 class="h2">小短文 <span class="hint">涵盖 ' + passage.words.length + ' 个单词</span></h2>'
    + '<div class="passage">' + highlightAll(text, wordSet) + '</div>'
    + '<p class="muted">点击文中高亮单词可查看音标、释义与例句。</p>'
    + '<div class="row" style="margin-top:10px"><button class="btn sm" id="readAll">' + IC('volume') + ' 朗读全文</button></div>'
    + '</section>'
    + '<section class="card">'
    + '<h2 class="h2">涉及单词</h2>'
    + '<div class="word-cloud" style="max-height:none">'
    + passage.words.map(function(w){ return '<span class="w-link" data-w="' + escapeHtml(w.w) + '">' + escapeHtml(w.w) + '</span>'; }).join('')
    + '</div></section>'
    + '<section class="card">'
    + '<h2 class="h2">句子出处</h2>'
    + sentences.map(function(t, i){
        return '<div class="ex">'
          + '<div class="ex-btns"><button class="ex-play" data-say="' + escapeHtml(t) + '">' + IC('volume') + '</button></div>'
          + '<div class="ex-t">' + highlightAll(t, wordSet) + '</div>'
          + '<div class="ex-s">— ' + escapeHtml(passage.items[i].src) + '</div>'
          + '</div>';
      }).join('')
    + '</section>'

    + '<button class="btn primary" id="regen">换一篇</button>'
    + '<button class="btn" id="backReview">返回复习</button>'
    + '</div>';
  $('#readAll').onclick = function(){ speak(text, 'en'); };
  $('#regen').onclick = function(){ buildPassage(passage.words); };
  $('#backReview').onclick = function(){ view = 'review'; render(); };
}

/* ============================================================
   考试：语法填空 / 完型填空
   ============================================================ */
function makeGrammarExam(words){
  var items = buildCoherentItems(words, 6);
  return items.map(function(it){
    var re = new RegExp('\\b' + escapeRe(it.word.w) + '\\w*', 'i');
    var sentence = it.connector + it.text;
    var hasBlank = re.test(sentence);
    return { word:it.word, original:it.text, sentence:hasBlank ? sentence.replace(re, '______') : sentence + ' ______', src:it.src, hasBlank:hasBlank };
  }).filter(function(x){ return x.hasBlank; });
}
function makeClozeExam(words){
  var items = buildCoherentItems(words, 6);
  var sentences = items.map(function(it){
    var re = new RegExp('\\b' + escapeRe(it.word.w) + '\\w*', 'i');
    return { text:it.connector + it.text, re:re, word:it.word, src:it.src };
  }).filter(function(x){ return x.re.test(x.text); });
  return {
    sentences:sentences.map(function(s){ return s.text; }),
    blanks:sentences.map(function(s){ return s.word; }),
    regexps:sentences.map(function(s){ return s.re; })
  };
}
function renderExam(app){
  if(!exam){ view = 'review'; render(); return; }
  if(exam.type === 'grammar') renderGrammarExam(app);
  else renderClozeExam(app);
}
function renderGrammarExam(app){

  if(e.submitted){
    var right = 0;

      + '<div class="stats">'

            + '</div>';
        }).join('')
      + '</section>'
      + '<div class="row" style="justify-content:center">'

    $('#retryExam').onclick = function(){

    + '<p class="muted" style="margin:0">阅读下面短文，根据括号中的中文提示填入正确的英文单词。</p>'
    + '</section>'
    + '<section class="card">'
    + e.items.map(function(it, i){
        return '<div class="qitem">'
          + '<div class="qnum">第 ' + (i + 1) + ' 题</div>'
          + '<div class="qsent">' + escapeHtml(it.sentence) + ' <span class="hint-cn">(' + escapeHtml(cleanMeaning(it.word.m)) + ')</span></div>'
          + '<input class="blank-in" data-i="' + i + '" style="width:180px;margin-top:8px" placeholder="填写英文单词" autocomplete="off" spellcheck="false">'
          + '</div>';
      }).join('')
    + '</section>'
    + '<div class="row" style="justify-content:center">'
    + '<button class="btn primary" id="submitExam">提交答卷</button>'
    + '<button class="btn ghost" id="cancelExam">返回</button></div>';
  var first = $('.blank-in'); if(first) first.focus();
  $$('.blank-in').forEach(function(inp){ inp.onkeydown = function(ev){ if(ev.key === 'Enter') $('#submitExam').click(); }; });
  $('#submitExam').onclick = function(){
    var answers = $$('.blank-in').map(function(i){ return i.value.trim(); });
    var results = e.items.map(function(it, i){
      var a = (answers[i] || '').toLowerCase();
      if(!a) return false;
      var base = it.word.w.toLowerCase();
      return a === base || (a.indexOf(base) === 0 && a.length <= base.length + 4);
    });
    e.answers = answers; e.results = results; e.submitted = true;
    e.items.forEach(function(it, i){ if(!results[i]) addWrong(it.word, 'cn2en', answers[i] || '(未作答)', it.word.w); });
    render();
  };
  $('#cancelExam').onclick = function(){ view = 'review'; render(); };
}
function makeClozeOptions(word, pool){
  var pos = getPOS(word);
  var others = pool.filter(function(x){ return x.w !== word.w && getPOS(x) === pos; });
  if(others.length < 3) others = pool.filter(function(x){ return x.w !== word.w; });
  return shuffle([word].concat(shuffle(others).slice(0, 3)));
}
function renderClozeExam(app){

var wordsQuery = '';
function wordsKeysList(){
  var table = wordsMode === 'ant' ? ANTONYMS : SYNONYMS;
  var q = wordsQuery.trim().toLowerCase();
  var out = [];
  for(var k in table){
    var arr = table[k] || [];
    if(!arr.length) continue;
    if(!inLevel(k, wordsLevel)) continue;
    if(q){
      var hit = matchQuery(k, q);
      if(!hit){
        for(var i = 0; i < arr.length; i++){
          if(matchQuery(arr[i].w, q)){ hit = true; break; }
        }
      }
      if(!hit){
        var w0 = findWord(k);
        if(w0 && matchQuery(w0.m, q)) hit = true;
      }
      if(!hit) continue;
    }
    out.push(k);
  }
  return out.sort();
}

  var modeName = wordsMode === 'ant' ? '反义词' : '近义词';

    }
  }
}
function matchAnswer(user, correct){
  var u = String(user || '').trim().toLowerCase().replace(/\s+/g, ' ');
  return String(correct).split('|').some(function(a){
    var c = a.trim().toLowerCase().replace(/,/g, ' ').replace(/\s+/g, ' ');
    return u === c || u === c.replace(/\s+/g, '');
  });
}

var PV_TAG_ORDER = ['励志','学习','时间','友谊','家庭','行动','坚持','智慧','金钱','健康','谨慎','品格','合作','言语','机会','习惯','勇气','逆境','经验'];
/* 数据里出现过的主题（按上面的偏好顺序排，未知主题附在最后） */
function allProverbTags(){
  var cnt = {};
  getAllProverbsUnique().forEach(function(p){ if(p && p.tag) cnt[p.tag] = (cnt[p.tag] || 0) + 1; });
  var known = PV_TAG_ORDER.filter(function(t){ return cnt[t]; });
  var extra = Object.keys(cnt).filter(function(t){ return PV_TAG_ORDER.indexOf(t) < 0; }).sort();
  return known.concat(extra).map(function(t){ return { t: t, n: cnt[t] }; });
}

/* ============================================================
   作文素材库：好词好句 / 高级词汇 / 模板句式 / 作文模板
   ============================================================ */
function phraseBigList(){
  var out = [], seen = {};
  PHRASES.forEach(function(p){ if(p.big && !seen[p.big]){ seen[p.big] = 1; out.push(p.big); } });
  return out;
}
function phraseSubList(big){
  var out = [], seen = {};
  PHRASES.forEach(function(p){ if(big !== 'all' && p.big !== big) return; if(p.sub && !seen[p.sub]){ seen[p.sub] = 1; out.push(p.sub); } });
  return out;
}
function writingPatternBigList(){
  var out = [], seen = {};
  (WRITING.patterns || []).forEach(function(p){ if(p.big && !seen[p.big]){ seen[p.big] = 1; out.push(p.big); } });
  return out;
}
function renderWriting(app){
  var WTABS = [
    { k:'phrase',    name:'好词好句', ic:'quote' },
    { k:'pattern',   name:'模板句式', ic:'pencil' },
    { k:'elevate',   name:'高级词汇', ic:'sparkle' },
    { k:'template',  name:'作文模板', ic:'file' }
  ];
  if(!WTABS.some(function(t){ return t.k === wTab; })) wTab = 'phrase';
  var q = wQuery.trim().toLowerCase();
  var html = '<section class="card">'
    + '<h2 class="h2">作文素材库 <span class="hint">' + PHRASES.length + ' 好句 · ' + (WRITING.patterns || []).length + ' 句式 · ' + (WRITING.elevate || []).length + ' 高级词 · ' + (WRITING.templates || []).length + ' 模板</span></h2>'
    + '<div class="chips" id="wTabs" style="margin-bottom:10px">'
    +   WTABS.map(function(t){
          var n = t.k === 'phrase' ? PHRASES.length
                : t.k === 'pattern' ? (WRITING.patterns || []).length
                : t.k === 'elevate' ? (WRITING.elevate || []).length
                : (WRITING.templates || []).length;
          return '<button class="chip ' + (wTab === t.k ? 'on' : '') + '" data-t="' + t.k + '">' + IC(t.ic) + ' ' + t.name + '<span class="n">' + n + '</span></button>';
        }).join('')
    + '</div>'
    + '<div class="search-wrap"><span class="si">' + IC('search') + '</span>'
    + '<input class="search-input" id="wSearch" placeholder="搜索英文、中文或分类…" value="' + escapeHtml(wQuery) + '" autocomplete="off" spellcheck="false">'
    + searchModeToggleHTML('wSearch') + '</div>';

  /* 好词好句：按大类 + 小类筛选 */
  if(wTab === 'phrase'){
    var bigs = phraseBigList();
    html += '<div class="chips" id="wBig" style="margin-bottom:8px">'
      + '<button class="chip ' + (wBig === 'all' ? 'on' : '') + '" data-b="all">全部<span class="n">' + PHRASES.length + '</span></button>'
      + bigs.map(function(b){
          var n = PHRASES.filter(function(p){ return p.big === b; }).length;
          return '<button class="chip ' + (wBig === b ? 'on' : '') + '" data-b="' + escapeHtml(b) + '">' + escapeHtml(b) + '<span class="n">' + n + '</span></button>';
        }).join('')
      + '</div>';
    var subs = phraseSubList(wBig);
    if(subs.length > 1){
      html += '<div class="chips" id="wSub" style="margin-bottom:4px">'
        + '<button class="chip ' + (wSub === 'all' ? 'on' : '') + '" data-s="all">全部小类</button>'
        + subs.map(function(s){
            return '<button class="chip ' + (wSub === s ? 'on' : '') + '" data-s="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
          }).join('')
        + '</div>';
    }
  }else if(wTab === 'pattern'){
    var pbigs = writingPatternBigList();
    html += '<div class="chips" id="wBig" style="margin-bottom:4px">'
      + '<button class="chip ' + (wBig === 'all' ? 'on' : '') + '" data-b="all">全部<span class="n">' + (WRITING.patterns || []).length + '</span></button>'
      + pbigs.map(function(b){

  /* ---- 内容区 ---- */
  if(wTab === 'template'){
    var tpls = WRITING.templates || [];
    if(!tpls.length){
      html += '<section class="card"><p class="muted" style="margin:0">暂无作文模板。</p></section>';
    }else{
      if(wTpl >= tpls.length) wTpl = 0;
      html += '<div class="chips" id="wTpl" style="margin-bottom:10px">'
        + tpls.map(function(t, i){
            return '<button class="chip ' + (wTpl === i ? 'on' : '') + '" data-i="' + i + '">' + escapeHtml(t.type || ('模板 ' + (i + 1))) + '</button>';
          }).join('')
        + '</div>';
      var tp = tpls[wTpl];
      html += '<section class="card">'
        + '<h2 class="h2">' + escapeHtml(tp.type || '作文模板') + (tp.cn ? ' <span class="hint">' + escapeHtml(tp.cn) + '</span>' : '') + '</h2>'
        + (tp.tip ? '<p class="muted" style="margin-bottom:10px">' + escapeHtml(tp.tip) + '</p>' : '')

              + '<div class="tpl-name">' + escapeHtml(pt.name || '') + '</div>'
              + '<div class="tpl-en">' + escapeHtml(pt.en || '') + '</div>'
              + (pt.cn ? '<div class="tpl-cn">' + escapeHtml(pt.cn) + '</div>' : '')
              + '</div>';
