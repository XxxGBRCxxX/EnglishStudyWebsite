/* ---------- 题库（内置 + 用户自定义） ---------- */
var ENTI_MIN_Q = 4;
function entiCustomBank(){
  return (Array.isArray(S.entiQ) && S.entiQ.length) ? S.entiQ : null;
}
function entiBankIsCustom(){ return !!entiCustomBank(); }
function entiBank(){
  return entiCustomBank() || ENTI_QUESTIONS;
}
function entiBankDefault(){
  S.entiQ = null;
  save();
}
/* 第一次修改题库时，把内置题库整份拷成用户题库，之后全在副本上改 */
function entiCustomize(){
  if(!entiCustomBank()){
    S.entiQ = entiBank().map(function(q){
      return { id:q.id, q:q.q, opts:q.opts.map(function(o){ return { en:o.en, cn:o.cn, p:entiCopy(o.p) }; }) };
    });
    save();
  }
  return S.entiQ;
}
function entiNewId(){
  return 'u' + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36);
}
function entiNormalizeQ(raw){
  var opts = [];
  (raw.opts || []).slice(0, 4).forEach(function(o){
    opts.push({ en:String(o.en || '').trim(), cn:String(o.cn || '').trim(), p:entiCopy(o.p) });
  });
  while(opts.length < 4) opts.push({ en:'', cn:'', p:{} });
  return { id: raw.id || entiNewId(), q: String(raw.q || '').trim(), opts: opts };
}
function entiQUpsert(raw){
  var list = entiCustomize(), q = entiNormalizeQ(raw), hit = -1;
  list.forEach(function(it, i){ if(it.id === q.id) hit = i; });
  if(hit >= 0) list[hit] = q; else list.push(q);
  save();
  return q;
}
function entiQDelete(id){
  var list = entiCustomize();
  if(list.length <= ENTI_MIN_Q){ toast('至少留 ' + ENTI_MIN_Q + ' 道题'); return false; }
  for(var i = list.length - 1; i >= 0; i--){ if(list[i].id === id) list.splice(i, 1); }
  save();
  return true;
}

/* ---------- 每次出多少题 ---------- */
function entiRunCount(){
  var bank = entiBank();
  if(bank.length <= ENTI_MIN_Q) return bank.length;
  var n = parseInt(S.entiCount, 10);
  if(!isFinite(n) || n <= 0) n = bank.length;
  return Math.max(ENTI_MIN_Q, Math.min(bank.length, n));
}
function entiSetRunCount(n){
  var bank = entiBank();
  S.entiCount = Math.max(ENTI_MIN_Q, Math.min(bank.length, parseInt(n, 10) || bank.length));
  save();
}

/* ---------- 状态 ---------- */
function entiState(){
  if(!S.enti || typeof S.enti !== 'object'){
    S.enti = { answers:{}, done:false, started:false, at:0, key:'', pcts:null, order:null, tab:'' };
  }
  if(!S.enti.answers || typeof S.enti.answers !== 'object') S.enti.answers = {};
  if(typeof S.enti.tab !== 'string') S.enti.tab = '';
  return S.enti;
}
/* 把题库里的 id 全打乱存进 st.order —— 每次开始新一轮都会重洗 */
function entiShuffle(){
  var st = entiState();
  var ids = entiBank().map(function(q){ return q.id; });
  for(var i = ids.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  }
  st.order = ids;
  return st.order;
}
function entiEnsureOrder(){
  var st = entiState();
  var ids = entiBank().map(function(q){ return q.id; });
  var ok = Array.isArray(st.order) && st.order.length === ids.length;
  if(ok){
    for(var i = 0; i < st.order.length; i++){ if(ids.indexOf(st.order[i]) < 0){ ok = false; break; } }
  }
  if(!ok){ entiShuffle(); save(); }
  return st.order;
}
/* 这一轮真正要答的题（按打乱后的顺序，取前 entiRunCount() 道） */
function entiRunList(){
  var st = entiState(), bank = entiBank(), n = entiRunCount();
  entiEnsureOrder();
  var byId = {};
  bank.forEach(function(q){ byId[q.id] = q; });
  var out = [];
  (st.order || []).forEach(function(id){
    var q = byId[id];
    if(q && out.length < n) out.push(q);
  });
  for(var i = 0; i < bank.length && out.length < n; i++){
    if(out.indexOf(bank[i]) < 0) out.push(bank[i]);
  }
  return out;
}
function entiAnsweredN(){
  var st = entiState(), n = 0;
  entiRunList().forEach(function(q){ if(st.answers[q.id] !== undefined) n++; });
  return n;
}
function entiCursor(){
  var st = entiState(), list = entiRunList();
  for(var i = 0; i < list.length; i++){ if(st.answers[list[i].id] === undefined) return i; }
  return list.length;
}
function entiReset(){
  var st = entiState();
  st.answers = {}; st.done = false; st.started = false;
  st.at = 0; st.key = ''; st.pcts = null; st.tab = 'test';
  entiShuffle();
  save();
}
/* 算分：每个维度的满分 = 这一轮所有题目里该维度能拿到的最高分之和 */
function entiCompute(){
  var st = entiState(), list = entiRunList();
  var raw = {}, max = {};
  ENTI_DIMS.forEach(function(d){ raw[d.k] = 0; max[d.k] = 0; });
  list.forEach(function(q){
    ENTI_DIMS.forEach(function(d){
      var m = 0;
      q.opts.forEach(function(o){ m = Math.max(m, (o.p && o.p[d.k]) || 0); });
      max[d.k] += m;
    });
    var a = st.answers[q.id];
    if(a === undefined || a === null) return;
    var pts = (q.opts[a] && q.opts[a].p) || {};
    Object.keys(pts).forEach(function(k){ if(raw[k] !== undefined) raw[k] += pts[k]; });
  });
  var pcts = {}, order = [];
  ENTI_DIMS.forEach(function(d){
    var p = max[d.k] ? Math.round(raw[d.k] / max[d.k] * 100) : 0;
    pcts[d.k] = p;
    order.push({ k:d.k, n:d.n, en:d.en, ic:d.ic, p:p });
  });
  order.sort(function(a, b){ return b.p - a.p || (a.k < b.k ? -1 : 1); });
  /* 前两名咬得很紧（差 6 分以内）就算均衡型 */
  var key = (order[0].p - order[1].p <= 6) ? 'balanced' : order[0].k;
  /* 注意：这里回的 rank 是「六维排名」，与 st.order（打乱后的题目 id 顺序）完全是两回事，
     刻意不叫 order，免得两处混用。 */
  return { pcts:pcts, rank:order, key:key, n:list.length };
}
function entiResult(){
  var st = entiState();
  if(!st.done) return null;
  var r = entiCompute();
  var type = ENTI_TYPES[r.key] || ENTI_TYPES.balanced;
  var second = null;
  if(r.rank.length > 1 && r.rank[1].p > 0){
    second = { dim:r.rank[1], type:ENTI_TYPES[r.rank[1].k] || null };
  }
  return { type:type, key:r.key, pcts:r.pcts, rank:r.rank, second:second, n:r.n };
}
/* 六维各自的档位解读（按维度固定顺序，不按分数排） */
function entiBands(r){
  return ENTI_DIMS.map(function(d){
    var p = r.pcts[d.k] || 0;
    var band = p >= 70 ? 0 : (p >= 45 ? 1 : 2);
    return { d:d, p:p, band:['hi', 'mid', 'lo'][band], read:d.read[band] };
  });
}
/* 一句综合结论：看最高与最低差多少 */
function entiVerdict(r){
  var hi = r.rank[0], lo = r.rank[r.rank.length - 1];
  var spread = hi.p - lo.p;
  var text;
  if(spread <= 18) text = '六个维度咬得很紧（最强 ' + hi.p + '%、最弱 ' + lo.p + '%，只差 ' + spread + ' 个百分点），是很少见的均衡型。';
  else if(spread <= 40) text = '你的轮廓很清晰：' + hi.n + ' 拉到 ' + hi.p + '%，' + lo.n + ' 只有 ' + lo.p + '%，差 ' + spread + ' 个百分点。';
  else text = '你的偏科很明显：' + hi.n + ' 高达 ' + hi.p + '%，' + lo.n + ' 只有 ' + lo.p + '%（差 ' + spread + ' 个百分点）—— 强的这一项是你的路子，弱的那一项是你下一个月的作业。';
  return { spread:spread, hi:hi, lo:lo, text:text };
}
/* 查看我的答案 */
function entiAnswersHTML(){
  var st = entiState(), list = entiRunList();
  if(!list.length) return '<p class="muted">还没有题目。</p>';
  return '<div class="enti-ans">' + list.map(function(q, i){
    var a = st.answers[q.id];
    var picked = (a === undefined || a === null) ? null : q.opts[a];
    return '<div class="enti-ans-row">'
      + '<div class="enti-ans-q">' + (i + 1) + '. ' + escapeHtml(q.q) + '</div>'
      + (picked
          ? '<div class="enti-ans-a on">' + escapeHtml(picked.en) + (picked.cn ? '（' + escapeHtml(picked.cn) + '）' : '') + '</div>'
          : '<div class="enti-ans-a">没答</div>')
      + '</div>';
  }).join('') + '</div>';
}

/* ---------- 雷达图 ---------- */
function entiRadarDraw(ctx, cx, cy, R, pcts, o){
  o = o || {};
  var labels = o.labels || ENTI_DIMS.map(function(d){ return d.n; });
  var n = labels.length;
  var grid = o.grid || 'rgba(148,163,184,.30)';
  var axis = o.axis || 'rgba(148,163,184,.35)';
  var fill = o.fill || 'rgba(14,165,233,.28)';
  var stroke = o.stroke || '#0ea5e9';
  var labelColor = o.label || '#64748b';
  var fs = o.labelSize || 14;
  var rings = o.rings || 4;
  function pt(i, r){
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  }
  /* 网格 */
  for(var g = 1; g <= rings; g++){
    ctx.beginPath();
    for(var i = 0; i < n; i++){
      var p = pt(i, R * g / rings);
      if(i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
    ctx.strokeStyle = (g === rings) ? axis : grid;
    ctx.lineWidth = (g === rings) ? 1.4 : 1;
    ctx.stroke();
  }
  /* 轴线 */
  for(var i = 0; i < n; i++){
    var p = pt(i, R);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p[0], p[1]);
    ctx.strokeStyle = grid; ctx.lineWidth = 1; ctx.stroke();
  }
  /* 数据面 */
  var pts = [];
  for(var i = 0; i < n; i++){
    var v = Math.max(0.05, Math.min(1, (pcts[i] || 0) / 100));
    pts.push(pt(i, R * v));
  }
  ctx.beginPath();
  pts.forEach(function(p, i){ if(i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
  /* 顶点 */
  pts.forEach(function(p){
    ctx.beginPath(); ctx.arc(p[0], p[1], 3.6, 0, Math.PI * 2);
    ctx.fillStyle = stroke; ctx.fill();
    ctx.strokeStyle = o.dotRing || '#ffffff'; ctx.lineWidth = 1.6; ctx.stroke();
  });
  /* 轴标签 */
  for(var i = 0; i < n; i++){
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    var lx = cx + Math.cos(a) * (R + (o.labelGap || 22));
    var ly = cy + Math.sin(a) * (R + (o.labelGap || 22));
    var ca = Math.cos(a);
    ctx.textAlign = (Math.abs(ca) < 0.25) ? 'center' : (ca > 0 ? 'left' : 'right');
    ctx.textBaseline = 'middle';
    ctx.fillStyle = labelColor;
    ctx.font = ciFont(fs, true);
    ctx.fillText(labels[i], lx, ly);
    if(o.showPct !== false){
      ctx.font = ciFont(fs - 2, false);
      ctx.fillStyle = o.pctColor || labelColor;
      ctx.fillText(Math.round(pcts[i]) + '%', lx, ly + fs + 3);
    }
  }
}
function entiRadarDataURL(px){
  px = px || 360;
  var scale = 2;
  var cv = document.createElement('canvas');
  cv.width = cv.height = Math.round(px * scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  var dark = !!S.dark;
  ctx.fillStyle = dark ? '#0f172a' : '#ffffff';
  ctx.fillRect(0, 0, px, px);
  var r = entiResult();
  var pcts = (r ? r.pcts : null) || {};
  entiRadarDraw(ctx, px / 2, px / 2 + 2, px * 0.235, ENTI_DIMS.map(function(d){ return pcts[d.k] || 0; }), {
    label: dark ? '#94a3b8' : '#475569',
    grid: dark ? 'rgba(148,163,184,.20)' : 'rgba(15,23,42,.10)',
    axis: dark ? 'rgba(148,163,184,.28)' : 'rgba(15,23,42,.16)',
    dotRing: dark ? '#0f172a' : '#ffffff',
    labelGap: 24, labelSize: 14
  });
  return cv.toDataURL('image/png');
}

/* ---------- 结果长图（720×1280） ---------- */
function entiDraw(cv, scale){
  var W = 720, H = 1280;
  scale = parseFloat(scale);
  if(!isFinite(scale) || scale <= 0) scale = 1;
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  var r = entiResult();
  if(!r){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); return cv; }
  var type = r.type, vd = entiVerdict(r);
  var ACC = '#0ea5e9';

  var g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0b1220');
  g.addColorStop(1, '#16233b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  var d = new Date();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(148,163,184,.95)';
  ctx.font = ciFont(22, false);

  ctx.textAlign = 'right';
  ctx.fillText(d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日', W - 56, 70);
  ctx.fillText(r.n + ' 道题', W - 56, 100);

  /* 人格名 */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = ciFont(50, true);
  ctx.fillText(type.n, 56, 164);
  ctx.fillStyle = ACC;
  ctx.font = ciFont(23, true);
  ctx.fillText(type.en, 56, 200);
  ctx.fillStyle = 'rgba(226,232,240,.92)';
  ctx.font = ciFont(20, false);
  ctx.fillText('「' + type.quote + '」', 56, 234);
  if(r.second && r.second.type){
    ctx.fillStyle = 'rgba(148,163,184,.95)';
    ctx.font = ciFont(18, false);
    ctx.fillText('第二人格：' + r.second.type.n + '（' + r.second.dim.p + '%）', 56, 262);
  }

  /* 雷达图 */
  var cx = W / 2, cy = 400, R = 118;
  entiRadarDraw(ctx, cx, cy, R, ENTI_DIMS.map(function(dd){ return r.pcts[dd.k] || 0; }), {
    label:'rgba(226,232,240,.95)', pctColor:ACC,
    grid:'rgba(148,163,184,.20)', axis:'rgba(148,163,184,.30)',
    fill:'rgba(14,165,233,.30)', stroke:ACC, dotRing:'#0b1220',
    labelGap:26, labelSize:14
  });

  /* 六个维度条 */
  var y0 = 560, rowH = 40;
  r.rank.forEach(function(o, i){
    var y = y0 + i * rowH;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(148,163,184,.95)';
    ctx.font = ciFont(18, false);
    ctx.fillText(o.n, 56, y);
    ciFillRound(ctx, 152, y - 13, 420, 13, 7, 'rgba(148,163,184,.18)');
    var w = Math.max(10, Math.round(420 * Math.min(1, o.p / 100)));
    ciFillRound(ctx, 152, y - 13, w, 13, 7, (i === 0 ? ACC : 'rgba(14,165,233,.55)'));
    ctx.textAlign = 'right';

    ctx.fillText(o.p + '%', W - 56, y);
  });

  /* 最强 / 最弱 */
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(148,163,184,.95)';
  ctx.font = ciFont(18, false);
  ctx.fillText('最强 ' + vd.hi.n + ' ' + vd.hi.p + '%　·　最弱 ' + vd.lo.n + ' ' + vd.lo.p + '%　·　相差 ' + vd.spread + ' 个百分点', 56, 848);

  /* 建议 */
  var ys = 892;
  ctx.fillStyle = 'rgba(226,232,240,.95)';
  ctx.font = ciFont(21, true);
  ctx.fillText('给你的三条建议', 56, ys);
  ctx.font = ciFont(19, false);

  });

  /* 底部二维码 */
  var qy = H - 168;
  ctx.fillStyle = '#ffffff';
  ciFillRound(ctx, 56, qy, 104, 104, 14, '#ffffff');
  try{ qrDraw(ctx, siteUrl(), 62, qy + 6, 92, { quiet:1, dark:'#0b1220', light:'#ffffff' }); }catch(e){}
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(226,232,240,.95)';
  ctx.font = ciFont(20, true);
  ctx.fillText(siteUrlIsRemote() ? '扫码打开「聚合英语」' : '「聚合英语」· 本地单页应用', 184, qy + 40);
  ctx.fillStyle = 'rgba(148,163,184,.9)';
  ctx.font = ciFont(17, false);

  ctx.fillText('v' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '4.0') + ' · 完整评语与学习处方在应用里', 184, qy + 94);
  return cv;

function entiDialog(id, draft){
  var isNew = !id, q = null;

  if(!q){
    if(isNew){
      q = { id:entiNewId(), q:'', opts:[{en:'',cn:'',p:{}},{en:'',cn:'',p:{}},{en:'',cn:'',p:{}},{en:'',cn:'',p:{}}] };
    }else{

    (function(i){

      function sync(){
        var p = {};
        if(pm && pm.value) p[pm.value] = 2;
        if(sb && sb.value && (!pm || sb.value !== pm.value)) p[sb.value] = 1;
        entiDraftForm.opts[i] = { en:en ? en.value : '', cn:cn ? cn.value : '', p:p };
      }
      if(en) en.oninput = sync;
      if(cn) cn.oninput = sync;
      if(pm) pm.onchange = sync;
      if(sb) sb.onchange = sync;
    })(i);
  }
}

    entiCustomize();
    entiShuffle(); save(); render();
    toast('已复制成你自己的题库，现在可以随便改了');
  };
  $$('#app [data-eq-edit]').forEach(function(b){
    b.onclick = function(){
      if(!entiBankIsCustom()){ toast('内置题库不能直接改，先点「改成可编辑的副本」'); return; }
      entiDialog(b.dataset.eqEdit);
    };
  });
  $$('#app [data-eq-del]').forEach(function(b){
    b.onclick = function(){
      if(!entiBankIsCustom()){ toast('内置题库不能直接改，先点「改成可编辑的副本」'); return; }
      var q = null;
      entiBank().forEach(function(it){ if(it.id === b.dataset.eqDel) q = it; });
      if(!q) return;
      uiConfirm('删掉这道题？\n\n' + q.q, function(){
        if(entiQDelete(q.id)){
          var s2 = entiState();
          delete s2.answers[q.id];
          s2.order = null;
          entiShuffle(); save(); render(); toast('已删除');
        }
      }, { okText:'删除' });
    };
  });
}

/* ============================================================
   18. 娱乐区（用户第 18 项）
   五个玩法：英语宾果 / 单词老虎机 / 单词接龙 / 听音猜词 / 英语人格测试（ENTI）。
   ------------------------------------------------------------
   · 词源一律是当前词库（curWords()，批次 D 之后是多选学段的并集）。
   · 英语人格测试是早就有的 ENTI（view='enti' 一个字没改），这一批只改了它的
     入口归属：从「语言」组搬到新加的「娱乐」组，老链接（navTo('enti')、
     全局搜索、分类管理里的条目）照旧能到。
   · ⚠【这些玩法一律不写学习记录】状态全在下面的 _funXxx **内存变量**里，
     不进 S；save() 的字段白名单（level/levels/count/flow/batch/batchStage/
     wrong/favs/seen/…/enti）里没有它们，所以刷新即清零、也永远不会落盘。
     这一段代码不碰 S.seen / S.wrong / S.batch / S.checkin / S.evals，
     并且**不调用 save()** —— 娱乐不是学习，玩多久都不该改变
     「学过没 / 答错过没 / 今天打卡没 / 这一轮几档评价」。
     _work/fun_assert.js 用两道锁钉住：静态扫这一段源码 + 运行时比 S 前后快照。
   ============================================================ */
var FUN_BINGO_N = 25;
var FUN_SLOT_NS = [1, 3, 5, 10];
/* 宾果：{ cells:25 个词, marked:25 个 0|1, drawn:已喊过的词 key, last:刚喊的词, line:连成的线 } */
var _funBingo = null;
var _funBingoWins = 0;
/* 老虎机：{ n, final:开转前就定下的结果, shown:此刻画在轮子上的, running, pool } */
var _funSlotN = 3;
var _funSlot = null;
var _funSlotTimer = null;
var _funSlotToken = 0;
/* 接龙：{ cur:当前词, used:本局用过的 key, score:接上几个, over:结束没, msg, pool } */
var _funChain = null;
var _funChainBest = 0;
/* 听音猜词：{ q:{ answer, options }, picked:本次选的 key, right, total } */
var _funEar = null;

/* 娱乐区的词池：当前学段并集里**纯英文单词**。带空格 / 连字符 / 撇号的词没法用
   末字母接龙，也容易被 TTS 念错，先一律摘掉。 */
function funPool(){
  var out = [], seen = {}, ws = curWords();
  for(var i = 0; i < ws.length; i++){
    var w = ws[i];
    var k = String((w && w.w) || '').toLowerCase();
    if(!k || seen[k] || !/^[a-z]+$/.test(k)) continue;
    seen[k] = 1;
    out.push(w);
  }
  return out;
}
/* 从池子里随机取 n 个（不重复；池子不够就取光，调用方自己判断够不够） */
function funPickWords(pool, n){
  var idx = [], out = [], i, j, r, t;
  if(!pool) return out;
  for(i = 0; i < pool.length; i++) idx.push(i);
  var want = Math.min(Math.max(n || 0, 0), idx.length);
  for(j = 0; j < want; j++){
    r = j + Math.floor(Math.random() * (idx.length - j));
    t = idx[j]; idx[j] = idx[r]; idx[r] = t;
    out.push(pool[idx[j]]);
  }
  return out;
}

/* ---------------- 英语宾果 ---------------- */
/* 填格：25 个不重复的英文词。池子不足 25 个回空数组 —— 宁可提示「词不够」，
   也不拿重复词凑数（重复词会让「点哪一格」变成两格，判连就乱了）。 */
function bingoFill(pool){
  if(!pool || pool.length < FUN_BINGO_N) return [];
  return funPickWords(pool, FUN_BINGO_N);
}
/* 判连：marked 是 25 个 0|1（行优先，下标 = 行 * 5 + 列）。
   返回 null（没连成）或 { kind:'row'|'col'|'diag', i, text }。
   5 行 → 5 列 → 主对角 → 副对角，先命中的那条算数（同时连上只报一条）。 */
function bingoLineOf(marked){
  if(!marked || marked.length !== FUN_BINGO_N) return null;
  var i, j, ok;
  for(i = 0; i < 5; i++){
    ok = true;
    for(j = 0; j < 5; j++){ if(!marked[i * 5 + j]){ ok = false; break; } }
    if(ok) return { kind:'row', i:i, text:'第 ' + (i + 1) + ' 行' };
  }
  for(j = 0; j < 5; j++){
    ok = true;
    for(i = 0; i < 5; i++){ if(!marked[i * 5 + j]){ ok = false; break; } }
    if(ok) return { kind:'col', i:j, text:'第 ' + (j + 1) + ' 列' };
  }
  ok = true;
  for(i = 0; i < 5; i++){ if(!marked[i * 6]){ ok = false; break; } }
  if(ok) return { kind:'diag', i:0, text:'主对角线' };
  ok = true;
  for(i = 0; i < 5; i++){ if(!marked[i * 4 + 4]){ ok = false; break; } }
  if(ok) return { kind:'diag', i:1, text:'副对角线' };
  return null;
}
/* 抽词：只在「还没喊过的格子」里随机挑一个；25 个都喊过就回 null。
   drawn 是 { 词的小写: 1 } —— 抽过的词记在这里，同一个词绝不喊第二次。 */
function bingoDrawOne(cells, drawn){
  var left = [], i, k;
  if(!cells || !cells.length) return null;
  for(i = 0; i < cells.length; i++){
    k = String((cells[i] && cells[i].w) || '').toLowerCase();
    if(!drawn || !drawn[k]) left.push(i);
  }
  if(!left.length) return null;
  var idx = left[Math.floor(Math.random() * left.length)];
  var key = String((cells[idx] && cells[idx].w) || '').toLowerCase();
  return { idx: idx, key: key, word: cells[idx] };
}
function bingoNew(pool){
  var cells = bingoFill(pool || funPool());
  if(!cells.length){ _funBingo = null; return null; }
  var marked = [], i;
  for(i = 0; i < cells.length; i++) marked.push(0);
  _funBingo = { cells: cells, marked: marked, drawn: {}, last: null, line: null };
  return _funBingo;
}
function bingoDrawnN(){
  var n = 0, k;
  if(!_funBingo) return 0;
  for(k in _funBingo.drawn){ if(_funBingo.drawn[k]) n++; }
  return n;
}
function bingoCellHTML(w, i){
  var b = _funBingo;
  var k = String((w && w.w) || '').toLowerCase();
  var lastKey = b && b.last ? String(b.last.w || '').toLowerCase() : '';
  var cls = 'bg-cell' + (b && b.marked[i] ? ' on' : '') + (k && k === lastKey ? ' call' : '');
  return '<button class="' + cls + '" data-bg="' + i + '" aria-pressed="' + (b && b.marked[i] ? 'true' : 'false') + '">'
    + escapeHtml(String((w && w.w) || '')) + '</button>';
}
function renderBingo(app){
  if(!_funBingo) bingoNew();
  var b = _funBingo;
  var n = bingoDrawnN();
  var call = '还没开始，点「抽一个词」';
  if(b && b.last) call = '刚喊到：<b>' + escapeHtml(String(b.last.w || '')) + '</b>';
  if(b && n >= FUN_BINGO_N) call = '这一局 ' + FUN_BINGO_N + ' 个词都喊完了，点「重开」换一批';
  var win = (b && b.line) ? '<div class="fun-win">宾果！' + escapeHtml(b.line.text) + '</div>' : '';
  app.innerHTML =
      '<section class="card" style="padding:16px 18px">'
    +   '<h2 class="h2" style="margin-bottom:10px">英语宾果 <span class="hint">当前词库 · ' + FUN_BINGO_N + ' 格</span></h2>'
    +   '<p class="muted" style="margin-top:0">点「抽一个词」随机喊一个词，点中卡片上对应的格子；连成一行、一列或一条对角线就算宾果。</p>'
    +   '<div class="fun-acts">'
    +     '<button class="btn primary" id="bingoDraw">' + IC('volume') + ' 抽一个词</button>'
    +     '<button class="btn" id="bingoNew">' + IC('refresh') + ' 重开</button>'
    +     '<span class="fun-status" id="bingoStatus">已喊 ' + n + ' / ' + FUN_BINGO_N + '</span>'
    +   '</div>'
    +   '<div class="fun-call" id="bingoCall">' + call + '</div>'
    +   win
    +   (b ? '<div class="bingo" id="bingoCard">' + b.cells.map(bingoCellHTML).join('') + '</div>'
         : '<p class="muted">当前词库不足 ' + FUN_BINGO_N + ' 个纯英文单词，先去「词库管理」多选几个学段。</p>')
    + '</section>';

  var draw = $('#bingoDraw');
  if(draw) draw.onclick = function(){
    if(!_funBingo){ toast('当前词库不足 ' + FUN_BINGO_N + ' 个纯英文单词'); return; }
    var hit = bingoDrawOne(_funBingo.cells, _funBingo.drawn);
    if(!hit){ toast('这一局喊完了，点「重开」换一批词'); return; }
    _funBingo.drawn[hit.key] = 1;
    _funBingo.last = hit.word;
    _funBingo.line = bingoLineOf(_funBingo.marked);
    speak(String(hit.word.w || ''), 'en');
    render();
  };
  var nw = $('#bingoNew');
  if(nw) nw.onclick = function(){ bingoNew(); render(); toast('换了一批新词'); };
  $$('#bingoCard .bg-cell').forEach(function(btn){
    btn.onclick = function(){
      if(!_funBingo) return;
      var i = parseInt(btn.dataset.bg, 10);
      if(isNaN(i) || i < 0 || i >= _funBingo.marked.length) return;
      _funBingo.marked[i] = _funBingo.marked[i] ? 0 : 1;
      _funBingo.line = bingoLineOf(_funBingo.marked);
      if(_funBingo.line) _funBingoWins++;
      render();
      if(_funBingo.line) toast('宾果！' + _funBingo.line.text);
    };
  });
}

/* ---------------- 单词老虎机 ---------------- */
/* 抽词：n 只认 1 / 3 / 5 / 10（别的值一律按 1 算），回 n 个不重复的词 */
function slotDraw(pool, n){
  var want = (n === 3 || n === 5 || n === 10) ? n : 1;
  return funPickWords(pool || [], want);
}
/* 开转：**结果在动画开始之前就定下来**。转的过程只是画随机占位词，
   停下来（slotStop）显示的就是这里定下的 final —— 转完不会再换一批。 */
function slotStart(n, pool){
  var want = (n === 3 || n === 5 || n === 10) ? n : 1;
  var p = pool || funPool();
  if(p.length < want) return null;
  var final = slotDraw(p, want);
  if(final.length < want) return null;
  _funSlot = { n: want, final: final, shown: final.slice(), running: true, pool: p };
  return _funSlot;
}
/* 停：清掉转动的计时器，把 shown 钉回 final。之后谁都不许再动 shown —— 
   「不许假动画」就是这一条：停下来看到的就是最终结果。 */
function slotStop(){
  if(_funSlotTimer){ clearInterval(_funSlotTimer); _funSlotTimer = null; }
  if(!_funSlot) return null;
  _funSlot.running = false;
  _funSlot.shown = _funSlot.final.slice();
  return _funSlot;
}
function slotResultHTML(list, spinning){
  return '<div class="slot-reels">' + (list || []).map(function(w){
    var k = String((w && w.w) || '');
    return '<div class="slot-reel' + (spinning ? ' spinning' : '') + '">'
      + '<span class="slot-w">' + escapeHtml(k) + '</span>'
      + (spinning ? ''
         : '<span class="slot-p">' + escapeHtml(String((w && w.p) || '')) + '</span>'
           + '<span class="slot-m">' + escapeHtml(String((w && w.m) || '')) + '</span>'
           + '<button class="btn sm" data-say="' + escapeHtml(k) + '">' + IC('volume') + ' 朗读</button>')
      + '</div>';
  }).join('') + '</div>';
}
function slotPaint(){
  var box = $('#slotOut');
  if(!box || !_funSlot) return;
  box.innerHTML = slotResultHTML(_funSlot.shown, true);
}
/* 开转（UI 入口）：先定结果 → 每 70ms 换一批占位词 → 950ms 后落定并重画 */
function slotGo(){
  var st = slotStart(_funSlotN, funPool());
  if(!st){ toast('当前词库不够 ' + _funSlotN + ' 个词'); return null; }
  _funSlotToken++;
  var token = _funSlotToken;
  if(_funSlotTimer){ clearInterval(_funSlotTimer); _funSlotTimer = null; }
  _funSlotTimer = setInterval(function(){
    if(token !== _funSlotToken || view !== 'slot' || !_funSlot){ slotStop(); return; }
    _funSlot.shown = funPickWords(_funSlot.pool, _funSlot.n);
    slotPaint();
  }, 70);
  setTimeout(function(){
    if(token !== _funSlotToken) return;
    slotStop();
    if(view === 'slot') render();
  }, 950);
  render();
  return st;
}
function renderSlot(app){
  var st = _funSlot;
  var spinning = !!(st && st.running);
  app.innerHTML =
      '<section class="card" style="padding:16px 18px">'
    +   '<h2 class="h2" style="margin-bottom:10px">单词老虎机 <span class="hint">当前词库 · 抽 1 / 3 / 5 / 10 个</span></h2>'
    +   '<p class="muted" style="margin-top:0">先选抽几个词，点「开转」；停下来显示的就是这一次的结果，附音标与释义。</p>'
    +   '<div class="seg" id="slotN">' + FUN_SLOT_NS.map(function(n){
          return '<button data-n="' + n + '"' + (_funSlotN === n ? ' class="on"' : '') + '>' + n + ' 个</button>';
        }).join('') + '</div>'
    +   '<div class="fun-acts">'
    +     '<button class="btn primary" id="slotGo"' + (spinning ? ' disabled' : '') + '>' + (spinning ? '转着…' : IC('bolt') + ' 开转') + '</button>'
    +     '<span class="fun-status" id="slotStatus">' + (st ? ('这一次抽了 ' + st.n + ' 个') : '还没开转') + '</span>'
    +   '</div>'
    + '</section>'
    + '<section class="card" id="slotOut">'
    +   (st ? slotResultHTML(st.shown, spinning) : '<p class="muted" style="margin:0">还没开转</p>')
    + '</section>';

  $$('#slotN button').forEach(function(b){
    b.onclick = function(){
      var n = parseInt(b.dataset.n, 10);
      if(!isNaN(n)) _funSlotN = n;
      render();
    };
  });
  var go = $('#slotGo');
  if(go) go.onclick = function(){ if(!_funSlot || !_funSlot.running) slotGo(); };
  $$('#slotOut [data-say]').forEach(function(b){
    b.onclick = function(){ speak(String(b.dataset.say || ''), 'en'); };
  });
}

/* ---------------- 单词接龙 ---------------- */
/* 上一个词的末字母（小写；空词回空串） */
function funLastLetter(w){
  var s = String((w && w.w) || '');
  return s ? s.charAt(s.length - 1).toLowerCase() : '';
}
/* 接龙判定（纯函数，不读全局）：
   input 用户输入 / prev 上一个词 / used 本局用过的 { key:1 } / pool 词池。
   回 { ok:true, word, key } 或 { ok:false, reason, need }。
   reason：empty 没输入 / first 首字母不对 / used 这一局用过 / notfound 词库里没有。
   判对错只看三条硬条件：首字母 = 上一个词的末字母、在当前词库里真的存在、本局没用过。 */
function chainJudge(input, prev, used, pool){
  var raw = String(input == null ? '' : input).replace(/^\s+|\s+$/g, '');
  if(!raw) return { ok:false, reason:'empty', need:funLastLetter(prev) };
  var key = raw.toLowerCase();
  var need = funLastLetter(prev);
  if(need && key.charAt(0) !== need) return { ok:false, reason:'first', need:need };
  if(used && used[key]) return { ok:false, reason:'used', need:need };
  var hit = null, i;
  for(i = 0; i < (pool || []).length; i++){
    if(String((pool[i] && pool[i].w) || '').toLowerCase() === key){ hit = pool[i]; break; }
  }
  if(!hit) return { ok:false, reason:'notfound', need:need };
  return { ok:true, word:hit, key:key };
}
/* 四种失败各说各的（不合并成一句「不对」）：用户才知道下一步该改什么 */
function chainMsg(res){
  if(!res) return '';
  if(res.ok) return '接上了';
  if(res.reason === 'empty') return '先输入一个英文词';
  if(res.reason === 'first') return '要以「' + String(res.need || '').toUpperCase() + '」开头';
  if(res.reason === 'used') return '这个词这一局已经用过了';
  return '当前词库里没有这个词';
}
function chainStart(pool){
  var p = pool || funPool();
  if(!p.length) return null;
  var start = funPickWords(p, 1)[0];
  _funChain = { cur: start, used: {}, score: 0, over: false, msg: '', pool: p };
  _funChain.used[String((start && start.w) || '').toLowerCase()] = 1;
  return _funChain;
}
/* 提交一次：接上就换当前词、加一分；接不上这一局就结束（胜负 = 连上的词数） */
function chainSubmit(input){
  if(!_funChain || _funChain.over) return null;
  var res = chainJudge(input, _funChain.cur, _funChain.used, _funChain.pool);
  if(!res.ok){ _funChain.msg = chainMsg(res); _funChain.over = true; return res; }
  _funChain.used[res.key] = 1;
  _funChain.cur = res.word;
  _funChain.score++;
  if(_funChain.score > _funChainBest) _funChainBest = _funChain.score;
  _funChain.msg = chainMsg(res);
  return res;
}
function renderChain(app){
  if(!_funChain) chainStart();
  var c = _funChain;
  if(!c){
    app.innerHTML = '<section class="card"><h2 class="h2">单词接龙</h2>'
      + '<p class="muted" style="margin:0">当前词库里没有可用的英文单词，先去「词库管理」选一个学段。</p></section>';
    return;
  }
  var lost = c.over
    ? '这一局接了 ' + c.score + ' 个 · 结束原因：' + (c.msg || '接不上')
    : '这一局接了 ' + c.score + ' 个 · 最好成绩 ' + _funChainBest + ' 个';
  app.innerHTML =
      '<section class="card" style="padding:16px 18px">'
    +   '<h2 class="h2" style="margin-bottom:10px">单词接龙 <span class="hint">末字母 → 首字母</span></h2>'
    +   '<p class="muted" style="margin-top:0">从下面这个词开头，输入一个以它的<b>末字母</b>开头、并且在当前词库里真的存在的英文词；接不上这一局就结束。</p>'
    +   '<div class="fun-cur"><b>' + escapeHtml(String((c.cur && c.cur.w) || '')) + '</b>'
    +     '<span class="fun-need">下一个要以 <i>' + escapeHtml(funLastLetter(c.cur).toUpperCase()) + '</i> 开头</span>'
    +     '<span class="fun-status">' + escapeHtml(String((c.cur && c.cur.m) || '')) + '</span></div>'
    +   '<div class="fun-row">'
    +     '<input class="fun-in" id="chainIn" placeholder="输入英文单词…" autocomplete="off" spellcheck="false"'
    +       (c.over ? ' disabled' : '') + '>'
    +     '<button class="btn primary" id="chainGo"' + (c.over ? ' disabled' : '') + '>接上</button>'
    +     '<button class="btn" id="chainNew">换一个开头</button>'
    +   '</div>'
    +   '<div class="fun-msg' + (c.over ? ' bad' : '') + '" id="chainMsg">' + escapeHtml(lost) + '</div>'
    + '</section>';
  var inp = $('#chainIn');
  if(inp && !c.over){
    inp.focus();
    inp.onkeydown = function(e){ if(e && e.key === 'Enter') $('#chainGo').onclick(); };
  }
  var go = $('#chainGo');
  if(go) go.onclick = function(){
    if(!inp){ return; }
    var res = chainSubmit(inp.value);
    render();
    if(res && !res.ok) toast(chainMsg(res));
  };
  var nw = $('#chainNew');
  if(nw) nw.onclick = function(){ chainStart(); render(); };
}

/* ---------------- 听音猜词 ---------------- */
/* 出题：从池子里取 4 个不重复的词，其中一个当答案，顺序本来就打乱了 */
function earBuild(pool){
  if(!pool || pool.length < 4) return null;
  var pick = funPickWords(pool, 4);
  if(pick.length < 4) return null;
  return { answer: pick[Math.floor(Math.random() * pick.length)], options: pick };
}
function earJudge(pickedKey, answer){
  return String(pickedKey || '').toLowerCase() === String((answer && answer.w) || '').toLowerCase();
}
function earStart(){
  var q = earBuild(funPool());
  if(!q) return null;
  /* hint（用户第 6 项）：0 = 什么都没露（默认）/ 1 = 只露首字母与字母数 / 2 = 露拼写。
     **默认绝不许是 1 或 2** —— 那等于把答案摊开，这个玩法就没意义了。 */
  _funEar = { q: q, picked: null, right: 0, total: 0, hint: 0 };

var _gsIndex = null;
function gsSearch(q){
  if(!_gsIndex) _gsIndex = gsIndex();
  q = q.replace(/^\s+|\s+$/g, '').toLowerCase();
  if(!q) return { list:[], total:0 };
  var starts = [], has = [];
  for(var i = 0; i < _gsIndex.length; i++){
    var it = _gsIndex[i];
    /* 索引项里的 t / key 一律按字符串处理：影视与文学里带年份等数字字段，
       直接 .toLowerCase() 会抛 it.t.toLowerCase is not a function 而整块搜索失效 */
    var tt = String(it.t === undefined || it.t === null ? '' : it.t).toLowerCase();
    var kk = String(it.key === undefined || it.key === null ? '' : it.key).toLowerCase();
    var p = tt.indexOf(q);
    if(p === 0) starts.push(it);
    else if(matchQuery(kk, q)) has.push(it);
    if(starts.length >= 200 && has.length >= 200) break;
  }
  return { list: starts.concat(has), total: starts.length + has.length };
}

/* ============================================================
   19. 分享配置包（ZIP 打包 / 解包，纯本地实现）
   ============================================================ */
var ZIP_CRC_TABLE = null;
function zipCRCInit(){
  if(ZIP_CRC_TABLE) return ZIP_CRC_TABLE;
  var t = new Int32Array(256);
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  ZIP_CRC_TABLE = t;
  return t;
}
function zipCRC32(bytes){
  var t = zipCRCInit();
  var c = -1;
  for(var i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}
function zipUTF8(str){
  if(typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
  var out = [];
  for(var i = 0; i < str.length; i++){
    var c = str.charCodeAt(i);
    if(c < 0x80) out.push(c);
    else if(c < 0x800){ out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
    else if(c >= 0xD800 && c < 0xDC00 && i + 1 < str.length){
      var c2 = str.charCodeAt(++i);
      var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    }else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(out);
}
function zipStr(bytes){
  if(typeof TextDecoder !== 'undefined'){
    try{ return new TextDecoder('utf-8').decode(bytes); }catch(e){}
  }
  var s = '';
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  try{ return decodeURIComponent(escape(s)); }catch(e){ return s; }
}

    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);

    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);

    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataB.length, true);
    cv.setUint32(24, dataB.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);
    offset += lh.length;
  });
  var cdSize = 0;
  central.forEach(function(c){ cdSize += c.length; });
  var eocd = new Uint8Array(22);
  var ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, central.length, true);
  ev.setUint16(10, central.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);
  var all = parts.concat(central).concat([eocd]);
  var total = 0;
  all.forEach(function(p){ total += p.length; });
  var out = new Uint8Array(total), pos = 0;
  all.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return new Blob([out], { type:'application/zip' });
}
/* ArrayBuffer → {name: text}；只支持 store（method 0），兼容由 Windows/7-Zip 生成的无压缩包 */
function zipRead(buffer){
  var u8 = new Uint8Array(buffer);
  var dv = new DataView(buffer);
  var out = {}, i = 0;
  while(i + 30 <= u8.length){
    if(dv.getUint32(i, true) !== 0x04034b50) break;
    var method = dv.getUint16(i + 8, true);
    var csize = dv.getUint32(i + 18, true);
    var usize = dv.getUint32(i + 22, true);
    var nlen = dv.getUint16(i + 26, true);
    var elen = dv.getUint16(i + 28, true);
    var name = zipStr(u8.subarray(i + 30, i + 30 + nlen));
    var start = i + 30 + nlen + elen;
    if(method === 0){
      out[name] = zipStr(u8.subarray(start, start + (usize || csize)));
    }
    i = start + csize;
  }
  return out;
}

function shareSave(blob, name){

function shareReadFile(file, done){
  if(file.size > 24 * 1024 * 1024){ uiAlert('文件过大（上限 24 MB）。', '导入失败'); return; }
  var fr = new FileReader();
  fr.onload = function(){
    var buf = fr.result;
    var obj = null;
    var isZip = /\.zip$/i.test(file.name || '');
    if(!isZip){
      try{
        var t = zipStr(new Uint8Array(buf));
        obj = JSON.parse(t);
        done(obj, 'json'); return;
      }catch(e){ isZip = true; }
    }
    try{
      var files = zipRead(buf);
      var key = files['data.json'] ? 'data.json' : (files['config.json'] ? 'config.json' : null);
      if(!key) throw new Error('压缩包里没有找到 data.json');
      obj = JSON.parse(files[key]);
      done(obj, 'zip');
    }catch(e){
      uiAlert('无法解析该配置文件：' + e.message, '导入失败');
    }
  };
  fr.onerror = function(){ uiAlert('文件读取失败，请重试。', '导入失败'); };
  fr.readAsArrayBuffer(file);
}
function shareApply(obj, parts){
  if(!obj || typeof obj !== 'object') throw new Error('配置内容为空');
  var src = obj.data && typeof obj.data === 'object' ? obj.data : obj;
  var applied = [];
  parts.forEach(function(k){
    if(src[k] === undefined || src[k] === null) return;
    if(k === 'settings'){
      var s = src.settings;
      if(s){
        if(s.level && DATA[s.level]) S.level = s.level;
        /* #6：新包带 levels；老包里只有 level，就按单学段推（不保留本机原来的多选） */
        var keepLv = (Array.isArray(s.levels) && s.levels.length)
          ? s.levels.filter(function(k){ return typeof k === 'string' && !!DATA[k]; })
          : [S.level];
        if(keepLv.length) S.levels = keepLv;
        syncLevel();
        if(typeof s.count === 'number') S.count = s.count;
        if(Array.isArray(s.flow) && s.flow.length) S.flow = s.flow.filter(function(x){ return STEP_ORDER.indexOf(x) >= 0; });
        if(s.theme) S.theme = s.theme;
        if(typeof s.dark === 'boolean') S.dark = s.dark;
        if(s.fontSize) S.fontSize = s.fontSize;
        if(s.settings) for(var kk in s.settings){
          if(Object.prototype.hasOwnProperty.call(s.settings, kk)) S.settings[kk] = s.settings[kk];
        }
        applied.push('偏好设置');
      }
    }else if(k === 'libs'){
      if(Array.isArray(src.libs)){
        S.libs = src.libs.filter(function(L){ return L && L.name && Array.isArray(L.items); });
        if(!S.activeLibs) S.activeLibs = [];
        S.activeLibs = ['default'];
        S.libs.forEach(function(L){ if(L.id && S.activeLibs.indexOf(L.id) < 0) S.activeLibs.push(L.id); });
        applyUserLibs();
        applied.push('自建词库 ' + S.libs.length + ' 个');
      }
    }else if(k === 'wrong' && Array.isArray(src.wrong)){ S.wrong = src.wrong; applied.push('错题本 ' + S.wrong.length + ' 条'); }
    else if(k === 'favs' && Array.isArray(src.favs)){ S.favs = src.favs; applied.push('收藏本 ' + S.favs.length + ' 条'); }
    else if(k === 'checkin' && typeof src.checkin === 'object'){ S.checkin = src.checkin; applied.push('打卡记录'); }
    else if(k === 'evals' && Array.isArray(src.evals)){ S.evals = src.evals; applied.push('学习报告 ' + S.evals.length + ' 条'); }
    else if(k === 'notes' && typeof src.notes === 'object'){ S.notes = src.notes; applied.push('观后感'); }
    else if(k === 'schedule' && src.schedule){ S.schedule = src.schedule; applied.push('学习日程'); }
    else if(k === 'seen' && typeof src.seen === 'object'){ S.seen = src.seen; applied.push('学习痕迹'); }
  });
  save();
  applyTheme();
  return applied;
}

/* ============================================================
   全部数据：导出 / 导入（2026-10-20 用户第 1 项）
   ------------------------------------------------------------
   为什么要有：学习进度、错题本、收藏、打卡、标注历史、每日使用时长**全都只在本机
   localStorage 里**，换手机 / 清了浏览器数据就一点不剩，而「配置分享」那个包只挑了几类。

   导出 = 把 localStorage 里的**每一个键**按原样塞进 JSON（逐个枚举，不写死清单）：
     ew_local_v10（主存档 S） / ew_session_v10（学习会话） / ew_onboard_v1（引导）
     ew_env_v1（环境提示） / ew_anno_hist_v1（标注历史） / ew_usage_<日期>（当日时长）…
   以后加了新键，这里一个字都不用改。文件结构：
     { app:'聚合英语', schema:1, exportedAt:'<ISO>', keys:{ '<键>':'<原始字符串>' } }

   导入 = ① 读文本 → ② JSON.parse → ③ **先校验形状**（app / schema / keys 对象、
   每个值都是字符串），任何一条不对就拒绝、一个键都不写 → ④ 确认框把摘要摆出来
   并**明说「会覆盖这台手机上现在的全部数据」** → ⑤ 用户点头才逐个 setItem
   （一项一个 try，失败的汇总报出来，不许部分成功还显示成功）→ ⑥ location.reload()。
   ============================================================ */
var DATA_APP = '聚合英语';
var DATA_SCHEMA = 1;
var SW_CACHE_NAME = 'juhe-v1';   /* 必须与 sw.js 里的 CACHE_NAME 一致 */

/* 文件名带日期时间：juhe-english-backup-2026-10-20-1530.json */
function dataBackupName(d){
  d = d || new Date();
  return 'juhe-english-backup-' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
    + '-' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.json';
}
/* 逐个枚举 localStorage 的真实键。读某个键失败只跳过它自己，不打断整份导出。 */
function dataCollectKeys(){
  var keys = {}, n = 0;
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(typeof k !== 'string' || !k) continue;
      if(Object.prototype.hasOwnProperty.call(keys, k)) continue;
      var v = null;
      try{ v = localStorage.getItem(k); }catch(e){ continue; }
      if(typeof v !== 'string') continue;
      keys[k] = v;
      n++;
    }
  }catch(e){}
  return { keys:keys, n:n };
}
function dataExportBundle(){
  var got = dataCollectKeys();
  return { app:DATA_APP, schema:DATA_SCHEMA, exportedAt:new Date().toISOString(), keys:got.keys };
}
/* 真下载：Blob + createObjectURL + a[download]（与本页生成 PDF / 打卡图同一条路） */
function dataExportDownload(){
  var bundle = dataExportBundle();
  var names = Object.keys(bundle.keys);
  if(!names.length){ toast('本机还没有可导出的数据'); return null; }
  var text = JSON.stringify(bundle, null, 2);
  var name = dataBackupName(new Date());
  try{
    var blob = new Blob([text], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      try{ URL.revokeObjectURL(url); }catch(e){}
    }, 400);
  }catch(e){
    toast('导出失败：这个浏览器不让下载（' + ((e && e.message) || '原因不明') + '）');
    return null;
  }
  toast('已导出 ' + names.length + ' 项数据，文件名 ' + name);
  return { name:name, count:names.length, text:text };
}

/* 形状校验：**只判断、绝不写键**。回 { ok:true, bundle, names, n } 或 { ok:false, why } */
function dataBundleCheck(text){
  var obj = null;
  try{ obj = JSON.parse(String(text == null ? '' : text)); }
  catch(e){ return { ok:false, why:'这不是一个合法的 JSON 文件（' + ((e && e.message) || '解析失败') + '）' }; }
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)){
    return { ok:false, why:'文件里装的不是一个 JSON 对象' };
  }
  if(obj.app !== DATA_APP){
    return { ok:false, why:'这不是「' + DATA_APP + '」的备份（文件里写的 app 是「'
      + (obj.app === undefined ? '没有这一项' : String(obj.app)) + '」）' };
  }
  var sc = obj.schema;
  if(typeof sc !== 'number' || !isFinite(sc) || Math.floor(sc) !== sc || sc < 1){
    return { ok:false, why:'备份文件的 schema 不是正整数（读到「' + String(sc) + '」）' };
  }
  if(sc > DATA_SCHEMA){
    return { ok:false, why:'这份备份来自更新的版本（schema ' + sc + '，这个页面只认到 ' + DATA_SCHEMA
      + '），直接导会读错，请先把页面更新到最新再导' };
  }
  if(!obj.keys || typeof obj.keys !== 'object' || Array.isArray(obj.keys)){
    return { ok:false, why:'备份文件里没有 keys 对象' };
  }
  var names = Object.keys(obj.keys);
  for(var i = 0; i < names.length; i++){
    if(typeof obj.keys[names[i]] !== 'string'){
      return { ok:false, why:'备份里「' + names[i] + '」这一项的值不是字符串（是 '
        + (obj.keys[names[i]] === null ? 'null' : typeof obj.keys[names[i]]) + '），不敢往里写' };
    }
  }
  if(!names.length) return { ok:false, why:'备份文件里一个数据项都没有' };
  return { ok:true, bundle:obj, names:names, n:names.length };
}
/* 确认框要摆的摘要：数据项数、主状态里学过的词、错题数、导出时间 */
function dataBundleSummary(bundle){
  var keys = (bundle && bundle.keys) || {};
  var out = {
    n:Object.keys(keys).length, seenN:0, wrongN:0, mainOk:false,
    exportedAt:String((bundle && bundle.exportedAt) || '') || '（备份里没写导出时间）'
  };
  var main = null;
  try{ main = JSON.parse(String(keys[LS_KEY] == null ? 'null' : keys[LS_KEY])); }catch(e){ main = null; }
  if(main && typeof main === 'object'){
    out.mainOk = true;
    out.seenN = (main.seen && typeof main.seen === 'object') ? Object.keys(main.seen).length : 0;
    out.wrongN = Array.isArray(main.wrong) ? main.wrong.length : 0;
  }
  return out;
}
/* 真写：一项一个 try，失败的收集起来汇总（不吞、也不假装成功） */
function dataImportApply(bundle){
  var keys = (bundle && bundle.keys) || {};
  var names = Object.keys(keys), ok = 0, bad = [];
  for(var i = 0; i < names.length; i++){
    var k = names[i];
    try{
      localStorage.setItem(k, String(keys[k]));
      ok++;
    }catch(e){ bad.push(k); }
  }
  return { ok:ok, bad:bad, n:names.length };
}
/* 导入的唯一入口（file 读完就把文本交给它；自检也直接调它） */
function dataImportText(fileName, text){
  var ck = dataBundleCheck(text);
  if(!ck.ok){
    uiAlert('这个文件不能导入：' + ck.why + '。这台手机上的数据一个键都没有动。', '导入被拒绝');
    return false;
  }
  var sum = dataBundleSummary(ck.bundle);
  var curSeen = Object.keys(S.seen || {}).length;
  var curWrong = Array.isArray(S.wrong) ? S.wrong.length : 0;
  var html =
      '<p style="margin:0 0 8px">文件：' + escapeHtml(String(fileName || '（没有文件名）'))
    + '　·　导出时间：' + escapeHtml(sum.exportedAt) + '</p>'
    + '<ul style="margin:0 0 10px 18px;padding:0;line-height:1.9">'
    +   '<li>数据项：<b>' + sum.n + '</b> 个</li>'
    +   '<li>主状态里学过的词：备份里 <b>' + sum.seenN + '</b> 个，这台手机上现在是 <b>' + curSeen + '</b> 个</li>'
    +   '<li>错题：备份里 <b>' + sum.wrongN + '</b> 条，这台手机上现在是 <b>' + curWrong + '</b> 条</li>'
    + '</ul>'
    + '<p style="margin:0;color:#b42318;font-weight:700">导入会覆盖这台手机上现在的全部数据'
    + '（学习进度、错题本、收藏、打卡、设置、自建词库、标注历史、每日使用时长），而且不能撤销。'
    + '确定要覆盖吗？</p>';
  uiConfirm('', function(){
    var r = dataImportApply(ck.bundle);
    if(!r.ok){
      uiDialog({ title:'导入失败', danger:true, okText:'知道了', cancelText:'',
        body:'一项都没写进去（' + r.bad.slice(0, 3).join('、') + '）。这台手机上的数据没有变。' });
      return;
    }
    if(r.bad.length){
      /* 部分成功：如实报，并且照样刷新 —— 不刷新的话页面上还是旧状态，
         下一次 save() 会把旧存档写回去，把刚导进来的东西悄悄盖掉。 */
      uiDialog({ title:'有一部分没写进去', danger:true, okText:'刷新页面', cancelText:'',
        body:'写进去 ' + r.ok + ' 项，另有 ' + r.bad.length + ' 项被浏览器拒绝（'
          + r.bad.slice(0, 3).join('、') + (r.bad.length > 3 ? '…' : '') + '）。'
          + '点「刷新页面」后会看到「写进去的那部分」，没写进去的那几项还是原来的。',
        onOk:function(){ location.reload(); } });
      return;
    }
    location.reload();
  }, { title:'导入数据', okText:'覆盖并导入', cancelText:'取消', danger:true, html:html });
  return true;
}
/* 点「导入数据」→ 打开那颗 hidden 的 input[type=file] */
function dataImportFromFile(){
  var inp = document.getElementById('dataImportFile');

function dataImportBind(){

  };
}

/* 离线缓存的真实状态（用户第 2 项）。真相源是 window.__swState，由文档末尾那段
   <script id="swReg"> 写进去 —— 它在 bootLoader 之后、主脚本之前跑，所以这里一定读得到。 */
function swState(){
  var st = (typeof window !== 'undefined' && window.__swState) ? window.__swState : null;
  if(st) return st;
  return { state:'idle', err:'', cache:SW_CACHE_NAME };
}
function swStatusOk(){ return swState().state === 'ready'; }
function swStatusText(){
  var st = swState();
  var name = st.cache || SW_CACHE_NAME;
  if(st.state === 'ready') return '离线缓存已注册成功（缓存版本 ' + name + '）：联网打开过一次之后，断网也能打开这一页。';
  if(st.state === 'file') return '现在是用本地文件（file://）打开的，浏览器不允许本地文件用离线缓存 —— 从网址打开才谈得上离线。';
  if(st.state === 'unsupported') return '这个浏览器不支持 Service Worker，离线缓存没开成：断网时打不开这一页，只能联网用。';
  if(st.state === 'failed') return '离线缓存没注册成功（' + (st.err || '原因不明') + '）：断网时打不开这一页，只能联网用。';
  if(st.state === 'registering') return '离线缓存正在注册，过一会儿再看这一行（还是这句就说明没注册上）。';
  return '离线缓存还没开始注册（页面可能没加载完），断网时打不开这一页。';
}
/* 注册成功 / 失败时由 swReg 回调：只改这一行的文字，不重绘整页（用户可能正在改设置） */
window.__swRefresh = function(){

/* 我的页：今日统计 + 近 N 天趋势折线 + 日程 + 导入导出 */
var meTrendRange = 7;
function meTodayEvals(){
  var tk = todayKey();
  return (S.evals || []).filter(function(r){ return dateKeyOf(new Date(r.t)) === tk; }).sort(function(a, b){ return a.t - b.t; });
}
function meTrendData(n){
  var out = [];
  var now = new Date();
  for(var i = n - 1; i >= 0; i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    var k = dateKeyOf(d);
    var rec = S.checkin[k] || {};
    var acc = rec.total > 0 ? Math.round((rec.correct || 0) / rec.total * 100) : null;
    var dayEvals = (S.evals || []).filter(function(r){ return dateKeyOf(new Date(r.t)) === k; });
    var grade = '-';
    if(dayEvals.length){
      var best = 99;
      dayEvals.forEach(function(r){ var rk = GRADE_ORDER.indexOf(r.grade); if(rk >= 0 && rk < best){ best = rk; grade = r.grade; } });
    }
    out.push({ d:d, k:k, words:rec.words || 0, acc:acc, grade:grade, label:(i === 0 ? '今天' : WEEK_NAME[schedIdx(d)]) });
  }
  return out;
}
function meTrendChartSVG(data){
  var W = 640, H = 216, padL = 32, padR = 12, padT = 26, padB = 26;
  var maxWords = 1;
  data.forEach(function(d){ if(d.words > maxWords) maxWords = d.words; });
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var n = data.length, bw = innerW / n;
  var s = '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  [0, 50, 100].forEach(function(v){
    var y = padT + innerH * (1 - v / 100);
    s += '<line class="tg" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>';
    s += '<text class="tax" x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + v + '</text>';
  });
  var pts = [];
  data.forEach(function(d, i){
    var cx = padL + bw * i + bw / 2;
    var barW = bw * 0.5;
    var bx = padL + bw * i + bw * 0.25;
    var bh = innerH * (d.words / maxWords);
    var by = padT + innerH - bh;
    s += '<rect class="' + (d.words > 0 ? 'tbar' : 'tbar-empty') + '" x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(bh, 2).toFixed(1) + '" rx="3"/>';
    s += '<text class="tw" x="' + cx + '" y="' + (by - 6) + '" text-anchor="middle">' + d.words + '</text>';
    if(d.grade !== '-'){
      var gm = evalGradeMeta(d.grade);
      s += '<text class="tgrd" x="' + cx + '" y="' + (padT - 9) + '" text-anchor="middle" style="fill:' + gm.color + '">' + d.grade + '</text>';
    }
    if(d.acc != null){
      var ay = padT + innerH * (1 - d.acc / 100);
      pts.push([cx, ay]);
      s += '<circle class="tp" cx="' + cx + '" cy="' + ay + '" r="3.5"/>';
    }
    s += '<text class="td" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + d.label + '</text>';
  });
  if(pts.length >= 2){
    s += '<polyline class="tl" points="' + pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
  }
  s += '</svg>';
  return s;
}
function renderMe(app){
  var cs = checkinStats();
  var today = cs.todayData;
  var todayAcc = today.total > 0 ? Math.round((today.correct || 0) / today.total * 100) : null;
  var totalAcc = cs.total > 0 ? Math.round(cs.correct / cs.total * 100) : null;

  $('#meGoSched').onclick = function(){ view = 'schedule'; render(); };

function renderNavManage(app){
  var grp = navGroups();
  var assigned = {};
  grp.forEach(function(g){ g.items.forEach(function(it){ assigned[it.v] = true; }); });
  var unassigned = allNavItems().filter(function(it){ return !assigned[it.v]; });
  function ensure(){
    if(!S.navGroups || !S.navGroups.length){
      S.navGroups = JSON.parse(JSON.stringify(NAV_GROUPS));
    }
    return S.navGroups;
  }
  app.innerHTML =
      '<div class="nm-head">'
    +   '<div><h1 class="h2" style="margin:0">分类管理</h1>'
    +   '<p class="muted" style="margin:6px 0 0">点击分组标题可折叠/展开侧边栏；在此重命名、增删分组、把功能移进或移出分组。改动会覆盖默认分类，可随时重置。</p></div>'
    +   '<button class="btn" id="nmAdd">' + IC('folder') + ' 新建分类</button>'
    + '</div>'
    + grp.map(function(g){
        return '<section class="card">'
        + '<div class="nm-group-head">'
        +   '<input class="text-input nm-name" data-gk="' + escapeHtml(g.k) + '" value="' + escapeHtml(g.t) + '" aria-label="分类名">'
        +   '<button class="btn sm ghost nm-del" data-gk="' + escapeHtml(g.k) + '">' + IC('trash') + ' 删除</button>'
        + '</div>'
        + '<div class="chips">'
        +   g.items.map(function(it){
              return '<span class="chip nm-chip">' + escapeHtml(it.n)
                + '<button class="nm-rm" data-gk="' + escapeHtml(g.k) + '" data-v="' + it.v + '" title="移出此分类">×</button></span>';
            }).join('')
        + '</div>'
        + '</section>';
      }).join('')
    + '<section class="card">'
    + '<h2 class="h2">未分类</h2>'
    + (unassigned.length
        ? unassigned.map(function(it){
            return '<div class="nm-row">'
            + '<span class="nm-it">' + IC(it.ic) + '<span>' + escapeHtml(it.n) + '</span></span>'
            + '<select class="nm-sel" data-v="' + it.v + '" aria-label="移入分类">'
            +   grp.map(function(g){ return '<option value="' + escapeHtml(g.k) + '">' + escapeHtml(g.t) + '</option>'; }).join('')
            + '</select>'
            + '<button class="btn sm nm-move" data-v="' + it.v + '">移入</button>'
            + '</div>';
          }).join('')
        : '<p class="muted" style="margin:0">所有功能都已分类。</p>')
    + '</section>'
    + '<div class="row">'
    + '<button class="btn ghost" id="nmReset">' + IC('refresh') + ' 重置为默认分类</button>'
    + '</div>';

  $('#nmAdd').onclick = function(){
    var name = prompt('新分类名称：', '');
    if(!name) return;
    name = name.trim();
    if(!name) return;
    ensure().push({ k:'g' + Date.now(), t:name, items:[] });
    save(); render();
  };
  $$('.nm-name').forEach(function(inp){
    inp.onchange = function(){
      var gs = ensure();
      var g = gs.filter(function(x){ return x.k === inp.dataset.gk; })[0];
      if(g && inp.value.trim()){ g.t = inp.value.trim(); save(); render(); }
    };
  });
  $$('.nm-del').forEach(function(b){
    b.onclick = function(){
      S.navGroups = ensure().filter(function(x){ return x.k !== b.dataset.gk; });
      save(); render();
    };
  });
  $$('.nm-rm').forEach(function(b){
    b.onclick = function(){
      ensure().forEach(function(x){
        if(x.k === b.dataset.gk){ x.items = x.items.filter(function(it){ return it.v !== b.dataset.v; }); }
      });
      save(); render();
    };
  });
  $$('.nm-move').forEach(function(b){
    b.onclick = function(){
      var sel = $('.nm-sel[data-v="' + b.dataset.v + '"]');
      if(!sel) return;
      var gk = sel.value;
      var it = allNavItems().filter(function(x){ return x.v === b.dataset.v; })[0];
      if(!it) return;
      var gs = ensure();
      gs.forEach(function(x){ if(x.k === gk) x.items.push({ v:it.v, n:it.n, ic:it.ic }); });
      save(); render();
    };
  });
  $('#nmReset').onclick = function(){
    S.navGroups = null;
    save(); render();
  };
}

/* ============================================================
   文本标注：粘贴英文 → 统计 + 标注（词库内蓝 / 词库外红，点击收录）
   ============================================================ */
var ANNO_POS = ['n.','v.','vt.','vi.','adj.','adv.','prep.','conj.','pron.','num.','art.','aux.','其他'];
var _annoWord = '';
function annoCount(text){
  var words = text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g) || [];
  var paras = text.split(/\n+/).filter(function(s){ return s.trim(); });
  return { words: words.length, paras: paras.length };
}
function annoRenderResult(text){
  var html = '', last = 0, m;
  var re = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
  while((m = re.exec(text))){
    html += escapeHtml(text.slice(last, m.index));
    var tok = m[0];
    var direct = findWord(tok);
    if(direct){
      html += '<span class="anno anno-known" data-w="' + escapeHtml(direct.w) + '" title="' + escapeHtml(direct.m || '') + '">' + escapeHtml(tok) + '</span>';
    }else{
      var base = findBase(tok);
      if(base){
        html += '<span class="anno anno-known" data-w="' + escapeHtml(base.w) + '" title="' + escapeHtml(base.m || '') + '">' + escapeHtml(tok) + '</span>';
      }else{
        html += '<span class="anno anno-unknown" data-anno-add="' + escapeHtml(tok) + '" title="词库未收录，点击填写详情">' + escapeHtml(tok) + '</span>';
      }
    }
    last = m.index + m[0].length;
  }
  html += escapeHtml(text.slice(last));
  return html;
}
/* ============================================================
   拍照识别英文：Tesseract.js（懒加载）+ 本站词库纠错
   ------------------------------------------------------------
   全站只有这一处要联网：识别引擎（wasm + 英文 traineddata，十几 MB）不可能塞进这个单页。
   所以只在用户点「开始识别」那一刻才去 CDN 拿，并且在界面上如实写明「第一次要联网」。
   纠错只做两件不会无中生有的事：
     ① 先把 OCR 常见混淆归一化（rn→m、vv→w、cl→d、0→o、1→l…），拿归一化结果查词库，
        命中就换成词库里的正字（大小写照原样还原）；
     ② 归一化也查不到时，只在「首字母相同、长度差 ≤1」的候选词里找编辑距离 ≤1 的词。
   词库里本来就有的词、短于 4 个字母的词、含非英文字母的词，一律原样保留。
   ============================================================ */
var TESS_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var _ocrIndex = null;   /* 归一化形式 → 词库里的正字（小写） */
var _ocrByHead = null;  /* 首字母 → [词…]，只给编辑距离用 */
function ocrCanon(s){
  return String(s).toLowerCase()
    .replace(/rn/g, 'm').replace(/vv/g, 'w').replace(/cl/g, 'd').replace(/\|/g, 'l')
    .replace(/0/g, 'o').replace(/1/g, 'l').replace(/3/g, 'e').replace(/4/g, 'a')
    .replace(/5/g, 's').replace(/7/g, 't').replace(/8/g, 'b').replace(/9/g, 'g')
    .replace(/[‘’´`]/g, "'").replace(/[—–]/g, '-');
}
function ocrBuildIndex(){
  if(_ocrIndex) return;
  var idx = {}, head = {};
  ALL_MAP.forEach(function(v, k){
    var low = String(k).toLowerCase();
    if(!/^[a-z][a-z'-]*$/.test(low)) return;
    var c = ocrCanon(low);
    if(idx[c] === undefined) idx[c] = low;
    var h = low.charAt(0);
    if(!head[h]) head[h] = [];
    head[h].push(low);
  });
  _ocrIndex = idx;
  _ocrByHead = head;
}
/* 编辑距离是否 ≤ 1（只关心这一个阈值，不必算完整矩阵） */
function ocrNear(a, b){
  var la = a.length, lb = b.length;
  if(Math.abs(la - lb) > 1) return false;
  var i = 0, j = 0, diff = 0;
  while(i < la && j < lb){
    if(a.charAt(i) === b.charAt(j)){ i++; j++; continue; }
    diff++;
    if(diff > 1) return false;
    if(la > lb) i++;
    else if(lb > la) j++;
    else { i++; j++; }
  }
  if(i < la || j < lb) diff++;
  return diff <= 1;
}
function ocrKeepCase(orig, low){
  /* 大小写只在「原 token 的首字符是字母」时才照抄 —— OCR 常把 l/o 认成 1/0，
     那种 token 的首字符是数字，一律按小写还回去，不能掰成 Likes / Only。 */
  if(orig.length > 1 && /[A-Za-z]/.test(orig) && orig === orig.toUpperCase()) return low.toUpperCase();
  var c0 = orig.charAt(0);
  if(/[A-Za-z]/.test(c0) && c0 === c0.toUpperCase()) return low.charAt(0).toUpperCase() + low.slice(1);
  return low;
}
function ocrFixToken(tok){
  var low = String(tok).toLowerCase();
  /* 允许 token 里混进数字（OCR 常把 l 认成 1、o 认成 0），但必须至少有一个字母 */
  if(!/[a-z]/.test(low)) return tok;
  if(!/^[a-z0-9][a-z0-9'-]*$/.test(low)) return tok;
  if(findWord(low)) return tok;           /* 词库里本来就有，绝不动它 */
  if(low.length < 4) return tok;
  ocrBuildIndex();
  var c = ocrCanon(low);
  /* 归一化没改动任何字符（c === low）说明它身上没有可还原的 OCR 混淆字（rn / vv / cl / 0 / 1…）。
     词库里又查不到它 ⇒ 就当正常词原样留着。这一条是硬的：绝不能在此时再往「编辑距离 ≤1 的近邻」
     里找，否则 things→thing、likes→like，等于把用户本来就写对的词改错。 */
  if(c === low) return tok;
  /* 归一化确实还原了混淆字：先看还原出来的样子是不是词库里的合法形式（含变形，
     例如 1ikes → likes → 词库有 like），再看归一化索引里有没有正字 */
  if(findWord(c) || findBase(c)) return ocrKeepCase(tok, c);
  if(_ocrIndex[c]) return ocrKeepCase(tok, _ocrIndex[c]);
  /* 兜底：只认「首字母相同、编辑距离 ≤1」的近邻，且要求词本身够长（≥5）、且不含数字
     —— 免得把词库里没有的正常词、或年份那样的数字串硬掰成别的词 */
  if(c.length >= 5 && !/[0-9]/.test(low)){
    var pool = _ocrByHead[c.charAt(0)] || [];
    for(var i = 0; i < pool.length; i++){
      if(ocrNear(c, pool[i])) return ocrKeepCase(tok, pool[i]);
    }
  }
  return tok;
}
/* 同时产出两份：给屏幕看的高亮 HTML + 喂给标注框的纯文本。
   token 允许夹数字（OCR 会把 l 认成 1、o 认成 0），但必须至少含一个字母。 */
function ocrFixAll(text){
  var html = '', plain = '', fixed = 0, total = 0, last = 0, m;
  var re = /[A-Za-z0-9]*[A-Za-z][A-Za-z0-9]*(?:['’-][A-Za-z0-9]+)*/g;
  while((m = re.exec(text))){
    var gap = text.slice(last, m.index);
    html += escapeHtml(gap); plain += gap;
    var tok = m[0];
    var nw = ocrFixToken(tok);
    total++;
    if(nw !== tok){
      fixed++;
      html += '<span class="anno-fixmark" title="原识别：' + escapeHtml(tok) + '">' + escapeHtml(nw) + '</span>';
    }else{
      html += escapeHtml(tok);
    }
    plain += nw;
    last = m.index + m[0].length;
  }
  var tail = text.slice(last);
  html += escapeHtml(tail); plain += tail;
  return { html: html, plain: plain, fixed: fixed, total: total };
}
/* 识字结果里常见的「行尾连字符断词」接回去：exam- ⏎ ple → example */
function ocrJoinHyphens(text){
  return String(text).replace(/([A-Za-z])-\s*\n\s*([a-z])/g, '$1$2');
}
function ocrStatusText(s){
  var t = String(s || '');
  if(t.indexOf('loading tesseract') === 0) return '正在下载识别引擎…';
  if(t.indexOf('loading language') === 0) return '正在下载英文识别模型…';
  if(t.indexOf('initializing') === 0) return '正在初始化…';
  if(t.indexOf('recognizing') === 0) return '正在识别文字…';
  return t || '正在识别…';
}
function ocrLoadLib(cb){
  if(window.Tesseract) return cb(null, window.Tesseract);
  var old = document.getElementById('tessLib');
  if(old){
    old.addEventListener('load', function(){ window.Tesseract ? cb(null, window.Tesseract) : cb(new Error('识别引擎加载完却没就绪')); });
    old.addEventListener('error', function(){ cb(new Error('识别引擎脚本没下载下来')); });
    return;
  }
  var s = document.createElement('script');
  s.id = 'tessLib';
  s.src = TESS_CDN;
  s.onload = function(){ window.Tesseract ? cb(null, window.Tesseract) : cb(new Error('识别引擎加载完却没就绪')); };
  s.onerror = function(){ cb(new Error('识别引擎脚本没下载下来（检查一下网络）')); };
  document.head.appendChild(s);
}
function ocrRun(file, onProg, cb){
  ocrLoadLib(function(err, T){
    if(err) return cb(err);
    var keep = true;
    T.recognize(file, 'eng', {
      logger: function(m){
        if(keep && onProg) onProg(m && m.status, (m && typeof m.progress === 'number') ? m.progress : 0);
      }
    }).then(function(r){
      keep = false;
      cb(null, (r && r.data && r.data.text) ? r.data.text : '');
    }).catch(function(e){
      keep = false;
      cb(e || new Error('识别失败'));
    });
  });
}
/* ============================================================
   文本标注：识别记录（文本标注 + 拍照识别，最多留 100 条）
   记录单独存一个 localStorage 键，不塞进 S —— 不然每次 save() 都要
   把上百条正文与缩略图序列化一遍，主存储会越来越慢。
   ============================================================ */
var ANNO_HIST_KEY = 'ew_anno_hist_v1';
var ANNO_HIST_MAX = 100;
var _annoTab = 'text';      /* 子标签页：text（粘贴文本）| ocr（拍照 / 图片） */
var _annoHist = null;       /* 懒读缓存，写回时原地改这个数组 */

function annoHistLoad(){
  if(_annoHist) return _annoHist;
  var a = [];
  try{
    var raw = localStorage.getItem(ANNO_HIST_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(Array.isArray(p)) a = p;
    }
  }catch(e){ a = []; }
  _annoHist = a.filter(function(r){
    return r && typeof r.t === 'number' && typeof r.text === 'string' && r.id;
  });
  return _annoHist;
}
/* 配额不够时逐级退让：先丢最旧的十条 → 再丢所有缩略图 → 最后一条条丢。
   localStorage 满的时候 setItem 会抛异常，绝不能让它冒出去打断渲染。 */
function annoHistWrite(){
  var list = annoHistLoad();
  for(var i = 0; i < 10; i++){
    try{ localStorage.setItem(ANNO_HIST_KEY, JSON.stringify(list)); return true; }
    catch(e){
      if(list.length > 10){ list.length -= 10; continue; }
      var dropped = 0;
      for(var j = 0; j < list.length; j++){ if(list[j].thumb){ delete list[j].thumb; dropped++; } }
      if(dropped) continue;
      if(list.length > 1){ list.length -= 1; continue; }
      return false;
    }
  }
  return false;
}
function annoHistOneLine(s, max){
  var t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  return t.length > max ? t.slice(0, max) + '…' : t;
}
function annoHistAgo(t){
  var d = Date.now() - t;
  if(d < 0) d = 0;
  if(d < 60000) return '刚刚';
  if(d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if(d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
  if(d < 86400000 * 7) return Math.floor(d / 86400000) + ' 天前';
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  var dt = new Date(t);
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());
}
function annoHistAdd(kind, text, extra){
  var list = annoHistLoad();
  /* 同一种来源、正文一模一样的两条只留最新的，免得连点「开始标注」刷出一屏重复 */
  if(list.length && list[0].kind === kind && list[0].text === text) return list[0];
  var c = annoCount(text);
  var rec = {
    id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    t: Date.now(), kind: kind, text: String(text || ''),
    words: c.words, paras: c.paras
  };
  if(extra) Object.keys(extra).forEach(function(k){ if(extra[k]) rec[k] = extra[k]; });
  list.unshift(rec);
  if(list.length > ANNO_HIST_MAX) list.length = ANNO_HIST_MAX;
  annoHistWrite();
  return rec;
}
function annoHistDel(id){
  var list = annoHistLoad();
  for(var i = 0; i < list.length; i++){
    if(list[i].id === id){ list.splice(i, 1); break; }
  }
  annoHistWrite();
}
function annoHistClear(){ _annoHist = []; annoHistWrite(); }
function annoHistFind(id){
  var list = annoHistLoad();
  for(var i = 0; i < list.length; i++){ if(list[i].id === id) return list[i]; }
  return null;
}
/* 缩略图：img 或 canvas 都能吃，最多 120px 的长边，JPEG 0.6 —— 一条大约 4~8 KB，一百条也就几百 KB */
function annoHistThumb(src, maxSide){
  try{
    var nw = src.naturalWidth || src.width || 0, nh = src.naturalHeight || src.height || 0;
    if(!nw || !nh) return '';
    var sc = Math.min(1, (maxSide || 120) / Math.max(nw, nh));
    var w = Math.max(1, Math.round(nw * sc)), h = Math.max(1, Math.round(nh * sc));
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(src, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', 0.6);
  }catch(e){ return ''; }
}
function annoHistKindText(k){ return k === 'ocr' ? '拍照识别' : '文本标注'; }
function annoHistDetailHTML(r){
  var h = '<div class="hist-detail">'
    + '<div class="hist-m">'
    +   '<span class="hist-badge' + (r.kind === 'ocr' ? ' ocr' : '') + '">' + annoHistKindText(r.kind) + '</span>'
    +   '<span>' + escapeHtml(annoHistAgo(r.t)) + '</span>'
    +   '<span>' + (r.words || 0) + ' 个单词 · ' + (r.paras || 0) + ' 个段落</span>'
    +   (r.fixedCount ? '<span>词库纠正 ' + r.fixedCount + ' 个</span>' : '')
    +   (r.cropped ? '<span>只识别了框选范围</span>' : '')
    + '</div>';
  if(r.thumb) h += '<img src="' + r.thumb + '" alt="这次识别用的图片">';
  if(r.kind === 'ocr' && r.raw && r.raw !== r.text){
    h += '<h3 class="anno-lab">原始识别</h3><pre>' + escapeHtml(r.raw) + '</pre>'
       + '<h3 class="anno-lab">词库纠错后</h3><pre>' + escapeHtml(r.text) + '</pre>';
  }else{
    h += '<pre>' + escapeHtml(r.text) + '</pre>';
  }
  return h + '</div>';
}

/* ---- 拖拽 / 粘贴进来的图片 ----------------------------------------------
   两个纯判断：这次拖动带的是不是文件、里面第一张能用的图片是哪张。
   有些系统（老 Windows、从压缩包里直接拖）给不出 MIME，所以按扩展名再兜一次。 */
function annoHasFiles(e){
  var dt = e && e.dataTransfer;
  if(!dt) return false;
  var ts = dt.types;
  if(ts){ for(var i = 0; i < ts.length; i++){ if(ts[i] === 'Files') return true; } }
  return false;
}
var ANNO_IMG_EXT = /\.(png|jpe?g|webp|gif|bmp|avif|tiff?)$/i;
function annoFirstImage(list){
  if(!list) return null;
  var i, f;
  for(i = 0; i < list.length; i++){
    f = list[i];
    if(f && f.type && /^image\//.test(f.type)) return f;
  }
  for(i = 0; i < list.length; i++){
    f = list[i];
    if(f && ANNO_IMG_EXT.test(f.name || '')) return f;
  }
  return null;
}
/* 整页的兜底：往非投放区松手时，浏览器默认会直接用那张图替换掉整个页面。
   标注页开着的时候，干脆整页都当投放区（页签不在这边就自动切过去），
   其它页面才真的把默认行为挡掉。 */
if(!window.__annoDropGuard){
  window.__annoDropGuard = true;
  /* #annoPaneOcr 只有 renderAnnotate 会建，它在就说明标注页正开着 */
  function annoLive(){ return !!document.getElementById('annoPaneOcr'); }
  window.addEventListener('dragover', function(e){ if(annoLive() && annoHasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', function(e){
    if(!annoLive()) return;
    e.preventDefault();
    var f = annoFirstImage(e.dataTransfer && e.dataTransfer.files);
    if(f && typeof window.__annoDrop === 'function'){
      if(typeof window.__annoShowOcr === 'function') window.__annoShowOcr();
      if(window.__annoDrop(f)) toast('已接收拖进来的图片');
    }
  });
  /* 粘贴图片：只挂这一次，转交给当前那次渲染留下的处理函数（见 renderAnnotate 里的 window.__annoPaste） */
  document.addEventListener('paste', function(e){
    var p = document.getElementById('annoPaneOcr');
    if(!p || p.classList.contains('hidden')) return;
    var items = e.clipboardData && e.clipboardData.items;
    if(!items || typeof window.__annoPaste !== 'function') return;
    for(var i = 0; i < items.length; i++){
      if(items[i].kind === 'file' && /^image\//.test(items[i].type || '')){
        var f = items[i].getAsFile();
        if(f && window.__annoPaste(f)){ e.preventDefault(); toast('已用剪贴板里的图片'); }
        return;
      }
    }
  });
}

/* ------------------------------------------------------------
   用户第 19 项：文本标注页的「语音输入（英文）」
   ------------------------------------------------------------
   跟读训练那套 bindShadowHold 是「按住才录、松手才判」的状态机（判跟读对错用的），
   这里**不照抄**它：这边是「点一下开始、再点一下停、认出一句就往文本框末尾接一句」。

   · continuous = true：标注的输入常常是一整段话（可能连着说好几声），一句一停会逼
     用户反复点那颗按钮；而中间结果只进提示、**只有 isFinal 的句子才写进文本框**，
     所以不会「同一句被追加两遍」。
   · 结果**追加**不覆盖：先看末尾是不是空白，不是就补一个空格，用户已经粘贴/输入的
     内容一个字都不动。
   · **不自动点「开始标注」**：用户可能要说好几段（或边说边改），自动提交会把没说完的
     半段拿去标注。所以只追加文本，并在提示里说「说完了就点『开始标注』」。
   · 五种失败各说各的：不支持 / 没权限 / 没听清 / 识别服务没连上 / 这一句什么都没认出来。
     network 那条必须说清是**服务**没连上，不是用户的麦克风坏了。
   ------------------------------------------------------------ */
var ANNO_VOICE_TEXT = {
  unsupported: '这个浏览器不做语音识别（Chrome 与 Edge 支持）',
  denied: '麦克风被挡住了，去浏览器地址栏那把麦克风权限放开',
  nospeech: '没听到声音，再点一次试',
  network: '识别服务没连上',
  empty: '这一句什么都没认出来',
  listen: '正在听…再点一下这颗按钮就停；说完了就点「开始标注」',
  got: '已经接到文本框末尾；说完了就点「开始标注」'
};
/* 错误码 → 文案键；认不出的一律回 other，由调用方把原始错误码拼进去，绝不吞掉 */
function annoVoiceErrKey(err){
  if(!err) return '';
  if(err === 'not-allowed' || err === 'service-not-allowed') return 'denied';
  if(err === 'no-speech') return 'nospeech';
  if(err === 'network') return 'network';
  if(err === 'aborted') return 'aborted';
  return 'other';
}
/* 返回一个小状态对象，方便自检与排错；所有元素都允许是桩（缺 classList 也不炸） */
function bindAnnoVoice(btn, tip, ta, after){
  if(!btn || !ta) return null;
  var st = { rec:null, heard:false, err:'', stopping:false };
  function hint(msg, tone){
    if(!tip) return;
    tip.textContent = msg || '';
    if(tip.classList){
      tip.classList.toggle('bad', tone === 'bad');
      tip.classList.toggle('on', tone === 'on');
    }
  }
  function say(msg){ hint(msg, 'bad'); toast(msg); }
  function paintStop(stopping){
    if(btn.classList) btn.classList.add('rec');
    if(btn.setAttribute) btn.setAttribute('aria-pressed', 'true');
    btn.innerHTML = IC('x') + (stopping ? ' 正在停…' : ' 停止');
  }
  function paintIdle(){
    if(btn.classList) btn.classList.remove('rec');
    if(btn.setAttribute) btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = IC('mic') + ' 语音输入';
  }
  /* 追加：末尾不是空白就补一个空格；用户原来的字一个都不动 */
  function append(text){
    var t = String(text || '').replace(/\s+/g, ' ').trim();
    if(!t) return false;
    var cur = String(ta.value || '');
    ta.value = cur ? (cur + (/[\s]$/.test(cur) ? '' : ' ') + t) : t;
    st.heard = true;
    if(after) after(ta.value);
    return true;
  }
  function finish(){
    st.rec = null;
    st.stopping = false;
    paintIdle();
    if(st.err) return;                        /* 失败已经说过了，别拿「认出了什么」盖掉 */
    if(!st.heard){ hint(ANNO_VOICE_TEXT.empty, 'bad'); return; }
    hint(ANNO_VOICE_TEXT.got, 'on');
  }
  function stop(){
    var r = st.rec;
    if(!r) return false;
    st.rec = null;
    st.stopping = true;
    paintStop(true);
    try{ if(r.stop) r.stop(); }catch(e){}
    return true;
  }
  btn.onclick = function(){
    if(st.rec) return stop();                 /* 再点一下 = 停 */
    if(!speechSupported()){
      hint(ANNO_VOICE_TEXT.unsupported, 'bad');
      toast(ANNO_VOICE_TEXT.unsupported);
      return false;
    }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var r;
    try{ r = new SR(); }
    catch(e){ say('语音识别起不来：' + ((e && e.message) || e)); return false; }
    st.heard = false; st.err = ''; st.stopping = false;
    r.lang = 'en-US';          /* 这一页只认英文 */
    r.continuous = true;       /* 可以连着说，中途不停 */
    r.interimResults = true;   /* 中间结果只进提示，不进文本框 */
    r.maxAlternatives = 3;
    r.onresult = function(ev){
      var i, res, finals = '', mid = '';
      var from = (ev && typeof ev.resultIndex === 'number') ? ev.resultIndex : 0;
      var list = (ev && ev.results) || [];
      for(i = from; i < list.length; i++){
        res = list[i];
        if(!res || !res[0]) continue;
        if(res.isFinal) finals += res[0].transcript + ' ';
        else mid += res[0].transcript + ' ';
      }
      if(finals){
        if(append(finals)) hint(ANNO_VOICE_TEXT.got, 'on');
      }else if(mid){
        hint('听到：' + mid.replace(/\s+/g, ' ').trim(), 'on');
      }
    };
    r.onerror = function(ev){
      var err = ev && ev.error;
      /* aborted 是「被叫停」（用户点停 / 被下一轮顶掉），不是失败：不给它安文案，
         交给 onend 去说「认出了什么 / 这一句什么都没认出来」。 */
      if(err === 'aborted'){ st.rec = null; paintIdle(); return; }
      st.err = err || 'error';
      /* 出错就当场收工：浏览器一般紧接着发 onend，但有的版本不发 —— 那样按钮会
         一直卡在「停止」，用户再也点不出第二次。这里先自己复位，onend 再来也不冲突。 */
      st.rec = null;
      paintIdle();
      var k = annoVoiceErrKey(err);
      say(k === 'other' ? ('识别失败：' + err) : ANNO_VOICE_TEXT[k]);
    };
    r.onend = function(){ finish(); };
    st.rec = r;
    try{ r.start(); }
    catch(e){
      st.rec = null;
      st.err = 'start';
      paintIdle();
      say('语音识别起不来：' + ((e && e.message) || e));
      return false;
    }
    paintStop(false);
    hint(ANNO_VOICE_TEXT.listen, 'on');
    return true;
  };
  return st;
}

  var _ocrPick = null, _ocrPlain = '', _ocrRaw = '', _ocrBusy = false;
  var _ocrUrl = '', _nat = { w:0, h:0 }, _crop = { x:0, y:0, w:1, h:1 }, _ocrCropped = false;

  function cropIsFull(){
    return _crop.x <= 0.0005 && _crop.y <= 0.0005 && _crop.w >= 0.999 && _crop.h >= 0.999;
  }
  function cropPaint(){
    if(!cropSel) return;

    cropSel.style.top = (_crop.y * 100) + '%';

  }
  function cropReset(){ _crop = { x:0, y:0, w:1, h:1 }; cropPaint(); }
  (function bindCrop(){
    var mode = null, sx = 0, sy = 0, base = null;
    function frac(e){
      var r = cropWrap.getBoundingClientRect();
      return {
        x: r.width ? (e.clientX - r.left) / r.width : 0,
        y: r.height ? (e.clientY - r.top) / r.height : 0
      };
    }
    function down(e, m){
      if(!_nat.w) return;
      mode = m;
      var p = frac(e);
      sx = p.x; sy = p.y;
      base = { x:_crop.x, y:_crop.y, w:_crop.w, h:_crop.h };
      try{ cropWrap.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();

    });

      if(!mode) return;
      var MIN = 0.05;
      var p = frac(e), dx = p.x - sx, dy = p.y - sy;
      var c = { x:base.x, y:base.y, w:base.w, h:base.h };
      if(mode === 'move'){
        c.x = Math.min(Math.max(0, base.x + dx), 1 - base.w);
        c.y = Math.min(Math.max(0, base.y + dy), 1 - base.h);
      }else{
        var x2 = base.x + base.w, y2 = base.y + base.h;
        if(mode.indexOf('w') >= 0){ c.x = Math.min(Math.max(0, base.x + dx), x2 - MIN); c.w = x2 - c.x; }
        if(mode.indexOf('e') >= 0){ c.w = Math.min(Math.max(MIN, base.w + dx), 1 - base.x); }
        if(mode.indexOf('n') >= 0){ c.y = Math.min(Math.max(0, base.y + dy), y2 - MIN); c.h = y2 - c.y; }
        if(mode.indexOf('s') >= 0){ c.h = Math.min(Math.max(MIN, base.h + dy), 1 - base.y); }
      }
      _crop = c;
      cropPaint();
      e.preventDefault();
    });
    function up(e){
      if(!mode) return;
      mode = null;
      try{ cropWrap.releasePointerCapture(e.pointerId); }catch(err){}

  /* 把框选的那一块画到 canvas 上再交给识别引擎；整张时不折腾，直接用原图 */
  function ocrCropTarget(cb){
    if(cropIsFull() || !_nat.w || !_nat.h){ cb(null); return; }
    var sx = Math.round(_crop.x * _nat.w), sy = Math.round(_crop.y * _nat.h);
    var sw = Math.max(8, Math.round(_crop.w * _nat.w)), sh = Math.max(8, Math.round(_crop.h * _nat.h));

    /* 用同步的 toDataURL 换出 Blob：toBlob 是异步的，个别环境下会迟迟不回调，

    try{
      var url = cv.toDataURL('image/png');
      var bin = atob(url.slice(url.indexOf(',') + 1));
      var buf = new Uint8Array(bin.length);
      for(var k = 0; k < bin.length; k++) buf[k] = bin.charCodeAt(k);
      cb(new Blob([buf], { type:'image/png' }));
    }catch(e2){
      /* 画布读不出来（极少数受限环境）就退回原图，别让流程卡死在这里 */
      cb(null);
    }
  }

    $('#ocrFull').classList.remove('hidden');

    /* 粘贴：截图之后直接 Ctrl + V 就能用。

    window.__annoPaste = useImageFile;

  $('#ocrUse').onclick = function(){ ocrFeed(_ocrPlain, '已把纠错后的文本填进标注框'); };

  $('#ocrGo').onclick = function(){
    if(_ocrBusy) return;

        _ocrBusy = false;
        btn.disabled = false;
        ocrSt.classList.add('hidden');
        if(err){
          ocrBar.style.width = '0';
          uiAlert('识别没成功：' + ((err && err.message) || err) + '。第一次识别要先联网下载识别模型；网络没问题的话，也可能是图片太模糊或太大。', '识别失败');
          return;
        }
        var text = ocrJoinHyphens(raw || '').replace(/\n{3,}/g, '\n\n').trim();
        if(!text){
          uiAlert('这张图里没读出文字。尽量正对着拍、光线亮一点、别拍歪，再试一次。', '没读出文字');
          return;
        }
        var fx = ocrFixAll(text);
        _ocrRaw = text;
        _ocrPlain = fx.plain;
        ocrRawEl.textContent = text;
        ocrFixedEl.innerHTML = fx.html;
        $('#ocrMeta').textContent = '共 ' + fx.total + ' 个单词 · 词库纠正 ' + fx.fixed + ' 个'
          + (_ocrCropped ? ' · 只识别了框选范围' : '');
        ocrWarn.classList.add('hidden');
        ocrOut.classList.remove('hidden');
        annoHistAdd('ocr', fx.plain, {
          raw: text,
          fixedCount: fx.fixed,
          cropped: _ocrCropped,
          thumb: annoHistThumb(ocrImg, 120)
        });
        renderHist();
        toast('识别完成，词库纠正了 ' + fx.fixed + ' 个单词');
        if(ocrOut.scrollIntoView) ocrOut.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
  };
  return;
}

function annoSaveWord(r){
  var k = String(r.w).toLowerCase();
  var meaning = (r.pos ? r.pos + ' ' : '') + r.meanings.join('；');
  var ipa = r.ipa || '';
  if(ipa && ipa.charAt(0) !== '/') ipa = '/' + ipa + '/';
  var L = libById('mywords');
  if(!L){
    L = { id:'mywords', name:'我的词库', items:[] };
    S.libs.push(L);
  }
  L.items = L.items.filter(function(e){ return String(e[0]).toLowerCase() !== k; });
  L.items.push([r.w, ipa, meaning, []]);
  if(S.activeLibs.indexOf('mywords') < 0) S.activeLibs.push('mywords');
  var ex = S.extras;
  if(r.past || r.pp){
    ex.irregular = (ex.irregular || []).filter(function(v){ return String(v.b).toLowerCase() !== k; });
    ex.irregular.push({ b:r.w, p:r.past || r.w, pp:r.pp || r.w, cn:meaning });
  }
  if(r.comp || r.sup){
    ex.compare = (ex.compare || []).filter(function(v){ return String(v.b).toLowerCase() !== k; });
    ex.compare.push({ b:r.w, c:r.comp || '', s:r.sup || '', cn:meaning });
  }
  ex.syn = ex.syn || {}; ex.ant = ex.ant || {};
  if(r.syn.length) ex.syn[k] = r.syn.map(function(s){ return { w:s, d:'' }; });
  if(r.ant.length) ex.ant[k] = r.ant.map(function(s){ return { w:s, d:'' }; });
  applyExtras();
  applyUserLibs();
  save();
  _annoVerbBase = null; _annoCompBase = null;
  _inflCache = {};   /* 用户自加的不规则动词会改词形表，缓存必须一起作废 */
  var ta = $('#annoText');
  if(ta && $('#annoResultCard') && !$('#annoResultCard').classList.contains('hidden')){
    var text = ta.value;
    if(text && text.trim()) $('#annoResult').innerHTML = annoRenderResult(text);
  }
}
