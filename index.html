/* ============================================================
   作文素材库：好词好句 / 高级词汇 / 模板句式 / 作文模板
   ============================================================ */
function phraseBigList(){
  var out = [], seen = {};
  PHRASES.forEach(function(p){ if(p.big && !seen[p.big]){ seen[p.big] = 1; out.push(p.big); } });
  return out;
}
function phraseSubList(big){
  var out = [], seen = {};
  PHRASES.forEach(function(p){ if(big !== 'all' && p.big !== big) return; if(p.sub && !seen[p.sub]){ seen[p.sub] = 1; out.push(p.sub); } });
  return out;
}
function writingPatternBigList(){
  var out = [], seen = {};
  (WRITING.patterns || []).forEach(function(p){ if(p.big && !seen[p.big]){ seen[p.big] = 1; out.push(p.big); } });
  return out;
}
function renderWriting(app){
  var WTABS = [
    { k:'phrase',    name:'好词好句', ic:'quote' },
    { k:'pattern',   name:'模板句式', ic:'pencil' },
    { k:'elevate',   name:'高级词汇', ic:'sparkle' },
    { k:'template',  name:'作文模板', ic:'file' }
  ];
  if(!WTABS.some(function(t){ return t.k === wTab; })) wTab = 'phrase';
  var q = wQuery.trim().toLowerCase();
  var html = '<section class="card">'
    + '<h2 class="h2">作文素材库 <span class="hint">' + PHRASES.length + ' 好句 · ' + (WRITING.patterns || []).length + ' 句式 · ' + (WRITING.elevate || []).length + ' 高级词 · ' + (WRITING.templates || []).length + ' 模板</span></h2>'
    + '<div class="chips" id="wTabs" style="margin-bottom:10px">'
    +   WTABS.map(function(t){
          var n = t.k === 'phrase' ? PHRASES.length
                : t.k === 'pattern' ? (WRITING.patterns || []).length
                : t.k === 'elevate' ? (WRITING.elevate || []).length
                : (WRITING.templates || []).length;
          return '<button class="chip ' + (wTab === t.k ? 'on' : '') + '" data-t="' + t.k + '">' + IC(t.ic) + ' ' + t.name + '<span class="n">' + n + '</span></button>';
        }).join('')
    + '</div>'
    + '<div class="search-wrap"><span class="si">' + IC('search') + '</span>'
    + '<input class="search-input" id="wSearch" placeholder="搜索英文、中文或分类…" value="' + escapeHtml(wQuery) + '" autocomplete="off" spellcheck="false">'
    + searchModeToggleHTML('wSearch') + '</div>';

  /* 好词好句：按大类 + 小类筛选 */
  if(wTab === 'phrase'){
    var bigs = phraseBigList();
    html += '<div class="chips" id="wBig" style="margin-bottom:8px">'
      + '<button class="chip ' + (wBig === 'all' ? 'on' : '') + '" data-b="all">全部<span class="n">' + PHRASES.length + '</span></button>'
      + bigs.map(function(b){
          var n = PHRASES.filter(function(p){ return p.big === b; }).length;
          return '<button class="chip ' + (wBig === b ? 'on' : '') + '" data-b="' + escapeHtml(b) + '">' + escapeHtml(b) + '<span class="n">' + n + '</span></button>';
        }).join('')
      + '</div>';
    var subs = phraseSubList(wBig);
    if(subs.length > 1){
      html += '<div class="chips" id="wSub" style="margin-bottom:4px">'
        + '<button class="chip ' + (wSub === 'all' ? 'on' : '') + '" data-s="all">全部小类</button>'
        + subs.map(function(s){
            return '<button class="chip ' + (wSub === s ? 'on' : '') + '" data-s="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>';
          }).join('')
        + '</div>';
    }
  }else if(wTab === 'pattern'){
    var pbigs = writingPatternBigList();
    html += '<div class="chips" id="wBig" style="margin-bottom:4px">'
      + '<button class="chip ' + (wBig === 'all' ? 'on' : '') + '" data-b="all">全部<span class="n">' + (WRITING.patterns || []).length + '</span></button>'
      + pbigs.map(function(b){
          var n = (WRITING.patterns || []).filter(function(p){ return p.big === b; }).length;
          return '<button class="chip ' + (wBig === b ? 'on' : '') + '" data-b="' + escapeHtml(b) + '">' + escapeHtml(b) + '<span class="n">' + n + '</span></button>';
        }).join('')
      + '</div>';
  }
  html += '<p class="muted" style="margin-bottom:0">点句中的喇叭可朗读，右侧星标收藏，剪贴板图标加入错题本。</p></section>';

  /* ---- 内容区 ---- */
  if(wTab === 'template'){
    var tpls = WRITING.templates || [];
    if(!tpls.length){
      html += '<section class="card"><p class="muted" style="margin:0">暂无作文模板。</p></section>';
    }else{
      if(wTpl >= tpls.length) wTpl = 0;
      html += '<div class="chips" id="wTpl" style="margin-bottom:10px">'
        + tpls.map(function(t, i){
            return '<button class="chip ' + (wTpl === i ? 'on' : '') + '" data-i="' + i + '">' + escapeHtml(t.type || ('模板 ' + (i + 1))) + '</button>';
          }).join('')
        + '</div>';
      var tp = tpls[wTpl];
      html += '<section class="card">'
        + '<h2 class="h2">' + escapeHtml(tp.type || '作文模板') + (tp.cn ? ' <span class="hint">' + escapeHtml(tp.cn) + '</span>' : '') + '</h2>'
        + (tp.tip ? '<p class="muted" style="margin-bottom:10px">' + escapeHtml(tp.tip) + '</p>' : '')
        + (tp.parts || []).map(function(pt){
            return '<div class="tpl-part">'
              + '<div class="tpl-name">' + escapeHtml(pt.name || '') + '</div>'
              + '<div class="tpl-en">' + escapeHtml(pt.en || '') + '</div>'
              + (pt.cn ? '<div class="tpl-cn">' + escapeHtml(pt.cn) + '</div>' : '')
              + '</div>';
          }).join('')
        + '<div class="row" style="justify-content:center;margin-top:14px">'
        +   '<button class="btn sm" data-speak="' + escapeHtml((tp.parts || []).map(function(x){ return x.en || ''; }).join(' ')) + '">' + IC('volume') + ' 朗读全文</button>'
        +   '<button class="btn sm" data-fav-tpl="' + wTpl + '">' + IC('star') + ' 收藏模板</button>'
        + '</div>'
        + '</section>';
    }
  }else{
    var pool = wTab === 'phrase' ? PHRASES
             : wTab === 'pattern' ? (WRITING.patterns || [])
             : (WRITING.elevate || []);
    if(wTab === 'phrase'){
      if(wBig !== 'all') pool = pool.filter(function(p){ return p.big === wBig; });
      if(wSub !== 'all') pool = pool.filter(function(p){ return p.sub === wSub; });
    }else if(wTab === 'pattern'){
      if(wBig !== 'all') pool = pool.filter(function(p){ return p.big === wBig; });
    }
    if(q){
      pool = pool.filter(function(p){
        return matchQuery(p.en || '', q)
            || matchQuery(p.cn || '', q)
            || matchQuery(p.big || '', q)
            || matchQuery(p.sub || '', q)
            || matchQuery(p.tip || '', q);
      });
    }
    var pages = Math.max(1, Math.ceil(pool.length / W_PER_PAGE));
    if(wPage >= pages) wPage = pages - 1;
    if(wPage < 0) wPage = 0;
    var slice = pool.slice(wPage * W_PER_PAGE, (wPage + 1) * W_PER_PAGE);
    html += '<section class="card">';
    if(!slice.length){
      html += '<p class="muted" style="margin:0">没有匹配的素材，换个分类或关键词试试。</p>';
    }else{
      html += slice.map(function(p, si){
        var idx = wPage * W_PER_PAGE + si;
        var key = p.en || '';
        var faved = isFavAny(key);
        return '<div class="wp-item">'
          + '<div class="wp-head">'
          +   (p.big ? '<span class="wp-tag">' + escapeHtml(p.big) + '</span>' : '')
          +   (p.sub ? '<span class="wp-tag sub">' + escapeHtml(p.sub) + '</span>' : '')
          +   '<span class="wp-acts">'
          +     '<button class="dict-act" data-speak="' + escapeHtml(key) + '" title="朗读">' + IC('volume') + '</button>'
          +     '<button class="dict-act' + (faved ? ' on' : '') + '" data-fav-ph="' + idx + '" title="收藏">' + IC('star') + '</button>'
          +     '<button class="dict-act" data-wr-ph="' + idx + '" title="加入错题本">' + IC('clipboard') + '</button>'
          +   '</span>'
          + '</div>'
          + '<div class="wp-en">' + escapeHtml(key) + '</div>'
          + (p.cn ? '<div class="wp-cn">' + escapeHtml(p.cn) + '</div>' : '')
          + (p.tip ? '<div class="wp-tip">' + IC('bulb') + ' ' + escapeHtml(p.tip) + '</div>' : '')
          + '</div>';
      }).join('');
      if(pages > 1){
        html += '<div class="pager">'
          + '<button class="btn sm" id="wPrev"' + (wPage === 0 ? ' disabled style="opacity:.4"' : '') + '>' + IC('left') + ' 上一页</button>'
          + '<span>' + (wPage + 1) + ' / ' + pages + ' · 共 ' + pool.length + ' 条</span>'
          + '<button class="btn sm" id="wNext"' + (wPage >= pages - 1 ? ' disabled style="opacity:.4"' : '') + '>下一页 ' + IC('right') + '</button>'
          + '</div>';
      }
    }
    html += '</section>';
  }
  app.innerHTML = html;

  var inp = $('#wSearch');
  if(inp){
    inp.focus();
    try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){}
    bindSearchInput(inp, function(v){ wQuery = v; wPage = 0; render(); }, 220);
    $('#wSearchMode').onclick = function(){ toggleSearchMode('wSearch', function(v){ wQuery = v; wPage = 0; }); };
  }
  $$('#wTabs .chip').forEach(function(b){ b.onclick = function(){ wTab = b.dataset.t; wBig = 'all'; wSub = 'all'; wPage = 0; render(); }; });
  $$('#wBig .chip').forEach(function(b){ b.onclick = function(){ wBig = b.dataset.b; wSub = 'all'; wPage = 0; render(); }; });
  $$('#wSub .chip').forEach(function(b){ b.onclick = function(){ wSub = b.dataset.s; wPage = 0; render(); }; });
  $$('#wTpl .chip').forEach(function(b){ b.onclick = function(){ wTpl = +b.dataset.i; render(); }; });
  var wp = $('#wPrev'); if(wp && !wp.disabled) wp.onclick = function(){ wPage--; render(); };
  var wn = $('#wNext'); if(wn && !wn.disabled) wn.onclick = function(){ wPage++; render(); };
  $$('[data-speak]').forEach(function(b){ b.onclick = function(ev){ ev.stopPropagation(); speak(b.dataset.speak, 'en'); }; });
  $$('[data-fav-ph]').forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var p = pool[+b.dataset.favPh];
      if(!p) return;
      if(wTab === 'phrase') toggleFavPhrase(p);
      else toggleFavEx('', p.en || '', p.cn || '', wTab === 'pattern' ? '模板句式' : '高级词汇');
      render();
    };
  });
  $$('[data-wr-ph]').forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var p = pool[+b.dataset.wrPh];
      if(!p) return;
      var t = String(p.en || '').replace(/[^A-Za-z' -]/g, ' ').split(/\s+/).filter(Boolean)[0] || '';
      addWrongWord(t, p.en || '');
      render();
    };
  });
  $$('[data-fav-tpl]').forEach(function(b){
    b.onclick = function(){
      var t = (WRITING.templates || [])[+b.dataset.favTpl];
      if(!t) return;
      var en = (t.parts || []).map(function(x){ return x.en || ''; }).join('\n');
      toggleFavEx('', en, t.type || '作文模板', '作文模板');
      render();
    };
  });
}

/* ============================================================
   导出打印
   ============================================================ */
var printOpts = { mode:'excel', direction:'cn2en', count:20, scope:['current'], levels:['current'] };
var printPreview = null, printKey = '';
var printCustom = null; /* 从选择器手工选定的打印词列表（词对象数组），非空时覆盖范围/层级 */
function printSig(){
  /* #6：多选词库也要进签名 —— 只把 S.level（多选里的第一个）放进来，
     从「四级」加成「四级 + 六级」时签名不变，预览就会停在旧词池上 */
  return [printOpts.mode, printOpts.direction, printOpts.count,
          printOpts.scope.join(','), printOpts.levels.join(','),
          S.level, curLevels().join('+'), S.batch.length, S.wrong.length, S.favs.length,
          printCustom ? 'C' + printCustom.length : ''].join('|');
}
function scopePool(k){
  if(k === 'current') return S.batch.map(findWord).filter(Boolean);
  if(k === 'wrong')   return uniqueWrongWords();
  if(k === 'favs')    return S.favs.filter(function(f){ return f.type === 'word'; }).map(function(f){ return findWord(f.key); }).filter(Boolean);
  if(k === 'ok')      return ALL_WORDS.filter(function(w){ return wordStat(w.w) === 'ok'; });
  if(k === 'new')     return ALL_WORDS.filter(function(w){ return wordStat(w.w) === 'new'; });
  return ALL_WORDS.slice();
}
/* 多选范围：并集去重 */
function scopePoolMulti(keys){
  var out = [], seen = {};
  (keys && keys.length ? keys : ['all']).forEach(function(k){
    scopePool(k).forEach(function(w){
      var kk = w.w.toLowerCase();
      if(seen[kk]) return;
      seen[kk] = 1;
      out.push(w);
    });
  });
  return out;
}
/* 多选层级：并集去重 */
function levelSet(keys){
  var set = {};
  (keys || []).forEach(function(k){
    if(k === 'current'){ curWords().forEach(function(w){ set[w.w.toLowerCase()] = 1; }); }
    else if(DATA[k]){ DATA[k].words.forEach(function(w){ set[w.w.toLowerCase()] = 1; }); }
  });
  return set;
}
function renderPrint(app){
  var scopeCounts = {};
  ['current','wrong','favs','ok','new','all'].forEach(function(k){ scopeCounts[k] = scopePool(k).length; });
  /* 层级：移除「混合层级」与「我的词库」，多选 */
  var levelOptions = [{ k:'current', n:'当前词库（' + levelShortName() + '）' }, { k:'all', n:'全部层级' }];
  LEVELS.forEach(function(k){ if(k !== 'user' && DATA[k]) levelOptions.push({ k:k, n:DATA[k].name }); });

  var sig = printSig();

  var picked = printPreview;

    : '<p class="muted" style="margin:0">当前条件下没有可打印的单词，请切换范围或层级。</p>';

    + (printOpts.mode === 'excel'
        ? '<div class="divider"></div><div class="lab">填写方向</div><div class="chips" id="dirChips" style="margin-top:8px">'
          + '<button class="chip ' + (printOpts.direction === 'cn2en' ? 'on' : '') + '" data-dir="cn2en">中文 → 填写英文</button>'
          + '<button class="chip ' + (printOpts.direction === 'en2cn' ? 'on' : '') + '" data-dir="en2cn">英文 → 填写中文</button>'
          + '</div>'
        : '')

    + '</div>'

  $$('#modeChips .chip').forEach(function(b){ b.onclick = function(){ printOpts.mode = b.dataset.mode; render(); }; });

  $$('#scopeChips .chip').forEach(function(b){

      }else{

        printOpts.scope = cur;
      }

    };
  });
  $$('#levelChips .chip').forEach(function(b){
    b.onclick = function(){
      var k = b.dataset.lv, cur = printOpts.levels.slice();
      if(k === 'all'){

      }else{
        var i = cur.indexOf(k);
        if(i >= 0) cur.splice(i, 1); else cur.push(k);
        var j = cur.indexOf('all'); if(j >= 0) cur.splice(j, 1);

  $('#pickPrint').onclick = function(){

  $('#genBtn').onclick = generatePrintable;
}
function pickPrintWords(){
  if(printCustom) return printCustom.slice();

  if(lvs.indexOf('all') < 0 && lvs.length){
    var set = levelSet(lvs);
    pool = pool.filter(function(w){ return set[w.w.toLowerCase()]; });
  }
  return shuffle(pool).slice(0, printOpts.count);
}

var MEDIA_FILTER = { q:'', genre:'all', sub:'all', level:'all', decade:'all', sort:'year', mkind:'all', fav:false };
var MEDIA_LV_NAME = { 1:'入门', 2:'轻松', 3:'进阶', 4:'挑战', 5:'硬核' };
var curMedia = null;

function mediaKindOf(k){ return k === 'book' ? 'book' : 'film'; }
function mediaKindName(k){ return k === 'book' ? '文学作品' : '影视作品'; }
function mediaKindUnit(k){ return k === 'book' ? '本' : '部'; }
function openMedia(kind, t){
  curMedia = { kind:mediaKindOf(kind), t:t };
  view = 'mediaDetail';
  render();
  window.scrollTo(0, 0);
}
function mediaFind(kind, t){
  var arr = mediaList(mediaKindOf(kind));
  for(var i = 0; i < arr.length; i++) if(arr[i].t === t) return arr[i];
  return null;
}
function mdEscape(s){ return escapeHtml(String(s == null ? '' : s)); }
function mdPoster(m){
  var ch = String(m.t || '?').replace(/^(the|a|an)\s+/i, '').charAt(0) || '?';
  return '<div class="md-poster">' + mdEscape(ch) + '</div>';
}
function mdLevel(m){
  var lv = mediaLevel(m), h = '';
  for(var i = 1; i <= 5; i++) h += '<i class="' + (i <= lv ? 'on' : '') + '"></i>';
  return '<span class="md-lv" title="学习难度 ' + lv + '/5 · ' + (MEDIA_LV_NAME[lv] || '') + '">' + h + '</span>';
}
function mdChips(m, kind){
  var out = [];
  if(kind === 'film') out.push(m.kind === 'series' ? '剧集' : '电影');
  out.push(m.genre);
  (m.sub || []).slice(0, 2).forEach(function(s){ out.push(s); });
  return out.filter(Boolean).map(function(s, i){
    return '<span class="md-chip' + (i === 0 && kind === 'book' ? ' g' : '') + '">' + mdEscape(s) + '</span>';
  }).join('');
}
function mdCard(m, kind){
  var fav = isMediaFav(kind, m.t);
  var noteN = getNotes(kind, m.t).length;
  return '<article class="md-card" data-md="' + mdEscape(m.t) + '">'
    +   '<div class="md-top">'
    +     mdPoster(m)
    +     '<div class="md-h">'
    +       '<div class="md-t">' + mdEscape(m.t) + '</div>'
    +       '<div class="md-cn">' + mdEscape(m.cn || '') + (m.a ? ' · ' + mdEscape(m.a) : '') + '</div>'
    +       '<div class="md-meta" style="margin-top:6px">'
    +         mdChips(m, kind)
    +         '<span class="md-chip">' + (m.y || '—') + '</span>'
    +         mdLevel(m)
    +       '</div>'
    +       '<div class="md-meta" style="margin-top:5px">'
    +         '<span>' + mdEscape(mediaLenLabel(m)) + '</span>'
    +         (noteN ? '<span class="md-chip g">观后感 ' + noteN + '</span>' : '')
    +       '</div>'
    +     '</div>'
    +     '<div class="md-acts">'
    +       '<button class="dict-act' + (fav ? ' on' : '') + '" data-mfav="' + mdEscape(m.t) + '" title="收藏">' + IC('star') + '</button>'
    +     '</div>'
    +   '</div>'
    +   (m.note ? '<div class="md-note">' + mdEscape(m.note) + '</div>' : '')
    +   '<div class="md-links">'
    +     '<a class="md-link" data-mopen="' + mdEscape(m.t) + '">' + IC('info') + ' 查看详情</a>'
    +     '<a class="md-link" data-mnote="' + mdEscape(m.t) + '">' + IC('pen') + ' 写观后感</a>'
    +   '</div>'
    + '</article>';
}
function mediaFiltered(kind){
  var F = MEDIA_FILTER;
  return sortMedia(filterMedia(kind, {
    q:F.q, kind:F.mkind, genre:F.genre, sub:F.sub, level:F.level, decade:F.decade, fav:F.fav
  }), F.sort);
}
function renderMedia(app, kind){
  kind = mediaKindOf(kind);
  var F = MEDIA_FILTER;
  var all = mediaList(kind);
  var list = mediaFiltered(kind);
  var genres = mediaGenres(kind);
  var subs = F.genre === 'all' ? mediaSubs(kind, 'all') : mediaSubs(kind, F.genre);
  var decades = mediaDecades(kind);
  var unit = mediaKindUnit(kind);

  var html =
      '<section class="card">'
    +   '<div class="md-toolbar">'
    +     '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'
    +       '<h2 class="h2" style="margin:0">' + mediaKindName(kind) + '库 <span class="hint">共 ' + all.length + ' ' + unit + '</span></h2>'
    +       '<div class="chips">'
    +         '<button class="chip' + (F.fav ? ' on' : '') + '" data-mfavonly="1">' + IC('star') + ' 收藏 ' + mediaFavCount(kind) + '</button>'
    +       '</div>'
    +     '</div>'
    +     '<div class="search-wrap"><span class="si">' + IC('search') + '</span>'

    +       searchModeToggleHTML('mdQ') + '</div>';

  if(kind === 'film'){
    html += '<div class="chips">'
      + [['all','全部'], ['movie','电影'], ['series','剧集']].map(function(p){
          return '<button class="chip' + (F.mkind === p[0] ? ' on' : '') + '" data-mkind="' + p[0] + '">' + p[1] + '</button>';
        }).join('')
      + '</div>';
  }
  html += '<div class="chips">'
    +   '<button class="chip' + (F.genre === 'all' ? ' on' : '') + '" data-mgenre="all">全部类型</button>'
    +   genres.map(function(g){
          return '<button class="chip' + (F.genre === g ? ' on' : '') + '" data-mgenre="' + mdEscape(g) + '">' + mdEscape(g) + '</button>';
        }).join('')
    + '</div>';

  html += '<div class="chips">'
    +   '<button class="chip' + (F.level === 'all' ? ' on' : '') + '" data-mlevel="all">全部难度</button>'
    +   [1,2,3,4,5].map(function(l){
          return '<button class="chip' + (String(F.level) === String(l) ? ' on' : '') + '" data-mlevel="' + l + '">' + MEDIA_LV_NAME[l] + '</button>';
        }).join('')
    + '</div>';
  if(decades.length > 1){
    html += '<div class="chips">'
      +   '<button class="chip' + (F.decade === 'all' ? ' on' : '') + '" data-mdec="all">全部年代</button>'
      +   decades.slice(0, 14).map(function(d){
            return '<button class="chip' + (String(F.decade) === String(d) ? ' on' : '') + '" data-mdec="' + d + '">' + d + 's</button>';
          }).join('')
      + '</div>';
  }
  html += '<div class="chips">'
    +   '<span class="muted" style="align-self:center;margin-right:2px">排序</span>'
    +   MEDIA_SORTS.map(function(s){
          return '<button class="chip' + (F.sort === s.k ? ' on' : '') + '" data-msort="' + s.k + '">' + IC(s.ic) + ' ' + s.label + '</button>';
        }).join('')
    + '</div>'
    +   '</div>'

      + '<div class="done-icon">' + IC(kind === 'book' ? 'library' : 'film') + '</div>'

      + '<p class="muted">试着放宽筛选条件，或者清空搜索词。</p>'
      + '<button class="btn sm" id="mdClear">清空筛选</button>'
      + '</div>';
  }else{
    html += '<section class="card">'
      + '<div class="md-meta" style="margin-bottom:10px">'
      +   '<span>筛选结果：共 <b style="color:var(--accent)">' + list.length + '</b> ' + unit + '</span>'
      +   (F.q ? '<span class="md-chip">搜索「' + mdEscape(F.q) + '」</span>' : '')
      +   (F.genre !== 'all' ? '<span class="md-chip">' + mdEscape(F.genre) + '</span>' : '')
      +   (F.sub !== 'all' ? '<span class="md-chip">' + mdEscape(F.sub) + '</span>' : '')
      +   (F.level !== 'all' ? '<span class="md-chip">难度 ' + MEDIA_LV_NAME[F.level] + '</span>' : '')
      +   (F.decade !== 'all' ? '<span class="md-chip">' + F.decade + 's</span>' : '')
      +   (F.fav ? '<span class="md-chip g">仅收藏</span>' : '')
      +   '<button class="btn ghost sm" id="mdClear2" style="margin-left:auto">重置</button>'
      + '</div>'
      + '<div class="md-grid">' + list.map(function(m){ return mdCard(m, kind); }).join('') + '</div>'
      + '</section>';
  }
  app.innerHTML = html;

  function rerender(){ render(); }

  bindSearchInput(qi, function(v){
    MEDIA_FILTER.q = v;
    var pos = qi.selectionStart;
    render();
    var nq = $('#mdQ');
    if(nq){ nq.focus(); try{ nq.setSelectionRange(pos, pos); }catch(e){} }
  }, 320);
  $('#mdQMode').onclick = function(){
    toggleSearchMode('mdQ', function(v){
      MEDIA_FILTER.q = v;
      render();
      var nq = $('#mdQ');
      if(nq){ nq.focus(); try{ nq.setSelectionRange(nq.value.length, nq.value.length); }catch(e){} }
    });
  };
  $$('[data-mgenre]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.genre = b.dataset.mgenre; MEDIA_FILTER.sub = 'all'; rerender(); }; });
  $$('[data-msub]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.sub = b.dataset.msub; rerender(); }; });
  $$('[data-mlevel]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.level = b.dataset.mlevel; rerender(); }; });
  $$('[data-mdec]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.decade = b.dataset.mdec; rerender(); }; });
  $$('[data-msort]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.sort = b.dataset.msort; rerender(); }; });
  $$('[data-mkind]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.mkind = b.dataset.mkind; rerender(); }; });

  if(clr) clr.onclick = doClear;
  if(clr2) clr2.onclick = doClear;
  $$('[data-mfav]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      toggleMediaFav(kind, b.dataset.mfav);
      rerender();
    };

  $$('[data-mopen]').forEach(function(b){ b.onclick = function(){ openMedia(kind, b.dataset.mopen); }; });
  $$('[data-mnote]').forEach(function(b){ b.onclick = function(){ openMedia(kind, b.dataset.mnote); }; });
  $$('.md-card').forEach(function(c){
    c.onclick = function(e){
      if(e.target.closest('button') || e.target.closest('a')) return;
      openMedia(kind, c.dataset.md);
    };
  });
}

    { n:'哔哩哔哩',  u:function(q){ return 'https://search.bilibili.com/all?keyword=' + q; } },
    { n:'腾讯视频',  u:function(q){ return 'https://v.qq.com/x/search/?q=' + q; } },
    { n:'爱奇艺',    u:function(q){ return 'https://so.iqiyi.com/so/q_' + q; } },
    { n:'优酷',      u:function(q){ return 'https://so.youku.com/search_video/q_' + q; } },
    { n:'芒果 TV',   u:function(q){ return 'https://so.mgtv.com/so?k=' + q; } },

function mediaWatchHTML(m, kind){
  var list = MEDIA_WATCH[kind === 'book' ? 'book' : 'film'] || [];
  if(!list.length) return '';
  var qc = encodeURIComponent(m.cn || m.t || '');
  var qe = encodeURIComponent(m.t || m.cn || '');
  function link(p, q, cls, label){
    return '<a class="' + cls + '" target="_blank" rel="noopener noreferrer" href="' + p.u(q) + '">' + escapeHtml(label) + '</a>';
  }
  return '<section class="card">'
    + '<h3 class="h3">' + (kind === 'book' ? '在线阅读 · 找书' : '在线观看') + ' <span class="hint">点开就是该作品在这些平台的搜索结果</span></h3>'
    + '<div class="chips md-watch">'
    +   list.map(function(p){ return link(p, qc, 'chip', p.n); }).join('')
    + '</div>'
    + '<p class="md-watch-alt">原名搜索：'
    +   list.slice(0, 3).map(function(p){ return link(p, qe, 'md-watch-t', p.n); }).join(' · ')
    + '</p>'
    + '<p class="muted" style="margin:6px 0 0;font-size:12.5px">跳转需要联网；本站不存放任何影视 / 图书内容，只做平台直达。</p>'
    + '</section>';
}

/* ============================================================
   11. 每日打卡
   ============================================================ */
var ciYM = null;                      /* {y, m} 当前查看的月份 */
var ciStyle = 'light';
var CI_STYLES = [
  { k:'light', name:'简约白', bg:'#ffffff', fg:'#1f2937', sub:'#6b7280', ac:'#0ea5e9', card:'#f1f5f9', line:'#e5e7eb' },
  { k:'blue',  name:'渐变蓝', bg:'#0ea5e9', fg:'#ffffff', sub:'#e0f2fe', ac:'#ffffff', card:'#38bdf8', line:'#7dd3fc', grad:['#0ea5e9','#6366f1'] },
  { k:'dark',  name:'暗夜黑', bg:'#111827', fg:'#f9fafb', sub:'#9ca3af', ac:'#38bdf8', card:'#1f2937', line:'#374151' },
  { k:'green', name:'清新绿', bg:'#f0fdf4', fg:'#14532d', sub:'#4d7c0f', ac:'#16a34a', card:'#dcfce7', line:'#bbf7d0' },
  { k:'pink',  name:'暖粉',   bg:'#fff1f2', fg:'#881337', sub:'#be185d', ac:'#f43f5e', card:'#ffe4e6', line:'#fecdd3' }
];
function ciStyleOf(k){
  for(var i = 0; i < CI_STYLES.length; i++) if(CI_STYLES[i].k === k) return CI_STYLES[i];
  return CI_STYLES[0];
}
function ciFont(px, bold){ return (bold ? 'bold ' : '') + px + 'px "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif'; }
function ciRound(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);   ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);   ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);       ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function ciFillRound(ctx, x, y, w, h, r, color){ ctx.fillStyle = color; ciRound(ctx, x, y, w, h, r); ctx.fill(); }
/* 打卡强度：按当天单词数分 1~4 级 */
function ciLevel(words){
  if(!words) return 0;
  if(words < 10) return 1;
  if(words < 30) return 2;
  if(words < 60) return 3;
  return 4;
}
/* 把「连续打卡 / 统计 / 日历」画到任意 canvas 上，scale 控制输出尺寸 */
function ciHexA(hex, a){
  var h = String(hex || '#000000').replace('#', '');
  if(h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
  var n = parseInt(h, 16);
  if(isNaN(n)) return hex;
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function ciDraw(cv, styleKey, scale){
  var W = 720, H = 1080;
  scale = scale || 1;
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  var st = ciStyleOf(styleKey);
  var s = checkinStats();
  var today = new Date();
  var dateStr = today.getFullYear() + ' 年 ' + (today.getMonth() + 1) + ' 月 ' + today.getDate() + ' 日';

  if(st.grad){
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, st.grad[0]);
    g.addColorStop(1, st.grad[1]);
    ctx.fillStyle = g;
  }else{
    ctx.fillStyle = st.bg;
  }
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText('聚合英语 · 每日打卡', 56, 76);
  ctx.textAlign = 'right';
  ctx.fillText(dateStr, W - 56, 76);
  ctx.textAlign = 'left';

  /* 主视觉：连续打卡天数 */
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(120, true);
  ctx.fillText(String(s.cur), 52, 236);
  var nw = ctx.measureText(String(s.cur)).width;
  ctx.font = ciFont(34, false);
  ctx.fillStyle = st.sub;
  ctx.fillText('天', 52 + nw + 14, 236);
  ctx.font = ciFont(28, true);
  ctx.fillStyle = st.ac;
  ctx.fillText(s.cur > 0 ? '连续打卡中' : '今天开始吧', 56, 284);

  /* 四宫格统计 */
  var cells = [
    ['累计天数', s.days + ' 天'],
    ['累计单词', s.words + ' 词'],
    ['学习时长', fmtDuration(s.seconds)],
    ['正确率', (s.total ? Math.round(s.correct / s.total * 100) : 0) + '%']
  ];
  var cw = (W - 112 - 18) / 2, ch = 98;
  cells.forEach(function(c, i){
    var x = 56 + (i % 2) * (cw + 18);
    var y = 322 + Math.floor(i / 2) * (ch + 16);
    ciFillRound(ctx, x, y, cw, ch, 20, st.card);
    ctx.fillStyle = st.fg;
    ctx.font = ciFont(36, true);
    ctx.fillText(c[1], x + 24, y + 54);
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(19, false);
    ctx.fillText(c[0], x + 24, y + 82);
  });

  /* 今日 */
  ciFillRound(ctx, 56, 556, W - 112, 66, 18, st.card);
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(23, true);
  ctx.fillText('今日', 80, 597);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText(s.todayData.words + ' 词 · ' + fmtDuration(s.todayData.seconds)
    + ' · 答题 ' + s.todayData.total + ' 次', 152, 597);

  /* 本月日历热力图 */
  var ym = ciYM || { y:today.getFullYear(), m:today.getMonth() };
  var cellsM = checkinMonth(ym.y, ym.m);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText(ym.y + ' 年 ' + (ym.m + 1) + ' 月', 56, 674);
  var heads = ['一','二','三','四','五','六','日'];
  var cell = 50, gap = 6;
  var gx = (W - (cell * 7 + gap * 6)) / 2, gy = 712;
  ctx.font = ciFont(18, false);
  ctx.fillStyle = st.sub;
  ctx.textAlign = 'center';
  heads.forEach(function(h, i){ ctx.fillText(h, gx + i * (cell + gap) + cell / 2, gy - 12); });
  ctx.textAlign = 'left';
  var alphas = { 0:0, 1:0.26, 2:0.5, 3:0.76, 4:1 };
  cellsM.forEach(function(c, i){
    var col = i % 7, row = Math.floor(i / 7);
    var x = gx + col * (cell + gap), y = gy + row * (cell + gap);
    if(c.blank) return;
    var lv = ciLevel(c.active ? (S.checkin[c.k] || {}).words : 0);
    ciFillRound(ctx, x, y, cell, cell, 9, lv ? ciHexA(st.ac, alphas[lv]) : ciHexA(st.line, 0.7));
    if(c.today){
      ctx.strokeStyle = st.fg; ctx.lineWidth = 2.2;
      ciRound(ctx, x + 1.2, y + 1.2, cell - 2.4, cell - 2.4, 8); ctx.stroke();
    }
  });

  /* 二维码：扫码打开本站（配色跟随主题） */
  try{
    var qrSide = 108, qrX = W - 56 - qrSide, qrY = H - 56 - 24 - qrSide;
    var qrC = qrThemeColors();
    ciFillRound(ctx, qrX - 9, qrY - 9, qrSide + 18, qrSide + 18, 12, '#ffffff');
    ctx.strokeStyle = qrC.dark; ctx.lineWidth = 2;
    ciRound(ctx, qrX - 9, qrY - 9, qrSide + 18, qrSide + 18, 12); ctx.stroke();
    qrDraw(ctx, siteUrl(), qrX, qrY, qrSide, { quiet:1, dark:qrC.dark, light:'#ffffff' });
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(15, false);
    ctx.textAlign = 'right';
    ctx.fillText('扫码打开', qrX + qrSide, qrY - 16);
    ctx.textAlign = 'left';
  }catch(e){}

  ctx.fillStyle = st.sub;
  ctx.font = ciFont(19, false);
  ctx.fillText(s.max > 0 ? '最长连续 ' + s.max + ' 天 · 累计 ' + s.days + ' 天' : '坚持每天学一点，进步看得见', 56, 1066);
  ctx.textAlign = 'right';
  ctx.fillText('v' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '3.0'), W - 56, 1066);
  ctx.textAlign = 'left';
  return cv;
}
function ciDownload(){
  try{
    var cv = document.createElement('canvas');
    ciDraw(cv, ciStyle, 1.5);
    cv.toBlob(function(blob){
      if(!blob){ toast('生成图片失败'); return; }
      var d = new Date();
      var name = '打卡-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.png';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('已保存 ' + name);
    }, 'image/png');
  }catch(e){
    toast('生成图片失败：' + e.message);
  }
}

          return '<div class="' + cls + '"' + tip + '>' + c.day + '</div>';

   12. 词库管理：导入 / 导出 / 启用 / 删除

function libStamp(){
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
}
function libExportName(){
  var d = new Date();
  return '词库-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
}
/* 把内部词条转成紧凑数组形式 */
function libPackEntry(w){
  var ex = (w.ex || []).map(function(g){ return [g.t || '', g.tr || '', g.s || '例句']; });
  return [w.w, w.p || '', w.m || '', ex];
}
function libExportObj(scope){
  var libs = [];
  if(scope === 'default' || scope === 'all'){
    var words = [];
    var seen = {};
    visibleLevels().forEach(function(k){
      if(k === 'user' || !DATA[k]) return;
      DATA[k].words.forEach(function(w){
        var kk = w.w.toLowerCase();
        if(seen[kk]) return;
        seen[kk] = 1;
        words.push(libPackEntry(w));
      });
    });
    libs.push({ name:'内置词库', sys:true, count:words.length, items:words });
  }
  if(scope === 'user' || scope === 'all'){
    S.libs.forEach(function(L){
      libs.push({ name:L.name, time:L.time, count:(L.items || []).length, items:L.items || [] });
    });
  }
  return {
    app:'聚合英语 · 词库',
    version:1,
    time:new Date().toISOString(),
    scope:scope,
    libs:libs
  };
}
function libSaveFile(name, text){
  try{
    var blob = new Blob([text], { type:'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('已导出 ' + name);
  }catch(e){
    toast('导出失败：' + e.message);
  }
}
/* 兼容多种 JSON 形状，返回 [{name, items}] */
function libParseJSON(text){
  var obj;
  try{ obj = JSON.parse(text); }
  catch(e){ throw new Error('不是合法的 JSON 文件'); }
  var out = [];
  function pushLib(name, arr){ var it = libNormalize(arr); if(it.length) out.push({ name:name || '导入词库', items:it }); }
  function scanList(list, name){ pushLib(name, list); }

  if(Array.isArray(obj)){
    pushLib('导入词库', obj);
  }else if(obj && obj.libs && Array.isArray(obj.libs)){
    obj.libs.forEach(function(L){ pushLib(L.name, L.items || L.words || L.list || []); });
  }else if(obj && obj.BANK){
    Object.keys(obj.BANK).forEach(function(k){
      var b = obj.BANK[k];
      if(b && Array.isArray(b.list)) pushLib((b.name || k), b.list);
    });
  }else if(obj && obj.name){
    scanList(obj.items || obj.words || obj.list || [], obj.name);
  }else if(obj && typeof obj === 'object'){
    scanList(obj.items || obj.words || obj.list || [], '导入词库');
  }
  if(!out.length) throw new Error('没有解析到任何单词');
  return out;
}
/* 单条词目归一化：[单词, 音标, 释义, [[en,cn,src],…]] */
function libNormalizeEntry(e){
  var w = '', p = '', m = '', raw = [];
  if(Array.isArray(e)){
    w = e[0] || ''; p = e[1] || ''; m = e[2] || ''; raw = e[3] || [];
  }else if(e && typeof e === 'object'){
    w = e.w || e.word || e.en || e.t || '';
    p = e.p || e.phonetic || e.ipa || e.pron || '';
    m = e.m || e.meaning || e.cn || e.tr || e.def || '';
    raw = e.ex || e.examples || e.e || [];
  }
  w = String(w).trim();
  if(!w || !/[A-Za-z]/.test(w)) return null;
  if(w.length > 48) return null;
  m = String(m).trim();
  var ex = [];
  if(Array.isArray(raw)){
    raw.forEach(function(g){
      if(Array.isArray(g) && g[0]){
        ex.push([String(g[0]).trim(), String(g[1] || '').trim(), String(g[2] || '例句').trim() || '例句']);
      }else if(g && typeof g === 'object' && (g.t || g.en || g.s)){
        ex.push([String(g.t || g.en || '').trim(), String(g.tr || g.cn || '').trim(), String(g.s || '例句').trim() || '例句']);
      }
    });
  }
  ex = ex.filter(function(g){ return g[0]; }).slice(0, 3);
  if(!ex.length) ex = [['', '', '例句']];
  return [w, String(p).trim(), m, ex];
}
function libNormalize(arr){
  var out = [], seen = {};
  (arr || []).forEach(function(e){
    var v = libNormalizeEntry(e);
    if(!v) return;
    var k = v[0].toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    out.push(v);
  });
  out.sort(function(a, b){ return a[0].toLowerCase().localeCompare(b[0].toLowerCase(), 'en'); });
  return out;
}
function libImportText(text, fileName){
  var libs = libParseJSON(text);
  var added = 0;
  libs.forEach(function(L, i){
    var name = String(L.name || '').trim() || (fileName || '导入词库');
    if(libs.length > 1 && L.name) name = L.name;
    else if(!L.name || L.name === '导入词库') name = (fileName || '导入词库');
    if(libs.length > 1) name = String(L.name || name);
    var id = 'lib' + Date.now().toString(36) + i;
    S.libs.push({ id:id, name:name, time:Date.now(), items:L.items });
    if(S.activeLibs.indexOf(id) < 0) S.activeLibs.push(id);
    added += L.items.length;
  });
  save();
  applyUserLibs();
  return { libs:libs.length, words:added };
}
function libReadFile(file, done){
  if(!file) return;
  if(file.size > 12 * 1024 * 1024){ uiAlert('文件太大了（上限 12 MB）。', '导入失败'); return; }
  var fr = new FileReader();
  fr.onload = function(){ done(String(fr.result || ''), file.name); };
  fr.onerror = function(){ uiAlert('文件读取失败，请重试。', '导入失败'); };
  fr.readAsText(file, 'utf-8');
}
function libDoImport(file){
  libReadFile(file, function(text, name){
    var base = String(name || '导入词库').replace(/\.json$/i, '');
    try{
      var r = libImportText(text, base);
      uiAlert('成功导入 ' + r.libs + ' 个词库，共 ' + r.words + ' 个单词。\n已自动启用，可切换到「我的词库」学段学习。', '导入完成');
      render();
    }catch(e){
      uiAlert(e.message, '导入失败');
    }
  });
}

/* ============================================================
   用户导入的附表：谚语 / 不规则动词 / 比较级
   —— S.extras 里的内容写回全局表，新增一个「我的」分类
   ============================================================ */
function applyExtras(){
  var ex = S.extras || { proverb:[], irregular:[], compare:[] };
  var pv = (ex.proverb   || []).slice();
  var ir = (ex.irregular || []).slice();
  var cp = (ex.compare   || []).slice();
  PROVERBS.user     = pv;
  IRREGULAR.user    = ir;
  COMPARATIVES.user = cp;
  if((pv.length || ir.length || cp.length) && !LV_TABS.some(function(t){ return t.k === 'user'; })){
    LV_TABS.push({ k:'user', name:'我的', ic:'user' });
  }
}
function extraCount(){
  var ex = S.extras || {};
  return (ex.proverb || []).length + (ex.irregular || []).length + (ex.compare || []).length;
}

/* ============================================================
   分类导出 / 分类导入
   ============================================================ */
var LIB_CAT_PICK = {};
function libCatDefs(){
  var out = [];
  /* LEVELS 里自带一个 'user' 档（名字也叫「我的词库」），这里跳过它，
     改由下面 kind:'lib' 的条目统一承担自建词库的导出，避免出现两个同名分类 */
  LEVELS.forEach(function(k){
    if(k === 'user') return;
    out.push({ k:k, kind:'level', n:LEVEL_NAME(k) || k });
  });
  out.push({ k:'user',      kind:'lib',       n:'我的词库' });
  out.push({ k:'proverb',   kind:'proverb',   n:'谚语' });
  out.push({ k:'irregular', kind:'irregular', n:'不规则动词' });
  out.push({ k:'compare',   kind:'compare',   n:'比较级·最高级' });
  return out;
}
function libCatCount(d){
  if(d.kind === 'level') return (DATA[d.k] && DATA[d.k].words) ? DATA[d.k].words.length : 0;
  if(d.kind === 'lib'){
    var n = 0;
    S.libs.forEach(function(L){ n += (L.items || []).length; });
    return n;
  }
  if(d.kind === 'proverb')   return getAllProverbsUnique().length;
  if(d.kind === 'irregular') return getAllIrregular().length;
  if(d.kind === 'compare')   return getAllComparatives().length;
  return 0;
}
/* 单个分类 → 一个或多个 section */
function libCatSections(d){
  var out = [];
  if(d.kind === 'level'){
    var words = (DATA[d.k] && DATA[d.k].words) ? DATA[d.k].words : [];
    out.push({ kind:'level', key:d.k, name:d.n, count:words.length, items:words.map(libPackEntry) });
  }else if(d.kind === 'lib'){
    S.libs.forEach(function(L){
      out.push({ kind:'lib', key:L.id, name:L.name, count:(L.items || []).length, items:L.items || [] });
    });
  }else if(d.kind === 'proverb'){
    var pv = getAllProverbsUnique().map(function(p){ return { en:p.en, cn:p.cn, tag:p.tag || '' }; });
    out.push({ kind:'proverb', key:'proverb', name:'谚语', count:pv.length, items:pv });
  }else if(d.kind === 'irregular'){
    var ir = getAllIrregular().map(function(v){ return { b:v.b, p:v.p, pp:v.pp, cn:v.cn }; });
    out.push({ kind:'irregular', key:'irregular', name:'不规则动词', count:ir.length, items:ir });
  }else if(d.kind === 'compare'){
    var cp = getAllComparatives().map(function(v){ return { b:v.b, c:v.c, s:v.s, cn:v.cn }; });
    out.push({ kind:'compare', key:'compare', name:'比较级·最高级', count:cp.length, items:cp });
  }
  return out;
}
/* keys 为 null 时导出全部分类 */
function libExportBundle(keys){
  var defs = libCatDefs();
  var secs = [];
  defs.forEach(function(d){
    if(keys && keys.indexOf(d.k) < 0) return;
    secs = secs.concat(libCatSections(d));
  });
  var total = 0;
  secs.forEach(function(s){ total += s.count; });
  return {
    app:'聚合英语 · 分类导出',
    version:2,
    time:new Date().toISOString(),
    total:total,
    sections:secs
  };
}
function libBundleName(tag){
  var d = new Date();
  return '聚合英语-' + (tag || '全部') + '-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json';
}
function libExportCats(keys, tag){

/* 分类包 → 写回状态；返回统计 */
function libApplyBundle(obj){
  var secs = obj.sections || [];
  var stat = { words:0, libs:0, proverb:0, irregular:0, compare:0, skip:0 };
  var ex = S.extras || (S.extras = { proverb:[], irregular:[], compare:[] });
  secs.forEach(function(s, i){
    var kind = s.kind, items = s.items || [];
    if(kind === 'level' || kind === 'lib'){
      var it = libNormalize(items);
      if(!it.length){ stat.skip++; return; }
      var id = 'lib' + Date.now().toString(36) + i;
      var nm = String(s.name || '导入词库').trim() || '导入词库';
      if(kind === 'level') nm = nm + '·导入';
      S.libs.push({ id:id, name:nm, time:Date.now(), items:it });
      if(S.activeLibs.indexOf(id) < 0) S.activeLibs.push(id);
      stat.libs++; stat.words += it.length;
    }else if(kind === 'proverb'){
      var have = {};
      ex.proverb.forEach(function(p){ have[String(p.en || '').toLowerCase()] = 1; });
      items.forEach(function(p){
        if(!p || !p.en) return;
        var k = String(p.en).toLowerCase();
        if(have[k]) return;
        have[k] = 1;
        ex.proverb.push({ en:String(p.en), cn:String(p.cn || ''), tag:String(p.tag || '') });
        stat.proverb++;
      });
    }else if(kind === 'irregular'){
      var hi = {};
      ex.irregular.forEach(function(v){ hi[String(v.b || '').toLowerCase()] = 1; });
      items.forEach(function(v){
        if(!v || !v.b) return;
        var k = String(v.b).toLowerCase();
        if(hi[k]) return;
        hi[k] = 1;
        ex.irregular.push({ b:String(v.b), p:String(v.p || ''), pp:String(v.pp || ''), cn:String(v.cn || '') });
        stat.irregular++;
      });
    }else if(kind === 'compare'){
      var hc = {};
      ex.compare.forEach(function(v){ hc[String(v.b || '').toLowerCase()] = 1; });
      items.forEach(function(v){
        if(!v || !v.b) return;
        var k = String(v.b).toLowerCase();
        if(hc[k]) return;
        hc[k] = 1;
        ex.compare.push({ b:String(v.b), c:String(v.c || ''), s:String(v.s || ''), cn:String(v.cn || '') });
        stat.compare++;
      });
    }else{
      stat.skip++;
    }
  });
  save();
  applyExtras();
  applyUserLibs();
  return stat;
}
function libImportAnyText(text, fileName){

/* ---------- 站点地址（二维码用，恒为当前页面地址） ---------- */
function siteUrl(){
  try{ return location.href.split('#')[0].split('?')[0]; }catch(e){ return ''; }
}
function siteUrlLabel(){
  var u = siteUrl();
  if(!u) return '';
  try{
    var a = document.createElement('a');
    a.href = u;
    if(a.protocol === 'file:'){
      var seg = a.pathname.split('/');
      var last = decodeURIComponent(seg[seg.length - 1] || '');
      return last ? '本地文件 · ' + last : '本地文件';
    }
    return a.host + (a.pathname && a.pathname !== '/' ? a.pathname : '');
  }catch(e){ return u.slice(0, 48); }
}
function siteUrlIsRemote(){
  var u = siteUrl();
  return /^https?:\/\//i.test(u);
}

/* ---------- 自动夜间模式 ---------- */
function hmToMin(hm){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || ''));
  if(!m) return -1;
  var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if(h > 23 || mi > 59) return -1;
  return h * 60 + mi;
}
function autoDarkWant(dt){
  var st = S.settings;
  if(!st || !st.autoDark) return null;
  var a = hmToMin(st.darkStart), b = hmToMin(st.darkEnd);
  if(a < 0) a = 19 * 60;
  if(b < 0) b = 7 * 60;
  dt = dt || new Date();
  var now = dt.getHours() * 60 + dt.getMinutes();
  if(a === b) return null;
  /* 起 > 止 表示跨零点（19:00 → 07:00） */
  return a < b ? (now >= a && now < b) : (now >= a || now < b);
}
var _autoDarkLast = null;
function autoDarkTick(force){
  var want = autoDarkWant();
  if(want === null){
    _autoDarkLast = null;
    return;
  }
  if(!force && want === _autoDarkLast) return;
  _autoDarkLast = want;
  if(S.dark === want) return;
  S.dark = want;
  save();
  applyTheme();
  if(typeof view !== 'undefined' && (view === 'settings' || view === 'me' || view === 'home')) render();
}
function autoDarkLabel(){
  var st = S.settings;
  if(!st || !st.autoDark) return '关闭';
  return (st.darkStart || '19:00') + ' → ' + (st.darkEnd || '07:00');
}

  if(/Weibo/i.test(ua)) return 'weibo';

  if(/AlipayClient/i.test(ua)) return 'alipay';

function envIsEdge(){

}
function envDismissed(kind){
  try{
    var raw = localStorage.getItem(ENV_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw) || {};
    if(kind === 'edge'){
      /* Edge 收藏提醒 30 天内只提示一次 */
      return !!o.edge && (Date.now() - o.edge) < 30 * 864e5;
    }
    return !!o[kind];
  }catch(e){ return false; }
}
function envDismiss(kind){
  try{
    var raw = localStorage.getItem(ENV_KEY);
    var o = {};
    try{ o = JSON.parse(raw) || {}; }catch(e2){ o = {}; }
    o[kind] = (kind === 'edge') ? Date.now() : 1;
    localStorage.setItem(ENV_KEY, JSON.stringify(o));
  }catch(e){}
}

function obInitPicks(){

    focus: fs,
    bg: S.settings.bg || 'auto',
    theme: S.theme || 'sky',

  var o = {};

}
function obPickExt(k){ return !!(obPicks && obPicks.ext && obPicks.ext[k]); }
/* 引导页第 5 步里每行的小字：词数 + 它自己的二级分类 */
function obExtDesc(k){
  var L = extLib(k);

  return extWordCount(L) + ' 词 · ' + gs.join(' / ');
}

function obExtSummary(){
  var ks = extKeys();
  if(!ks.length) return '没有加载到（不影响使用）';

function obPurposeOf(k){

function obFlowKeys(){
  var set = [];

  fs.forEach(function(k){

  return STEP_ORDER.filter(function(k){ return set.indexOf(k) >= 0; });

  if(po){ S.level = po.level; S.levels = [po.level]; S.count = po.count; }
  var ks = obFlowKeys();
  if(ks.length){

  }
  S.settings.bg = obPicks.bg;

  S.fontSize = obPicks.fs;

  if(obPicks.ext && Object.keys(obPicks.ext).length) S.settings.extLibsOn = Object.assign({}, obPicks.ext);

/* ============================================================
   17. 评价体系（D~S）· 学习报告 · 评价分享图
   ============================================================ */
var GRADE_META = {
  S: { name:'卓越',   color:'#8b5cf6', tip:'准确率与速度都很出色，把节奏保持住。' },
  A: { name:'优秀',   color:'#0ea5e9', tip:'掌握得很稳，可以试试更高的学段。' },
  B: { name:'良好',   color:'#16a34a', tip:'整体不错，把错题再过一遍就更牢了。' },
  C: { name:'及格',   color:'#f59e0b', tip:'基础还在，放慢一点、把例句再读一遍。' },
  D: { name:'待加强', color:'#ef4444', tip:'别急，这一批词重新学一遍再来复习。' }
};
var GRADE_ORDER = ['S', 'A', 'B', 'C', 'D'];
var MODE_NAME = { learn:'学习', review:'复习', wrong:'错题', dictation:'听写', exam:'测验', read:'学习' };

function evalCuts(){
  var c = S.settings && S.settings.evalCuts;
  if(!c || !c.length || c.length < 4) c = [90, 80, 70, 60];
  var out = [];
  for(var i = 0; i < 4; i++){
    var v = parseInt(c[i], 10);
    out.push(isNaN(v) ? [90, 80, 70, 60][i] : v);
  }
  return out;
}
function evalGrade(score){
  var c = evalCuts();
  if(score >= c[0]) return 'S';
  if(score >= c[1]) return 'A';
  if(score >= c[2]) return 'B';
  if(score >= c[3]) return 'C';
  return 'D';
}
function evalGradeMeta(g){ return GRADE_META[g] || GRADE_META.D; }
/* 按「准确率 + 速度」加权求综合分：速度以每题的基准秒数为参照 */
function evalCompute(o){
  o = o || {};
  var n = o.total || 0;
  var acc = n ? Math.round(o.correct / n * 100) : 0;
  var base = (S.settings && S.settings.secPerQ) || 15;
  var avg = n ? (o.sec || 0) / n : 0;
  var sp;
  if(!n || avg <= 0) sp = acc >= 60 ? 100 : 60;
  else sp = Math.max(0, Math.min(100, Math.round(100 * (2 - avg / base))));
  var w = (S.settings && S.settings.evalAccWeight);
  w = (w === undefined || w === null) ? 70 : parseInt(w, 10);
  if(isNaN(w)) w = 70;
  w = Math.max(0, Math.min(100, w));
  var score = n ? Math.round(acc * w / 100 + sp * (100 - w) / 100) : 0;
  return { n:n, correct:o.correct || 0, total:n, acc:acc, speed:sp, avg:avg,
           score:score, grade:n ? evalGrade(score) : '-' };
}
/* 记录一次评价 */
function evalRecord(o){
  if(!S.evals) S.evals = [];
  var r = {
    t: Date.now(),
    mode: o.mode || 'learn',
    level: o.level || S.level,
    n: o.total || 0,
    correct: o.correct || 0,
    sec: Math.round(o.sec || 0),
    score: o.score || 0,
    grade: o.grade || '-',
    acc: o.acc || 0,
    speed: o.speed || 0,
    steps: (o.steps && typeof o.steps === 'object') ? o.steps : null,
    words: (o.words || []).slice(0, 40)
  };
  if(r.n <= 0) return null;
  S.evals.push(r);
  if(S.evals.length > 200) S.evals = S.evals.slice(-200);
  save();
  return r;
}
function evalList(){ return (S.evals || []).slice().sort(function(a, b){ return b.t - a.t; }); }
function evalSummary(list){
  list = list || evalList();
  var sum = { n:0, correct:0, sec:0, score:0, count:list.length, best:'-', dist:{S:0,A:0,B:0,C:0,D:0} };
  if(!list.length) return sum;
  var bestRank = 99;
  list.forEach(function(r){
    var sc = (typeof r.score === 'number' && isFinite(r.score)) ? r.score : 0;
    sum.n += r.n || 0; sum.correct += r.correct || 0; sum.sec += r.sec || 0; sum.score += sc;
    if(sum.dist[r.grade] !== undefined) sum.dist[r.grade]++;
    var rk = GRADE_ORDER.indexOf(r.grade);
    if(rk >= 0 && rk < bestRank){ bestRank = rk; sum.best = r.grade; }
  });
  sum.acc = sum.n ? Math.round(sum.correct / sum.n * 100) : 0;
  sum.avgScore = Math.round(sum.score / list.length);
  sum.avgSec = sum.n ? sum.sec / sum.n : 0;
  return sum;
}
function gradeBadge(g, big){
  var m = evalGradeMeta(g);
  if(g === '-') return '<span class="grade g-m">—</span>';
  return '<span class="grade g-' + g + (big ? ' big' : '') + '" style="--gc:' + m.color + '">' + g + '</span>';
}
function fmtTime(ts){
  var d = new Date(ts);
  var now = new Date();
  var same = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if(same) return '今天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

/* ---------- 分模块（跟读 / 中译英 / 听音选词…）正确率与评价 ---------- */
/* 只有准确率、没有用时，所以评价直接按准确率折算同一个 A~S 评级口径 */
function accEval(acc){
  if(typeof acc !== 'number' || !isFinite(acc)) return '-';
  return evalGrade(acc);
}
function accTip(acc){
  if(acc >= 95) return '这一模块几乎全对，很稳。';
  if(acc >= 85) return '表现不错，个别词回看一遍就牢了。';
  if(acc >= 70) return '还行，错的那几个词建议单独再练一次。';
  if(acc >= 60) return '偏弱，这一块要多花点时间。';
  return '这是目前的短板，建议先回「朗读认知」过一遍再来。';
}
/* 从一批评价记录里汇总每个模块的 答对 / 总题数 */
function evalStepSummary(list){
  var out = {};
  (list || []).forEach(function(r){
    var st = r && r.steps;
    if(!st || typeof st !== 'object') return;
    Object.keys(st).forEach(function(k){
      var v = st[k] || {};
      var t = parseInt(v.t, 10) || 0, c = parseInt(v.c, 10) || 0;
      if(t <= 0) return;
      if(!out[k]) out[k] = { c:0, t:0 };
      out[k].c += Math.max(0, Math.min(c, t));
      out[k].t += t;
    });
  });
  return out;
}
/* 展示顺序：先按学习流程的先后，流程里没有的（比如听写）补在后面 */
function stepSummaryKeys(map, flow){
  var order = (flow && flow.length) ? flow.slice() : STEP_ORDER.slice();
  ['spell','sent','dictation'].forEach(function(k){ if(order.indexOf(k) < 0) order.push(k); });
  var keys = order.filter(function(k){ return map[k] && map[k].t > 0; });
  Object.keys(map).forEach(function(k){ if(keys.indexOf(k) < 0 && map[k].t > 0) keys.push(k); });
  return keys;
}
function stepAccRowHTML(k, c, t, opts){
  var a = t ? Math.round(c / t * 100) : 0;
  var g = accEval(a);
  var m = evalGradeMeta(g);
  var row = '<div class="stp-row">'
    + '<span class="stp-ic">' + STEP_ICON(k) + '</span>'
    + '<span class="stp-n">' + escapeHtml(STEP_LABEL(k)) + '</span>'
    + '<span class="stp-bar"><i style="width:' + a + '%;background:' + m.color + '"></i></span>'
    + '<b class="stp-a">' + a + '%</b>'
    + '<span class="stp-c">' + c + '/' + t + '</span>'
    + gradeBadge(g)
    + '</div>';
  if(opts && opts.tip) row += '<p class="stp-tip">' + escapeHtml(accTip(a)) + '</p>';
  return row;
}
/* 一轮结束时卡片里的分模块小结（只列本轮真答过的模块） */
function stepBreakHTML(byStep, flow){
  if(!byStep || typeof byStep !== 'object') return '';
  var keys = [];
  (flow || []).forEach(function(k){ if(byStep[k] && byStep[k].t > 0) keys.push(k); });
  Object.keys(byStep).forEach(function(k){
    if(keys.indexOf(k) < 0 && byStep[k] && byStep[k].t > 0) keys.push(k);
  });
  if(keys.length < 2) return '';
  return '<div class="divider"></div>'
    + '<div class="stp-head">各模块表现 <span class="hint">右键头是正确率，灰色是答对 / 总题数</span></div>'
    + '<div class="stp-list">' + keys.map(function(k){
        return stepAccRowHTML(k, byStep[k].c, byStep[k].t, null);
      }).join('') + '</div>';

/* ---------- 评价分享图 ---------- */
function evalDraw(cv, styleKey, r, scale){
  var W = 720, H = 1120;
  scale = scale || 1;
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  var st = ciStyleOf(styleKey);
  var m = evalGradeMeta(r.grade);
  var d = new Date(r.t);
  var dateStr = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';

  if(st.grad){
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, st.grad[0]);
    g.addColorStop(1, st.grad[1]);
    ctx.fillStyle = g;
  }else ctx.fillStyle = st.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText('聚合英语 · 学习报告', 56, 76);
  ctx.textAlign = 'right';
  ctx.fillText(dateStr, W - 56, 76);
  ctx.textAlign = 'left';

  /* 评级大字母 */
  ciFillRound(ctx, 56, 112, 250, 250, 36, st.card);
  ctx.fillStyle = m.color;
  ctx.font = 'bold 170px "Segoe UI",Arial,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(r.grade, 181, 292);
  ctx.textAlign = 'left';
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(38, true);
  ctx.fillText(m.name, 336, 210);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText((MODE_NAME[r.mode] || '学习') + ' · ' + LEVEL_NAME(r.level), 336, 250);
  ctx.fillStyle = st.fg;
  ctx.font = 'bold 76px "Segoe UI",Arial,sans-serif';
  ctx.fillText(String(r.score), 336, 336);
  var sw = ctx.measureText(String(r.score)).width;
  ctx.font = ciFont(22, false);
  ctx.fillStyle = st.sub;
  ctx.fillText('综合分', 336 + sw + 10, 336);

  /* 四宫格 */
  var cells = [
    ['准确率', r.acc + '%'],
    ['速度分', String(r.speed)],
    ['答对题数', r.correct + ' / ' + r.n],
    ['总用时', fmtDuration(r.sec)]
  ];
  var cw = (W - 112 - 18) / 2, ch = 98;
  cells.forEach(function(c, i){
    var x = 56 + (i % 2) * (cw + 18);
    var y = 400 + Math.floor(i / 2) * (ch + 16);
    ciFillRound(ctx, x, y, cw, ch, 20, st.card);
    ctx.fillStyle = st.fg;
    ctx.font = ciFont(34, true);
    ctx.fillText(c[1], x + 24, y + 54);
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(19, false);
    ctx.fillText(c[0], x + 24, y + 82);
  });

  /* 词汇 */
  ciFillRound(ctx, 56, 638, W - 112, 250, 20, st.card);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(20, false);
  ctx.fillText('本批词汇', 80, 678);
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(26, true);
  var ws = r.words || [];
  var per = 4, shown = ws.slice(0, 16);
  shown.forEach(function(w, i){
    var col = i % per, row = Math.floor(i / per);
    ctx.fillText(w, 80 + col * 158, 724 + row * 44);
  });
  if(!shown.length){
    ctx.font = ciFont(22, false);
    ctx.fillStyle = st.sub;
    ctx.fillText('（未记录词汇）', 80, 724);
  }else if(r.n > shown.length){
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(19, false);
    ctx.fillText('另有 ' + (r.n - shown.length) + ' 个单词', 80, 862);
  }

  /* 评语 */
  ctx.fillStyle = st.ac;
  ctx.font = ciFont(23, true);
  ctx.fillText(m.tip, 56, 934);

  /* 二维码（配色跟随主题） */
  var qy = 962, qs = 92;
  var qrC = qrThemeColors();
  ciFillRound(ctx, 56 - 9, qy - 9, qs + 18, qs + 18, 12, '#ffffff');
  ctx.strokeStyle = qrC.dark; ctx.lineWidth = 2;
  ciRound(ctx, 56 - 9, qy - 9, qs + 18, qs + 18, 12); ctx.stroke();
  qrDraw(ctx, siteUrl(), 56, qy, qs, { quiet:1, dark:qrC.dark, light:'#ffffff' });
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(23, true);
  ctx.fillText(siteUrlIsRemote() ? '扫码打开「聚合英语」' : '「聚合英语」· 本地单页应用', 178, qy + 40);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(19, false);
  ctx.fillText(siteUrlLabel(), 178, qy + 72);
  ctx.fillText('综合分 = 准确率 × ' + (S.settings.evalAccWeight === undefined ? 70 : S.settings.evalAccWeight)
    + '% + 速度分 × ' + (100 - (S.settings.evalAccWeight === undefined ? 70 : S.settings.evalAccWeight)) + '%', 178, qy + 100);

  ctx.textAlign = 'right';
  ctx.font = ciFont(18, false);
  ctx.fillText('v' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '3.0'), W - 56, 1092);
  ctx.textAlign = 'left';
  return cv;
}

/* ============================================================
   18. 学习日程 · 全局搜索
   ============================================================ */
var WEEK_NAME = ['周一','周二','周三','周四','周五','周六','周日'];

/* ---------- 学习日程 ---------- */
function schedDef(){
  return { on:false, week:[20, 20, 20, 20, 20, 30, 0], dates:{} };
}
function sched(){
  if(!S.schedule || typeof S.schedule !== 'object') S.schedule = schedDef();
  var d = schedDef();
  if(!S.schedule.week || S.schedule.week.length !== 7) S.schedule.week = d.week;
  if(!S.schedule.dates || typeof S.schedule.dates !== 'object') S.schedule.dates = {};
  return S.schedule;
}
/* 周一为 0 */
function schedIdx(dt){
  dt = dt || new Date();
  return (dt.getDay() + 6) % 7;
}
function schedTarget(k){
  var sc = sched();
  if(!sc.on) return null;
  if(sc.dates && sc.dates[k] !== undefined && sc.dates[k] !== null && sc.dates[k] !== '') return parseInt(sc.dates[k], 10) || 0;
  return parseInt(sc.week[schedIdx()], 10) || 0;
}
function schedToday(){
  var sc = sched();
  var k = todayKey();
  var ov = (sc.dates && sc.dates[k] !== undefined);
  var t = ov ? (parseInt(sc.dates[k], 10) || 0) : (parseInt(sc.week[schedIdx()], 10) || 0);
  return { on:!!sc.on, key:k, target:t, override:ov, rest:!!sc.on && t === 0 };
}
function schedDoneToday(){
  var d = S.checkin[todayKey()] || {};
  return d.words || 0;
}
function schedSetWeek(i, v){
  sched().week[i] = Math.max(0, parseInt(v, 10) || 0);
  save();
}
function schedSetDate(k, v){
  var sc = sched();
  if(v === '' || v === null || v === undefined) delete sc.dates[k];
  else sc.dates[k] = Math.max(0, parseInt(v, 10) || 0);
  save();
}
function schedUpcoming(n){
  var out = [];
  var now = new Date();
  for(var i = 0; i < (n || 14); i++){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    var k = dateKeyOf(d);
    var ov = sched().dates[k] !== undefined;
    var t = ov ? (parseInt(sched().dates[k], 10) || 0) : (parseInt(sched().week[schedIdx(d)], 10) || 0);
    var rec = S.checkin[k] || {};
    out.push({ d:d, k:k, i:i, target:t, override:ov, done:rec.words || 0, rest:t === 0,
               weekday:WEEK_NAME[schedIdx(d)] });
  }
  return out;
}
var SCHED_CHOICES = [0, 10, 20, 30, 50];

/* ============================================================
   学习日程 · 闯关模式（线性关卡）
   ------------------------------------------------------------
   把当前学段的词库按「每次学多少词」切成一条直线上的关卡：
   第 1 关 = 前 N 个词，第 2 关 = 接着的 N 个词…… 只能顺着解锁，
   点已解锁的关卡直接进学习界面。通过的标准是本轮正确率 ≥ 60%。
   数据存在 S.quest 里，键是「学段:关卡号」，只记通过的关。
   ============================================================ */
var QUEST_PASS_ACC = 60;      /* 通关所需正确率（%） */
var QUEST_STAR_CUTS = [60, 80, 95];   /* 一星 / 二星 / 三星 的正确率门槛 */

function questPerLevel(){
  var n = parseInt(S.count, 10) || 10;
  return Math.max(5, Math.min(50, n));
}
function questLevels(){ return curWords(); }
function questCount(){
  var per = questPerLevel();
  return Math.max(1, Math.ceil(questLevels().length / per));
}
function questKeyOf(i){ return String(S.level) + ':' + String(i); }
function questRec(i){ return (S.quest && S.quest[questKeyOf(i)]) || null; }
function questPassed(i){ return !!questRec(i); }
/* 当前该打的那一关 = 第一个没通过的；全通了就返回总关数 */
function questCurrent(){
  var n = questCount();
  for(var i = 0; i < n; i++){ if(!questPassed(i)) return i; }
  return n;
}
function questStars(acc){
  var n = 0;
  for(var i = 0; i < QUEST_STAR_CUTS.length; i++){ if(acc >= QUEST_STAR_CUTS[i]) n++; }
  return n;
}
function questWordsOf(i){
  var per = questPerLevel();
  return questLevels().slice(i * per, i * per + per);
}
function questStart(i){
  var words = questWordsOf(i);
  if(!words.length){ toast('这一关没有单词'); return; }
  startSession(words, (S.flow && S.flow.length ? S.flow : DEFAULT_FLOW).slice(), { mode:'quest', quest:i });
}
/* 通关记一笔；返回 { pass, first, stars, need } */
function questMark(i, acc, secs){
  var ok = (acc >= QUEST_PASS_ACC);
  var first = false;
  if(ok){
    if(!S.quest || typeof S.quest !== 'object') S.quest = {};
    var k = questKeyOf(i);
    first = !S.quest[k];
    var old = S.quest[k] || {};
    /* 已通过的关卡再打一次只留更好的成绩 */
    S.quest[k] = {
      acc:Math.max(acc, old.acc || 0),
      sec:(old.sec && old.acc >= acc) ? old.sec : secs,
      at:old.at || Date.now(),
      stars:Math.max(questStars(acc), old.stars || 0),
      tries:(old.tries || 0) + 1
    };
    save();
  }
  return { pass:ok, first:first, stars:questStars(acc), need:QUEST_PASS_ACC };
}
function questClear(){
  S.quest = {};
  save();
}
function questTotalStars(){
  var n = 0;
  Object.keys(S.quest || {}).forEach(function(k){ n += (S.quest[k].stars || 0); });
  return n;
}
function questDoneOf(levelKey){
  var n = 0;
  Object.keys(S.quest || {}).forEach(function(k){
    if(k.indexOf(String(levelKey) + ':') === 0) n++;
  });
  return n;
}

/* 一条关卡路径：每行 4 个节点，节点之间画连线 */
function questPathHTML(){
  var total = questCount();
  var cur = questCurrent();
  var per = questPerLevel();
  var words = questLevels();
  var rows = [];
  for(var r = 0; r < Math.ceil(total / 4); r++){
    var cells = [];
    for(var c = 0; c < 4; c++){
      var i = r * 4 + c;
      if(i >= total) break;
      var rec = questRec(i);
      var state = rec ? 'done' : (i === cur ? 'now' : (i < cur ? 'done' : 'lock'));
      var stars = rec ? (rec.stars || 0) : 0;
      var from = i * per + 1, to = Math.min((i + 1) * per, words.length);
      cells.push('<button class="q-node ' + state + '" data-q="' + i + '"'
        + ' title="第 ' + (i + 1) + ' 关 · 第 ' + from + '–' + to + ' 个词'
        + (rec ? ' · 正确率 ' + rec.acc + '%' : '') + '">'
        + '<i class="q-hex"><b>' + (state === 'lock' ? IC('lock') : String(i + 1)) + '</b></i>'
        + '<span class="q-star">' + (stars ? '★'.repeat(stars) : (state === 'lock' ? '未解锁' : '待挑战')) + '</span>'
        + '<span class="q-range">' + from + '–' + to + '</span>'
        + '</button>');
    }
    rows.push('<div class="q-row">' + cells.join('<i class="q-link"></i>') + '</div>');
  }
  return rows.join('');
}

/* ============================================================
   勋章系统
   ------------------------------------------------------------
   10 个勋章家族 × 铜 / 银 / 金三档 = 30 枚，形状是正六边形。
   每族的 get() 现算当前进度，cuts 是铜 / 银 / 金三档的门槛。
   拿到的时间戳记在 S.medals['家族:档位'] 里，用来显示「获得于」。
   ============================================================ */
var MEDAL_TIER_NAME = { 1:'铜牌', 2:'银牌', 3:'金牌' };
var MEDAL_FAMILIES = [
  { k:'learn', n:'初识词汇', ic:'book', unit:'词',
    desc:'学过多少个不同的单词（每个词只要练过一次就算）。',
    cuts:[100, 500, 1000],
    get:function(){ return Object.keys(S.seen || {}).length; } },

  { k:'perfect', n:'一击必中', ic:'target', unit:'次',
    desc:'单轮练习正确率打到 100% 的次数。',
    cuts:[1, 10, 50],
    get:function(){ return (S.evals || []).filter(function(r){ return r && r.acc === 100; }).length; } },

  { k:'streak', n:'持之以恒', ic:'flame', unit:'天',
    desc:'连续打卡的最长天数（断一天就重新数）。',
    cuts:[3, 7, 15],
    get:function(){ try{ return checkinStats().max; }catch(e){ return 0; } } },

  { k:'days', n:'日积月累', ic:'calendar', unit:'天',
    desc:'累计打卡的天数，不要求连续。',
    cuts:[7, 30, 100],
    get:function(){ try{ return checkinStats().days; }catch(e){ return 0; } } },

  { k:'volume', n:'勤学不辍', ic:'pencil', unit:'题',
    desc:'累计答题次数。',
    cuts:[100, 1000, 5000],
    get:function(){ try{ return checkinStats().total; }catch(e){ return 0; } } },

  { k:'great', n:'满分表现', ic:'trophy', unit:'次',
    desc:'单轮综合分达到 90 分以上的次数。',
    cuts:[1, 5, 20],
    get:function(){ return (S.evals || []).filter(function(r){ return r && (r.score || 0) >= 90; }).length; } },

  { k:'collect', n:'收藏家', ic:'star', unit:'词',
    desc:'收藏本里攒下的单词数。',
    cuts:[10, 50, 100],
    get:function(){ return (S.favs || []).length; } },

  { k:'listen', n:'听音达人', ic:'headphones', unit:'题',
    desc:'「听音选词」模块累计答对的题数。',
    cuts:[50, 200, 500],
    get:function(){
      var n = 0;
      (S.evals || []).forEach(function(r){
        if(r && r.steps && r.steps.listen) n += (r.steps.listen.c || 0);
      });
      return n;
    } },

  { k:'words', n:'博览词库', ic:'bookopen', unit:'词次',
    desc:'累计练习过的单词次数（同一个词练几遍算几遍）。',
    cuts:[300, 1500, 5000],
    get:function(){ try{ return checkinStats().words; }catch(e){ return 0; } } },

  { k:'quest', n:'闯关先锋', ic:'bolt', unit:'关',
    desc:'在「学习日程 · 闯关模式」里通关的关卡数。',
    cuts:[5, 20, 50],
    get:function(){ return Object.keys(S.quest || {}).length; } }
];

/* 某一族现在的档位：0 = 还没拿到，1/2/3 = 铜 / 银 / 金 */
function medalTierOf(fam){
  var v = 0;
  try{ v = fam.get() || 0; }catch(e){ v = 0; }
  var t = 0;
  for(var i = 0; i < 3; i++){ if(v >= fam.cuts[i]) t = i + 1; }
  return t;
}
/* 距离下一档还差多少；满了回 null */
function medalNextOf(fam){
  var v = 0;
  try{ v = fam.get() || 0; }catch(e){ v = 0; }
  for(var i = 0; i < 3; i++){
    if(v < fam.cuts[i]) return { tier:i + 1, need:fam.cuts[i], cur:v, left:fam.cuts[i] - v };
  }
  return null;
}
function medalEarnedCount(){
  var n = 0;
  MEDAL_FAMILIES.forEach(function(f){ n += medalTierOf(f); });
  return n;
}
function medalTierCount(t){
  var n = 0;
  MEDAL_FAMILIES.forEach(function(f){ if(medalTierOf(f) >= t) n++; });
  return n;
}
/* 把这次达到的勋章记下时间戳；quiet=true 时不弹提示（启动时用） */
function medalSync(quiet){
  var fresh = [];
  MEDAL_FAMILIES.forEach(function(f){
    var t = medalTierOf(f);
    for(var i = 1; i <= t; i++){
      var key = f.k + ':' + i;
      if(!S.medals[key]){ S.medals[key] = Date.now(); fresh.push({ fam:f, tier:i }); }
    }
  });
  if(fresh.length){
    save();
    if(!quiet){
      var last = fresh[fresh.length - 1];
      toast('获得新勋章：' + last.fam.n + ' · ' + MEDAL_TIER_NAME[last.tier]
        + (fresh.length > 1 ? '（共 ' + fresh.length + ' 枚）' : ''));
    }
  }
  return fresh;
}
function medalKeyOf(fam, tier){ return fam.k + ':' + tier; }
function medalAt(fam, tier){ return S.medals[medalKeyOf(fam, tier)] || 0; }

/* 正六边形勋章（外圈是六边形，里面放图标） */
function medalHexHTML(fam, tier, size){
  size = size || 78;
  var w = Math.round(size * 0.866);
  return '<i class="ml-hex t' + tier + '" style="width:' + w + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.40) + 'px">'
    + '<span class="ml-hex-in">' + IC(tier ? fam.ic : 'lock') + '</span>'
    + '</i>';
}
var medalFilter = 'all';
function medalCardHTML(fam){
  var tier = medalTierOf(fam);
  var nx = medalNextOf(fam);
  var pct = Math.min(100, Math.round((nx ? nx.cur : fam.cuts[2]) / (nx ? nx.need : fam.cuts[2]) * 100));
  var tiers = [1, 2, 3].map(function(t){
    return '<i class="ml-dot t' + t + (tier >= t ? ' on' : '') + '" title="' + MEDAL_TIER_NAME[t] + '"></i>';
  }).join('');
  return '<button class="ml-card' + (tier ? ' has' : '') + '" data-ml="' + fam.k + '">'
    + medalHexHTML(fam, tier)
    + '<b class="ml-n">' + fam.n + '</b>'
    + '<span class="ml-t">' + (tier ? MEDAL_TIER_NAME[tier] : '未获得') + '</span>'
    + '<span class="ml-dots">' + tiers + '</span>'
    + '<span class="ml-prog"><i style="width:' + pct + '%"></i></span>'
    + '<span class="ml-p">' + (nx ? '还差 ' + nx.left + ' ' + fam.unit : '已满级') + '</span>'
    + '</button>';
}
function medalDetail(fam){
  var tier = medalTierOf(fam);
  var rows = [1, 2, 3].map(function(t){
    var at = medalAt(fam, t);
    var got = at > 0;
    var d = new Date(at || Date.now());
    return '<div class="ml-row' + (got ? ' on' : '') + '">'
      + '<span class="ml-rt t' + t + '">' + MEDAL_TIER_NAME[t] + '</span>'
      + '<span class="ml-rq">达到 ' + fam.cuts[t - 1] + ' ' + fam.unit + '</span>'
      + '<span class="ml-rd">' + (got ? ('获得于 ' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())) : '未获得') + '</span>'
      + '</div>';
  }).join('');
  var nx = medalNextOf(fam);
  uiDialog({
    title: fam.n + (tier ? ' · ' + MEDAL_TIER_NAME[tier] : ''),
    html: '<div style="text-align:center;padding:6px 0 12px">' + medalHexHTML(fam, tier, 108) + '</div>'
      + '<p class="muted" style="margin:0 0 12px">' + escapeHtml(fam.desc) + '</p>'
      + '<div class="ml-rows">' + rows + '</div>'
      + '<p class="muted" style="margin:12px 0 0">当前进度：<b>' + (function(){ try{ return fam.get() || 0; }catch(e){ return 0; } })()
      + ' ' + fam.unit + '</b>' + (nx ? '，还差 ' + nx.left + ' ' + fam.unit + ' 就能拿到' + MEDAL_TIER_NAME[nx.tier] : '，已经满级') + '</p>',
    okText:'知道了', cancelText:''
  });
}
function renderMedals(app){
  medalSync(true);

  var b = medalTierCount(1), s = medalTierCount(2), g = medalTierCount(3);

  });

  app.innerHTML =
      '<section class="card">'
    +   '<h2 class="h2">勋章 <span class="hint">正六边形勋章 · 铜牌 / 银牌 / 金牌三档</span></h2>'
    +   '<div class="ci-stats" style="margin-top:12px">'
    +     '<div class="ci-stat"><b>' + got + '/' + all + '</b><span>已获得</span></div>'
    +     '<div class="ci-stat"><b>' + b + '</b><span>铜牌</span></div>'
    +     '<div class="ci-stat"><b>' + s + '</b><span>银牌</span></div>'
    +     '<div class="ci-stat"><b>' + g + '</b><span>金牌</span></div>'
    +   '</div>'
    +   '<div class="ml-bar"><i style="width:' + Math.round(got / Math.max(1, all) * 100) + '%"></i></div>'
    +   '<p class="muted" style="margin:10px 0 0">每族的铜牌最快，金牌要攒很久；灰色的是还没拿到的。点任意一枚看领取条件与进度。</p>'
    + '</section>'

    + '<section class="card">'
    +   '<div class="chips" id="mlFilter" style="margin-bottom:4px">'
    +     [['all', '全部'], ['1', '铜牌'], ['2', '银牌'], ['3', '金牌'], ['none', '未获得']].map(function(x){

  $$('#mlFilter .chip').forEach(function(ch){
    ch.onclick = function(){ medalFilter = ch.dataset.mf; render(); };

  $$('#app [data-ml]').forEach(function(el){
    el.onclick = function(){
      var fam = null;
      MEDAL_FAMILIES.forEach(function(f){ if(f.k === el.dataset.ml) fam = f; });

function entiDimByKey(k){
  var out = null;
  ENTI_DIMS.forEach(function(d){ if(d.k === k) out = d; });

function entiCopy(o){
  var out = {};
  Object.keys(o || {}).forEach(function(k){ out[k] = o[k]; });
  return out;
}
