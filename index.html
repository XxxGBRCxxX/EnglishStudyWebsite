        +   '<button class="btn sm" data-speak="' + escapeHtml((tp.parts || []).map(function(x){ return x.en || ''; }).join(' ')) + '">' + IC('volume') + ' 朗读全文</button>'
        +   '<button class="btn sm" data-fav-tpl="' + wTpl + '">' + IC('star') + ' 收藏模板</button>'
        + '</div>'
        + '</section>';
    }
  }else{
    var pool = wTab === 'phrase' ? PHRASES
             : wTab === 'pattern' ? (WRITING.patterns || [])
             : (WRITING.elevate || []);
    if(wTab === 'phrase'){
      if(wBig !== 'all') pool = pool.filter(function(p){ return p.big === wBig; });
      if(wSub !== 'all') pool = pool.filter(function(p){ return p.sub === wSub; });
    }else if(wTab === 'pattern'){
      if(wBig !== 'all') pool = pool.filter(function(p){ return p.big === wBig; });
    }
    if(q){
      pool = pool.filter(function(p){
        return matchQuery(p.en || '', q)
            || matchQuery(p.cn || '', q)
            || matchQuery(p.big || '', q)
            || matchQuery(p.sub || '', q)
            || matchQuery(p.tip || '', q);
      });
    }
    var pages = Math.max(1, Math.ceil(pool.length / W_PER_PAGE));
    if(wPage >= pages) wPage = pages - 1;
    if(wPage < 0) wPage = 0;
    var slice = pool.slice(wPage * W_PER_PAGE, (wPage + 1) * W_PER_PAGE);
    html += '<section class="card">';
    if(!slice.length){
      html += '<p class="muted" style="margin:0">没有匹配的素材，换个分类或关键词试试。</p>';
    }else{
      html += slice.map(function(p, si){
        var idx = wPage * W_PER_PAGE + si;
        var key = p.en || '';
        var faved = isFavAny(key);
        return '<div class="wp-item">'
          + '<div class="wp-head">'
          +   (p.big ? '<span class="wp-tag">' + escapeHtml(p.big) + '</span>' : '')
          +   (p.sub ? '<span class="wp-tag sub">' + escapeHtml(p.sub) + '</span>' : '')
          +   '<span class="wp-acts">'
          +     '<button class="dict-act" data-speak="' + escapeHtml(key) + '" title="朗读">' + IC('volume') + '</button>'
          +     '<button class="dict-act' + (faved ? ' on' : '') + '" data-fav-ph="' + idx + '" title="收藏">' + IC('star') + '</button>'
          +     '<button class="dict-act" data-wr-ph="' + idx + '" title="加入错题本">' + IC('clipboard') + '</button>'
          +   '</span>'
          + '</div>'
          + '<div class="wp-en">' + escapeHtml(key) + '</div>'
          + (p.cn ? '<div class="wp-cn">' + escapeHtml(p.cn) + '</div>' : '')
          + (p.tip ? '<div class="wp-tip">' + IC('bulb') + ' ' + escapeHtml(p.tip) + '</div>' : '')
          + '</div>';
      }).join('');
      if(pages > 1){
        html += '<div class="pager">'
          + '<button class="btn sm" id="wPrev"' + (wPage === 0 ? ' disabled style="opacity:.4"' : '') + '>' + IC('left') + ' 上一页</button>'
          + '<span>' + (wPage + 1) + ' / ' + pages + ' · 共 ' + pool.length + ' 条</span>'
          + '<button class="btn sm" id="wNext"' + (wPage >= pages - 1 ? ' disabled style="opacity:.4"' : '') + '>下一页 ' + IC('right') + '</button>'
          + '</div>';
      }
    }
    html += '</section>';
  }
  app.innerHTML = html;

  var inp = $('#wSearch');
  if(inp){
    inp.focus();
    try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){}
    bindSearchInput(inp, function(v){ wQuery = v; wPage = 0; render(); }, 220);

  $$('#wBig .chip').forEach(function(b){ b.onclick = function(){ wBig = b.dataset.b; wSub = 'all'; wPage = 0; render(); }; });

  var wn = $('#wNext'); if(wn && !wn.disabled) wn.onclick = function(){ wPage++; render(); };
  $$('[data-speak]').forEach(function(b){ b.onclick = function(ev){ ev.stopPropagation(); speak(b.dataset.speak, 'en'); }; });
  $$('[data-fav-ph]').forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var p = pool[+b.dataset.favPh];
      if(!p) return;
      if(wTab === 'phrase') toggleFavPhrase(p);

  $$('[data-wr-ph]').forEach(function(b){

  $$('[data-fav-tpl]').forEach(function(b){
    b.onclick = function(){

      if(!t) return;
      var en = (t.parts || []).map(function(x){ return x.en || ''; }).join('\n');

      render();
    };
  });
}

/* ============================================================
   导出打印
   ============================================================ */
var printOpts = { mode:'excel', direction:'cn2en', count:20, scope:['current'], levels:['current'] };
var printPreview = null, printKey = '';
var printCustom = null; /* 从选择器手工选定的打印词列表（词对象数组），非空时覆盖范围/层级 */
function printSig(){
  return [printOpts.mode, printOpts.direction, printOpts.count,
          printOpts.scope.join(','), printOpts.levels.join(','),
          S.level, S.batch.length, S.wrong.length, S.favs.length,
          printCustom ? 'C' + printCustom.length : ''].join('|');
}
function scopePool(k){
  if(k === 'current') return S.batch.map(findWord).filter(Boolean);
  if(k === 'wrong')   return uniqueWrongWords();
  if(k === 'favs')    return S.favs.filter(function(f){ return f.type === 'word'; }).map(function(f){ return findWord(f.key); }).filter(Boolean);
  if(k === 'ok')      return ALL_WORDS.filter(function(w){ return wordStat(w.w) === 'ok'; });
  if(k === 'new')     return ALL_WORDS.filter(function(w){ return wordStat(w.w) === 'new'; });
  return ALL_WORDS.slice();
}
/* 多选范围：并集去重 */
function scopePoolMulti(keys){
  var out = [], seen = {};
  (keys && keys.length ? keys : ['all']).forEach(function(k){
    scopePool(k).forEach(function(w){
      var kk = w.w.toLowerCase();
      if(seen[kk]) return;
      seen[kk] = 1;
      out.push(w);
    });
  });
  return out;
}
/* 多选层级：并集去重 */
function levelSet(keys){
  var set = {};
  (keys || []).forEach(function(k){
    if(k === 'current'){ curWords().forEach(function(w){ set[w.w.toLowerCase()] = 1; }); }
    else if(DATA[k]){ DATA[k].words.forEach(function(w){ set[w.w.toLowerCase()] = 1; }); }
  });
  return set;
}

var MEDIA_FILTER = { q:'', genre:'all', sub:'all', level:'all', decade:'all', sort:'year', mkind:'all', fav:false };
var MEDIA_LV_NAME = { 1:'入门', 2:'轻松', 3:'进阶', 4:'挑战', 5:'硬核' };
var curMedia = null;

function mediaKindOf(k){ return k === 'book' ? 'book' : 'film'; }
function mediaKindName(k){ return k === 'book' ? '文学作品' : '影视作品'; }
function mediaKindUnit(k){ return k === 'book' ? '本' : '部'; }
function openMedia(kind, t){
  curMedia = { kind:mediaKindOf(kind), t:t };
  view = 'mediaDetail';
  render();
  window.scrollTo(0, 0);
}
function mediaFind(kind, t){
  var arr = mediaList(mediaKindOf(kind));
  for(var i = 0; i < arr.length; i++) if(arr[i].t === t) return arr[i];
  return null;
}
function mdEscape(s){ return escapeHtml(String(s == null ? '' : s)); }
function mdPoster(m){
  var ch = String(m.t || '?').replace(/^(the|a|an)\s+/i, '').charAt(0) || '?';
  return '<div class="md-poster">' + mdEscape(ch) + '</div>';
}
function mdLevel(m){
  var lv = mediaLevel(m), h = '';
  for(var i = 1; i <= 5; i++) h += '<i class="' + (i <= lv ? 'on' : '') + '"></i>';
  return '<span class="md-lv" title="学习难度 ' + lv + '/5 · ' + (MEDIA_LV_NAME[lv] || '') + '">' + h + '</span>';
}
function mdChips(m, kind){
  var out = [];
  if(kind === 'film') out.push(m.kind === 'series' ? '剧集' : '电影');
  out.push(m.genre);
  (m.sub || []).slice(0, 2).forEach(function(s){ out.push(s); });
  return out.filter(Boolean).map(function(s, i){
    return '<span class="md-chip' + (i === 0 && kind === 'book' ? ' g' : '') + '">' + mdEscape(s) + '</span>';
  }).join('');
}
function mdCard(m, kind){
  var fav = isMediaFav(kind, m.t);
  var noteN = getNotes(kind, m.t).length;
  return '<article class="md-card" data-md="' + mdEscape(m.t) + '">'
    +   '<div class="md-top">'
    +     mdPoster(m)
    +     '<div class="md-h">'
    +       '<div class="md-t">' + mdEscape(m.t) + '</div>'
    +       '<div class="md-cn">' + mdEscape(m.cn || '') + (m.a ? ' · ' + mdEscape(m.a) : '') + '</div>'
    +       '<div class="md-meta" style="margin-top:6px">'
    +         mdChips(m, kind)
    +         '<span class="md-chip">' + (m.y || '—') + '</span>'
    +         mdLevel(m)
    +       '</div>'
    +       '<div class="md-meta" style="margin-top:5px">'
    +         '<span>' + mdEscape(mediaLenLabel(m)) + '</span>'
    +         (noteN ? '<span class="md-chip g">观后感 ' + noteN + '</span>' : '')
    +       '</div>'
    +     '</div>'
    +     '<div class="md-acts">'
    +       '<button class="dict-act' + (fav ? ' on' : '') + '" data-mfav="' + mdEscape(m.t) + '" title="收藏">' + IC('star') + '</button>'
    +     '</div>'
    +   '</div>'
    +   (m.note ? '<div class="md-note">' + mdEscape(m.note) + '</div>' : '')
    +   '<div class="md-links">'
    +     '<a class="md-link" data-mopen="' + mdEscape(m.t) + '">' + IC('info') + ' 查看详情</a>'
    +     '<a class="md-link" data-mnote="' + mdEscape(m.t) + '">' + IC('pen') + ' 写观后感</a>'
    +   '</div>'
    + '</article>';
}
function mediaFiltered(kind){
  var F = MEDIA_FILTER;
  return sortMedia(filterMedia(kind, {
    q:F.q, kind:F.mkind, genre:F.genre, sub:F.sub, level:F.level, decade:F.decade, fav:F.fav
  }), F.sort);
}
function renderMedia(app, kind){
  kind = mediaKindOf(kind);
  var F = MEDIA_FILTER;
  var all = mediaList(kind);
  var list = mediaFiltered(kind);
  var genres = mediaGenres(kind);
  var subs = F.genre === 'all' ? mediaSubs(kind, 'all') : mediaSubs(kind, F.genre);
  var decades = mediaDecades(kind);
  var unit = mediaKindUnit(kind);

  var html =
      '<section class="card">'
    +   '<div class="md-toolbar">'
    +     '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'
    +       '<h2 class="h2" style="margin:0">' + mediaKindName(kind) + '库 <span class="hint">共 ' + all.length + ' ' + unit + '</span></h2>'
    +       '<div class="chips">'
    +         '<button class="chip' + (F.fav ? ' on' : '') + '" data-mfavonly="1">' + IC('star') + ' 收藏 ' + mediaFavCount(kind) + '</button>'
    +       '</div>'
    +     '</div>'
    +     '<div class="search-wrap"><span class="si">' + IC('search') + '</span>'
    +       '<input class="search-input" id="mdQ" placeholder="搜索名称、作者、类型或子类…" value="' + mdEscape(F.q) + '" autocomplete="off" spellcheck="false">'
    +       searchModeToggleHTML('mdQ') + '</div>';

  if(kind === 'film'){
    html += '<div class="chips">'
      + [['all','全部'], ['movie','电影'], ['series','剧集']].map(function(p){
          return '<button class="chip' + (F.mkind === p[0] ? ' on' : '') + '" data-mkind="' + p[0] + '">' + p[1] + '</button>';
        }).join('')
      + '</div>';
  }
  html += '<div class="chips">'
    +   '<button class="chip' + (F.genre === 'all' ? ' on' : '') + '" data-mgenre="all">全部类型</button>'
    +   genres.map(function(g){
          return '<button class="chip' + (F.genre === g ? ' on' : '') + '" data-mgenre="' + mdEscape(g) + '">' + mdEscape(g) + '</button>';
        }).join('')
    + '</div>';
  if(subs.length > 1){

            return '<button class="chip' + (F.sub === s ? ' on' : '') + '" data-msub="' + mdEscape(s) + '">' + mdEscape(s) + '</button>';
          }).join('')
      + '</div>';
  }
  html += '<div class="chips">'
    +   '<button class="chip' + (F.level === 'all' ? ' on' : '') + '" data-mlevel="all">全部难度</button>'
    +   [1,2,3,4,5].map(function(l){
          return '<button class="chip' + (String(F.level) === String(l) ? ' on' : '') + '" data-mlevel="' + l + '">' + MEDIA_LV_NAME[l] + '</button>';
        }).join('')
    + '</div>';
  if(decades.length > 1){
    html += '<div class="chips">'
      +   '<button class="chip' + (F.decade === 'all' ? ' on' : '') + '" data-mdec="all">全部年代</button>'
      +   decades.slice(0, 14).map(function(d){
            return '<button class="chip' + (String(F.decade) === String(d) ? ' on' : '') + '" data-mdec="' + d + '">' + d + 's</button>';
          }).join('')
      + '</div>';
  }
  html += '<div class="chips">'
    +   '<span class="muted" style="align-self:center;margin-right:2px">排序</span>'
    +   MEDIA_SORTS.map(function(s){
          return '<button class="chip' + (F.sort === s.k ? ' on' : '') + '" data-msort="' + s.k + '">' + IC(s.ic) + ' ' + s.label + '</button>';
        }).join('')
    + '</div>'
    +   '</div>'
    + '</section>';

  if(!list.length){
    html += '<div class="card empty-box">'
      + '<div class="done-icon">' + IC(kind === 'book' ? 'library' : 'film') + '</div>'
      + '<h2 class="h2" style="font-size:var(--fs-lg);justify-content:center;display:flex">没有符合条件的作品</h2>'
      + '<p class="muted">试着放宽筛选条件，或者清空搜索词。</p>'
      + '<button class="btn sm" id="mdClear">清空筛选</button>'
      + '</div>';
  }else{
    html += '<section class="card">'
      + '<div class="md-meta" style="margin-bottom:10px">'
      +   '<span>筛选结果：共 <b style="color:var(--accent)">' + list.length + '</b> ' + unit + '</span>'
      +   (F.q ? '<span class="md-chip">搜索「' + mdEscape(F.q) + '」</span>' : '')
      +   (F.genre !== 'all' ? '<span class="md-chip">' + mdEscape(F.genre) + '</span>' : '')
      +   (F.sub !== 'all' ? '<span class="md-chip">' + mdEscape(F.sub) + '</span>' : '')
      +   (F.level !== 'all' ? '<span class="md-chip">难度 ' + MEDIA_LV_NAME[F.level] + '</span>' : '')
      +   (F.decade !== 'all' ? '<span class="md-chip">' + F.decade + 's</span>' : '')
      +   (F.fav ? '<span class="md-chip g">仅收藏</span>' : '')

      + '</div>'
      + '<div class="md-grid">' + list.map(function(m){ return mdCard(m, kind); }).join('') + '</div>'
      + '</section>';
  }
  app.innerHTML = html;

  function rerender(){ render(); }

  var qi = $('#mdQ');
  bindSearchInput(qi, function(v){
    MEDIA_FILTER.q = v;
    var pos = qi.selectionStart;
    render();
    var nq = $('#mdQ');
    if(nq){ nq.focus(); try{ nq.setSelectionRange(pos, pos); }catch(e){} }
  }, 320);
  $('#mdQMode').onclick = function(){
    toggleSearchMode('mdQ', function(v){
      MEDIA_FILTER.q = v;
      render();
      var nq = $('#mdQ');
      if(nq){ nq.focus(); try{ nq.setSelectionRange(nq.value.length, nq.value.length); }catch(e){} }
    });
  };
  $$('[data-mgenre]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.genre = b.dataset.mgenre; MEDIA_FILTER.sub = 'all'; rerender(); }; });
  $$('[data-msub]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.sub = b.dataset.msub; rerender(); }; });
  $$('[data-mlevel]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.level = b.dataset.mlevel; rerender(); }; });
  $$('[data-mdec]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.decade = b.dataset.mdec; rerender(); }; });
  $$('[data-msort]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.sort = b.dataset.msort; rerender(); }; });
  $$('[data-mkind]').forEach(function(b){ b.onclick = function(){ MEDIA_FILTER.mkind = b.dataset.mkind; rerender(); }; });

  if(clr) clr.onclick = doClear;
  if(clr2) clr2.onclick = doClear;
  $$('[data-mfav]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      toggleMediaFav(kind, b.dataset.mfav);
      rerender();
    };
  });
  $$('[data-mopen]').forEach(function(b){ b.onclick = function(){ openMedia(kind, b.dataset.mopen); }; });
  $$('[data-mnote]').forEach(function(b){ b.onclick = function(){ openMedia(kind, b.dataset.mnote); }; });
  $$('.md-card').forEach(function(c){
    c.onclick = function(e){
      if(e.target.closest('button') || e.target.closest('a')) return;
      openMedia(kind, c.dataset.md);
    };
  });
}

/* ============================================================
   11. 每日打卡
   ============================================================ */
var ciYM = null;                      /* {y, m} 当前查看的月份 */
var ciStyle = 'light';
var CI_STYLES = [
  { k:'light', name:'简约白', bg:'#ffffff', fg:'#1f2937', sub:'#6b7280', ac:'#0ea5e9', card:'#f1f5f9', line:'#e5e7eb' },
  { k:'blue',  name:'渐变蓝', bg:'#0ea5e9', fg:'#ffffff', sub:'#e0f2fe', ac:'#ffffff', card:'#38bdf8', line:'#7dd3fc', grad:['#0ea5e9','#6366f1'] },
  { k:'dark',  name:'暗夜黑', bg:'#111827', fg:'#f9fafb', sub:'#9ca3af', ac:'#38bdf8', card:'#1f2937', line:'#374151' },
  { k:'green', name:'清新绿', bg:'#f0fdf4', fg:'#14532d', sub:'#4d7c0f', ac:'#16a34a', card:'#dcfce7', line:'#bbf7d0' },
  { k:'pink',  name:'暖粉',   bg:'#fff1f2', fg:'#881337', sub:'#be185d', ac:'#f43f5e', card:'#ffe4e6', line:'#fecdd3' }
];
function ciStyleOf(k){
  for(var i = 0; i < CI_STYLES.length; i++) if(CI_STYLES[i].k === k) return CI_STYLES[i];
  return CI_STYLES[0];
}
function ciFont(px, bold){ return (bold ? 'bold ' : '') + px + 'px "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif'; }
function ciRound(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);   ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);   ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);       ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function ciFillRound(ctx, x, y, w, h, r, color){ ctx.fillStyle = color; ciRound(ctx, x, y, w, h, r); ctx.fill(); }
/* 打卡强度：按当天单词数分 1~4 级 */
function ciLevel(words){
  if(!words) return 0;
  if(words < 10) return 1;
  if(words < 30) return 2;
  if(words < 60) return 3;
  return 4;
}
/* 把「连续打卡 / 统计 / 日历」画到任意 canvas 上，scale 控制输出尺寸 */
function ciHexA(hex, a){
  var h = String(hex || '#000000').replace('#', '');
  if(h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
  var n = parseInt(h, 16);
  if(isNaN(n)) return hex;
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function ciDraw(cv, styleKey, scale){
  var W = 720, H = 1080;
  scale = scale || 1;
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  var st = ciStyleOf(styleKey);
  var s = checkinStats();
  var today = new Date();
  var dateStr = today.getFullYear() + ' 年 ' + (today.getMonth() + 1) + ' 月 ' + today.getDate() + ' 日';

  if(st.grad){
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, st.grad[0]);
    g.addColorStop(1, st.grad[1]);
    ctx.fillStyle = g;
  }else{
    ctx.fillStyle = st.bg;
  }
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText('聚合英语 · 每日打卡', 56, 76);
  ctx.textAlign = 'right';
  ctx.fillText(dateStr, W - 56, 76);
  ctx.textAlign = 'left';

  /* 主视觉：连续打卡天数 */
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(120, true);
  ctx.fillText(String(s.cur), 52, 236);
  var nw = ctx.measureText(String(s.cur)).width;
  ctx.font = ciFont(34, false);
  ctx.fillStyle = st.sub;
  ctx.fillText('天', 52 + nw + 14, 236);
  ctx.font = ciFont(28, true);
  ctx.fillStyle = st.ac;
  ctx.fillText(s.cur > 0 ? '连续打卡中' : '今天开始吧', 56, 284);

  /* 四宫格统计 */
  var cells = [
    ['累计天数', s.days + ' 天'],
    ['累计单词', s.words + ' 词'],
    ['学习时长', fmtDuration(s.seconds)],
    ['正确率', (s.total ? Math.round(s.correct / s.total * 100) : 0) + '%']
  ];
  var cw = (W - 112 - 18) / 2, ch = 98;
  cells.forEach(function(c, i){
    var x = 56 + (i % 2) * (cw + 18);
    var y = 322 + Math.floor(i / 2) * (ch + 16);
    ciFillRound(ctx, x, y, cw, ch, 20, st.card);
    ctx.fillStyle = st.fg;
    ctx.font = ciFont(36, true);
    ctx.fillText(c[1], x + 24, y + 54);
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(19, false);
    ctx.fillText(c[0], x + 24, y + 82);
  });

  /* 今日 */
  ciFillRound(ctx, 56, 556, W - 112, 66, 18, st.card);
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(23, true);
  ctx.fillText('今日', 80, 597);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText(s.todayData.words + ' 词 · ' + fmtDuration(s.todayData.seconds)
    + ' · 答题 ' + s.todayData.total + ' 次', 152, 597);

  /* 本月日历热力图 */
  var ym = ciYM || { y:today.getFullYear(), m:today.getMonth() };
  var cellsM = checkinMonth(ym.y, ym.m);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText(ym.y + ' 年 ' + (ym.m + 1) + ' 月', 56, 674);
  var heads = ['一','二','三','四','五','六','日'];
  var cell = 50, gap = 6;
  var gx = (W - (cell * 7 + gap * 6)) / 2, gy = 712;
  ctx.font = ciFont(18, false);
  ctx.fillStyle = st.sub;
  ctx.textAlign = 'center';
  heads.forEach(function(h, i){ ctx.fillText(h, gx + i * (cell + gap) + cell / 2, gy - 12); });
  ctx.textAlign = 'left';
  var alphas = { 0:0, 1:0.26, 2:0.5, 3:0.76, 4:1 };
  cellsM.forEach(function(c, i){
    var col = i % 7, row = Math.floor(i / 7);
    var x = gx + col * (cell + gap), y = gy + row * (cell + gap);
    if(c.blank) return;
    var lv = ciLevel(c.active ? (S.checkin[c.k] || {}).words : 0);
    ciFillRound(ctx, x, y, cell, cell, 9, lv ? ciHexA(st.ac, alphas[lv]) : ciHexA(st.line, 0.7));
    if(c.today){
      ctx.strokeStyle = st.fg; ctx.lineWidth = 2.2;
      ciRound(ctx, x + 1.2, y + 1.2, cell - 2.4, cell - 2.4, 8); ctx.stroke();
    }
  });

  /* 二维码：扫码打开本站（配色跟随主题） */
  try{
    var qrSide = 108, qrX = W - 56 - qrSide, qrY = H - 56 - 24 - qrSide;
    var qrC = qrThemeColors();
    ciFillRound(ctx, qrX - 9, qrY - 9, qrSide + 18, qrSide + 18, 12, '#ffffff');
    ctx.strokeStyle = qrC.dark; ctx.lineWidth = 2;
    ciRound(ctx, qrX - 9, qrY - 9, qrSide + 18, qrSide + 18, 12); ctx.stroke();
    qrDraw(ctx, siteUrl(), qrX, qrY, qrSide, { quiet:1, dark:qrC.dark, light:'#ffffff' });
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(15, false);
    ctx.textAlign = 'right';
    ctx.fillText('扫码打开', qrX + qrSide, qrY - 16);
    ctx.textAlign = 'left';
  }catch(e){}

  ctx.fillStyle = st.sub;
  ctx.font = ciFont(19, false);
  ctx.fillText(s.max > 0 ? '最长连续 ' + s.max + ' 天 · 累计 ' + s.days + ' 天' : '坚持每天学一点，进步看得见', 56, 1066);
  ctx.textAlign = 'right';
  ctx.fillText('v' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '3.0'), W - 56, 1066);
  ctx.textAlign = 'left';
  return cv;
}

function libStamp(){

/* 把内部词条转成紧凑数组形式 */
function libPackEntry(w){
  var ex = (w.ex || []).map(function(g){ return [g.t || '', g.tr || '', g.s || '例句']; });
  return [w.w, w.p || '', w.m || '', ex];
}
function libExportObj(scope){
  var libs = [];
  if(scope === 'default' || scope === 'all'){
    var words = [];

    visibleLevels().forEach(function(k){
      if(k === 'user' || !DATA[k]) return;
      DATA[k].words.forEach(function(w){
        var kk = w.w.toLowerCase();
        if(seen[kk]) return;
        seen[kk] = 1;
        words.push(libPackEntry(w));
      });
    });
    libs.push({ name:'内置词库', sys:true, count:words.length, items:words });
  }
  if(scope === 'user' || scope === 'all'){
    S.libs.forEach(function(L){
      libs.push({ name:L.name, time:L.time, count:(L.items || []).length, items:L.items || [] });
    });

function libSaveFile(name, text){
  try{
    var blob = new Blob([text], { type:'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('已导出 ' + name);
  }catch(e){
    toast('导出失败：' + e.message);
  }
}
/* 兼容多种 JSON 形状，返回 [{name, items}] */
function libParseJSON(text){
  var obj;
  try{ obj = JSON.parse(text); }
  catch(e){ throw new Error('不是合法的 JSON 文件'); }
  var out = [];
  function pushLib(name, arr){ var it = libNormalize(arr); if(it.length) out.push({ name:name || '导入词库', items:it }); }
  function scanList(list, name){ pushLib(name, list); }

  if(Array.isArray(obj)){
    pushLib('导入词库', obj);
  }else if(obj && obj.libs && Array.isArray(obj.libs)){
    obj.libs.forEach(function(L){ pushLib(L.name, L.items || L.words || L.list || []); });
  }else if(obj && obj.BANK){
    Object.keys(obj.BANK).forEach(function(k){
      var b = obj.BANK[k];
      if(b && Array.isArray(b.list)) pushLib((b.name || k), b.list);
    });
  }else if(obj && obj.name){
    scanList(obj.items || obj.words || obj.list || [], obj.name);
  }else if(obj && typeof obj === 'object'){
    scanList(obj.items || obj.words || obj.list || [], '导入词库');
  }
  if(!out.length) throw new Error('没有解析到任何单词');
  return out;
}
/* 单条词目归一化：[单词, 音标, 释义, [[en,cn,src],…]] */
function libNormalizeEntry(e){
  var w = '', p = '', m = '', raw = [];
  if(Array.isArray(e)){
    w = e[0] || ''; p = e[1] || ''; m = e[2] || ''; raw = e[3] || [];
  }else if(e && typeof e === 'object'){
    w = e.w || e.word || e.en || e.t || '';
    p = e.p || e.phonetic || e.ipa || e.pron || '';
    m = e.m || e.meaning || e.cn || e.tr || e.def || '';
    raw = e.ex || e.examples || e.e || [];
  }
  w = String(w).trim();
  if(!w || !/[A-Za-z]/.test(w)) return null;
  if(w.length > 48) return null;
  m = String(m).trim();
  var ex = [];
  if(Array.isArray(raw)){
    raw.forEach(function(g){
      if(Array.isArray(g) && g[0]){
        ex.push([String(g[0]).trim(), String(g[1] || '').trim(), String(g[2] || '例句').trim() || '例句']);
      }else if(g && typeof g === 'object' && (g.t || g.en || g.s)){
        ex.push([String(g.t || g.en || '').trim(), String(g.tr || g.cn || '').trim(), String(g.s || '例句').trim() || '例句']);
      }
    });
  }
  ex = ex.filter(function(g){ return g[0]; }).slice(0, 3);
  if(!ex.length) ex = [['', '', '例句']];
  return [w, String(p).trim(), m, ex];
}
function libNormalize(arr){
  var out = [], seen = {};
  (arr || []).forEach(function(e){
    var v = libNormalizeEntry(e);
    if(!v) return;
    var k = v[0].toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    out.push(v);
  });
  out.sort(function(a, b){ return a[0].toLowerCase().localeCompare(b[0].toLowerCase(), 'en'); });
  return out;
}
function libImportText(text, fileName){
  var libs = libParseJSON(text);
  var added = 0;
  libs.forEach(function(L, i){
    var name = String(L.name || '').trim() || (fileName || '导入词库');
    if(libs.length > 1 && L.name) name = L.name;
    else if(!L.name || L.name === '导入词库') name = (fileName || '导入词库');
    if(libs.length > 1) name = String(L.name || name);
    var id = 'lib' + Date.now().toString(36) + i;
    S.libs.push({ id:id, name:name, time:Date.now(), items:L.items });
    if(S.activeLibs.indexOf(id) < 0) S.activeLibs.push(id);
    added += L.items.length;
  });
  save();
  applyUserLibs();
  return { libs:libs.length, words:added };
}
function libReadFile(file, done){
  if(!file) return;
  if(file.size > 12 * 1024 * 1024){ uiAlert('文件太大了（上限 12 MB）。', '导入失败'); return; }
  var fr = new FileReader();
  fr.onload = function(){ done(String(fr.result || ''), file.name); };
  fr.onerror = function(){ uiAlert('文件读取失败，请重试。', '导入失败'); };
  fr.readAsText(file, 'utf-8');
}
function libDoImport(file){
  libReadFile(file, function(text, name){
    var base = String(name || '导入词库').replace(/\.json$/i, '');
    try{
      var r = libImportText(text, base);
      uiAlert('成功导入 ' + r.libs + ' 个词库，共 ' + r.words + ' 个单词。\n已自动启用，可切换到「我的词库」学段学习。', '导入完成');
      render();
    }catch(e){
      uiAlert(e.message, '导入失败');
    }
  });
}

/* ============================================================
   用户导入的附表：谚语 / 不规则动词 / 比较级
   —— S.extras 里的内容写回全局表，新增一个「我的」分类
   ============================================================ */
function applyExtras(){
  var ex = S.extras || { proverb:[], irregular:[], compare:[] };
  var pv = (ex.proverb   || []).slice();
  var ir = (ex.irregular || []).slice();
  var cp = (ex.compare   || []).slice();
  PROVERBS.user     = pv;
  IRREGULAR.user    = ir;
  COMPARATIVES.user = cp;
  if((pv.length || ir.length || cp.length) && !LV_TABS.some(function(t){ return t.k === 'user'; })){
    LV_TABS.push({ k:'user', name:'我的', ic:'user' });
  }
}
function extraCount(){
  var ex = S.extras || {};
  return (ex.proverb || []).length + (ex.irregular || []).length + (ex.compare || []).length;
}

/* ============================================================
   分类导出 / 分类导入
   ============================================================ */
var LIB_CAT_PICK = {};
function libCatDefs(){
  var out = [];
  /* LEVELS 里自带一个 'user' 档（名字也叫「我的词库」），这里跳过它，
     改由下面 kind:'lib' 的条目统一承担自建词库的导出，避免出现两个同名分类 */
  LEVELS.forEach(function(k){
    if(k === 'user') return;
    out.push({ k:k, kind:'level', n:LEVEL_NAME(k) || k });
  });
  out.push({ k:'user',      kind:'lib',       n:'我的词库' });
  out.push({ k:'proverb',   kind:'proverb',   n:'谚语' });
  out.push({ k:'irregular', kind:'irregular', n:'不规则动词' });
  out.push({ k:'compare',   kind:'compare',   n:'比较级·最高级' });
  return out;
}
function libCatCount(d){
  if(d.kind === 'level') return (DATA[d.k] && DATA[d.k].words) ? DATA[d.k].words.length : 0;
  if(d.kind === 'lib'){
    var n = 0;
    S.libs.forEach(function(L){ n += (L.items || []).length; });
    return n;
  }
  if(d.kind === 'proverb')   return getAllProverbsUnique().length;
  if(d.kind === 'irregular') return getAllIrregular().length;
  if(d.kind === 'compare')   return getAllComparatives().length;
  return 0;
}
/* 单个分类 → 一个或多个 section */
function libCatSections(d){
  var out = [];
  if(d.kind === 'level'){
    var words = (DATA[d.k] && DATA[d.k].words) ? DATA[d.k].words : [];
    out.push({ kind:'level', key:d.k, name:d.n, count:words.length, items:words.map(libPackEntry) });
  }else if(d.kind === 'lib'){
    S.libs.forEach(function(L){
      out.push({ kind:'lib', key:L.id, name:L.name, count:(L.items || []).length, items:L.items || [] });
    });
  }else if(d.kind === 'proverb'){
    var pv = getAllProverbsUnique().map(function(p){ return { en:p.en, cn:p.cn, tag:p.tag || '' }; });
    out.push({ kind:'proverb', key:'proverb', name:'谚语', count:pv.length, items:pv });
  }else if(d.kind === 'irregular'){
    var ir = getAllIrregular().map(function(v){ return { b:v.b, p:v.p, pp:v.pp, cn:v.cn }; });
    out.push({ kind:'irregular', key:'irregular', name:'不规则动词', count:ir.length, items:ir });
  }else if(d.kind === 'compare'){
    var cp = getAllComparatives().map(function(v){ return { b:v.b, c:v.c, s:v.s, cn:v.cn }; });
    out.push({ kind:'compare', key:'compare', name:'比较级·最高级', count:cp.length, items:cp });
  }
  return out;
}
/* keys 为 null 时导出全部分类 */
function libExportBundle(keys){
  var defs = libCatDefs();
  var secs = [];
  defs.forEach(function(d){
    if(keys && keys.indexOf(d.k) < 0) return;

  });

    app:'聚合英语 · 分类导出',
    version:2,

    sections:secs
  };
}

/* 分类包 → 写回状态；返回统计 */
function libApplyBundle(obj){
  var secs = obj.sections || [];
  var stat = { words:0, libs:0, proverb:0, irregular:0, compare:0, skip:0 };
  var ex = S.extras || (S.extras = { proverb:[], irregular:[], compare:[] });
  secs.forEach(function(s, i){
    var kind = s.kind, items = s.items || [];
    if(kind === 'level' || kind === 'lib'){
      var it = libNormalize(items);
      if(!it.length){ stat.skip++; return; }
      var id = 'lib' + Date.now().toString(36) + i;
      var nm = String(s.name || '导入词库').trim() || '导入词库';
      if(kind === 'level') nm = nm + '·导入';
      S.libs.push({ id:id, name:nm, time:Date.now(), items:it });
      if(S.activeLibs.indexOf(id) < 0) S.activeLibs.push(id);
      stat.libs++; stat.words += it.length;
    }else if(kind === 'proverb'){
      var have = {};
      ex.proverb.forEach(function(p){ have[String(p.en || '').toLowerCase()] = 1; });
      items.forEach(function(p){
        if(!p || !p.en) return;
        var k = String(p.en).toLowerCase();
        if(have[k]) return;
        have[k] = 1;
        ex.proverb.push({ en:String(p.en), cn:String(p.cn || ''), tag:String(p.tag || '') });
        stat.proverb++;
      });
    }else if(kind === 'irregular'){
      var hi = {};
      ex.irregular.forEach(function(v){ hi[String(v.b || '').toLowerCase()] = 1; });
      items.forEach(function(v){
        if(!v || !v.b) return;
        var k = String(v.b).toLowerCase();
        if(hi[k]) return;
        hi[k] = 1;
        ex.irregular.push({ b:String(v.b), p:String(v.p || ''), pp:String(v.pp || ''), cn:String(v.cn || '') });
        stat.irregular++;
      });
    }else if(kind === 'compare'){
      var hc = {};
      ex.compare.forEach(function(v){ hc[String(v.b || '').toLowerCase()] = 1; });
      items.forEach(function(v){
        if(!v || !v.b) return;
        var k = String(v.b).toLowerCase();
        if(hc[k]) return;
        hc[k] = 1;
        ex.compare.push({ b:String(v.b), c:String(v.c || ''), s:String(v.s || ''), cn:String(v.cn || '') });
        stat.compare++;
      });
    }else{
      stat.skip++;
    }
  });
  save();
  applyExtras();
  applyUserLibs();
  return stat;
}
function libImportAnyText(text, fileName){

    var st = libApplyBundle(obj);
    var msg = [];
    if(st.words)     msg.push(st.libs + ' 个词库 / ' + st.words + ' 个单词');
    if(st.proverb)   msg.push('谚语 ' + st.proverb + ' 条');
    if(st.irregular) msg.push('不规则动词 ' + st.irregular + ' 个');
    if(st.compare)   msg.push('比较级 ' + st.compare + ' 个');
    if(!msg.length) throw new Error('文件中没有可导入的内容');
    return { bundle:true, text:'成功导入 ' + msg.join(' · ') + '。\n导入的词库已自动启用，可在「我的词库」中查看。' };

/* ---------- 站点地址（二维码用，恒为当前页面地址） ---------- */
function siteUrl(){
  try{ return location.href.split('#')[0].split('?')[0]; }catch(e){ return ''; }
}
function siteUrlLabel(){
  var u = siteUrl();
  if(!u) return '';
  try{
    var a = document.createElement('a');
    a.href = u;
    if(a.protocol === 'file:'){
      var seg = a.pathname.split('/');
      var last = decodeURIComponent(seg[seg.length - 1] || '');
      return last ? '本地文件 · ' + last : '本地文件';
    }
    return a.host + (a.pathname && a.pathname !== '/' ? a.pathname : '');
  }catch(e){ return u.slice(0, 48); }
}
function siteUrlIsRemote(){
  var u = siteUrl();
  return /^https?:\/\//i.test(u);
}

/* ---------- 自动夜间模式 ---------- */
function hmToMin(hm){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || ''));
  if(!m) return -1;
  var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
  if(h > 23 || mi > 59) return -1;
  return h * 60 + mi;
}
function autoDarkWant(dt){
  var st = S.settings;
  if(!st || !st.autoDark) return null;
  var a = hmToMin(st.darkStart), b = hmToMin(st.darkEnd);
  if(a < 0) a = 19 * 60;
  if(b < 0) b = 7 * 60;
  dt = dt || new Date();
  var now = dt.getHours() * 60 + dt.getMinutes();
  if(a === b) return null;
  /* 起 > 止 表示跨零点（19:00 → 07:00） */
  return a < b ? (now >= a && now < b) : (now >= a || now < b);
}
var _autoDarkLast = null;
function autoDarkTick(force){
  var want = autoDarkWant();
  if(want === null){
    _autoDarkLast = null;
    return;
  }
  if(!force && want === _autoDarkLast) return;
  _autoDarkLast = want;
  if(S.dark === want) return;
  S.dark = want;
  save();
  applyTheme();
  if(typeof view !== 'undefined' && (view === 'settings' || view === 'me' || view === 'home')) render();
}
function autoDarkLabel(){
  var st = S.settings;
  if(!st || !st.autoDark) return '关闭';
  return (st.darkStart || '19:00') + ' → ' + (st.darkEnd || '07:00');
}

function envDismissed(kind){
  try{
    var raw = localStorage.getItem(ENV_KEY);
    if(!raw) return false;
    var o = JSON.parse(raw) || {};
    if(kind === 'edge'){
      /* Edge 收藏提醒 30 天内只提示一次 */
      return !!o.edge && (Date.now() - o.edge) < 30 * 864e5;
    }
    return !!o[kind];
  }catch(e){ return false; }
}
function envDismiss(kind){
  try{
    var raw = localStorage.getItem(ENV_KEY);
    var o = {};
    try{ o = JSON.parse(raw) || {}; }catch(e2){ o = {}; }
    o[kind] = (kind === 'edge') ? Date.now() : 1;
    localStorage.setItem(ENV_KEY, JSON.stringify(o));
  }catch(e){}
}

var mfKind = 'all';        /* all | prefix | suffix | root */
var mfPOS = 'all';         /* all | n | v | adj | adv */
var mfQuery = '';
var mfOpen = {};           /* 折叠状态 */
var _mfCache = null;

function mfAffixStems(a){
  return String(a).replace(/^[-\u2010-\u2015]+/, '').replace(/[-\u2010-\u2015]+$/, '')
    .split('/').map(function(x){ return x.replace(/[-\u2010-\u2015]+/g, '').toLowerCase(); })
    .filter(function(x){ return x.length >= 2; });
}
function mfPOSOf(w){
  var m = '';
  try{ var e = findWord(w); if(e && e[2]) m = String(e[2]); }catch(err){}
  var mm = /^\s*([a-z]{1,4})\./.exec(m);
  var p = mm ? mm[1] : '';
  if(p === 'vt' || p === 'vi') p = 'v';
  if(!p || ['n','v','adj','adv'].indexOf(p) < 0) p = mfPOSGuess(w);
  return p || '';
}
function mfPOSGuess(w){
  var s = String(w).toLowerCase();
  if(/(ness|ment|tion|sion|ance|ence|ity|ism|ist|ship|hood|dom|age|er|or)$/.test(s)) return 'n';
  if(/(ize|ise|ify|ate)$/.test(s)) return 'v';
  if(/(ful|less|ive|ous|able|ible|al|ent|ant|ic|ish|ary)$/.test(s)) return 'adj';
  if(/ly$/.test(s)) return 'adv';
  return '';

function mfAffixWords(affix, kind){
  var stems = mfAffixStems(affix);
  if(!stems.length) return [];
  var out = [], seen = {};
  function push(w){
    if(!w || seen[w]) return;
    seen[w] = 1; out.push(w);
  }
  var M = window.MORPH || {};
  Object.keys(M).forEach(function(w){
    var e = M[w];
    if(!e) return;
    if(kind === 'suffix' && e.suffix === affix) push(w);
    if(kind === 'prefix' && e.prefix === affix) push(w);
  });
  /* ALL_WORDS 里放的是词条对象 {w,p,m,ex,levels}，必须先取出 .w 再判断拼写 */
  (ALL_WORDS || []).forEach(function(en){
    var w = (en && en.w) ? en.w : en;
    if(!w) return;
    var s = String(w).toLowerCase();
    for(var i = 0; i < stems.length; i++){
      var st = stems[i];
      if(kind === 'suffix' && s.length > st.length + 1 && s.slice(-st.length) === st){ push(w); return; }
      if(kind === 'prefix' && s.length > st.length + 1 && s.slice(0, st.length) === st){ push(w); return; }
    }
  });

}
function mfAffixDesc(a){
  var AM = window.AFFIX_MEANING || {};
  if(AM[a]) return AM[a];
  for(var k in AM){
    if(!Object.prototype.hasOwnProperty.call(AM, k)) continue;
    if(mfAffixStems(k).join('|') === mfAffixStems(a).join('|')) return AM[k];
  }
  return '';
}
function mfBuild(){
  if(_mfCache) return _mfCache;
  var groups = { prefix:{}, suffix:{}, root:{} };
  var M = window.MORPH || {};
  Object.keys(M).forEach(function(w){
    var e = M[w];
    if(!e) return;
    if(e.type === 'derived'){
      var kind = e.prefix ? 'prefix' : (e.suffix ? 'suffix' : '');
      var a = e.prefix || e.suffix;
      if(!kind || !a) return;
      if(!groups[kind][a]) groups[kind][a] = { a:a, kind:kind, desc:mfAffixDesc(a), words:[] };
      if(groups[kind][a].words.indexOf(w) < 0) groups[kind][a].words.push(w);
    }else if(e.type === 'root'){
      if(!groups.root[w]) groups.root[w] = { a:w, kind:'root', desc:'词根', words:[] };
      (e.deriv || []).forEach(function(d){
        if(groups.root[w].words.indexOf(d) < 0) groups.root[w].words.push(d);
      });
    }
  });
  var AM = window.AFFIX_MEANING || {};
  Object.keys(AM).forEach(function(a){
    var kind = a.charAt(0) === '-' ? 'suffix' : (a.charAt(a.length - 1) === '-' ? 'prefix' : '');
    if(!kind) return;
    if(!groups[kind][a]) groups[kind][a] = { a:a, kind:kind, desc:AM[a], words:[] };
  });
  /* 补齐：把词库里真正符合词缀的单词并进来 */
  ['prefix', 'suffix'].forEach(function(kind){
    Object.keys(groups[kind]).forEach(function(a){
      var ws = mfAffixWords(a, kind);
      ws.forEach(function(w){
        if(groups[kind][a].words.indexOf(w) < 0) groups[kind][a].words.push(w);
      });
    });
  });
  Object.keys(groups).forEach(function(kind){
    Object.keys(groups[kind]).forEach(function(a){
      var g = groups[kind][a];
      g.words.sort(function(x, y){ return x < y ? -1 : (x > y ? 1 : 0); });
      g.pos = {};
      g.words.forEach(function(w){
        var p = mfPOSOf(w);
        g.pos[w] = p;
      });
    });
  });

  return groups;
}
function mfAllAffixes(){

}
function mfMatched(){
  var list = mfAllAffixes();
  var q = mfQuery.replace(/^\s+|\s+$/g, '').toLowerCase();
  return list.filter(function(g){
    if(mfKind !== 'all' && g.kind !== mfKind) return false;
    if(q){
      var hit = matchQuery(g.a, q);
      if(!hit){
        for(var i = 0; i < g.words.length; i++){
          if(matchQuery(g.words[i], q)){ hit = true; break; }
        }
      }
      if(!hit) return false;
    }
    if(mfPOS !== 'all'){
      var ok = false;
      for(var j = 0; j < g.words.length; j++){
        if(g.pos[g.words[j]] === mfPOS){ ok = true; break; }
      }
      if(!ok) return false;
    }

  });

var cmpTab = '';

  { t:'多音节词与部分双音节词：前面加 more / most', e:'beautiful → more beautiful → most beautiful' },
  { t:'不规则变化：需要单独记忆', e:'good → better → best；bad → worse → worst' }

function renderCompare(app){

          || matchQuery(v.cn, q);

/* ============================================================
   17. 评价体系（D~S）· 学习报告 · 评价分享图
   ============================================================ */
var GRADE_META = {
  S: { name:'卓越',   color:'#8b5cf6', tip:'准确率与速度都很出色，把节奏保持住。' },
  A: { name:'优秀',   color:'#0ea5e9', tip:'掌握得很稳，可以试试更高的学段。' },
  B: { name:'良好',   color:'#16a34a', tip:'整体不错，把错题再过一遍就更牢了。' },
  C: { name:'及格',   color:'#f59e0b', tip:'基础还在，放慢一点、把例句再读一遍。' },
  D: { name:'待加强', color:'#ef4444', tip:'别急，这一批词重新学一遍再来复习。' }
};
var GRADE_ORDER = ['S', 'A', 'B', 'C', 'D'];
var MODE_NAME = { learn:'学习', review:'复习', wrong:'错题', dictation:'听写', exam:'测验', read:'学习' };

function evalCuts(){
  var c = S.settings && S.settings.evalCuts;
  if(!c || !c.length || c.length < 4) c = [90, 80, 70, 60];
  var out = [];
  for(var i = 0; i < 4; i++){
    var v = parseInt(c[i], 10);
    out.push(isNaN(v) ? [90, 80, 70, 60][i] : v);
  }
  return out;
}
function evalGrade(score){
  var c = evalCuts();
  if(score >= c[0]) return 'S';
  if(score >= c[1]) return 'A';
  if(score >= c[2]) return 'B';
  if(score >= c[3]) return 'C';
  return 'D';
}
function evalGradeMeta(g){ return GRADE_META[g] || GRADE_META.D; }
/* 按「准确率 + 速度」加权求综合分：速度以每题的基准秒数为参照 */
function evalCompute(o){
  o = o || {};
  var n = o.total || 0;
  var acc = n ? Math.round(o.correct / n * 100) : 0;
  var base = (S.settings && S.settings.secPerQ) || 15;
  var avg = n ? (o.sec || 0) / n : 0;
  var sp;
  if(!n || avg <= 0) sp = acc >= 60 ? 100 : 60;
  else sp = Math.max(0, Math.min(100, Math.round(100 * (2 - avg / base))));
  var w = (S.settings && S.settings.evalAccWeight);
  w = (w === undefined || w === null) ? 70 : parseInt(w, 10);
  if(isNaN(w)) w = 70;
  w = Math.max(0, Math.min(100, w));
  var score = n ? Math.round(acc * w / 100 + sp * (100 - w) / 100) : 0;
  return { n:n, correct:o.correct || 0, total:n, acc:acc, speed:sp, avg:avg,
           score:score, grade:n ? evalGrade(score) : '-' };
}
/* 记录一次评价 */
function evalRecord(o){
  if(!S.evals) S.evals = [];
  var r = {
    t: Date.now(),
    mode: o.mode || 'learn',
    level: o.level || S.level,
    n: o.total || 0,
    correct: o.correct || 0,
    sec: Math.round(o.sec || 0),
    score: o.score || 0,
    grade: o.grade || '-',
    acc: o.acc || 0,
    speed: o.speed || 0,
    words: (o.words || []).slice(0, 40)
  };
  if(r.n <= 0) return null;
  S.evals.push(r);
  if(S.evals.length > 200) S.evals = S.evals.slice(-200);
  save();
  return r;
}
function evalList(){ return (S.evals || []).slice().sort(function(a, b){ return b.t - a.t; }); }
function evalSummary(list){
  list = list || evalList();
  var sum = { n:0, correct:0, sec:0, score:0, count:list.length, best:'-', dist:{S:0,A:0,B:0,C:0,D:0} };
  if(!list.length) return sum;
  var bestRank = 99;
  list.forEach(function(r){
    var sc = (typeof r.score === 'number' && isFinite(r.score)) ? r.score : 0;
    sum.n += r.n || 0; sum.correct += r.correct || 0; sum.sec += r.sec || 0; sum.score += sc;
    if(sum.dist[r.grade] !== undefined) sum.dist[r.grade]++;
    var rk = GRADE_ORDER.indexOf(r.grade);
    if(rk >= 0 && rk < bestRank){ bestRank = rk; sum.best = r.grade; }
  });
  sum.acc = sum.n ? Math.round(sum.correct / sum.n * 100) : 0;
  sum.avgScore = Math.round(sum.score / list.length);
  sum.avgSec = sum.n ? sum.sec / sum.n : 0;
  return sum;
}
function gradeBadge(g, big){
  var m = evalGradeMeta(g);
  if(g === '-') return '<span class="grade g-m">—</span>';
  return '<span class="grade g-' + g + (big ? ' big' : '') + '" style="--gc:' + m.color + '">' + g + '</span>';
}
function fmtTime(ts){
  var d = new Date(ts);
  var now = new Date();
  var same = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  var hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  if(same) return '今天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

        +     '<div class="ci-stat"><b>' + sum.avgScore + '</b><span>平均综合分</span></div>'
        +     '<div class="ci-stat"><b style="font-size:19px">' + fmtDuration(sum.sec) + '</b><span>累计用时</span></div>'
        +     '<div class="ci-stat"><b style="font-size:19px">' + (sum.avgSec ? sum.avgSec.toFixed(1) : '0.0') + ' 秒</b><span>平均每题</span></div>'
        +   '</div>'

    + '</section>'

    + '<section class="card">'
    +   '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">'
    +     '<h3 class="h3" style="margin:0">历史记录 <span class="hint">共 ' + list.length + ' 条</span></h3>'
    +     '<div class="chips">' + modes.map(function(m){
            return '<button class="chip' + (evalFilter === m.k ? ' on' : '') + '" data-em="' + m.k + '">' + m.n + '</button>';
          }).join('') + '</div>'
    +   '</div>'
    +   (list.length
        ? '<div class="rp-list" style="margin-top:12px">' + list.map(function(r, i){
            return '<div class="rp-item" data-ri="' + i + '">'
              + gradeBadge(r.grade)
              + '<div class="rp-main">'
              +   '<b>' + (MODE_NAME[r.mode] || '学习') + ' · ' + LEVEL_NAME(r.level) + ' · ' + r.n + ' 词</b>'
              +   '<span>' + fmtTime(r.t) + ' · 准确率 ' + r.acc + '% · 速度分 ' + r.speed + ' · 用时 ' + fmtDuration(r.sec) + '</span>'
              + '</div>'
              + '<b class="rp-score">' + r.score + '</b>'
              + '<div class="rp-acts">'
              +   '<button class="btn ghost sm" data-rdl="' + i + '">预览图片</button>'

              + '</div>';
          }).join('') + '</div>'
        : '<p class="muted" style="margin-top:12px">还没有记录。</p>')
    + '</section>'

    + '<section class="card">'

    +     '速度分以「每题 ' + (S.settings.secPerQ || 15) + ' 秒」为满分线，用时翻倍则速度分归零。</p>'
    +   '<div class="rp-legend">' + GRADE_ORDER.map(function(g){
          var m = evalGradeMeta(g);
          return '<div class="rp-lg"><span class="rp-g" style="background:' + m.color + '">' + g + '</span><b>' + m.name + '</b><span>' + m.tip + '</span></div>';
        }).join('') + '</div>'

/* ---------- 评价分享图 ---------- */
function evalDraw(cv, styleKey, r, scale){
  var W = 720, H = 1120;
  scale = scale || 1;
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  var ctx = cv.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  var st = ciStyleOf(styleKey);
  var m = evalGradeMeta(r.grade);
  var d = new Date(r.t);
  var dateStr = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';

  if(st.grad){
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, st.grad[0]);
    g.addColorStop(1, st.grad[1]);
    ctx.fillStyle = g;
  }else ctx.fillStyle = st.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText('聚合英语 · 学习报告', 56, 76);
  ctx.textAlign = 'right';
  ctx.fillText(dateStr, W - 56, 76);
  ctx.textAlign = 'left';

  /* 评级大字母 */
  ciFillRound(ctx, 56, 112, 250, 250, 36, st.card);
  ctx.fillStyle = m.color;
  ctx.font = 'bold 170px "Segoe UI",Arial,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(r.grade, 181, 292);
  ctx.textAlign = 'left';
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(38, true);
  ctx.fillText(m.name, 336, 210);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(22, false);
  ctx.fillText((MODE_NAME[r.mode] || '学习') + ' · ' + LEVEL_NAME(r.level), 336, 250);
  ctx.fillStyle = st.fg;
  ctx.font = 'bold 76px "Segoe UI",Arial,sans-serif';
  ctx.fillText(String(r.score), 336, 336);
  var sw = ctx.measureText(String(r.score)).width;
  ctx.font = ciFont(22, false);
  ctx.fillStyle = st.sub;
  ctx.fillText('综合分', 336 + sw + 10, 336);

  /* 四宫格 */
  var cells = [
    ['准确率', r.acc + '%'],
    ['速度分', String(r.speed)],
    ['答对题数', r.correct + ' / ' + r.n],
    ['总用时', fmtDuration(r.sec)]
  ];
  var cw = (W - 112 - 18) / 2, ch = 98;
  cells.forEach(function(c, i){
    var x = 56 + (i % 2) * (cw + 18);
    var y = 400 + Math.floor(i / 2) * (ch + 16);
    ciFillRound(ctx, x, y, cw, ch, 20, st.card);
    ctx.fillStyle = st.fg;
    ctx.font = ciFont(34, true);
    ctx.fillText(c[1], x + 24, y + 54);
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(19, false);
    ctx.fillText(c[0], x + 24, y + 82);
  });

  /* 词汇 */
  ciFillRound(ctx, 56, 638, W - 112, 250, 20, st.card);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(20, false);
  ctx.fillText('本批词汇', 80, 678);
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(26, true);
  var ws = r.words || [];
  var per = 4, shown = ws.slice(0, 16);
  shown.forEach(function(w, i){
    var col = i % per, row = Math.floor(i / per);
    ctx.fillText(w, 80 + col * 158, 724 + row * 44);
  });
  if(!shown.length){
    ctx.font = ciFont(22, false);
    ctx.fillStyle = st.sub;
    ctx.fillText('（未记录词汇）', 80, 724);
  }else if(r.n > shown.length){
    ctx.fillStyle = st.sub;
    ctx.font = ciFont(19, false);
    ctx.fillText('另有 ' + (r.n - shown.length) + ' 个单词', 80, 862);
  }

  /* 评语 */
  ctx.fillStyle = st.ac;
  ctx.font = ciFont(23, true);
  ctx.fillText(m.tip, 56, 934);

  /* 二维码（配色跟随主题） */
  var qy = 962, qs = 92;
  var qrC = qrThemeColors();
  ciFillRound(ctx, 56 - 9, qy - 9, qs + 18, qs + 18, 12, '#ffffff');
  ctx.strokeStyle = qrC.dark; ctx.lineWidth = 2;
  ciRound(ctx, 56 - 9, qy - 9, qs + 18, qs + 18, 12); ctx.stroke();
  qrDraw(ctx, siteUrl(), 56, qy, qs, { quiet:1, dark:qrC.dark, light:'#ffffff' });
  ctx.fillStyle = st.fg;
  ctx.font = ciFont(23, true);
  ctx.fillText(siteUrlIsRemote() ? '扫码打开「聚合英语」' : '「聚合英语」· 本地单页应用', 178, qy + 40);
  ctx.fillStyle = st.sub;
  ctx.font = ciFont(19, false);
  ctx.fillText(siteUrlLabel(), 178, qy + 72);
  ctx.fillText('综合分 = 准确率 × ' + (S.settings.evalAccWeight === undefined ? 70 : S.settings.evalAccWeight)
    + '% + 速度分 × ' + (100 - (S.settings.evalAccWeight === undefined ? 70 : S.settings.evalAccWeight)) + '%', 178, qy + 100);

  ctx.textAlign = 'right';
  ctx.font = ciFont(18, false);
  ctx.fillText('v' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '3.0'), W - 56, 1092);
  ctx.textAlign = 'left';
  return cv;
}
/* 预览评价分享图，弹窗内展示 + 下方保存按钮 */
function evalPreview(r){
  try{
    var cv = document.createElement('canvas');
    evalDraw(cv, ciStyle, r, 2);
    var dataURL = cv.toDataURL('image/png');
    var html = '<div class="preview-wrap"><img class="preview-img" src="' + dataURL + '" alt="评价图预览"></div>'
      + '<p class="muted" style="margin:10px 0 0;text-align:center">评级 ' + escapeHtml(r.grade) + ' · 综合分 ' + r.score + ' · 准确率 ' + r.acc + '%</p>';
    uiDialog({
      title: '评价图片预览',
      html: html,
      okText: '保存图片',
      cancelText: '关闭',
      onOk: function(){ evalDownload(r); }
    });
  }catch(e){ toast('预览失败：' + e.message); }
}
function evalDownload(r){
  try{
    var cv = document.createElement('canvas');
    evalDraw(cv, ciStyle, r, 1.5);
    cv.toBlob(function(blob){
      if(!blob){ toast('生成图片失败'); return; }
      var d = new Date();
      var name = '学习报告-' + r.grade + '-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.png';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('已保存 ' + name);
    }, 'image/png');

function schedDef(){

}
function sched(){
  if(!S.schedule || typeof S.schedule !== 'object') S.schedule = schedDef();
  var d = schedDef();
  if(!S.schedule.week || S.schedule.week.length !== 7) S.schedule.week = d.week;
  if(!S.schedule.dates || typeof S.schedule.dates !== 'object') S.schedule.dates = {};
  return S.schedule;
}
/* 周一为 0 */
function schedIdx(dt){
  dt = dt || new Date();
  return (dt.getDay() + 6) % 7;

function schedTarget(k){
  var sc = sched();
  if(!sc.on) return null;
  if(sc.dates && sc.dates[k] !== undefined && sc.dates[k] !== null && sc.dates[k] !== '') return parseInt(sc.dates[k], 10) || 0;
  return parseInt(sc.week[schedIdx()], 10) || 0;
}
function schedToday(){
  var sc = sched();
  var k = todayKey();
  var ov = (sc.dates && sc.dates[k] !== undefined);
  var t = ov ? (parseInt(sc.dates[k], 10) || 0) : (parseInt(sc.week[schedIdx()], 10) || 0);
  return { on:!!sc.on, key:k, target:t, override:ov, rest:!!sc.on && t === 0 };

function schedSetDate(k, v){
  var sc = sched();

  else sc.dates[k] = Math.max(0, parseInt(v, 10) || 0);

function schedUpcoming(n){
  var out = [];

  for(var i = 0; i < (n || 14); i++){

    var k = dateKeyOf(d);
    var ov = sched().dates[k] !== undefined;
    var t = ov ? (parseInt(sched().dates[k], 10) || 0) : (parseInt(sched().week[schedIdx(d)], 10) || 0);

    out.push({ d:d, k:k, i:i, target:t, override:ov, done:rec.words || 0, rest:t === 0,

var _gsIndex = null;
function gsSearch(q){
  if(!_gsIndex) _gsIndex = gsIndex();

  if(!q) return { list:[], total:0 };
  var starts = [], has = [];
  for(var i = 0; i < _gsIndex.length; i++){
    var it = _gsIndex[i];
    /* 索引项里的 t / key 一律按字符串处理：影视与文学里带年份等数字字段，
       直接 .toLowerCase() 会抛 it.t.toLowerCase is not a function 而整块搜索失效 */
    var tt = String(it.t === undefined || it.t === null ? '' : it.t).toLowerCase();
    var kk = String(it.key === undefined || it.key === null ? '' : it.key).toLowerCase();
    var p = tt.indexOf(q);
    if(p === 0) starts.push(it);
    else if(matchQuery(kk, q)) has.push(it);
    if(starts.length >= 200 && has.length >= 200) break;
  }
  return { list: starts.concat(has), total: starts.length + has.length };
}

   19. 分享配置包（ZIP 打包 / 解包，纯本地实现）

var ZIP_CRC_TABLE = null;
function zipCRCInit(){
  if(ZIP_CRC_TABLE) return ZIP_CRC_TABLE;
  var t = new Int32Array(256);
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  ZIP_CRC_TABLE = t;
  return t;
}
function zipCRC32(bytes){
  var t = zipCRCInit();
  var c = -1;
  for(var i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}
function zipUTF8(str){
  if(typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
  var out = [];
  for(var i = 0; i < str.length; i++){
    var c = str.charCodeAt(i);
    if(c < 0x80) out.push(c);
    else if(c < 0x800){ out.push(0xC0 | (c >> 6), 0x80 | (c & 63)); }
    else if(c >= 0xD800 && c < 0xDC00 && i + 1 < str.length){
      var c2 = str.charCodeAt(++i);
      var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
    }else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(out);
}
function zipStr(bytes){
  if(typeof TextDecoder !== 'undefined'){
    try{ return new TextDecoder('utf-8').decode(bytes); }catch(e){}
  }
  var s = '';
  for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  try{ return decodeURIComponent(escape(s)); }catch(e){ return s; }
}

    var dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, dataB.length, true);
    dv.setUint32(22, dataB.length, true);
    dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);

    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataB.length, true);
    cv.setUint32(24, dataB.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);
    offset += lh.length;
  });
  var cdSize = 0;
  central.forEach(function(c){ cdSize += c.length; });
  var eocd = new Uint8Array(22);
  var ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, central.length, true);
  ev.setUint16(10, central.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);
  var all = parts.concat(central).concat([eocd]);
  var total = 0;
  all.forEach(function(p){ total += p.length; });
  var out = new Uint8Array(total), pos = 0;
  all.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return new Blob([out], { type:'application/zip' });
}
/* ArrayBuffer → {name: text}；只支持 store（method 0），兼容由 Windows/7-Zip 生成的无压缩包 */
function zipRead(buffer){
  var u8 = new Uint8Array(buffer);
  var dv = new DataView(buffer);
  var out = {}, i = 0;
  while(i + 30 <= u8.length){
    if(dv.getUint32(i, true) !== 0x04034b50) break;
    var method = dv.getUint16(i + 8, true);
    var csize = dv.getUint32(i + 18, true);
    var usize = dv.getUint32(i + 22, true);
    var nlen = dv.getUint16(i + 26, true);
    var elen = dv.getUint16(i + 28, true);
    var name = zipStr(u8.subarray(i + 30, i + 30 + nlen));
    var start = i + 30 + nlen + elen;
    if(method === 0){
      out[name] = zipStr(u8.subarray(start, start + (usize || csize)));
    }
    i = start + csize;
  }
  return out;
}

function shareSave(blob, name){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    toast('已导出 ' + name);
  }catch(e){ toast('导出失败：' + e.message); }

function shareReadFile(file, done){
  if(file.size > 24 * 1024 * 1024){ uiAlert('文件过大（上限 24 MB）。', '导入失败'); return; }
  var fr = new FileReader();
  fr.onload = function(){
    var buf = fr.result;
    var obj = null;
    var isZip = /\.zip$/i.test(file.name || '');
    if(!isZip){
      try{
        var t = zipStr(new Uint8Array(buf));
        obj = JSON.parse(t);
        done(obj, 'json'); return;
      }catch(e){ isZip = true; }
    }
    try{
      var files = zipRead(buf);
      var key = files['data.json'] ? 'data.json' : (files['config.json'] ? 'config.json' : null);
      if(!key) throw new Error('压缩包里没有找到 data.json');
      obj = JSON.parse(files[key]);
      done(obj, 'zip');
    }catch(e){
      uiAlert('无法解析该配置文件：' + e.message, '导入失败');
    }
  };
  fr.onerror = function(){ uiAlert('文件读取失败，请重试。', '导入失败'); };
  fr.readAsArrayBuffer(file);
}
function shareApply(obj, parts){
  if(!obj || typeof obj !== 'object') throw new Error('配置内容为空');
  var src = obj.data && typeof obj.data === 'object' ? obj.data : obj;
  var applied = [];
  parts.forEach(function(k){
    if(src[k] === undefined || src[k] === null) return;
    if(k === 'settings'){
      var s = src.settings;
      if(s){
        if(s.level && DATA[s.level]) S.level = s.level;
        if(typeof s.count === 'number') S.count = s.count;
        if(Array.isArray(s.flow) && s.flow.length) S.flow = s.flow.filter(function(x){ return STEP_ORDER.indexOf(x) >= 0; });
        if(s.theme) S.theme = s.theme;
        if(typeof s.dark === 'boolean') S.dark = s.dark;
        if(s.fontSize) S.fontSize = s.fontSize;
        if(s.settings) for(var kk in s.settings){
          if(Object.prototype.hasOwnProperty.call(s.settings, kk)) S.settings[kk] = s.settings[kk];
        }
        applied.push('偏好设置');
      }
    }else if(k === 'libs'){
      if(Array.isArray(src.libs)){
        S.libs = src.libs.filter(function(L){ return L && L.name && Array.isArray(L.items); });
        if(!S.activeLibs) S.activeLibs = [];
        S.activeLibs = ['default'];
        S.libs.forEach(function(L){ if(L.id && S.activeLibs.indexOf(L.id) < 0) S.activeLibs.push(L.id); });
        applyUserLibs();
        applied.push('自建词库 ' + S.libs.length + ' 个');
      }
    }else if(k === 'wrong' && Array.isArray(src.wrong)){ S.wrong = src.wrong; applied.push('错题本 ' + S.wrong.length + ' 条'); }
    else if(k === 'favs' && Array.isArray(src.favs)){ S.favs = src.favs; applied.push('收藏本 ' + S.favs.length + ' 条'); }
    else if(k === 'checkin' && typeof src.checkin === 'object'){ S.checkin = src.checkin; applied.push('打卡记录'); }
    else if(k === 'evals' && Array.isArray(src.evals)){ S.evals = src.evals; applied.push('学习报告 ' + S.evals.length + ' 条'); }
    else if(k === 'notes' && typeof src.notes === 'object'){ S.notes = src.notes; applied.push('观后感'); }
    else if(k === 'schedule' && src.schedule){ S.schedule = src.schedule; applied.push('学习日程'); }
    else if(k === 'seen' && typeof src.seen === 'object'){ S.seen = src.seen; applied.push('学习痕迹'); }
  });
  save();
  applyTheme();
  return applied;
}

/* 我的页：今日统计 + 近 N 天趋势折线 + 日程 + 导入导出 */
var meTrendRange = 7;
function meTodayEvals(){
  var tk = todayKey();
  return (S.evals || []).filter(function(r){ return dateKeyOf(new Date(r.t)) === tk; }).sort(function(a, b){ return a.t - b.t; });
}
function meTrendData(n){
  var out = [];
  var now = new Date();
  for(var i = n - 1; i >= 0; i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    var k = dateKeyOf(d);
    var rec = S.checkin[k] || {};
    var acc = rec.total > 0 ? Math.round((rec.correct || 0) / rec.total * 100) : null;
    var dayEvals = (S.evals || []).filter(function(r){ return dateKeyOf(new Date(r.t)) === k; });
    var grade = '-';
    if(dayEvals.length){
      var best = 99;
      dayEvals.forEach(function(r){ var rk = GRADE_ORDER.indexOf(r.grade); if(rk >= 0 && rk < best){ best = rk; grade = r.grade; } });
    }
    out.push({ d:d, k:k, words:rec.words || 0, acc:acc, grade:grade, label:(i === 0 ? '今天' : WEEK_NAME[schedIdx(d)]) });
  }
  return out;
}
function meTrendChartSVG(data){
  var W = 640, H = 216, padL = 32, padR = 12, padT = 26, padB = 26;
  var maxWords = 1;
  data.forEach(function(d){ if(d.words > maxWords) maxWords = d.words; });
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var n = data.length, bw = innerW / n;
  var s = '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
  [0, 50, 100].forEach(function(v){
    var y = padT + innerH * (1 - v / 100);
    s += '<line class="tg" x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '"/>';
    s += '<text class="tax" x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + v + '</text>';
  });
  var pts = [];
  data.forEach(function(d, i){
    var cx = padL + bw * i + bw / 2;
    var barW = bw * 0.5;
    var bx = padL + bw * i + bw * 0.25;
    var bh = innerH * (d.words / maxWords);
    var by = padT + innerH - bh;
    s += '<rect class="' + (d.words > 0 ? 'tbar' : 'tbar-empty') + '" x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(bh, 2).toFixed(1) + '" rx="3"/>';
    s += '<text class="tw" x="' + cx + '" y="' + (by - 6) + '" text-anchor="middle">' + d.words + '</text>';
    if(d.grade !== '-'){
      var gm = evalGradeMeta(d.grade);
      s += '<text class="tgrd" x="' + cx + '" y="' + (padT - 9) + '" text-anchor="middle" style="fill:' + gm.color + '">' + d.grade + '</text>';
    }
    if(d.acc != null){
      var ay = padT + innerH * (1 - d.acc / 100);
      pts.push([cx, ay]);
      s += '<circle class="tp" cx="' + cx + '" cy="' + ay + '" r="3.5"/>';
    }
    s += '<text class="td" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + d.label + '</text>';
  });
  if(pts.length >= 2){
    s += '<polyline class="tl" points="' + pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"/>';
  }
  s += '</svg>';
  return s;
}

/* ============================================================
   文本标注：粘贴英文 → 统计 + 标注（词库内蓝 / 词库外红，点击收录）
   ============================================================ */
var ANNO_POS = ['n.','v.','vt.','vi.','adj.','adv.','prep.','conj.','pron.','num.','art.','aux.','其他'];
var _annoWord = '';
function annoCount(text){
  var words = text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g) || [];
  var paras = text.split(/\n+/).filter(function(s){ return s.trim(); });
  return { words: words.length, paras: paras.length };
}
function annoRenderResult(text){
  var html = '', last = 0, m;
  var re = /[A-Za-z]+(?:['’-][A-Za-z]+)*/g;
  while((m = re.exec(text))){
    html += escapeHtml(text.slice(last, m.index));
    var tok = m[0];
    var direct = findWord(tok);
    if(direct){
      html += '<span class="anno anno-known" data-w="' + escapeHtml(direct.w) + '" title="' + escapeHtml(direct.m || '') + '">' + escapeHtml(tok) + '</span>';
    }else{
      var base = findBase(tok);
      if(base){
        html += '<span class="anno anno-known" data-w="' + escapeHtml(base.w) + '" title="' + escapeHtml(base.m || '') + '">' + escapeHtml(tok) + '</span>';
      }else{
        html += '<span class="anno anno-unknown" data-anno-add="' + escapeHtml(tok) + '" title="词库未收录，点击填写详情">' + escapeHtml(tok) + '</span>';
      }
    }
    last = m.index + m[0].length;
  }
  html += escapeHtml(text.slice(last));
  return html;
}
function renderAnnotate(app){
  app.innerHTML =
      '<section class="card">'
    +   '<h2 class="h2">文本标注 <span class="hint">粘贴英文，自动区分词库内外单词</span></h2>'

    +   '<textarea class="anno-input" id="annoText" placeholder="在此粘贴英文文本…（可含中文，自动跳过非英文）"></textarea>'
    +   '<div class="anno-stats" id="annoStats">'
    +     '<span>单词 <b>0</b></span><span>段落 <b>0</b></span>'
    +     '<span class="anno-stats-hint">蓝色下划线 = 词库已收录（点击看详情） · 红色 = 词库未收录（点击收录）</span>'
    +   '</div>'
    +   '<div class="row" style="margin-top:12px">'
    +     '<button class="btn primary" id="annoGo">' + IC('pen') + ' 开始标注</button>'
    +     '<button class="btn ghost" id="annoClear">清空</button>'
    +   '</div>'
    + '</section>'
    + '<section class="card hidden" id="annoResultCard">'
    +   '<h2 class="h2">标注结果 <span class="hint" id="annoResultMeta"></span></h2>'
    +   '<div class="anno-result" id="annoResult"></div>'
    + '</section>';

  var ta = $('#annoText');
  function refreshStats(){
    var c = annoCount(ta.value);
    var s = $('#annoStats');
    if(s) s.innerHTML = '<span>单词 <b>' + c.words + '</b></span><span>段落 <b>' + c.paras + '</b></span>'
      + '<span class="anno-stats-hint">蓝色下划线 = 词库已收录（点击看详情） · 红色 = 词库未收录（点击收录）</span>';
  }
  function run(){
    var text = ta.value;
    if(!text.trim()){ toast('请先粘贴英文文本'); return; }
    var c = annoCount(text);
    if(c.words === 0){ toast('未识别到英文单词'); return; }
    $('#annoResult').innerHTML = annoRenderResult(text);
    $('#annoResultMeta').textContent = c.words + ' 个单词 · ' + c.paras + ' 个段落';
    $('#annoResultCard').classList.remove('hidden');
  }
  ta.addEventListener('input', refreshStats);
  $('#annoGo').onclick = run;
  $('#annoClear').onclick = function(){
    ta.value = '';
    refreshStats();
    $('#annoResultCard').classList.add('hidden');
    $('#annoResult').innerHTML = '';
  };
}
function annoAddOpen(word){
  _annoWord = word;
  var mask = $('#dlg'), box = $('#dlgBox');
  if(!mask || !box) return;
  box.innerHTML =
      '<button class="modal-close" id="annoClose">' + IC('x') + '</button>'
    + '<div class="m-head"><div style="flex:1;min-width:0">'
    +   '<div class="word-big sm" style="margin:0">' + escapeHtml(word) + '</div>'
    +   '<p class="muted" style="margin-top:6px">这个词不在词库里，填写详情后保存到「我的词库」。</p>'
    + '</div></div>'
    + '<div class="anno-form">'
    +   '<label class="anno-lab">音标</label>'
    +   '<input class="text-input" id="afIpa" placeholder="/əˈpəl/">'
    +   '<label class="anno-lab">词性（点选一个）</label>'
    +   '<div class="chips" id="afPos">' + ANNO_POS.map(function(p){ return '<button class="chip" data-pos="' + escapeHtml(p) + '" type="button">' + escapeHtml(p) + '</button>'; }).join('') + '</div>'
    +   '<label class="anno-lab">词义（可添加多条）</label>'
    +   '<div id="afMeanings"></div>'
    +   '<button class="btn ghost sm" id="afAddMean" style="margin-top:8px;align-self:flex-start" type="button">+ 添加词义</button>'
    +   '<label class="anno-lab">动词变化（过去式 / 过去分词，动词填）</label>'
    +   '<div class="anno-2col"><input class="text-input" id="afPast" placeholder="过去式"><input class="text-input" id="afPp" placeholder="过去分词"></div>'
    +   '<label class="anno-lab">比较级 / 最高级（形容词填）</label>'
    +   '<div class="anno-2col"><input class="text-input" id="afComp" placeholder="比较级"><input class="text-input" id="afSup" placeholder="最高级"></div>'
    +   '<label class="anno-lab">近义词（逗号分隔）</label>'
    +   '<input class="text-input" id="afSyn" placeholder="例如 fast, quick">'
    +   '<label class="anno-lab">反义词（逗号分隔）</label>'
    +   '<input class="text-input" id="afAnt" placeholder="例如 slow">'
    + '</div>'
    + '<div class="dlg-f">'
    +   '<button class="btn ghost" id="afCancel">取消</button>'
    +   '<button class="btn primary" id="afSave">' + IC('check') + ' 保存到我的词库</button>'
    + '</div>';
  mask.classList.remove('hidden');

  var pos = '';
  var meanings = [''];
  function renderMeanings(){
    $('#afMeanings').innerHTML = meanings.map(function(mm, i){
      return '<div class="anno-mrow"><input class="text-input" data-mi="' + i + '" value="' + escapeHtml(mm) + '" placeholder="词义 ' + (i + 1) + '">'
        + '<button class="icon-btn" data-mdel="' + i + '" title="删除这条" type="button">' + IC('x') + '</button></div>';
    }).join('');
  }
  renderMeanings();
  $$('#afPos .chip').forEach(function(b){ b.onclick = function(){
    pos = (pos === b.dataset.pos) ? '' : b.dataset.pos;
    $$('#afPos .chip').forEach(function(x){ x.classList.toggle('on', x.dataset.pos === pos); });
  }; });
  $('#afAddMean').onclick = function(){ meanings.push(''); renderMeanings(); };
  $('#afMeanings').addEventListener('input', function(e){
    var inp = e.target.closest ? e.target.closest('[data-mi]') : null;
    if(inp) meanings[+inp.dataset.mi] = inp.value;
  });
  $('#afMeanings').addEventListener('click', function(e){
    var del = e.target.closest ? e.target.closest('[data-mdel]') : null;
    if(del){
      meanings.splice(+del.dataset.mdel, 1);
      if(!meanings.length) meanings = [''];
      renderMeanings();
    }
  });
  function close(){ closeDialog(); _annoWord = ''; }
  $('#afCancel').onclick = close;
  $('#annoClose').onclick = close;
  mask.onclick = function(e){ if(e.target === mask) close(); };
  $('#afSave').onclick = function(){
    var collected = [];
    $$('#afMeanings [data-mi]').forEach(function(inp){ var v = inp.value.trim(); if(v) collected.push(v); });
    if(!collected.length){ toast('请至少填写一条词义'); return; }
    var syn = ($('#afSyn').value || '').split(/[,，;；]/).map(function(s){ return s.trim(); }).filter(Boolean);
    var ant = ($('#afAnt').value || '').split(/[,，;；]/).map(function(s){ return s.trim(); }).filter(Boolean);
    annoSaveWord({
      w: word,
      ipa: $('#afIpa').value.trim(),
      pos: pos,
      meanings: collected,
      past: $('#afPast').value.trim(),
      pp: $('#afPp').value.trim(),
      comp: $('#afComp').value.trim(),
      sup: $('#afSup').value.trim(),
      syn: syn, ant: ant
    });
    close();
    toast('已保存到我的词库');
  };
}
function annoSaveWord(r){
  var k = String(r.w).toLowerCase();
  var meaning = (r.pos ? r.pos + ' ' : '') + r.meanings.join('；');
  var ipa = r.ipa || '';
  if(ipa && ipa.charAt(0) !== '/') ipa = '/' + ipa + '/';
  var L = libById('mywords');
  if(!L){
    L = { id:'mywords', name:'我的词库', items:[] };
    S.libs.push(L);
  }
  L.items = L.items.filter(function(e){ return String(e[0]).toLowerCase() !== k; });
  L.items.push([r.w, ipa, meaning, []]);
  if(S.activeLibs.indexOf('mywords') < 0) S.activeLibs.push('mywords');
  var ex = S.extras;
  if(r.past || r.pp){
    ex.irregular = (ex.irregular || []).filter(function(v){ return String(v.b).toLowerCase() !== k; });
    ex.irregular.push({ b:r.w, p:r.past || r.w, pp:r.pp || r.w, cn:meaning });
  }
  if(r.comp || r.sup){
    ex.compare = (ex.compare || []).filter(function(v){ return String(v.b).toLowerCase() !== k; });
    ex.compare.push({ b:r.w, c:r.comp || '', s:r.sup || '', cn:meaning });
  }
  ex.syn = ex.syn || {}; ex.ant = ex.ant || {};
  if(r.syn.length) ex.syn[k] = r.syn.map(function(s){ return { w:s, d:'' }; });
  if(r.ant.length) ex.ant[k] = r.ant.map(function(s){ return { w:s, d:'' }; });
  applyExtras();
  applyUserLibs();
  save();
  _annoVerbBase = null; _annoCompBase = null;
  var ta = $('#annoText');
  if(ta && $('#annoResultCard') && !$('#annoResultCard').classList.contains('hidden')){
    var text = ta.value;
    if(text && text.trim()) $('#annoResult').innerHTML = annoRenderResult(text);
  }
}
